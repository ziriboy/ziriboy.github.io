<title>차시 정리 활동 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 수업 자료집처럼 상단에 두 탭, 방식별 묶음 아래 교과서 쪽 이미지 카드. 잉크색 하나에 방식마다 작은 색 표지. */
:root{
  --bg:#F2F3F1; --paper:#FFFFFF; --ink:#1B2420; --muted:#5E6A64; --rule:#D3D9D5; --soft:#E8ECE9;
  --m1:#2F6B5A; --m2:#7A5A2A; --m3:#8A3D4A; --m4:#3D5A86; --m5:#4F6B2E;
  --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --paper:#1D2421; --ink:#E6ECE8; --muted:#9AA8A1; --rule:#34403B; --soft:#26302C;
  --m1:#7FC3AE; --m2:#D2B07A; --m3:#E199A5; --m4:#9DB8E3; --m5:#A9C77E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --paper:#1D2421; --ink:#E6ECE8; --muted:#9AA8A1; --rule:#34403B; --soft:#26302C;
  --m1:#7FC3AE; --m2:#D2B07A; --m3:#E199A5; --m4:#9DB8E3; --m5:#A9C77E; color-scheme:dark}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:14px 16px 0}
.top-inner{max-width:1080px;margin:0 auto;display:grid;gap:10px}
h1{font-size:1.25rem;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:.92rem}
.tabs{display:flex;gap:0}
.tabs button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 9px;color:var(--muted);cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tabs button:focus-visible,.chip:focus-visible,.card button:focus-visible,.btn:focus-visible{outline:2px solid var(--m4);outline-offset:2px}
main{padding-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
section.method{display:grid;gap:12px;margin-bottom:30px}
.mhead{display:grid;gap:2px;border-left:4px solid var(--c);padding-left:12px}
.mhead h2{margin:0;font-size:1.12rem}
.mhead p{margin:0;color:var(--muted);font-size:.9rem;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;min-width:0}
.thumb{display:block;border:0;padding:0;width:100%;overflow:hidden;border-bottom:1px solid var(--rule)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.cbody{padding:12px 14px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.cname{font-weight:600;font-size:1rem;margin:0}
.src{color:var(--muted);font-size:.8rem;margin:0}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.86rem}
dt{color:var(--c);font-weight:600;white-space:nowrap}
dd{margin:0}
.use{justify-self:start;font:inherit;font-size:.86rem;font-weight:600;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;margin-top:2px}
.use[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* 적용 */
.apply{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.apply{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{margin:0;font-size:1.05rem}
.model{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.model img{width:120px;height:90px;object-fit:cover;object-position:top;border:1px solid var(--rule);border-radius:4px;cursor:zoom-in}
.model .empty{grid-column:1/-1;color:var(--muted);font-size:.9rem;border:1px dashed var(--rule);border-radius:6px;padding:14px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
label.f{display:grid;gap:4px;font-size:.88rem;font-weight:600}
input[type=text],textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:2px solid var(--m4);outline-offset:0;border-color:transparent}
.sheet{border:1.5px solid var(--ink);border-radius:2px;padding:16px 18px;display:grid;gap:10px;background:var(--paper)}
.sheet .row{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:10px;font-size:.92rem}
.sheet .row b{color:var(--muted);font-weight:600}
.sheet .act{white-space:pre-wrap;border-top:1px solid var(--rule);padding-top:10px;min-height:4em}
.sheet .ph{color:var(--muted)}
.btn{font:inherit;font-size:.9rem;font-weight:600;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 18px;cursor:pointer;justify-self:end}
.toast{color:var(--m1);font-size:.85rem;justify-self:end;min-height:1.2em}
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);max-width:min(1100px,96vw);max-height:94vh;border-radius:6px}
dialog::backdrop{background:rgba(10,14,12,.72)}
.dlg{display:grid;gap:8px;padding:12px}
.dlg img{max-width:100%;max-height:82vh;display:block;margin:0 auto}
.dlg .bar{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.88rem}
.dlg button{font:inherit;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--muted)}}

/* 다시 그린 활동지 — 한 가지 글꼴, 세 단계 글자 크기(제목 15 · 본문 14 · 보조 12.5), 여백 단위 12px. 색은 활동 이름 한 곳에만, 굵기는 제목·소제목·중심 개념에만 */
:root{--sheet:#FFFFFF;--line:#B9C2BD;--blank:#7D8983}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sheet:#1D2421;--line:#46524D;--blank:#8D9A94}}
:root[data-theme="dark"]{--sheet:#1D2421;--line:#46524D;--blank:#8D9A94}
.sh{background:var(--sheet);color:var(--ink);font-size:14px;line-height:1.7;word-break:keep-all;font-weight:400;padding:20px 20px 24px;display:grid;gap:12px;width:760px;max-width:none;align-content:start}
.sh p,.sh ol,.sh ul{margin:0}.sh b{font-weight:400}
.sh .small{font-size:12.5px;color:var(--muted)}
.shh{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:8px;flex-wrap:wrap}
.shh b{font-size:15px;font-weight:600}
.tag{font-size:12.5px;color:var(--c,var(--muted))}
.sh .h{font-weight:600}.sh .h em{font-style:normal;margin-right:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.cols2>div{display:grid;gap:12px;align-content:start}
.bx{display:inline-block;min-width:4.6em;border:1px solid var(--blank);border-radius:3px;padding:0 4px;font-size:12.5px;line-height:1.5;color:var(--muted);vertical-align:1px}
.ch{display:inline-flex;align-items:center;gap:1px;vertical-align:-2px}.ch i{font-style:normal;color:var(--muted);margin-right:2px;font-size:12.5px}
.ch b{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border:1px solid var(--blank);font-size:12.5px;color:var(--muted)}.ch b.gap{border:0;width:.4em}
.tb,.ox,.odd{border-collapse:collapse;width:100%}
.tb th,.tb td,.ox th,.ox td,.odd th,.odd td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-weight:400}
.sh table{font-size:inherit}.sh tr.hd th{border-bottom-color:var(--ink);color:var(--muted);font-size:12.5px}
.tb th{color:var(--muted);white-space:nowrap}
.band{display:grid;grid-template-columns:7.5em minmax(0,1fr);border-top:1px solid var(--line);padding-top:12px;gap:12px}.band .bl{color:var(--muted)}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.nc,.cq,.fq,.exit{border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:6px;align-content:start}
.nc .no{font-size:12.5px;color:var(--muted)}.nc .kw{font-size:12.5px;color:var(--muted)}
.lines{display:grid;gap:26px;padding-top:22px}.lines span{border-bottom:1px solid var(--line);height:1px}
.dsvg{width:100%;height:auto;display:block;color:var(--ink);font-family:var(--sans)}
.kwrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.kwrow>b{margin-right:4px;color:var(--muted)}
.sticky{border:1px solid var(--line);padding:1px 10px}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". n ." "w r e" ". s .";gap:12px;align-items:center}
.cq.n{grid-area:n}.cq.s{grid-area:s}.cq.w{grid-area:w}.cq.e{grid-area:e}.crose{grid-area:r;width:110px;justify-self:center;color:var(--ink)}
.clue{padding-left:1.4em;display:grid;gap:6px;align-content:start}
.ws,.cw{border-collapse:collapse;margin:0 auto}.ws td{width:2.1em;height:2.1em;text-align:center;border:1px solid var(--line)}
.cw td{width:2.2em;height:2.2em;border:1px solid var(--ink);position:relative;padding:0}.cw td.x{border:0;background:transparent}.cw i{position:absolute;left:3px;top:0;font-style:normal;font-size:10px;line-height:1.4;color:var(--muted)}
.cwl{display:grid;gap:6px;align-content:start}.cwl ul{list-style:none;padding:0;display:grid;gap:6px}.cwl li b{margin-right:4px;color:var(--muted)}.len{color:var(--muted);font-size:12.5px}
.ox td:first-child,.odd td:first-child{color:var(--muted);width:2.4em}.ox .sy{text-align:center;width:3em}
.collect{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.collect b{margin-right:6px;color:var(--muted)}.collect span{width:2.2em;height:2.2em;border:1px solid var(--blank);display:inline-block}
.hexes{max-width:300px;margin:0 auto}
.opt{line-height:1.9}.pill{color:var(--muted);margin-right:4px}
.t321{display:grid;gap:12px}.r321{display:grid;grid-template-columns:2em minmax(0,1fr);gap:12px}.n321{color:var(--muted)}
.frayer{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.frayer .fq{min-height:8em}.frayer>:nth-child(n+4){padding-top:28px}.frayer>:nth-child(-n+2){padding-bottom:24px}
.frayer .fc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--sheet);border:1px solid var(--ink);border-radius:999px;padding:6px 22px;font-weight:600;z-index:1}
.ex1{font-size:12.5px}
.d9{display:grid;gap:6px;justify-items:center}.d9r{display:flex;gap:6px}.d9r span{width:5.2em;height:2.6em;border:1px dashed var(--blank);border-radius:4px}
.d9lab{font-size:12.5px;color:var(--muted)}
.d9c{display:flex;flex-wrap:wrap;gap:6px}.d9c span{border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.flow{display:flex;align-items:stretch;gap:6px}.fb{border:1px solid var(--line);border-radius:4px;padding:8px 10px;flex:1 1 0;min-height:4.4em;display:grid;place-items:center;text-align:center}
.fb.blank{border:1px dashed var(--blank);color:var(--muted)}.fa{align-self:center}
.odd{table-layout:fixed}.odd td.blk{border-bottom-color:var(--ink)}
.exit{border-style:dashed;border-color:var(--blank);gap:6px}
.tl{display:flex;flex-wrap:wrap;gap:18px}.tl span{display:flex;align-items:center;gap:6px}.tl i{width:.9em;height:.9em;border-radius:50%;display:inline-block}
.tl .g{background:#8DBF8C}.tl .y{background:#E9CB6A}.tl .r{background:#DD8E82}
.cut{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
.kmap{width:300px;max-width:100%;margin:0 auto}
@media (max-width:640px){.sheetwrap{-webkit-overflow-scrolling:touch}}
/* 축소 미리보기 */
.thumb{cursor:zoom-in;height:230px;background:var(--sheet);text-align:left;position:relative}
.sheet-s{width:760px;transform:scale(.45);transform-origin:0 0;pointer-events:none}
.sheet-s .sh{width:760px;max-width:none}
.sheet-s .cols2{grid-template-columns:1fr 1fr}.sheet-s .cards3{grid-template-columns:repeat(3,1fr)}
.thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(transparent,var(--sheet))}
.mthumb{border:1px solid var(--rule);padding:0;background:var(--sheet);width:160px;height:120px;overflow:hidden;cursor:zoom-in;border-radius:4px}
.mthumb .sheet-s{transform:scale(.21)}
.model{grid-template-columns:160px minmax(0,1fr)}
#dlgbody .sh{margin:0 auto}
#dlgbody{overflow:auto;max-height:84vh}

/* 첫 화면과 유형 화면 */
.intro{display:grid;gap:6px;padding-block:4px 18px}
.intro h2{margin:0;font-size:1.05rem;font-weight:400;line-height:1.6;word-break:keep-all}
.intro p{margin:0;color:var(--muted);font-size:.9rem}
.types{display:grid;border-top:1px solid var(--rule)}
.type{font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 6px;display:grid;grid-template-columns:1.4em 13.5em minmax(0,1fr) auto;gap:12px;align-items:baseline;cursor:pointer}
.type:hover{background:var(--paper)}.type:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.tn{color:var(--c);font-size:.9rem}.tt{font-size:.98rem}.tk{color:var(--muted);font-size:.86rem}.tc{color:var(--muted);font-size:.8rem;white-space:nowrap}
.type .tt::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:.1em}
@media (max-width:640px){.type{grid-template-columns:1.4em minmax(0,1fr) auto}.tk{grid-column:2/-1;grid-row:2}}
.tgo{color:var(--muted)}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.back{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0}
.tnav{display:flex;flex-wrap:wrap;gap:6px}
.tpill{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--paper);color:var(--muted);border-radius:999px;padding:3px 11px;cursor:pointer}
.tpill[aria-pressed="true"]{border-color:var(--c);color:var(--c);font-weight:600}
.thead{border-left:4px solid var(--c);padding-left:12px;display:grid;gap:2px;margin-bottom:16px}.thead h2{margin:0;font-size:1.1rem;font-weight:600}.thead p{margin:0;color:var(--muted);font-size:.86rem}
.tbody{display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:18px;align-items:start}
@media (max-width:900px){.tbody{grid-template-columns:minmax(0,1fr)}.exlist{flex-direction:row;overflow-x:auto}}
.exlist{display:flex;flex-direction:column;gap:6px;position:sticky;top:120px}
@media (max-width:900px){.exlist{flex-direction:row;overflow-x:auto;position:static}}
.exi{font:inherit;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer;display:grid;gap:1px;color:var(--ink);min-width:170px}
.exi span{font-size:.82rem;color:var(--muted)}.exi b{font-weight:400}.exi[aria-current="true"] b{font-weight:600}.exsep{font-size:.78rem;color:var(--muted);margin:8px 0 0;padding:0 10px}
.exi[aria-current="true"]{background:var(--paper);border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.exmain{display:grid;gap:14px;min-width:0;width:762px;max-width:100%}
.sheetwrap{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow-x:auto}
.sheetwrap{width:fit-content;max-width:100%}
.exinfo{display:grid;gap:10px}.exinfo dl{font-size:.92rem;--c:var(--c)}
</style>

<header class="top"><div class="top-inner">
  <h1>차시 정리 활동 모음</h1>
  
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-gal" aria-selected="true" data-tab="gal">정리 방식</button>
    <button type="button" role="tab" id="tab-app" aria-selected="false" data-tab="app">내 차시에 적용</button>
  </div>
</div></header>

<div class="wrap"><main>
  <div id="v-gal">
    <div id="gal"></div>
  </div>
  <div id="v-app" hidden>
    <div class="apply">
      <div class="panel">
        <h2>모델로 삼을 예시</h2>
        <div class="model" id="model"></div>
        <div class="pick" id="pick" role="group" aria-label="예시 고르기"></div>
      </div>
      <div class="panel">
        <h2>내 차시의 정리 활동</h2>
        <label class="f" for="f-lesson">차시
          <input type="text" id="f-lesson" placeholder="예: 한국지리 탐구 4.9 왜 우리나라는 홍수 피해가 반복될까?">
        </label>
        <label class="f" for="f-act">정리 활동
          <textarea id="f-act" placeholder="예: 핵심 용어(불투수면, 첨두유량, 취약성)를 쓰게 하는 개념 채우기 다섯 문장. 마지막 문장은 '같은 비에도 피해가 다른 까닭'을 자기 말로 쓰게 한다."></textarea>
        </label>
        <div class="sheet" id="sheet" aria-live="polite"></div>
        <button type="button" class="btn" id="copy">글로 복사</button>
        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>
</main></div>

<dialog id="dlg"><div class="dlg"><div class="bar"><span id="dlgcap"></span><button type="button" id="dlgclose">닫기</button></div><div id="dlgbody"></div></div></dialog>

<script>
(function(){
/* ===== 다시 그린 정리 활동지 13종 — 형식은 교과서에서, 내용은 지리 차시로 새로 씀 ===== */
const B=n=>`<span class="bx">${"❶❷❸❹❺❻❼❽"[n-1]}</span>`;
const CH=(n,s)=>`<span class="ch"><i>${"❶❷❸❹❺❻❼❽"[n-1]}</i>${s.split("").map(c=>c===" "?`<b class="gap"></b>`:`<b>${c}</b>`).join("")}</span>`;
const LN=(k=2)=>`<div class="lines">${"<span></span>".repeat(k)}</div>`;
/* 글자 크기는 본문 14, 보조 12.5 두 가지만. 굵기는 중심 개념(w:600)에만 */
const svgText=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-size="${o.s&&o.s<13?12.5:14}" ${o.w===600?`font-weight="600"`:""} fill="${o.m?"var(--muted)":"currentColor"}">${t}</text>`;
function nodeBox(x,y,w,h,t,o={}){return `<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${o.r??h/2}" fill="var(--sheet)" stroke="${o.dash?"var(--blank)":o.line?"var(--line)":"currentColor"}" stroke-width="1" ${o.dash?'stroke-dasharray="4 3"':""}/>`+(t?svgText(x,y+4.5,t,o):"");}
function mapSVG(W,H,center,nodes,edges){
  let s=`<svg viewBox="0 0 ${W} ${H}" class="dsvg" role="img">`;
  s+=edges.map(([a,b])=>{const A=a==="ctr"?center:nodes[a],Bn=nodes[b];return `<line x1="${A.x}" y1="${A.y}" x2="${Bn.x}" y2="${Bn.y}" stroke="var(--line)" stroke-width="1"/>`;}).join("");
  s+=`<ellipse cx="${center.x}" cy="${center.y}" rx="${center.rx}" ry="${center.ry}" fill="var(--sheet)" stroke="currentColor" stroke-width="1.2"/>`+center.t.map((t,i)=>svgText(center.x,center.y+5+(i-(center.t.length-1)/2)*19,t,{w:600})).join("");
  for(const k in nodes){const n=nodes[k];s+=nodeBox(n.x,n.y,n.w,30,n.t,{dash:n.blank,r:n.b?4:15,line:!n.b});}
  return s+`</svg>`;}

 {m:"m1",sh:"s15",name:"개념 정의 틀 (프레이어 모델)",topic:"4.8 취약성",src:"일반적인 정리 활동 (Frayer model)",x:1,what:"한 개념의 뜻·특징·예·예가 아닌 것을 네 칸에 정리",when:"핵심 개념 하나가 차시의 중심인 경우",note:"'예가 아닌 것'이 개념의 경계를 드러낸다. 이 칸을 비우지 않게 한다."},
 {m:"m2",sh:"s17",name:"원인과 결과 흐름도",topic:"영동 지역의 대설",src:"일반적인 정리 활동 (flow diagram)",x:1,what:"현상이 일어나는 과정을 화살표로 이어 순서대로 정리",when:"과정과 인과가 핵심인 자연지리 차시",note:"빈칸을 과정의 중간에 두어야 인과를 묻게 된다. 처음과 끝은 채워 준다."},
 {m:"m3",sh:"s18",name:"다른 하나 찾기",topic:"여러 단원",src:"일반적인 정리 활동 (Odd one out)",x:1,what:"네 낱말 가운데 다른 하나를 고르고 나눈 기준을 밝힘",when:"분류 기준이 중요한 차시, 단원 복습",note:"답보다 기준이 중요하다. 기준이 타당하면 다른 답도 인정한다."},
 {m:"m4",sh:"s19",name:"출구 카드",topic:"4.9 홍수",src:"일반적인 정리 활동 (Exit ticket)",x:1,what:"차시 질문에 한 문장으로 답하고 이해 정도를 스스로 표시",when:"모든 차시, 특히 다음 차시를 준비할 때",note:"교사가 읽고 다음 수업을 고치는 데 써야 의미가 있다. 문항은 셋을 넘기지 않는다."},
 {m:"m5",sh:"s20",name:"백지도에 표시하고 주석 달기",topic:"4.10 대설과 산불",src:"지리 수업의 정리 활동 (annotated map)",x:1,what:"백지도에 위치·범위·흐름을 그리고 주석을 담",when:"현상이 특정 지역에 나타나는 까닭을 다룬 차시",note:"색과 기호를 너무 많이 쓰지 않게 한다. 주석은 '어디에서, 왜'를 담게 한다."},
 {m:"m5",sh:"s21",name:"단면도 완성",topic:"4.10 양간지풍과 산불",src:"지리 수업의 정리 활동 (cross-section)",x:1,what:"지형 단면 위에 바람·기온 변화를 그리고 설명을 씀",when:"지형과 기후가 함께 작용하는 현상을 다룬 차시",note:"그림을 꾸미는 데 시간을 쓰지 않게 단면은 미리 그려 준다."}];
const KEY="jeongri-v4";let S={tab:"gal",type:null,ex:null,pick:null,lesson:"",act:""};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mOf=id=>M.find(m=>m.id===id);
function renderHome(){
  $("#gal").innerHTML=`<section class="intro"><h2>차시의 정리 단계에서 쓸 활동을 하나 골라, 내 차시에 맞게 바꾼다</h2>
   <p>정리 단계에서는 학생 한 사람 한 사람이 그 차시에 배운 내용을 스스로 정리할 기회를 가져야 한다.</p></section>
   <div class="types">${M.map((m,k)=>{const n=E.filter(e=>e.m===m.id).length;return `<button type="button" class="type" data-type="${m.id}" style="--c:${m.c}"><span class="tn">${k+1}</span><span class="tt">${esc(m.name)}</span><span class="tk">${esc(m.k)}</span><span class="tc">예시 ${n} <span class="tgo">›</span></span></button>`;}).join("")}</div>`;}
function renderType(){const m=mOf(S.type),ex=E.map((e,i)=>[e,i]).filter(([e])=>e.m===m.id);
  if(!(ex.some(([,i])=>i===S.ex)))S.ex=ex[0][1];const e=E[S.ex];
  $("#gal").innerHTML=`<div class="tview" style="--c:${m.c}">
   <div class="tbar"><div class="tnav">${M.map(x=>`<button type="button" class="tpill" data-type="${x.id}" aria-pressed="${x.id===m.id}" style="--c:${x.c}">${esc(x.name)}</button>`).join("")}</div></div>
   <div class="thead"><h2>${esc(m.name)}</h2><p>${esc(m.d)}</p></div>
   <div class="tbody"><nav class="exlist" aria-label="예시">${ex.map(([x,i],j)=>`<button type="button" class="exi" data-ex="${i}" aria-current="${i===S.ex}"><b>${esc(x.name)}</b><span>${esc(x.topic)}</span></button>`).join("")}</nav>
    <div class="exmain"><div class="sheetwrap"><div class="sh">${SH[e.sh]()}</div></div>
     <div class="exinfo"><dl><dt>정리하는 것</dt><dd>${esc(e.what)}</dd><dt>어울리는 차시</dt><dd>${esc(e.when)}</dd><dt>살펴볼 점</dt><dd>${esc(e.note)}</dd></dl>
     <p class="src">형식: ${esc(e.src)}</p><button type="button" class="use" data-use="${S.ex}" aria-pressed="${S.pick===S.ex}">${S.pick===S.ex?"모델로 고름":"이 예시를 모델로"}</button></div></div></div></div>`;}
function renderGal(){if(S.type)renderType();else renderHome();}
function renderApp(){const e=S.pick!=null?E[S.pick]:null;
  $("#model").innerHTML=e?`<button type="button" class="mthumb" data-zoom="${S.pick}" aria-label="크게 보기" style="--c:${mOf(e.m).c}"><div class="sheet-s"><div class="sh">${SH[e.sh]()}</div></div></button><div><p class="cname">${esc(e.name)}</p><p class="src" style="color:${mOf(e.m).c};font-weight:600">${esc(mOf(e.m).name)}</p><p class="src">${esc(e.topic)} · 형식: ${esc(e.src)}</p></div>`:`<div class="empty">모델로 삼을 예시를 아래에서 고르세요.</div>`;
  $("#pick").innerHTML=E.map((x,i)=>`<button type="button" class="chip" data-use="${i}" aria-pressed="${S.pick===i}" style="--c:${mOf(x.m).c}"><span class="dot"></span>${esc(x.name)}</button>`).join("");
  renderSheet();}
function renderSheet(){const e=S.pick!=null?E[S.pick]:null;const ph=t=>`<span class="ph">${t}</span>`;
  $("#sheet").innerHTML=`<div class="row"><b>차시</b><span>${S.lesson.trim()?esc(S.lesson):ph("—")}</span></div><div class="row"><b>정리 방식</b><span>${e?esc(mOf(e.m).name):ph("—")}</span></div><div class="row"><b>모델</b><span>${e?esc(e.name):ph("—")}</span></div><div class="act">${S.act.trim()?esc(S.act):ph("정리 활동")}</div>`;}
function showTab(t){S.tab=t;save();document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));$("#v-gal").hidden=t!=="gal";$("#v-app").hidden=t!=="app";if(t==="gal")renderGal();else renderApp();}
document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-tab]");if(tb){if(tb.dataset.tab==="gal"&&S.tab==="gal")S.type=null;showTab(tb.dataset.tab);window.scrollTo({top:0});return;}
  const ty=ev.target.closest("[data-type]");if(ty){S.type=ty.dataset.type;S.ex=null;save();renderGal();window.scrollTo({top:0});return;}
  const hm=ev.target.closest("[data-home]");if(hm){S.type=null;save();renderGal();window.scrollTo({top:0});return;}
  const ex=ev.target.closest("[data-ex]");if(ex){S.ex=Number(ex.dataset.ex);save();renderGal();return;}
  const z=ev.target.closest("[data-zoom]");if(z){const e=E[Number(z.dataset.zoom)];$("#dlgbody").innerHTML=`<div class="sh" style="--c:${mOf(e.m).c}">${SH[e.sh]()}</div>`;$("#dlgcap").textContent=e.name+" · 형식: "+e.src;$("#dlg").showModal();return;}
  const u=ev.target.closest("[data-use]");if(u){const i=Number(u.dataset.use);S.pick=i;save();if(S.tab==="gal"){showTab("app");window.scrollTo({top:0});}else renderApp();return;}
});
$("#dlgclose").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("click",ev=>{if(ev.target.id==="dlg")$("#dlg").close();});
const fl=$("#f-lesson"),fa=$("#f-act");fl.value=S.lesson;fa.value=S.act;
fl.addEventListener("input",()=>{S.lesson=fl.value;save();renderSheet();});
fa.addEventListener("input",()=>{S.act=fa.value;save();renderSheet();});
$("#copy").onclick=()=>{const e=S.pick!=null?E[S.pick]:null;
  const t=`차시: ${S.lesson}\n정리 방식: ${e?mOf(e.m).name:""}\n모델: ${e?e.name:""}\n정리 활동:\n${S.act}`;
  const done=m=>{$("#toast").textContent=m;setTimeout(()=>{$("#toast").textContent="";},2500);};
  try{navigator.clipboard.writeText(t).then(()=>done("복사했습니다."),()=>{fa.select();done("복사가 막혀 있습니다. 정리 활동 칸을 직접 복사하세요.");});}catch(e){fa.select();done("복사가 막혀 있습니다. 정리 활동 칸을 직접 복사하세요.");}
};
showTab(S.tab==="app"?"app":"gal");
})();
</script>
