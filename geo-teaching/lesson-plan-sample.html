<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>예시 지도안 스리랑카</title>
<style>
/* ═══ 공통 스타일 v2 ═══ */
html{overflow-y:scroll;scrollbar-gutter:stable}
:root{--w:980px;--ink:#26323B;--soft:#4A5560;--mute:#7A8590;--line:#D5D8D6;--bg:#F7F6F2;--panel:#FFFFFF;--head:#F1EFEA;--accent:#B4532A;--grid:#BFC4C2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6E8E6;--soft:#C2C8CC;--mute:#98A2AA;--line:#3A444C;--bg:#1B2227;--panel:#232B31;--head:#2C353C;--accent:#E0A07F;--grid:#46525B}}
:root[data-theme="dark"]{--ink:#E6E8E6;--soft:#C2C8CC;--mute:#98A2AA;--line:#3A444C;--bg:#1B2227;--panel:#232B31;--head:#2C353C;--accent:#E0A07F;--grid:#46525B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:var(--w);margin:0 auto;padding:0 30px}
@media (max-width:640px){.wrap{padding:0 16px}}
/* ═══ 공통 스타일 v2 끝 ═══ */
header{background:#26323B;color:#F7F6F2}
header .wrap{padding-top:20px;padding-bottom:16px}
header .ey{font-size:13.5px;color:#E0A07F;font-weight:700}
header h1{font-size:22px;font-weight:700;margin-top:2px}
header .bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.btns{display:flex;gap:8px}
.btn{font:inherit;font-size:14px;border:1px solid #5C6B76;background:transparent;color:#F7F6F2;border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
nav a{font-size:14px;color:var(--soft);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px}
nav a:hover{border-color:var(--ink);color:var(--ink)}
main{padding:24px 0 90px}
.paper{background:var(--panel);border:1px solid var(--line);padding:34px 38px;margin:0 0 26px;scroll-margin-top:64px}
@media (max-width:640px){.paper{padding:20px 14px}}
.paper h2{font-size:22px;text-align:center;letter-spacing:2px;margin-bottom:14px}
.paper h3{font-size:17px;margin:22px 0 8px}
.paper .mh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px;gap:12px;flex-wrap:wrap}
.paper .mh b{font-size:18px}
.paper .mh span{font-size:14px;color:var(--mute)}
.paper p{margin:6px 0}
.paper .note{font-size:14.5px;color:var(--soft)}
.paper ul{padding-left:20px;margin:6px 0}
.paper li{margin:3px 0}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
th,td{border:1px solid var(--grid);padding:7px 9px;text-align:left;vertical-align:middle;white-space:pre-line}
th{background:var(--head);font-weight:700}
td.c,th.c{text-align:center}
table.proc td{vertical-align:top}
table.proc td:first-child{vertical-align:middle;text-align:center;font-weight:700;background:var(--head)}
table.vote td:nth-child(2){height:130px}
table.sum td{text-align:center}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--head);padding:10px 14px;margin:0 0 12px;font-size:15px}
.ctl input{font:inherit;width:72px;padding:3px 6px;border:1px solid var(--grid);border-radius:4px;background:var(--panel);color:var(--ink)}
.ctl span{color:var(--soft);font-size:14px}
table.tix td{text-align:center;height:64px;font-size:14.5px;line-height:1.45;border-style:dashed}
.blank{display:inline-block;min-width:6em;border-bottom:1px solid var(--ink);height:1.15em;vertical-align:-.2em;margin:0 3px}
.pie{display:flex;justify-content:center;margin:6px 0}
.pie svg{width:440px;max-width:100%;height:auto}
.map{margin:8px 0}.map svg{width:100%;height:auto;display:block;border:1px solid var(--grid)}
table.mig td:first-child,table.mig th:first-child{text-align:center}
table.kr td:last-child{text-align:center}
.new{color:var(--accent);font-weight:700}
.lines span{display:block;border-bottom:1px solid var(--line);height:30px}
#doc{display:none}
@media print{
 header,nav,main{display:none!important}
 #doc{display:block}
 :root{--ink:#26323B;--soft:#4A5560;--mute:#7A8590;--line:#D5D8D6;--panel:#fff;--head:#F1EFEA;--grid:#BFC4C2}
 body{background:#fff;font-size:10.5pt}
 @page{size:A4;margin:14mm}
 .paper{border:none;padding:0;margin:0;page-break-after:always}
 .paper:last-child{page-break-after:auto}
 table{font-size:9.5pt}
 th,td{padding:4px 6px}
 table.tix td{height:44px}
 .noprint{display:none!important}
 table.vote td:nth-child(2){height:38mm}
}
</style>
</head>

 <div class="bar">

<script>
/* ───────── 내용 ─────────
   셀·문단 안의 [ ]는 학생이 채우는 빈칸이다. 답은 넣지 않는다. */
const PROC=[
 ['도입','동기 유발\n- 발문: "우리나라 공휴일 가운데 종교와 관련된 날은? 왜 하필 이 날들일까?" (부처님오신날, 성탄절. 신자가 많은 종교)\n- 발문: "1년 공휴일 25일 가운데 21일이 종교와 관련된 나라가 있다." 지도에서 스리랑카의 위치를 확인한다.\n- 탐구 질문: 여러 민족과 종교가 함께 사는 나라에서는 어떤 일이 생기며, 함께 살아가려면 무엇이 필요한가?\n- 투표권에 적힌 정체성은 활동이 끝날 때까지 비밀로 한다.','5','자료① 투표권\n지도책'],
 ['전개 1','스리랑카의 공휴일\n- 활동지①: 공휴일마다 관련 종교를 표시하고 종교별 공휴일 수를 센다. (불교 13, 힌두교 3, 이슬람교 3, 기독교 2, 비종교 4일)\n- 활동지②: 종교 구성 그래프와 민족·종교·언어 표를 완성한다.\n- 발문: "작은 섬나라에 왜 네 종교가 있을까?" 답은 전개 3에서 찾는다.\n- 활동지④ 1번을 채운다.','8','활동지①, ②, ④'],
 ['전개 2','스리랑카 국민투표: 모둠 논의 → 전체 국민투표\n- 학생은 투표권에 적힌 스리랑카 국민의 입장이 되어, 독립 이후 실제로 있었던 세 안건을 연도 순서대로 다룬다.\n  ① 1948 차 농장 노동자의 시민권  ② 1956 싱할라어 단독 공용어  ③ 1987 북부·동부 자치\n- 모둠 논의(6분): 4~5명 모둠에서 안건마다 각자 맡은 사람의 입장과 근거를 말하고 활동지③에 적는다.\n- 전체 국민투표(6분): 학급 전체가 국민으로서 안건마다 찬반을 투표하고, 결과를 칠판과 활동지③에 기록한다.\n- 교사는 모둠을 돌며 "이 사람은 왜 찬성(반대)할까?"를 묻는다.','15','활동지③'],
 ['전개 3','실제 상황과 개념 정리\n- 실제 결정과 비교한다(자료②). 다수 집단의 뜻대로 ①은 거부, ②는 통과되었고, 갈등은 1983~2009년의 내전으로 이어졌다.\n- 여러 집단이 한 섬에 살게 된 까닭을 이주 지도로 설명한다(자료③). 인도양 바닷길의 위치, 불교 전래, 타밀인의 이주, 아랍 상인, 유럽의 식민 지배, 영국의 차 플랜테이션\n- 역할을 공개하고 토의한다: "다수결로 정했으니 공정한가? 소수 집단의 권리를 지키려면 어떤 제도가 필요한가?"\n- 활동지④ 2~4번을 채운다.','18','자료②, ③\n활동지④'],
 ['정리','학습 정리\n- 활동지④ 몇 장을 함께 읽으며 탐구 질문에 대한 답을 확인한다.\n- 차시 예고: 이슬람교와 힌두교의 종교 경관이 사람들의 생활에 미치는 영향','4','활동지④']
];
const MATS=[
 ['자료①','투표권','학생 한 명에게 스리랑카 사람 한 명의 민족, 언어, 종교를 맡긴다. 인구 비율을 반영해 다수와 소수의 차이를 투표에서 겪게 한다.'],
 ['활동지①','스리랑카의 공휴일','공휴일에 담긴 종교를 찾아 스리랑카의 종교 구성을 짐작하게 한다.'],
 ['활동지②','스리랑카의 민족과 종교','종교 구성 그래프와 민족·종교·언어 표로 배경 지식을 정리한다.'],
 ['활동지③','스리랑카 국민투표','독립 이후 실제로 있었던 세 결정을, 맡은 역할의 입장에서 토론하고 투표한다.'],
 ['자료②','실제로는 어떻게 결정되었나','투표 결과를 실제 결정과 그 뒤의 변화와 비교하게 한다.'],
 ['자료③','왜 한 섬에 여러 민족과 종교가 살게 되었나','이주 경로 지도와 표로, 위치와 이주의 역사(교역, 식민 지배, 플랜테이션)가 지금의 민족과 종교 분포를 만들었음을 보여 준다.'],
 ['활동지④','정리 워크시트','활동으로 알게 된 것을 핵심 개념으로 정리한다. 수업 내내 해당 부분을 채운다.']
];
const HOL=[
 ['1.15','타이 퐁갈\n한 해의 추수와 태양에 감사하는 타밀인의 힌두교 축제'],
 ['1.20','포야데이(1월)\n포야는 보름날이다. 불교에서는 보름을 신성한 날로 여겨, 스리랑카는 매달 보름을 공휴일로 정했다. 사람들은 흰옷을 입고 절에 가며, 이날은 고기와 술을 팔 수 없다.'],
 ['2.4','독립기념일\n1948년 영국으로부터 독립한 것을 기념하는 날'],
 ['2.19','포야데이(2월)'],
 ['3.4','마하 시바라트리\n\'시바의 위대한 밤\'이라는 뜻으로, 힌두교의 신 시바를 기리는 날'],
 ['3.20','포야데이(3월)'],
 ['4.13~14','싱할라·타밀 새해\n싱할라족과 타밀인이 함께 쇠는 설날. 가족이 모여 전통 음식과 놀이를 즐긴다.'],
 ['4.19','성금요일\n예수의 십자가 처형을 기리는 기독교 공휴일. 부활절 전 금요일이다.'],
 ['4.19','포야데이(4월)'],
 ['5.1','노동절\n노동자의 권리와 복지를 기리는 날'],
 ['5.18~19','웨삭데이(5월 포야데이)\n부처의 탄생, 깨달음, 열반을 기념하는 스리랑카 최대의 명절'],
 ['6.5','이드 알피트르\n약 한 달 동안의 라마단(금식 기간)이 끝난 것을 축하하는 날'],
 ['6.16','포야데이(6월, 포손)\n기원전 3세기 인도에서 불교가 전해진 것을 기념하는 날'],['7.16','포야데이(7월)'],
 ['8.12','이드 알아드하\n\'희생제\'라는 뜻. 무슬림은 모스크에서 예배하고, 일부는 성지 순례를 떠난다.'],
 ['8.14','포야데이(8월)'],['9.13','포야데이(9월)'],['10.13','포야데이(10월)'],
 ['10.27','디파발리\n집집마다 작은 등불을 밝히는 힌두교 최대의 명절. \'빛의 축제\'라고도 한다.'],
 ['11.10','밀라드 운나비\n선지자 무함마드의 탄생을 기념하는 이슬람교 공휴일'],
 ['11.12','포야데이(11월)'],['12.11','포야데이(12월)'],
 ['12.25','크리스마스\n예수의 탄생을 기념하는 기독교 공휴일']
];
/* 투표권 배정: 민족·언어·종교를 묶은 정체성별 인구 비율(2012년 인구 조사를 바탕으로 어림)에 따라
   학급 인원을 나눈다(최대 나머지 방식). 소수 집단이 사라지지 않도록 주요 정체성은 1장 이상 둔다. */
const IDS=[
 {k:'SB',eth:'싱할라족',lang:'싱할라어',rel:'불교',w:70},
 {k:'SC',eth:'싱할라족',lang:'싱할라어',rel:'기독교',w:4},
 {k:'TH',eth:'스리랑카 타밀인',lang:'타밀어',rel:'힌두교',w:9},
 {k:'TC',eth:'스리랑카 타밀인',lang:'타밀어',rel:'기독교',w:3},
 {k:'IH',eth:'인도 타밀인(차 농장)',lang:'타밀어',rel:'힌두교',w:4},
 {k:'MM',eth:'무어족',lang:'타밀어',rel:'이슬람교',w:10}];
const REAL={eth:{'싱할라족':74.9,'스리랑카 타밀인':11.2,'인도 타밀인(차 농장)':4.2,'무어족':9.2},lang:{'싱할라어':75,'타밀어':25},rel:{'불교':70.2,'힌두교':12.6,'이슬람교':9.7,'기독교':7.4}};
let NSTU=30;try{const v=+localStorage.getItem('sri.n');if(v>=10&&v<=40)NSTU=v;}catch(e){}
function alloc(n){const tot=IDS.reduce((a,b)=>a+b.w,0);
 const q=IDS.map(d=>n*d.w/tot),c=q.map(Math.floor);let left=n-c.reduce((a,b)=>a+b,0);
 q.map((v,i)=>[v-c[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(([,i])=>c[i]++);
 const need=i=>{if(c[i]<1){c[i]++;c[0]--;}};
 need(2);need(4);need(5); // 스리랑카 타밀인, 인도 타밀인, 무어족은 1장 이상
 if(c[1]+c[3]<1){c[3]++;c[0]--;} // 기독교 1장 이상
 return c;}
function tix(n){const c=alloc(n),L=[];IDS.forEach((d,i)=>{for(let j=0;j<c[i];j++)L.push(`${d.eth}\n${d.lang} · ${d.rel}`);});return L;}
function tixSummary(n){const c=alloc(n),row=(key,lab)=>{const m={};IDS.forEach((d,i)=>{m[d[key]]=(m[d[key]]||0)+c[i];});
  return Object.keys(REAL[key]).map(k=>[lab,k,`${m[k]||0}장`,`${Math.round((m[k]||0)/n*100)}%`,`${REAL[key][k]}%`]);};
 return[['구분','집단','장수','학급 비율','실제 비율'],...row('eth','민족'),...row('lang','언어'),...row('rel','종교')];}
function tixBlocks(){const L=tix(NSTU),rows=[];for(let r=0;r<L.length;r+=5){const a=L.slice(r,r+5);while(a.length<5)a.push('');rows.push(a);}
 return[{note:`학급 인원 ${NSTU}명에 맞춰 스리랑카의 민족, 언어, 종교 비율대로 배정한 투표권이다. 수업 전에 잘라 섞은 뒤 한 장씩 나눠 준다. 투표권에 적힌 정체성은 활동이 끝날 때까지 비밀로 한다.`},
  {table:{rows,w:[20,20,20,20,20],cls:'tix'}},
  {h3:'배정 결과'},
  {table:{rows:tixSummary(NSTU),w:[14,34,16,18,18],head:1,col0:1,cls:'sum'}},

function blockHTML(b){
 if(b.h3)return`<h3>${esc(b.h3)}</h3>`;
 if(b.p)return`<p${b.b?' style="font-weight:700"':''}>${bl(b.p)}</p>`;
 if(b.note)return`<p class="note">${esc(b.note)}</p>`;
 if(b.ul)return`<ul>${b.ul.map(x=>`<li>${bl(x)}</li>`).join('')}</ul>`;
 if(b.pie)return PIE;
 if(b.map)return`<div class="map">${MAPSVG}</div>`;
 if(b.table){const t=b.table;return`<table class="${t.cls||''}"><colgroup>${t.w.map(w=>`<col style="width:${w}%">`).join('')}</colgroup>${t.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>{const h=(t.head&&ri===0)||(t.lab&&ci===0)||(t.lab6&&ci%2===0)||(t.col0&&ci===0&&ri>0)||(t.cls==='proc'&&ri===t.rows.length-1&&ci===0);const center=(t.cls==='proc'&&(ci===2))||(t.cls==='hol'&&ci>=2)||(t.cls==='vote'&&ci>=2);let v=bl(c);if(t.cls==='hol'&&ci===1&&ri>0){const[a,...rest]=String(c).split('\n');v=`<b>${esc(a)}</b>${rest.length?'\n'+esc(rest.join('\n')):''}`;}if(t.cls==='proc'&&ci===1&&ri>0){const[a,...rest]=String(c).split('\n');v=`<b>${esc(a)}</b>\n${esc(rest.join('\n'))}`;}return`<${h?'th':'td'}${center?' class="c"':''}>${v}</${h?'th':'td'}>`;}).join('')}</tr>`).join('')}</table>`;}
 return'';}
function secHTML(s,screen){return`<section class="paper" id="${s.id}">${s.title?`<h2>${esc(s.title)}</h2>`:''}${s.mh?`<div class="mh"><b>${esc(s.mh)}</b>${s.name?'<span>이름 ________________</span>':''}</div>`:''}${s.id==='m1'&&screen?`<div class="ctl noprint"><label>학급 인원 <input type="number" id="nstu" min="10" max="40" value="${NSTU}"></label><span>명 (10~40명) · 바꾸면 투표권과 배정 결과가 바로 다시 계산된다.</span></div>`:''}<div id="${s.id}-body">${BL(s).map(blockHTML).join('')}</div></section>`;}
const BL=s=>typeof s.blocks==='function'?s.blocks():s.blocks;
document.getElementById('view').innerHTML=SEC.map(s=>secHTML(s,true)).join('');
document.addEventListener('input',e=>{if(e.target.id!=='nstu')return;const v=Math.round(+e.target.value);if(!(v>=10&&v<=40))return;NSTU=v;try{localStorage.setItem('sri.n',String(v));}catch(_){}document.getElementById('m1-body').innerHTML=BL(SEC[1]).map(blockHTML).join('');});
document.getElementById('dlPdf').onclick=()=>{document.getElementById('doc').innerHTML=SEC.map(s=>secHTML(s,false)).join('');window.print();};

const xe=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=(t,o={})=>`<w:r><w:rPr>${o.b?'<w:b/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.sz||20}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
const P=(runs,o={})=>`<w:p><w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after??60}" w:line="${o.line||252}" w:lineRule="auto"/>${o.jc?`<w:jc w:val="${o.jc}"/>`:''}${o.bd?'<w:pBdr><w:bottom w:val="single" w:sz="12" w:space="3" w:color="26323B"/></w:pBdr>':''}${o.ind?`<w:ind w:left="${o.ind}" w:hanging="${o.hang||0}"/>`:''}</w:pPr>${runs}</w:p>`;
const BR=(t,o={})=>String(t).split(/(\[[^\]]*\])/).filter(x=>x!=='').map(x=>/^\[.*\]$/.test(x)?R('_'.repeat(Math.max(10,Math.round((x.length-2)*2.4))),o):R(x,o)).join('');
function cellPs(c,o){return String(c).split('\n').map((l,i)=>P(BR(l,{...o,b:o.b||(o.firstBold&&i===0)}),{after:0,line:240,jc:o.jc})).join('');}
function TBL(t){const W=10318,ws=t.w.map(w=>Math.round(W*w/100));
 const brd='<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="8A9095"/>`).join('')+'</w:tblBorders>';
 return`<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/>${brd}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${t.rows.map((r,ri)=>`<w:tr>${t.cls==='tix'?'<w:trPr><w:trHeight w:val="900"/></w:trPr>':(t.cls==='vote'&&ri>0?'<w:trPr><w:trHeight w:val="1900"/></w:trPr>':'')}${r.map((c,ci)=>{const h=(t.head&&ri===0)||(t.lab&&ci===0)||(t.lab6&&ci%2===0)||(t.col0&&ci===0&&ri>0)||(t.cls==='proc'&&ci===0&&ri>0);const center=(t.cls==='proc'&&ci!==1)||(t.cls==='hol'&&ci!==1)||(t.cls==='vote'&&ci>=2)||t.cls==='tix'||(t.head&&ri===0);const fb=(t.cls==='proc'&&ci===1&&ri>0)||(t.cls==='hol'&&ci===1&&ri>0);
  return`<w:tc><w:tcPr><w:tcW w:w="${ws[ci]}" w:type="dxa"/>${h?'<w:shd w:val="clear" w:color="auto" w:fill="F1EFEA"/>':''}<w:vAlign w:val="${t.cls==='proc'&&ci===1?'top':'center'}"/><w:tcMar><w:top w:w="45" w:type="dxa"/><w:bottom w:w="45" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tcMar></w:tcPr>${cellPs(c,{b:h,firstBold:fb,jc:center?'center':null,sz:t.cls==='hol'?18:19})}</w:tc>`;}).join('')}</w:tr>`).join('')}</w:tbl>`+P('',{after:40});}
function IMG(rid='rIdMap',w=721,h=642,cx=5760000,id=1){const cy=Math.round(cx*h/w);return`<w:p><w:pPr><w:spacing w:after="80"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="img${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="img${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;}

 if(b.h3)return P(R(b.h3,{b:1,sz:22}),{before:160,after:60});

 if(b.note)return P(R(b.note,{sz:18,c:'4A5560'}),{after:80});
