<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차시 개요 그리기</title>
<style>
/* ═══ 수업자료 공통 스타일 v1 ═══ */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --paper:#ffffff;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:1120px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9ECEA; --mid:#A8AFAC; --soft:#7D8582;
    --line:#2E3432; --line2:#252A28; --wash:#1C2120;
    --acc:#6FC0AE; --acc-w:#17302C; --red:#D9917E;
    --warn-b:#2A2519; --warn-l:#4A4028; --warn-t:#D9C89B; --paper:#121615;
  }
}
:root[data-theme="dark"]{
  --ink:#E9ECEA; --mid:#A8AFAC; --soft:#7D8582;
  --line:#2E3432; --line2:#252A28; --wash:#1C2120;
  --acc:#6FC0AE; --acc-w:#17302C; --red:#D9917E;
  --warn-b:#2A2519; --warn-l:#4A4028; --warn-t:#D9C89B; --paper:#121615;
}
*{box-sizing:inherit} html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 9px) 30px 9px;
  display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:4px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 11px;font-size:13.5px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}
.switch .dn{color:var(--acc);margin-left:6px;font-size:11px}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}
.gl{font-size:13px;color:var(--soft);font-weight:600;letter-spacing:.04em;margin:34px 0 -6px}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:20px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{max-width:900px;margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.step{margin-bottom:44px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:54em}

.bg{border-left:3px solid var(--acc);background:var(--wash);border-radius:0 8px 8px 0;
  padding:20px 24px;max-width:900px;font-size:16px;line-height:1.95}
.bg .l{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin-bottom:8px}
.bg p{margin:0 0 10px}.bg p:last-child{margin-bottom:0}
.bg .qq{font-weight:600}

.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);
  border-radius:10px;padding:12px 18px;margin-bottom:16px;background:var(--wash)}
.toolbar .tl{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.toolbar .tc{margin-left:auto;font-size:13px;color:var(--soft)}
.pens{display:flex;gap:8px;flex-wrap:wrap}
.pen{border:1px solid var(--line);border-radius:20px;cursor:pointer;padding:6px 15px;
  font-size:14px;background:none;color:var(--mid)}
.pen[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.pen i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.stdbox{border:1px solid var(--line);border-radius:10px;padding:20px 24px;max-width:900px}
.stdbox .code{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.04em;margin-bottom:6px}
.stdbox .body{font-size:19px;line-height:2.1;cursor:text;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:none;word-break:keep-all}
.stdbox .body mark{padding:2px 0;border-radius:3px;cursor:pointer;color:inherit}
.stdbox.empty{border-style:dashed}
.stdbox.empty .body{font-size:15px;color:var(--soft)}

.out{border-left:3px solid var(--acc);background:var(--acc-w);border-radius:0 8px 8px 0;
  padding:16px 20px;font-size:15.5px;margin-top:16px;max-width:900px}
.out h3{margin:0 0 7px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.out p{margin:0 0 8px;line-height:1.8}.out p:last-child{margin-bottom:0}
.out dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 16px;margin:0}
.out dt{color:var(--mid);font-size:14px}
.out dd{margin:0}
.out .none{color:var(--soft)}
.out .sm{font-size:14px;color:var(--mid);margin-top:10px}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;margin:18px 0;max-width:900px}

label.fl{display:block;font-size:14.5px;font-weight:600;margin:18px 0 5px}
label.fl em{font-style:normal;font-weight:400;color:var(--soft);font-size:13.5px;margin-left:8px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;background:none;line-height:1.7}
textarea{min-height:72px;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--acc)}
.fw{max-width:900px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;max-width:900px}
.narrow{max-width:280px}

.ovt{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.ov{border:1px solid var(--line);border-radius:10px;padding:20px 24px;max-width:860px}
.ovk{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:20px 0 6px}
.ovk:first-child{margin-top:0}
.ov p{margin:0;line-height:1.85}
.ov .ovbg{font-size:15.5px}
.ovl{margin:0;padding-left:20px}
.ovl li{margin:4px 0;line-height:1.75}
.ovl .qt{color:var(--mid);font-size:14px}
.ovhide{color:var(--soft);font-style:normal;border:1px dashed var(--line);border-radius:7px;
  padding:9px 14px;font-size:14px}
.secs{margin:0;padding-left:20px;max-width:900px}
.secs li{margin:5px 0;color:var(--mid)}
.fq{margin-bottom:30px}
.fqq{font-size:15.5px;font-weight:600;margin:0 0 10px}
.chip.st{cursor:default;color:var(--mid)}
.picks{display:grid;gap:10px;max-width:900px}
.pick1{display:flex;gap:13px;align-items:flex-start;text-align:left;background:none;
  border:1px solid var(--line);border-radius:9px;padding:13px 17px;cursor:pointer;color:var(--ink)}
.pick1:hover{border-color:var(--acc)}
.pick1[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.pick1 .mk{width:17px;height:17px;border:1px solid var(--line);border-radius:4px;flex:0 0 auto;margin-top:4px}
.pick1[aria-pressed="true"] .mk{background:var(--acc);border-color:var(--acc)}
.pick1 span{font-size:15px;line-height:1.65;word-break:keep-all}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:20px;cursor:pointer;
  padding:5px 13px;font-size:13px;color:var(--mid)}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:inline-flex;flex-wrap:wrap}
.seg button{background:none;border:1px solid var(--line);border-right:none;cursor:pointer;
  padding:7px 16px;font-size:14px;color:var(--mid)}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.qrow{display:grid;grid-template-columns:186px minmax(0,1fr);gap:10px;margin-bottom:10px;max-width:900px}
.qrow .qn{font-size:13px;color:var(--soft);padding-top:11px}

.ct{border-collapse:separate;border-spacing:0;width:100%;max-width:900px;font-size:14px;
  table-layout:fixed;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ct th,.ct td{border-bottom:1px solid var(--line2);padding:9px 11px;text-align:left;vertical-align:top}
.ct tbody tr:last-child td{border-bottom:none}
.ct thead th{background:var(--wash);border-bottom:1px solid var(--line);color:var(--mid);
  font-weight:600;font-size:12.5px}
.ct input,.ct select{border:none;padding:4px 2px;border-radius:0;background:none}
.ct td.no{color:var(--soft);font-size:13px;width:34px;text-align:center;padding-top:13px}
.ct td.pick{width:86px;text-align:center;padding-top:11px}
.ct td.pick label{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--mid);cursor:pointer}
.ct td.mm{color:var(--mid);font-size:13px}
.ct td .ds{display:block;color:var(--mid);font-size:13px;line-height:1.55;margin-top:2px}
.addrow{background:none;border:none;color:var(--mid);cursor:pointer;font-size:13.5px;padding:8px 0 0}
.addrow:hover{color:var(--acc)}

.chain{display:grid;gap:9px;max-width:900px}
.chainline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.chainline .n{font-size:12.5px;color:var(--soft);min-width:13px}
.chainline input{flex:1 1 260px}
.chainline .ar{color:var(--soft)}
.lockmsg{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);
  color:var(--soft);font-size:14px;max-width:900px}
.egbtn{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 15px;font-size:13.5px;color:var(--mid)}
.egbtn:hover{border-color:var(--acc);color:var(--ink)}

.goal{border:1px solid var(--acc);background:var(--acc-w);border-radius:10px;padding:20px 24px;
  margin-top:18px;max-width:900px}
.goal .l{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin-bottom:10px}
.goal textarea{border:none;background:none;font-size:16.5px;line-height:1.95;min-height:74px;padding:0}
.goal textarea:focus{outline:none}

.sum{max-width:900px;border:1px solid var(--line);border-radius:10px;padding:26px 28px}
.sum h4{margin:24px 0 8px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.sum h4:first-child{margin-top:0}
.sum p{margin:0 0 7px;white-space:pre-wrap;line-height:1.85}
.sum ol,.sum ul{margin:0;padding-left:20px}
.sum li{margin:3px 0}
.sum .none{color:var(--soft)}
.sum .me{color:var(--acc);font-weight:600}
.sum .gbox{border-left:3px solid var(--acc);padding-left:14px;font-size:16px}

.foot{margin-top:50px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  color:var(--mid);padding:6px 14px}
.foot button:hover{border-color:var(--acc);color:var(--ink)}
.foot .sp{flex:1}.foot .msg{color:var(--acc)}
.nav{display:flex;justify-content:space-between;margin-top:44px;padding-top:18px;
  border-top:1px solid var(--line2)}
.nav button{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;
  padding:8px 18px;font-size:14.5px;color:var(--mid)}
.nav button:hover{border-color:var(--acc);color:var(--ink)}
.nav button.go{background:var(--acc);border-color:var(--acc);color:#fff}

@media (max-width:760px){
  .hin{padding-left:16px;padding-right:16px;flex-wrap:wrap;gap:10px}
  .switch{margin-left:0;width:100%}
  main{padding:26px 16px 90px}
  h1{font-size:25px}
  .two,.qrow{grid-template-columns:1fr}
  .stdbox .body{font-size:17px}
}
@media print{
  header,.toolbar,.nav,.foot{display:none}
  main{padding:0;max-width:none} body{font-size:11pt}
  .sum{border:none;padding:0}
}
</style>
<style>
.ovt{font-size:23px;font-weight:700;letter-spacing:-.025em;margin:0 0 4px}
.ovmeta{font-size:13.5px;color:var(--soft);margin:0 0 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ovmeta a{color:var(--acc);text-decoration:none;border-bottom:1px solid var(--acc)}
.fieldrow{border-top:1px solid var(--line2);padding:18px 0}
.fieldrow:first-of-type{border-top:none;padding-top:0}
.fk{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 3px}
.fd{font-size:13px;color:var(--soft);margin:0 0 10px;line-height:1.55}
.fv{font-size:16px;line-height:1.9;max-width:860px}
.fv ol,.fv ul{margin:0;padding-left:20px}
.fv li{margin:5px 0}
.fv .qt{color:var(--mid);font-size:14.5px}
.pick9{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.p9{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;
  padding:6px 13px;font-size:13.5px;color:var(--mid)}
.p9:hover{border-color:var(--acc);color:var(--ink)}
.p9[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.prev{border:1px solid var(--acc);border-radius:10px;padding:24px 26px;max-width:900px;margin-top:8px}
.prev .fk{margin-top:18px}
.prev .fk:first-child{margin-top:0}
.prev .none{color:var(--soft)}
.mini2{display:flex;gap:12px;flex-wrap:wrap;max-width:520px;margin-bottom:26px}
.mini2 input{width:190px}
</style>
<style>
.ov.tight .fieldrow{padding:16px 0}
.qtwrap{overflow-x:auto}
.qt2{min-width:640px}
.qt2 td{padding:6px 7px}
.qt2 td.no{width:28px;color:var(--soft);font-size:12.5px;text-align:center;padding-top:14px}
.qt2 td.x{padding-top:11px;text-align:center}
.qt2 td.x button{background:none;border:none;color:var(--soft);cursor:pointer;font-size:15px}
.qt2 td.x button:hover{color:var(--red)}
.prev .fv .qm{display:block;font-size:13.5px;color:var(--mid);margin-top:2px}
.qcard{border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:12px}
.qcard .qh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.qcard .qh .n{font-size:12.5px;color:var(--soft);min-width:14px}
.qcard .qh select{max-width:280px}
.qcard .sub{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.qcard .sl{font-size:12px;color:var(--soft);margin:0 0 7px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid .full{grid-column:1/-1}
.thumb{margin-top:9px;display:flex;gap:10px;align-items:flex-start}
.thumb img{max-width:160px;border:1px solid var(--line);border-radius:6px}
.thumb button{background:none;border:1px solid var(--line);border-radius:6px;
  cursor:pointer;color:var(--mid);padding:4px 10px;font-size:12.5px}
.prev .qitem{margin:0 0 12px}
.prev .qitem .qx{font-size:16px;line-height:1.8}
.prev .qitem .qm{font-size:13.5px;color:var(--mid);margin-top:3px}
.prev .qitem .qm a{color:var(--acc)}
.prev .qitem img{max-width:220px;border:1px solid var(--line);border-radius:6px;margin-top:8px}
@media (max-width:700px){.qgrid{grid-template-columns:1fr}}
</style>
<style>
.qtwrap{overflow-x:auto}
.qt2{min-width:660px}
.qt2 td{padding:6px 7px}
.qt2 td.no{width:28px;color:var(--soft);font-size:12.5px;text-align:center;padding-top:14px}
.qt2 td.x{padding-top:11px;text-align:center;width:30px}
.qt2 td.x button{background:none;border:none;color:var(--soft);cursor:pointer;font-size:15px}
.qt2 td.x button:hover{color:var(--red)}
.ov.tight .fieldrow{padding:18px 0}
.rowlist{display:grid;gap:7px}
.rl{display:flex;gap:8px;align-items:center}
.rl .n{font-size:12.5px;color:var(--soft);min-width:13px}
.hint{font-size:12.5px;color:var(--soft);margin:0 0 9px;line-height:1.7}
.hint b{color:var(--mid);font-weight:600}
.egwrap details{margin-top:26px;border-top:1px solid var(--line2);padding-top:14px}
.egwrap summary{cursor:pointer;font-size:14px;color:var(--mid)}
.prev .fv .qm{display:block;font-size:13.5px;color:var(--mid);margin-top:2px}
.memo{font-size:13.5px;color:var(--mid)}
.ct thead th{font-size:12.5px}
</style>
<style>
textarea.sm{min-height:0}
.ov.tight .fieldrow{padding:16px 0}
</style>
<style>
.curbox{border:1px solid var(--line);border-radius:10px;padding:18px 22px;max-width:900px;margin-top:14px;background:var(--wash)}
.ck{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 8px}
.clist{margin:0;padding:0;list-style:none}
.clist li{font-size:14.5px;line-height:1.7;padding:6px 0 6px 0;color:var(--mid);border-top:1px solid var(--line2)}
.clist li:first-child{border-top:none}
.clist li b{color:var(--soft);font-weight:600;font-size:13px;margin-right:6px}
.clist li.on{color:var(--ink)}
.clist li.on b{color:var(--acc)}
.cex{margin:0;font-size:14.5px;line-height:1.8;color:var(--mid)}
</style>
</head>
<body>
<header><div class="hin">
  <button class="brand" id="brand">
    <span class="c">지리교재연구 및 지도법 · 9월 29일</span>
    <span class="n">차시 개요 작성하기</span>
  </button>
  <nav class="switch" id="switch"></nav>
</div></header>
<main id="main"></main>
<script>
(function(){
"use strict";
var TAMGU=[{"t": "3.7 한국의 산업은 왜 그곳에 모여있을까?", "bg": "우리나라의 대표적인 제조업에는 무엇이 있을까? 반도체·자동차·조선·철강·석유화학 등이 떠오른다. 이러한 산업들은 아무 곳에나 자리 잡지 않는다. 포항과 광양에는 제철소가, 거제와 울산에는 조선소가, 울산과 여수에는 석유화학단지가, 화성과 평택에는 반도체 공장이 집중되어 있다. 이러한 분포는 우연히 형성된 것이 아니다. 산업마다 생산에 필요한 조건이 다르고, '유리한 입지'의 의미도 시대에 따라 달라져 왔다. 중화학공업이 성장하던 시기에는 원료를 대량으로 들여오고 제품을 수출할 수 있는 항만이 중요했다. 반면 첨단산업에서는 인재·연구·자본·전문 서비스가 모여 있는 환경이 더욱 중요해졌다. 그 결과 한국의 산업 지도에는 산업별로 뚜렷한 공간적 패턴이 나타난다. 산업은 한 번 입지하면 그곳에만 머무르지 않는다. 관련 기업과 협력업체, 연구기관, 숙련된 인력이 같은 지역으로 모여들면서 산업은 더욱 집적된다.", "ki": ["주요 제조업은 산업마다 필요한 입지 조건에 따라 특정 지역에 집중되며, 그 입지 조건은 시대에 따라 달라진다.", "한 번 자리 잡은 산업은 관련 기업·협력업체·연구기관·숙련된 인력을 끌어들이며, 시간이 지날수록 산업은 한 지역에 더욱 집중된다."], "goal": "학생들은 한국 주요 제조업의 분포와 입지 요인을 파악하고, 관련 기업과 인력이 한 지역에 집적되어 클러스터를 형성하는 과정을 설명할 수 있다.", "q": [["어디인가?", "한국의 주요 산업은 어디에 분포하는가?"], ["왜 거기인가?", "각 산업은 왜 그 지역에 자리 잡았는가?"], ["어떻게 연결되는가?", "한 지역에 모인 기업과 인력은 서로 어떻게 연결되는가?"]], "conc": "산업 입지, 적환지 입지, 클러스터", "secs": ["어디인가? 한국의 주요 산업은 어디에 분포하는가?", "왜 거기인가? 각 산업은 왜 그 지역에 자리 잡았는가?", "어떻게 연결되는가? 왜 산업은 한 지역에 계속 모여들까?"], "url": "https://kgeography.tistory.com/293", "no": "3.7"}, {"t": "3.8 산업의 변화는 왜 지역의 운명을 바꾸는가?", "bg": "산업은 한 지역에 자리 잡은 뒤에도 계속 같은 모습으로 남아 있지 않는다. 기술과 시장, 정부 정책, 기업의 투자 결정이 달라지면 어떤 산업은 성장하고, 어떤 산업은 쇠퇴하거나 다른 지역으로 이동한다. 정선과 태백은 한때 우리나라의 대표적인 탄광 지역이었지만, 석탄 산업이 쇠퇴하면서 인구와 일자리가 크게 줄었다. 서울 구로와 인천·부천·안양에서는 경공업 공장이 떠난 자리에 정보통신 기업과 주거 시설이 들어섰다. 이러한 변화는 지금도 이어지고 있다. 조선업의 침체를 겪은 거제는 인구와 고용이 흔들린 반면, 반도체 산업이 성장한 평택은 공장과 기업, 인구가 빠르게 증가하였다. 이처럼 산업 구조의 변화는 지역의 인구와 고용, 토지 이용과 주민 생활을 바꾼다. 특히 특정 산업에 대한 의존도가 높은 지역일수록 산업의 성장과 쇠퇴가 지역 전체에 미치는 영향도 커진다.", "ki": ["산업 구조는 기술 변화, 글로벌 경쟁, 정부 정책, 기업의 투자와 이전에 따라 끊임없이 전환된다.", "산업 구조의 전환은 지역마다 서로 다른 성장과 쇠퇴를 일으키며, 지역 간 발전 격차를 만들어 낸다."], "goal": "학생들은 한국 산업 구조의 대표적인 변화 사례를 통해 산업 전환의 원인을 설명하고, 산업의 성장과 쇠퇴가 지역의 인구·고용·토지 이용에 미치는 영향을 비교할 수 있다.", "q": [["어떻게 변화했는가?", "한국의 산업과 산업 지역은 어떻게 변화해 왔는가?"], ["무엇이 영향을 미쳤는가?", "산업의 성장·쇠퇴·이전에는 어떤 요인이 작용하는가?"], ["어떻게 변화했는가?", "산업의 변화는 지역마다 어떤 차이를 만들어 내는가?"]], "conc": "산업 구조의 전환, 글로벌 경쟁, 공간적 불균등 발전", "secs": ["어떻게 변화했는가? 한국의 산업과 산업지역은 어떻게 변화해 왔는가?", "무엇이 영향을 미쳤는가? 산업의 성장, 쇠퇴, 이전에는 어떤 요인이 작용하는가?"], "url": "https://kgeography.tistory.com/294", "no": "3.8"}, {"t": "3.9 산업 위기 지역은 어떻게 대응하고 있는가?", "bg": "산업 구조가 전환되면 모든 지역이 같은 변화를 겪는 것은 아니다. 새로운 산업이 성장하는 지역도 있지만, 기존 산업에 크게 의존하던 지역은 일자리와 인구가 감소하기도 한다. 이러한 지역들은 관광산업을 육성하거나, 기존 산업을 유지하면서 새로운 산업을 더하고, 첨단산업을 유치하는 등 다양한 방식으로 변화에 대응해 왔다. 이번 차시에서는 정선·태백, 여수, 군산의 사례를 통해 산업 위기 지역이 어떤 방식으로 변화에 대응했는지 살펴본다.", "ki": ["산업 위기 지역은 관광산업 육성, 산업 다각화, 신산업 유치 등 다양한 방식으로 변화에 대응하였다.", "지역이 선택한 대응 방식은 지역의 산업 기반과 조건에 따라 달라지며, 그 결과도 서로 다르게 나타난다."], "goal": "학생들은 산업 위기 지역의 대응 사례를 자료와 통계를 바탕으로 비교·분석하고, 지역마다 서로 다른 대응 방식과 그 결과를 설명할 수 있다.", "q": [["어떻게 변화해 왔는가?", "산업 위기 지역은 산업 변화에 어떻게 대응해 왔는가?"], ["어떻게 변화해야 할까?", "산업 위기 지역에는 어떤 대응이 필요한가?"]], "conc": "산업 다각화, 지역 회복 탄력성", "secs": ["어떻게 변화해 왔는가? 산업 위기 지역은 산업 변화에 어떻게 대응해 왔는가?", "어떻게 변화해야 하는가? 산업 위기 지역은 무엇이 필요한가?"], "url": "https://kgeography.tistory.com/295", "no": "3.9"}, {"t": "4.8 자연현상은 언제 자연재해가 되는가?", "bg": "2024년 여름, 우리나라에서는 폭염으로 108명이 사망하였다. 이는 그해 자연재난으로 발생한 사망·실종자 121명의 약 89%에 해당한다. 폭염은 태풍이나 호우와 달리 건물을 무너뜨리거나 도로를 침수시키는 경우가 거의 없다. 그러나 많은 인명 피해를 일으켰다. 그렇다면 폭염과 같은 자연현상은 언제 자연재해가 되는가? 또 같은 더위에서도 사람마다 피해가 다른 까닭은 무엇인가? 이번 차시에서는 2024년 폭염을 중심으로 자연현상과 자연재해의 차이를 알아보고, 자연재해의 피해에 영향을 미치는 조건과 재해의 크기를 판단하는 방법을 살펴본다.", "ki": ["태풍이나 폭염과 같은 자연현상은 사람과 사회에 피해를 줄 때 자연재해가 된다.", "자연재해의 피해는 자연현상의 강도뿐 아니라 사람과 지역의 취약성, 피해에 대응하고 회복하는 능력에 따라 달라진다."], "goal": "학생들은 자연현상과 자연재해의 차이를 구분하고, 위험·취약성·회복탄력성의 관계를 통해 재해 피해가 달라지는 까닭을 설명하며, 우리나라의 주요 자연재해를 피해를 중심으로 이해할 수 있다.", "q": [["무엇인가?", "자연현상은 언제 자연재해가 되는가?"], ["무엇이 영향을 미쳤는가?", "같은 더위에도 사람마다 피해가 다른 까닭은 무엇인가?"], ["왜 중요한가?", "자연재해는 무엇으로 판단하는가?"]], "conc": "자연재해, 위험, 취약성, 회복탄력성", "secs": ["무엇인가? 자연현상은 언제 자연재해가 되는가?", "무엇이 영향을 미쳤는가? 같은 더위에도 사람마다 피해가 다른 까닭은 무엇인가?", "왜 중요한가? 자연재해는 무엇으로 판단하는가?"], "url": "https://kgeography.tistory.com/281", "no": "4.8"}, {"t": "4.9 왜 우리나라는 홍수 피해가 반복될까?", "bg": "우리나라는 여름철에 비가 집중되는 나라이다. 장마와 태풍의 영향으로 짧은 기간에 많은 비가 내리며, 산지가 많고 하천의 경사가 급해 빗물이 빠르게 하천으로 모인다. 이 때문에 우리나라는 홍수 위험이 큰 자연환경을 가지고 있다. 그러나 같은 양의 비가 내려도 모든 지역과 사람이 같은 피해를 입는 것은 아니다. 도시에서는 불투수면이 늘어나 빗물이 빠르게 모이고, 저지대와 반지하 주택처럼 물이 모이기 쉬운 공간에서는 피해가 더 크게 나타날 수 있다. 또한 같은 지역에서도 주거 형태와 대피 여건에 따라 피해의 정도는 달라진다. 우리나라에서 홍수 위험이 큰 까닭은 무엇일까? 또한 도시화는 빗물의 흐름을 어떻게 바꾸었으며, 같은 호우에서도 지역과 사람에 따라 피해가 다르게 나타나는 까닭은 무엇일까?", "ki": ["우리나라는 비가 여름철에 집중되고, 하천의 경사가 급해 빗물이 짧은 시간 안에 모이므로 홍수 위험이 크다.", "도시화는 빗물의 흐름과 취약성의 분포를 바꾸어 같은 호우에서도 지역과 사람에 따라 다른 피해를 만든다."], "goal": "학생들은 우리나라의 강수와 하천 특성이 홍수 위험에 미치는 영향을 설명하고, 도시화와 취약성에 따라 홍수 피해가 다르게 나타나는 까닭을 자료를 통해 분석할 수 있다.", "q": [["왜 거기인가?", "우리나라는 왜 여름철 홍수 위험이 큰가?"], ["어떻게 변화하였는가?", "도시는 빗물의 흐름을 어떻게 바꾸었는가?"], ["무엇이 영향을 미쳤는가?", "같은 호우에도 피해가 다르게 나타나는 까닭은 무엇인가?"]], "conc": "계절풍, 정체전선, 유역, 첨두유량, 불투수면, 도시 침수, 노출, 취약성", "secs": ["어디인가? 왜 거기인가? 우리나라는 왜 홍수에 취약한가?", "어떻게 변화하였는가? 도시화는 홍수 위험을 어떻게 바꾸었는가?", "누가 더 큰 피해를 입는가? 같은 호우에도 피해가 다른 까닭은 무엇인가?"], "url": "https://kgeography.tistory.com/282", "no": "4.9"}, {"t": "4.10 대설과 산불은 왜 특정 지역에서 반복되는가?", "bg": "대설과 산불은 서로 다른 자연재해이지만, 아무 곳에서나 발생하지 않는다. 우리나라의 대설은 호남·충남 서해안과 강원 영동에 집중되며, 대형 산불 피해는 강원 영동과 경북 동해안에서 주로 나타난다. 강원 영동은 겨울철에 눈이 많이 내리는 지역인 동시에 봄철 대형 산불이 자주 발생하는 지역이다. 같은 지형이 계절에 따라 서로 다른 재해의 발생 조건에 영향을 미치는 것이다. 대설과 산불은 어디에서 반복되며, 이러한 공간적 패턴은 어떤 기후·지형 조건으로 설명할 수 있을까? 또한 산불의 발생과 확산에는 자연환경과 인간 활동이 각각 어떤 영향을 미칠까?", "ki": ["대설과 산불은 특정 지역에 집중되는 공간적 패턴을 보인다.", "계절에 따라 바람의 방향이 바뀌면서, 태백산맥은 겨울에는 눈을 쏟게 하고 봄에는 불을 키우는 바람을 만든다."], "goal": "학생들은 대설과 산불의 분포에서 공간적 패턴을 찾고, 그 패턴이 나타나는 까닭을 바람의 방향과 지형의 관계로 설명하며, 산불의 발생에서 인간 활동이 하는 역할을 자료를 통해 분석할 수 있다.", "q": [["어디인가?", "대설과 대형 산불은 어디에 집중되는가?"], ["왜 거기인가?", "태백산맥은 겨울철 대설과 봄철 산불에 어떤 영향을 미치는가?"], ["무엇이 영향을 미쳤는가?", "산불의 발생과 확산에는 자연환경과 인간 활동이 각각 어떤 영향을 미치는가?"]], "conc": "지형성 강설, 푄 현상, 양간지풍, 산림인접지역", "secs": ["어디인가? 대설과 대형 산불은 어디에 집중되는가?", "왜 거기인가? 태백산맥은 대설과 산불에 어떤 영향을 미치는가?", "무엇이 영향을 미쳤는가? 같은 산불인데 왜 피해는 지역마다 다른가?"], "url": "https://kgeography.tistory.com/283", "no": "4.10"}, {"t": "4.11 우리 지역은 자연재해에 어떻게 대비해야 하는가?", "bg": "오늘날에는 다양한 공간정보기술을 이용하여 우리 지역의 자연재해 위험과 취약성을 조사하고, 재해에 대한 대비 상태도 확인할 수 있다. 우리 지역에는 어떤 자연재해 위험이 있으며, 피해를 줄이기 위해 무엇을 준비해야 할까?", "ki": ["공간정보기술은 자연재해 위험이 어디에, 얼마나 나타나는지를 지역 단위로 조사하고 평가하는 데 활용된다.", "자연재해의 발생을 막을 수는 없지만, 적절한 대응과 회복탄력성을 통해 피해를 줄일 수 있다."], "goal": "학생들은 공간정보기술을 활용하여 우리 지역의 자연재해 위험과 취약성을 조사하고, 재해 대응 시설의 분포를 분석하여 지역에 필요한 대응 방안을 근거를 들어 제안할 수 있다.", "q": [["어디인가?", "우리 지역에는 어떤 자연재해 위험이 있는가?"], ["무엇이 영향을 미쳤는가?", "우리 지역의 재해 피해를 크게 만드는 요인은 무엇인가?"], ["어떻게 연결되는가?", "취약한 사람과 재해 대응 시설은 어떻게 연결되어 있는가?"], ["나는 무엇을 할 수 있는가?", "우리 지역의 재해 피해를 줄이기 위해 나는 무엇을 할 수 있는가?"]], "conc": "공간정보, 노출, 취약성, 회복탄력성", "secs": ["어디인가? 우리 지역에는 어떤 자연재해 위험이 있는가?", "무엇이 영향을 미쳤는가? 우리 지역의 재해 피해를 크게 만드는 요인은 무엇인가?", "어떻게 연결되는가? 취약한 사람과 재해 대응 시설은 어떻게 연결되어 있는가?", "나는 무엇을 할 수 있는가? 우리 지역의 재해 피해를 줄이기 위해 나는 무엇을 할 수 있는가?"], "url": "https://kgeography.tistory.com/299", "no": "4.11"}, {"t": "4.12 한국은 어떤 에너지로 움직이는가?", "bg": "한국의 온실가스 배출은 1990년 311백만 톤에서 2018년 780백만 톤으로 약 2.5배 늘었다. 이 배출의 약 75%는 산업(약 38%)과 발전(약 35%) 두 부문에서 나오며, 그중 발전 부문은 1990년 이후 약 7배 증가해 탄소 배출 증가의 가장 큰 원이이 되었다. 그런데 그 많은 전기는 누가, 어디서 만들고 있는가? 한국의 대형 발전소는 대부분 충남·전남·경북·부산·인천 같은 비수도권 해안에 줄지어 서 있고, 그 전기는 초고압 송전선로를 따라 수도권으로 흐른다. 이번 차시는 한국 에너지 시스템의 지리를 세 가지 질문으로 들여다본다. 어떤 발전원으로 전기를 만드는가, 그 발전소는 어디에 있는가, 그리고 그 전기는 어떻게 흘러 우리에게 도달하는가?", "ki": ["에너지믹스는 한 국가의 총 발전량에서 각 발전원이 차지하는 구성 비율이다.", "한국의 발전소는 자연조건에 따라 비수도권 해안에 자리 잡고, 그 전기는 수도권으로 흘러간다."], "goal": "학생들은 한국의 발전원별 구성 비율을 파악하고, 발전소의 입지 특성을 설명하며, 전력 생산지와 소비지의 공간적 분리 현상을 해석할 수 있다.", "q": [["무엇인가?", "에너지믹스란 무엇이며, 한국은 어떤 에너지로 움직이는가?"], ["어디인가? 왜 거기인가?", "한국의 발전소는 어디에 분포하며, 왜 거기에 있는가?"], ["어떻게 연결되는가?", "발전과 소비, 비수도권과 수도권은 어떻게 연결되어 있는가?"]], "conc": "에너지믹스, 발전원, 전력자급률, 발전-소비의 공간적 분리", "secs": ["무엇인가? 에너지 믹스란 무엇이며, 한국은 어떤 에너지로 움직이는가?"], "url": "https://kgeography.tistory.com/284", "no": "4.12"}, {"t": "4.13 2050 에너지 믹스: 우리는 어떤 미래를 선택할 것인가?", "bg": "한국은 2050년 탄소중립을 목표로 하고 있다. 이를 위해서는 온실가스 배출의 약 35%를 차지하는 발전 부문의 변화가 필수적이다. 그렇다면 한국은 앞으로 어떤 에너지 믹스를 지향해야 할까? 지난 40년 동안 한국과 영국은 같은 시대를 살면서 매우 다른 길을 걸어 왔다. 영국은 석탄을 거의 0%로 줄였지만, 한국은 여전히 화석연료에 크게 의존한다. 왜 그런 차이가 생겼는가? 한국이 발전 방식을 바꾼다면, 그 부담은 누구에게 어떻게 분배될 것인가? 이번 차시에서 우리는 한국과 영국 function marked(){var s=std();if(!s)return [];

function offIn(n,o){var h=(n.nodeType===3)?n.parentNode:n;
  if(!h||h.dataset.s===undefined)return null;return (+h.dataset.s)+o;}
function hl(el){
  var sl=window.getSelection();if(!sl||sl.isCollapsed||!sl.rangeCount)return;
  var r=sl.getRangeAt(0);
  if(!el.contains(r.startContainer)||!el.contains(r.endContainer))return;
  var a=offIn(r.startContainer,r.startOffset),b=offIn(r.endContainer,r.endOffset);
  if(a===null||b===null||a===b)return;
  var st=Math.min(a,b),en=Math.max(a,b);
  S.marks=S.marks.filter(function(m){return m.e<=st||m.s>=en;});
  S.marks.push({s:st,e:en});sl.removeAllRanges();save();paint();
}
var pm=false,tt=null,sk="";
function host(){var sl=window.getSelection();
  if(!sl||sl.isCollapsed||!sl.rangeCount)return null;

  return (n&&n.closest)?n.closest("[data-doc]"):null;}
function snap(){var sl=window.getSelection();
  if(!sl||sl.isCollapsed||!sl.rangeCount)return "";
  var r=sl.getRangeAt(0);return sl.toString()+"@"+r.startOffset+"-"+r.endOffset;}
if(window.PointerEvent)document.addEventListener("pointerdown",function(e){pm=(e.pointerType!=="mouse");},true);
else{document.addEventListener("touchstart",function(){pm=true;},{passive:true,capture:true});

document.addEventListener("selectionchange",function(){
  if(tt){clearTimeout(tt);tt=null;}

       '.memo{color:#525C60}.none{color:#8A9296}a{color:#0E5A50}'+
       '</style></head><body><div class="wrap">'+prevHTML()+'</div></body></html>';
      var b=new Blob([doc],{type:"text/html;charset=utf-8"});
      var u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download=(has(S.title)?S.title.replace(/[\\/:*?"<>|]/g,"").slice(0,40):"차시개요")+".html";
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},400);
      flash("내려받았습니다");
    }catch(e){flash("이 화면에서는 저장이 막혀 있습니다 · 파일로 열면 됩니다");}
  };
  if($("#copy"))$("#copy").onclick=function(){
    var el=$("#prev").cloneNode(true);
    Array.prototype.forEach.call(el.querySelectorAll(".fk"),function(h){h.textContent="\n■ "+h.textContent;});
    var t=(el.innerText||el.textContent).replace(/\n{3,}/g,"\n\n").trim();
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(t).then(function(){flash("복사했습니다");},function(){fb(t);});
    else fb(t);};
  if($("#clear"))$("#clear").onclick=function(){
    if(!window.confirm("이 기기에 저장된 내용을 모두 지웁니다. 계속할까요?"))return;
    try{localStorage.removeItem(KEY);}catch(e){}
    S=blank();S.scr=1;save();paint();};
}
function fb(t){var a=document.createElement("textarea");a.value=t;
  a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
  try{document.execCommand("copy");flash("복사했습니다");}catch(e){flash("복사에 실패했습니다");}
  document.body.removeChild(a);}
function flash(t){var e=$("#msg");if(e){e.textContent=t;setTimeout(function(){e.textContent="";},2600);}}

load();paint();
})();
</script>
</body>
