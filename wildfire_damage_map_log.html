<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시군구별 산불 피해면적 (2011-2025)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f7f7f5;color:#2c2c2a}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:#6b6b66;margin-bottom:6px}
.filter{font-size:13px;color:#993c1d;background:#fbe4d8;display:inline-block;padding:4px 11px;border-radius:5px;margin-bottom:12px}
#map{height:640px;border-radius:8px;border:1px solid #ddd}
.legend{background:#fff;padding:11px 13px;border-radius:6px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.legend b{display:block;margin-bottom:8px}
.cir{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.cir span.d{border-radius:50%;flex:none;border:1.6px solid #a8391a;background:rgba(216,90,48,.32)}
.foot{font-size:12px;color:#8a8a85;margin-top:10px;line-height:1.7}
.leaflet-popup-content{font-size:13px;line-height:1.75;margin:10px 12px}
@media(max-width:600px){#map{height:460px}}
</style></head><body>
<div class="wrap">
<h1>시군구별 산불 피해면적</h1>
<div class="sub">2011&ndash;2025년 &middot; 산불 7,175건 &middot; 원 크기는 총 피해면적 (로그 스케일)</div>
<div class="filter">총 피해면적 100ha 이상 38개 시군구만 표시</div>
<div id="map"></div>
<div class="foot">자료: 산림청 산불통계 &middot; 위치는 시군구 경계 중심점<br>
원 크기는 로그 스케일이다. 값이 10배 커질 때마다 원이 일정하게 커진다.<br>원을 클릭하면 상세 수치가 나옵니다. 표시되지 않은 지역에도 산불은 발생했습니다.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const map=L.map('map').setView([36.4,128.1],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:13,minZoom:6,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const MX=Math.max.apply(null,DATA.map(function(d){return d.a;}));
const MN=Math.min.apply(null,DATA.map(function(d){return d.a;}));
function rad(v){return 6+30*(Math.log(v)-Math.log(MN))/(Math.log(MX)-Math.log(MN));}
DATA.forEach(function(d){
  const m=L.circleMarker([d.lat,d.lng],{
    radius:rad(d.a),fillColor:'#d85a30',fillOpacity:0.3,
    color:'#a8391a',weight:1.6,opacity:0.85
  }).addTo(map);
  m.bindPopup('<b>'+d.nm+'</b><br>총 피해면적 <b>'+d.a.toLocaleString()+'</b> ha<br>발생 건수 <b>'+d.c+'</b>건<br>한 건당 평균 '+d.per+' ha');
  m.bindTooltip(d.nm,{direction:'top'});
});
const lg=L.control({position:'bottomright'});
lg.onAdd=function(){
  const el=L.DomUtil.create('div','legend');
  let h='<b>총 피해면적 (ha)</b>';
  [100000,10000,1000,100].forEach(function(v){
    const r=Math.round(rad(v)*2);
    h+='<div class="cir"><span class="d" style="width:'+r+'px;height:'+r+'px"></span>'+v.toLocaleString()+'</div>';
  });
  el.innerHTML=h;
  return el;
};
lg.addTo(map);
</script></body></html>
