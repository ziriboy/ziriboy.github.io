<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>2.1 지역이 음식을 만들고, 음식이 지역을 만든다</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ═══ 수업자료 공통 스타일 v2 ═══
   폭은 --w 하나로 정한다: 980px = 본문 920px + 좌우 여백 30px.
   아이패드 가로·세로에서 같은 배치를 유지하고, 640px 이하(휴대폰)에서만 세로로 쌓는다. */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#2B3338; --acc-w:#ECEEEF; --on-acc:#ffffff; --red:#A03A26;
  --paper:#ffffff;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --w:980px;
  /* 이 활동: 두 방향의 색 */
  --place:#3D5A6C; --place-w:#EEF2F5;
  --food:#9A7128;  --food-w:#F7F2E6;
  --place-l:#CBD6DE; --food-l:#E6D9B8;
  /* 기존 이름 */
  --accent:var(--acc); --ink-mid:var(--mid); --ink-soft:var(--soft);
  --line-soft:var(--line2); --surface:var(--paper); --bg:var(--paper);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
input,textarea,button{font-family:inherit;color:inherit;outline:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:8px 30px 10px}
.brand{font-size:12px;color:var(--soft);margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--paper)}
.seg button{flex:1;border:none;border-right:1px solid var(--line);background:none;cursor:pointer;
  padding:9px 6px;font-size:14.5px;color:var(--mid);white-space:nowrap}
.seg button:last-child{border-right:none}
.seg button:hover:not(:disabled):not(.on){background:var(--wash)}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.seg button:disabled{color:var(--soft);opacity:.5;cursor:default}
.seg button.done::after{content:" ✓";color:var(--place);font-weight:600}
.seg button.on.done::after{color:var(--on-acc)}
.wrap{max-width:var(--w);margin:0 auto;padding:30px 30px 70px}
@media(max-width:640px){
  .hin,.wrap{padding-left:16px;padding-right:16px}
  .seg{flex-wrap:wrap}
  .seg button{flex:1 0 33.3%;font-size:13px;padding:8px 2px;border-bottom:1px solid var(--line)}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9ECEA; --mid:#A8AFAC; --soft:#7D8582;
    --line:#2E3432; --line2:#252A28; --wash:#1C2120;
    --acc:#D3D8DA; --acc-w:#22282A; --on-acc:#121615; --red:#D9917E; --paper:#121615;
    --place:#9DB6C6; --place-w:#1C2328; --food:#D4B06A; --food-w:#29241A;
    --place-l:#33414B; --food-l:#4A3F28;
  }
}
/* ═══ 공통 스타일 v2 끝 ═══ */

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes slide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.slide{animation:slide .22s ease forwards}

.mast{border-bottom:2px solid var(--acc);padding-bottom:16px;margin-bottom:24px}
.mast h1{font-size:30px;font-weight:700;color:var(--acc);line-height:1.35;letter-spacing:-.01em}
.lede{font-size:16px;color:var(--mid);line-height:1.85;margin-bottom:26px}

/* 두 방향: 서로 다른 두 영역. 화살표 머리줄로 방향을 보여 준다 */
.dir{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dpanel{border-radius:6px;padding:20px 22px 22px}
.dpanel.place{background:var(--place-w)}
.dpanel.food{background:var(--food-w)}
.flow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.chip{font-size:14px;font-weight:600;padding:3px 12px;border-radius:14px;white-space:nowrap}
.place .chip.from{color:var(--place);border:1.5px solid var(--place);background:var(--paper)}
.place .chip.to{color:#fff;background:var(--place);border:1.5px solid var(--place)}
.food .chip.from{color:var(--food);border:1.5px solid var(--food);background:var(--paper)}
.food .chip.to{color:#fff;background:var(--food);border:1.5px solid var(--food)}
.flow svg{flex:1;height:14px}
.dpanel h4{font-size:17px;font-weight:600;margin-bottom:12px;line-height:1.5}
.icons{display:grid;gap:10px;margin-bottom:14px}
.place .icons{grid-template-columns:repeat(3,1fr)}
.food .icons{grid-template-columns:repeat(4,1fr)}
.ic{background:var(--paper);border-radius:5px;padding:12px 6px 10px;text-align:center}
.ic svg{width:40px;height:40px;display:block;margin:0 auto 6px}
.place .ic svg{color:var(--place)} .food .ic svg{color:var(--food)}
.ic span{display:block;font-size:13.5px;line-height:1.45;color:var(--ink);word-break:keep-all}
.dpanel p{font-size:14.5px;color:var(--mid);line-height:1.8}
@media(max-width:640px){.dir{grid-template-columns:1fr}.food .icons{grid-template-columns:repeat(2,1fr)}}
.sec{margin-bottom:30px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:5px}
.sec-n{font-size:13px;font-weight:600;color:var(--acc)}
.sec-t{font-size:19px;font-weight:600;color:var(--ink)}
.sec-d{font-size:15px;color:var(--ink-mid);margin-bottom:16px;line-height:1.8}

.cards{display:flex;gap:9px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:13px 17px;cursor:pointer;min-width:96px;text-align:center;
  transition:border-color .16s,box-shadow .16s,background .16s}
.card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(29,53,87,.08)}
.card.sel{background:var(--accent);border-color:var(--accent)}
.card .r{font-size:16px;font-weight:600;color:var(--ink)}
.card.sel .r{color:var(--on-acc)}
.card .f{font-size:14px;color:var(--ink-soft);margin-top:2px}
.card.sel .f{color:rgba(255,255,255,.72)}
.card.add{border-style:dashed}

.band{border-radius:4px;padding:20px;margin-bottom:14px}
.band.place{background:var(--place-w);border:1px solid var(--place-l)}
.band.food{background:var(--food-w);border:1px solid var(--food-l)}
.band-h{display:flex;align-items:center;gap:11px;margin-bottom:15px}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;
  padding:3px 10px;border-radius:2px;white-space:nowrap}
.tag.place{color:#fff;background:var(--place);border:1px solid var(--place)}
.tag.food{color:#fff;background:var(--food);border:1px solid var(--food)}
.band-h .cap{font-size:12.5px;color:var(--ink-mid)}
.band-h .ln{flex:1;height:1px;background:var(--line-soft)}

.slots{display:flex;gap:16px;flex-wrap:wrap}
.slot{flex:1;min-width:250px}
.slot-h{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.slot-n{font-size:12px;font-weight:700;color:var(--ink-soft)}
.slot-l{font-size:16px;font-weight:600;color:var(--ink)}
.slot-s{font-size:13px;color:var(--ink-soft)}
.q{margin-left:auto;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);
  background:none;color:var(--ink-soft);font-size:11px;cursor:pointer;line-height:1}
.task{font-size:14px;color:var(--ink-mid);line-height:1.85;margin-bottom:9px;
  padding-left:9px;border-left:2px solid var(--line)}
.hintbox{background:var(--wash);border-left:2px solid var(--accent);padding:8px 11px;
  font-size:13.5px;color:var(--ink-mid);line-height:1.8;margin-bottom:9px;border-radius:0 2px 2px 0}
.hintbox b{color:var(--accent);font-weight:600}

.drop{border:1px dashed var(--line);border-radius:3px;background:#fafbfc;
  height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:border-color .16s,background .16s;overflow:hidden;position:relative}
.drop:hover{border-color:var(--accent);background:#f3f6fa}
.drop.has{border-style:solid;border-color:var(--line)}
.drop img{width:100%;height:100%;object-fit:cover;display:block}
.drop .ph{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.9}
.drop .ph span{display:block;font-size:19px;margin-bottom:3px;color:#c3cad2}
.rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;
  border-radius:2px;width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1}

.ta{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:10px 11px;font-size:15px;line-height:1.75;resize:none;height:84px;margin-top:8px}
.ta:focus{border-color:var(--accent)}
.cnt{text-align:right;font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.cnt.warn{color:#b4562a}

.sumbox{border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:18px}
.sumbox .ta{height:96px;margin-top:0}
.given{font-size:15px;color:var(--ink);line-height:2.05;margin-bottom:12px}
.given .lead{color:var(--ink-mid)}
.given .cue{font-weight:600;color:var(--accent)}
.given .dots{color:var(--ink-soft);letter-spacing:.15em}

.infobox{border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:18px}
.frow{display:flex;gap:11px;flex-wrap:wrap}
.fld{flex:1;min-width:130px}
.fld label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em}
.fld input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;
  font-size:15px;padding:8px 10px}
.fld input:focus{border-color:var(--accent)}

.note{background:var(--wash);border:1px solid var(--line);border-radius:3px;
  padding:13px 15px;font-size:12.5px;color:var(--ink-mid);line-height:1.95;margin-top:14px}
.note b{color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-mid);
  border-radius:4px;padding:9px 19px;font-size:15px;cursor:pointer}
.btn:hover{background:#f2f4f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-acc);font-weight:600}
.btn.pri:hover{filter:brightness(.92)}
.btn:disabled{opacity:.5;cursor:wait}
.nav{display:flex;gap:8px;align-items:center;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line-soft)}
.nav .sp{flex:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}

  color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}


.lst{margin:8px 0 0 15px}
.lst li{font-size:12.5px;color:var(--ink-mid);line-height:1.95;margin-bottom:1px}
.pull{margin-top:12px;padding:9px 12px;background:#f6f7f9;border-left:2px solid var(--accent);
  border-radius:0 2px 2px 0;font-size:12.5px;color:var(--ink);line-height:1.85}
.pull b{color:var(--accent)}
.closing{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.closing-h{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:11px}
.closing p{font-size:15px;color:var(--ink-mid);line-height:1.95;margin-bottom:7px}
.closing b{color:var(--ink);font-weight:600}
.report{border:1px solid var(--line);border-radius:4px;background:var(--surface);
  overflow:hidden;margin-bottom:18px}
.report-top{padding:16px 18px 13px;border-bottom:2px solid var(--accent)}
.report-top .rt-e{font-size:13px;letter-spacing:.02em;color:var(--ink-soft);font-weight:600;margin-bottom:5px}
.report-top .rt-t{font-size:21px;font-weight:700;color:var(--ink);line-height:1.3}
.report-top .rt-l{font-size:14px;color:var(--ink-mid);line-height:1.9;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--line-soft)}
.rsec{padding:14px 16px}
.rsec + .rsec{padding-top:0}
.rsec-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.rsec-h .ln{flex:1;height:1px;background:var(--line-soft)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rcard{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.rcard .im{width:100%;aspect-ratio:4/3;background:#eef1f4;position:relative;overflow:hidden}
.rcard .im img{width:100%;height:100%;object-fit:cover;display:block}
.rcard .im .no{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--ink-soft);flex-direction:column;gap:3px}
.rcard .im .no span{font-size:17px;color:#c8d0d8}
.rcard .im .nm{position:absolute;top:7px;left:7px;color:#fff;font-size:10.5px;font-weight:700;
  width:19px;height:19px;border-radius:2px;display:flex;align-items:center;justify-content:center}
.rcard .bd{padding:9px 11px 11px}
.rcard .lb{font-size:13.5px;font-weight:700;margin-bottom:3px}
.rcard .cp{font-size:14px;color:var(--ink-mid);line-height:1.75}
.rcard .cp.empty{color:#c3ccd4}
@media(max-width:640px){.rgrid{grid-template-columns:1fr}}

@media(max-width:640px){
  .wrap{padding:24px 15px 48px}
  .mast h1{font-size:23px}
  .slots{gap:20px}
}
@page{ size:A4 portrait; margin:0; }
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .a4wrap{padding:0!important;max-width:none!important;margin:0!important}
  .a4{width:210mm!important;height:297mm!important;margin:0!important;
      box-shadow:none!important;overflow:hidden!important;
      page-break-after:avoid;page-break-inside:avoid}
}
.a4wrap{max-width:var(--w);margin:0 auto;padding:24px 16px 60px}
.a4{width:210mm;height:297mm;margin:0 auto;background:#fff;overflow:hidden;
  box-shadow:0 3px 18px rgba(30,50,70,.13);
  padding:12mm;display:flex;flex-direction:column}
.a4 .frame{border:1px solid var(--accent);border-radius:2px;flex:1;min-height:0;
  display:flex;flex-direction:column;padding:7mm}
@media(max-width:640px){
  .a4{width:100%;height:auto;padding:16px 12px}
  .a4 .frame{padding:15px 13px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const LIMIT = 100;
const LS = 'food-place-v4';

const CARDS = [
  { region:"제주", food:"감귤" },
  { region:"통영", food:"굴"   },
  { region:"보성", food:"녹차" },
  { region:"평창", food:"고랭지 배추" },
];
const CUSTOM = 4;

const SLOTS = [
  { label:"자연환경", sub:"기후 · 지형 · 토양 · 바다", section:"place",
    task:"이 지역의 자연환경을 보여주는 사진을 넣고, 그것이 왜 이 음식에 유리한 조건인지 설명하세요.",
    ph:"어떤 자연환경이, 왜 이 음식에 유리한 조건이 되었나요?",
    hint:"기후, 지형, 토양, 바다의 어떤 특징이 이 음식의 재료가 자라거나 잡히는 데 유리하게 작용했나요?",
    ex:{ "제주-감귤":"겨울에도 영하로 잘 내려가지 않는 온난한 기후와, 물이 잘 빠지는 현무암 토양이 감귤 재배에 알맞았다.",
         "평창-고랭지 배추":"해발 600m 이상의 서늘한 여름 기후 덕분에, 저지대에서는 어려운 여름 배추 재배가 가능하다." } },
  { label:"생산 과정", sub:"재배 · 양식 · 수확 · 가공", section:"place",
    task:"생산하는 모습을 보여주는 사진을 넣고, 이곳에서 어떤 방식으로 생산하는지 설명하세요.",
    ph:"어떤 방식으로 기르고 수확하나요?",
    hint:"어떤 방법으로 기르고 수확하나요? 이 지역만의 방식이나 기술, 오래 쌓인 노하우가 있나요?",
    ex:{ "제주-감귤":"밭에서 기르는 노지 재배가 기본이지만, 하우스 재배가 늘면서 한라봉·천혜향 같은 품종으로 넓어졌다.",
         "평창-고랭지 배추":"경사진 산지를 계단식으로 개간해 심고, 수확 즉시 냉장 차량으로 도시에 보낸다." } },
  { label:"경관의 변화", sub:"과수원 · 양식장 · 음식거리", section:"food",
    task:"달라진 풍경을 보여주는 사진을 넣고, 이 음식 때문에 무엇이 생기고 바뀌었는지 설명하세요.",
    ph:"이 음식 때문에 무엇이 새로 생기고 달라졌나요?",
    hint:"과수원, 양식장, 시장, 가공시설처럼 이 음식 때문에 생겨난 공간이 있나요?",
    ex:{ "제주-감귤":"섬 곳곳이 과수원으로 채워지고, 마을마다 감귤을 고르고 파는 선별장과 직판장이 들어섰다.",
         "평창-고랭지 배추":"산비탈 전체가 배추밭으로 덮여, 여름철 능선을 따라 초록빛 경관이 펼쳐진다." } },
  { label:"경제와 이미지", sub:"일자리 · 관광 · 지역 브랜드", section:"food",
    task:"관광이나 축제, 브랜드를 보여주는 사진을 넣고, 지역 경제와 이미지가 어떻게 달라졌는지 설명하세요.",
    ph:"일자리·소득·지역 이미지는 어떻게 달라졌나요?",
    hint:"일자리와 소득은 어떻게 달라졌나요? 이 음식이 지역을 대표하는 이미지가 되었나요?",
    ex:{ "제주-감귤":"감귤 따기 체험 농장과 감귤박물관이 생기면서, 농사가 관광과 이어지는 소득원이 되었다.",
         "평창-고랭지 배추":"여름 김치 공급의 중심지가 되었고, 배추밭 길이 관광 코스로 알려졌다." } },
];

const saveLS = s => { try{ localStorage.setItem(LS, JSON.stringify(s)); }catch(e){} };
const loadLS = () => { try{ const s=localStorage.getItem(LS); return s?JSON.parse(s):null; }catch(e){ return null; } };

/* ─── 입력 슬롯 ─────────────────────────────── */
function Slot({ idx, slot, caption, img, exKey, onCap, onImg }){
  const fileRef = React.useRef();
  const [drag,setDrag] = React.useState(false);
  const [hint,setHint] = React.useState(false);
  const ex = slot.ex[exKey];
  const near = caption.length >= LIMIT*0.85;

  function read(f){
    if(!f || !f.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = e => onImg(e.target.result);
    r.readAsDataURL(f);
  }

  return (
    <div className="slot">
      <div className="slot-h">
        <span className="slot-n">{idx}</span>
        <span className="slot-l">{slot.label}</span>
        <span className="slot-s">{slot.sub}</span>
        <button className="q no-print" onClick={()=>setHint(!hint)} title="도움말">?</button>
      </div>

      <div className="task no-print">{slot.task}</div>

      {hint && (
        <div className="hintbox slide no-print">
          {slot.hint}
          {ex && <div style={{marginTop:6}}><b>예시</b> — {ex}</div>}
        </div>
      )}

      <div className={"drop"+(img?" has":"")}
        style={drag?{borderColor:"var(--accent)",background:"#f3f6fa"}:{}}
        onClick={()=>!img && fileRef.current.click()}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);read(e.dataTransfer.files[0]);}}>
        {img ? (
          <>
            <img src={img} alt={slot.label}/>
            <button className="rm no-print" onClick={e=>{e.stopPropagation();onImg("");}}>×</button>
          </>
        ) : (
          <div className="ph"><span>＋</span>사진을 넣으세요<br/>클릭하거나 끌어다 놓기</div>
        )}
      </div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
        onChange={e=>read(e.target.files[0])}/>

      <textarea className="ta" value={caption} maxLength={LIMIT}
        placeholder={slot.ph}
        onChange={e=>onCap(e.target.value)}/>
      <div className={"cnt"+(near?" warn":"")}>{caption.length} / {LIMIT}자</div>
    </div>
  );
}

/* ─── 결과물 (A4) ───────────────────────────── */
function Sheet({ card, caps, imgs, info, summary, onBack }){
  const [busy,setBusy] = React.useState(false);

  async function makeCanvas(){
    const el = document.getElementById("a4");
    return await html2canvas(el,{scale:2.2,useCORS:true,backgroundColor:"#ffffff",logging:false});
  }

  async function downPNG(){
    setBusy(true); await new Promise(r=>setTimeout(r,80));
    try{
      const cv = await makeCanvas();
      const url = cv.toDataURL("image/png");
      if(isIOS){
        const w = window.open("","_blank");
        if(w){
          w.document.write('<html><head><meta charset="UTF-8">'
            +'<meta name="viewport" content="width=device-width,initial-scale=1">'
            +'<style>body{margin:0;background:#111;display:flex;flex-direction:column;'
            +'align-items:center;justify-content:center;min-height:100vh;gap:14px}'
            +'img{max-width:100%}p{color:#fff;font-family:sans-serif;font-size:14px;'
            +'text-align:center;padding:0 20px;line-height:1.7}</style></head><body>'
            +'<img src="'+url+'"/><p>이미지를 길게 눌러 &lsquo;사진에 저장&rsquo;을 선택하세요.</p>'
            +'</body></html>');
          w.document.close();
        } else alert("팝업이 차단되었습니다. 팝업을 허용한 뒤 다시 시도하세요.");
      } else {
        const a = document.createElement("a");
        a.download = card.region+"-"+card.food+"-탐구보고서.png";
        a.href = url; a.click();
      }
    }catch(e){ alert("저장 중 오류가 발생했습니다."); }
    setBusy(false);
  }

  const Cell = ({i}) => {
    const s = SLOTS[i];
    const c = s.section==="place" ? "var(--place)" : "var(--food)";
    return (
      <div style={{border:"1px solid var(--line)",borderRadius:2,overflow:"hidden",
        background:"#fff",display:"flex",flexDirection:"column"}}>
        <div style={{width:"100%",aspectRatio:"16/10",background:"#eef1f4",
          position:"relative",overflow:"hidden"}}>
          {imgs[i]
            ? <img src={imgs[i]} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
            : <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",
                justifyContent:"center",fontSize:11,color:"var(--ink-soft)"}}>사진 없음</div>}
          <div style={{position:"absolute",top:6,left:6,background:c,color:"#fff",
            width:19,height:19,borderRadius:2,display:"flex",alignItems:"center",
            justifyContent:"center",fontSize:11,fontWeight:700}}>{i+1}</div>
        </div>
        <div style={{padding:"7px 9px 9px",flex:1}}>
          <div style={{fontSize:11,fontWeight:700,color:c,marginBottom:1}}>{s.label}</div>
          <div style={{fontSize:9,color:"var(--ink-soft)",marginBottom:5}}>{s.sub}</div>
          <div style={{fontSize:11,lineHeight:1.75,color:"var(--ink)"}}>
            {caps[i] || <span style={{color:"#c5ccd4"}}>설명 없음</span>}
          </div>
        </div>
      </div>
    );
  };

  const Band = ({tag,cls,cap,a,b}) => (
    <div style={{marginBottom:"3mm"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <span className={"tag "+cls}>{tag}</span>
        <span style={{fontSize:11,color:"var(--ink-mid)"}}>{cap}</span>
        <span style={{flex:1,height:1,background:"var(--line-soft)"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4mm"}}>
        <Cell i={a}/><Cell i={b}/>
      </div>
    </div>
  );

  return (
    <div className="a4wrap fade-up">
      <div className="btnrow no-print" style={{marginTop:0,marginBottom:16}}>
        <button className="btn" onClick={onBack}>← 다시 편집하기</button>
        <div style={{flex:1}}/>
        <button className="btn" onClick={()=>window.print()}>PDF로 저장 (A4)</button>
        <button className="btn pri" disabled={busy} onClick={downPNG}>
          {busy ? "처리 중…" : (isIOS ? "이미지 열기" : "이미지로 저장")}
        </button>
      </div>

      <div id="a4" className="a4">
        <div className="frame">

          <div style={{borderBottom:"2px solid var(--accent)",paddingBottom:"3.5mm",marginBottom:"4mm"}}>
            <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between"}}>
              <div style={{fontSize:9.5,letterSpacing:".04em",color:"var(--ink-soft)",fontWeight:600}}>
                한국지리 탐구 · 2.1 음식과 지역성
              </div>
              <div style={{fontSize:10,color:"var(--ink-soft)"}}>
                {info.classInfo}{info.classInfo&&info.name?"　":""}{info.name}
              </div>
            </div>
            <div style={{fontSize:13.5,fontWeight:600,color:"var(--ink-mid)",marginTop:5}}>
              지역이 음식을 만들고, 음식이 지역을 만든다
            </div>
            <div style={{fontSize:23,fontWeight:700,color:"var(--accent)",
              lineHeight:1.25,marginTop:1}}>{card.region} · {card.food}</div>
            <div style={{fontSize:10.5,color:"var(--ink-mid)",lineHeight:1.8,marginTop:5}}>
              {card.region}의 자연환경이 {card.food}을(를) 있게 한 과정과,
              {card.food}이(가) 다시 {card.region}을(를) 바꾼 과정을 두 방향에서 살펴본 결과다.
            </div>
          </div>

          <Band tag="지역 → 음식" cls="place" a={0} b={1}
            cap={card.region+"의 환경이 "+card.food+"을(를) 있게 한 과정"}/>
          <Band tag="음식 → 지역" cls="food" a={2} b={3}
            cap={card.food+"이(가) "+card.region+"을(를) 바꾼 과정"}/>

          <div style={{marginTop:"auto",paddingTop:"3.5mm",borderTop:"1px solid var(--line)"}}>
            <div style={{fontSize:9.5,fontWeight:700,color:"var(--ink-soft)",
              letterSpacing:".14em",marginBottom:6}}>탐구 정리</div>
            <div style={{borderLeft:"2px solid var(--accent)",paddingLeft:11}}>
              <div style={{fontSize:10,lineHeight:1.8,color:"var(--ink-mid)",marginBottom:3}}>
                지역의 환경은 그곳에서 생겨난 음식에 영향을 미치고,
                그 음식이 널리 알려지면 반대로 지역의 생활과 경관을 바꾸어 놓는다.
              </div>
              <div style={{fontSize:11.5,lineHeight:1.85,color:"var(--ink)"}}>
                예를 들어, {card.region}의 {card.food}은(는) {summary
                  || <span style={{color:"#c5ccd4"}}>…… (정리 문장을 입력하세요)</span>}
              </div>
            </div>
          </div>

        </div>
      </div>

      <div className="note no-print" style={{maxWidth:"210mm",margin:"14px auto 0"}}>
        <b>제출 방법</b>&nbsp; 위의 <b>PDF로 저장</b> 또는 <b>이미지로 저장</b>을 눌러 내려받은 뒤,
        선생님이 안내한 곳에 제출하세요. PDF는 인쇄 창에서 &lsquo;대상&rsquo;을 PDF로 저장으로 선택하면 됩니다.
      </div>
    </div>
  );
}

/* ─── 메인 ──────────────────────────────────── */
function App(){
  const init = loadLS() || {};
  const [sel,setSel]         = React.useState(init.sel ?? null);
  const [custom,setCustom]   = React.useState(init.custom || {region:"",food:""});
  const [caps,setCaps]       = React.useState(init.caps || ["","","",""]);
  const [imgs,setImgs]       = React.useState(init.imgs || ["","","",""]);
  const [summary,setSummary] = React.useState(init.summary || "");
  const [info,setInfo]       = React.useState(init.info || {name:"",classInfo:""});
  const [step,setStep]       = React.useState(0);
  const [done,setDone]       = React.useState(false);

  React.useEffect(()=>{ saveLS({sel,custom,caps,imgs,summary,info}); },
    [sel,custom,caps,imgs,summary,info]);

  const card = sel===null ? null
    : (sel===CUSTOM
        ? (custom.region && custom.food ? custom : null)
        : CARDS[sel]);
  const exKey = card ? card.region+"-"+card.food : "";

  // 사례를 고르면 모든 단계가 열린다. 입력은 강제하지 않고, 다 채운 단계에 ✓를 붙인다.
  const maxStep = card ? 4 : 1;
  const filled = i => caps[i].trim() && imgs[i];
  const doneArr = [false, !!card, !!(card&&filled(0)&&filled(1)), !!(card&&filled(2)&&filled(3)),
                   !!(card&&summary.trim())];
  const top = <Header step={step} go={go} maxStep={maxStep} doneArr={doneArr}/>;

  function go(n){ setStep(n); window.scrollTo({top:0,behavior:"smooth"}); }

  if(done && card) return (
    <>{top}<Sheet card={card} caps={caps} imgs={imgs} info={info}
      summary={summary} onBack={()=>setDone(false)}/></>
  );

  const Nav = ({back,next,label,disabled,onNext}) => (
    <div className="nav no-print">
      {back && <button className="btn" onClick={()=>go(step-1)}>← 이전</button>}
      <div className="sp"/>
      {next && <button className="btn pri" disabled={disabled}
        onClick={onNext||(()=>go(step+1))}>{label||"다음 →"}</button>}
    </div>
  );

  const RCard = ({i}) => {
    const c = SLOTS[i].section==="place" ? "var(--place)" : "var(--food)";
    return (
      <div className="rcard">
        <div className="im">
          {imgs[i]
            ? <img src={imgs[i]} alt={SLOTS[i].label}/>
            : <div className="no"><span>＋</span>사진이 없습니다</div>}
          <div className="nm" style={{background:c}}>{i+1}</div>
        </div>
        <div className="bd">
          <div className="lb" style={{color:c}}>{SLOTS[i].label}</div>
          <div className={"cp"+(caps[i]?"":" empty")}>
            {caps[i] || "설명이 비어 있습니다"}
          </div>
        </div>
      </div>
    );
  };

  const ReportPreview = () => (
    <div className="report">
      <div className="report-top">
        <div className="rt-e">한국지리 탐구 · 2.1 음식과 지역성</div>
        <div className="rt-t">{card.region} · {card.food}</div>
        <div className="rt-l">
          {card.region}의 자연환경이 {card.food}을(를) 있게 한 과정과,
          {card.food}이(가) 다시 {card.region}을(를) 바꾼 과정을 두 방향에서 살펴본 결과다.
        </div>
      </div>
      <div className="rsec">
        <div className="rsec-h">
          <span className="tag place">지역 → 음식</span>
          <span className="ln"/>
        </div>
        <div className="rgrid"><RCard i={0}/><RCard i={1}/></div>
      </div>
      <div className="rsec">
        <div className="rsec-h">
          <span className="tag food">음식 → 지역</span>
          <span className="ln"/>
        </div>
        <div className="rgrid"><RCard i={2}/><RCard i={3}/></div>
      </div>
    </div>
  );

  return (
    <>
    {top}
    <div className="wrap fade-up" key={step}>
      <div className="mast"><h1>지역이 음식을 만들고,<br/>음식이 지역을 만든다</h1></div>
      {step===0 && (
        <div className="sec">
          <p className="lede">
            제주의 감귤, 통영의 굴, 보성의 녹차처럼 어떤 음식은 그 지역의 기온과 강수, 지형과 토양, 바다 같은
            자연환경의 영향을 받아 발달한다. 그렇게 발달한 음식은 다시 과수원과 양식장, 음식거리와 관광처럼
            지역의 경관과 경제를 바꾼다.
          </p>
          <Concept/>
        </div>
      )}

      {step===1 && (
        <div className="sec">
          <div className="sec-h"><span className="sec-n">1</span>
            <span className="sec-t">사례 고르기</span></div>
          <div className="sec-d">
            아래에서 하나를 고르거나, <b>내가 아는 지역과 음식</b>을 직접 입력하세요.
            <span style={{display:"block",marginTop:5,color:"var(--ink-soft)"}}>
              ① 왜 이 음식이 이 지역에서 나게 되었는가?　② 이 음식 때문에 지역은 어떻게 달라졌는가?
            </span>
          </div>
          <div className="cards">
            {CARDS.map((c,i)=>(
              <div key={i} className={"card"+(sel===i?" sel":"")} onClick={()=>setSel(i)}>
                <div className="r">{c.region}</div>
                <div className="f">{c.food}</div>
              </div>
            ))}
            <div className={"card add"+(sel===CUSTOM?" sel":"")} onClick={()=>setSel(CUSTOM)}>
              <div className="r">{sel===CUSTOM&&custom.region ? custom.region : "직접 고르기"}</div>
              <div className="f">{sel===CUSTOM&&custom.food ? custom.food : "지역 + 음식"}</div>
            </div>
          </div>
          {sel===CUSTOM && <CustomForm v={custom} onChange={setCustom}/>}
        </div>
      )}

      {step===2 && card && (
        <div className="sec">
          <div className="sec-h"><span className="sec-n">2</span>
            <span className="sec-t">지역 → 음식</span></div>
          <div className="sec-d">
            {card.region}에서 {card.food}이(가) 나게 된 이유를 찾습니다.
            각 칸에 <b>사진 한 장과 설명</b>을 넣으세요.
          </div>
          <div className="band place">
            <div className="band-h">
              <span className="tag place">지역 → 음식</span>
              <span className="ln"/>
            </div>
            <div className="slots">
              {[0,1].map(i=>(
                <Slot key={i} idx={i+1} slot={SLOTS[i]} caption={caps[i]} img={imgs[i]} exKey={exKey}
                  onCap={v=>{const n=[...caps];n[i]=v;setCaps(n);}}
                  onImg={v=>{const n=[...imgs];n[i]=v;setImgs(n);}}/>
              ))}
            </div>
          </div>
        </div>
      )}

      {step===3 && card && (
        <div className="sec">
          <div className="sec-h"><span className="sec-n">3</span>
            <span className="sec-t">음식 → 지역</span></div>
          <div className="sec-d">
            {card.food}이(가) {card.region}을(를) 어떻게 바꾸었는지 찾습니다.
            각 칸에 <b>사진 한 장과 설명</b>을 넣으세요.
          </div>
          <div className="band food">
            <div className="band-h">
              <span className="tag food">음식 → 지역</span>
              <span className="ln"/>
            </div>
            <div className="slots">
              {[2,3].map(i=>(
                <Slot key={i} idx={i+1} slot={SLOTS[i]} caption={caps[i]} img={imgs[i]} exKey={exKey}
                  onCap={v=>{const n=[...caps];n[i]=v;setCaps(n);}}
                  onImg={v=>{const n=[...imgs];n[i]=v;setImgs(n);}}/>
              ))}
            </div>
          </div>
        </div>
      )}

      {step===4 && card && (
        <div className="sec">
          <div className="sec-h"><span className="sec-n">4</span>
            <span className="sec-t">정리하고 제출하기</span></div>
          <div className="sec-d">
            지금까지 찾은 내용입니다. 빠진 곳이 있으면 이전으로 돌아가 채우세요.
            아래 문장에 이어서 {card.region}과(와) {card.food}의 사례로 완성해 보세요.
          </div>

          <ReportPreview/>

          <div className="sumbox">
            <div className="given">
              <span className="lead">
                지역의 환경은 그곳에서 생겨난 음식에 영향을 미치고,
                그 음식이 널리 알려지면 반대로 지역의 생활과 경관을 바꾸어 놓는다.
              </span><br/>
              <span className="cue">예를 들어, {card.region}의 {card.food}은(는)</span>
              <span className="dots"> ……</span>
            </div>
            <textarea className="ta" value={summary} maxLength={200}
              placeholder={"앞 문장에 이어서 한두 문장으로 완성해 보세요."}
              onChange={e=>setSummary(e.target.value)}/>
            <div className="cnt">{summary.length} / 200자</div>
          </div>

          <div className="infobox" style={{marginTop:14}}>
            <div className="frow">
              <div className="fld">
                <label>이름</label>
                <input value={info.name} placeholder="홍길동"
                  onChange={e=>setInfo({...info,name:e.target.value})}/>
              </div>
              <div className="fld" style={{flex:2}}>
                <label>학년 · 반 · 번호</label>
                <input value={info.classInfo} placeholder="예) 2학년 3반 15번"
                  onChange={e=>setInfo({...info,classInfo:e.target.value})}/>
              </div>
            </div>
          </div>

          <div className="nav no-print">
            <div className="sp"/>
            <button className="btn pri" onClick={()=>setDone(true)}>결과물 확인하기 →</button>
          </div>

          <Closing/>
        </div>
      )}
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
