<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>기념탑 철거 전후</title>
<style>
:root{--ink:#16181d;--mid:#6b707a}
html,body{margin:0;background:transparent}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink)}
.wrap{max-width:760px;margin:0 auto}
.cmp{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#222}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cmp .bf{clip-path:inset(0 50% 0 0)}
.bar{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.knob{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#333;letter-spacing:-1px}
.tag{position:absolute;top:10px;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;pointer-events:none}
.tag.l{left:10px}.tag.r{right:10px}
.cap{font-size:12px;color:var(--mid);text-align:center;margin:6px 0 0;line-height:1.5}
</style></head><body>
<div class="wrap">
<div class="cmp" id="c">
<img src="img/nk51/mon_2026.jpg" alt="2026년, 탑이 철거된 자리">
<img class="bf" id="bf" src="img/nk51/mon_2022.jpg" alt="2022년, 조국통일3대헌장기념탑">
<div class="bar" id="bar"></div><div class="knob" id="kn">◀▶</div>
<span class="tag l">2022년</span><span class="tag r">2026년</span>
</div>
<p class="cap">조국통일3대헌장기념탑이 서 있던 통일거리 입구, 철거 전(2022년)과 후(2026년). 자료: Google Earth</p>
</div>
<script>
(function(){
var c=document.getElementById('c'),bf=document.getElementById('bf'),bar=document.getElementById('bar'),kn=document.getElementById('kn'),drag=false;
function set(x){var r=c.getBoundingClientRect(),p=Math.max(0,Math.min(1,(x-r.left)/r.width))*100;
 bf.style.clipPath='inset(0 '+(100-p)+'% 0 0)';bar.style.left=p+'%';kn.style.left=p+'%';}
c.addEventListener('pointerdown',function(e){drag=true;set(e.clientX);try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',function(e){if(drag||e.pointerType==='mouse')set(e.clientX);});
c.addEventListener('pointerup',function(){drag=false});c.addEventListener('pointercancel',function(){drag=false});
})();
(function(){function s(){try{var w=document.querySelector('.wrap');if(w)parent.postMessage({monH:Math.ceil(w.getBoundingClientRect().height)+4},'*')}catch(e){}}addEventListener('load',s);addEventListener('resize',s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);})();
</script>
</body></html>
