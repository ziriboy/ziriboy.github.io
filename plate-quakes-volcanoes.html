<title>판 경계와 지진·화산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 위에 제목과 자료 상태, 가운데 넓은 지도, 아래에 조작 막대와 선택 정보 */
:root{
  --bg:#f5f6f4; --panel:#ffffff; --ocean:#e9eef1; --land:#d6d8d2; --ink:#20262b; --muted:#5f6a70;
  --plate:#2b3136; --quake:#2f6f8f; --volc:#c0392b; --line:#c9cfd2; --focus:#2f6f8f;
  --font:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181b; --panel:#1b2024; --ocean:#1e262b; --land:#3a4146; --ink:#e7ebec; --muted:#9aa5aa;
  --plate:#d9dee0; --quake:#6fb3d4; --volc:#ef6b5b; --line:#343c41; --focus:#6fb3d4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --panel:#1b2024; --ocean:#1e262b; --land:#3a4146; --ink:#e7ebec; --muted:#9aa5aa;
  --plate:#d9dee0; --quake:#6fb3d4; --volc:#ef6b5b; --line:#343c41; --focus:#6fb3d4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;padding:20px 16px 32px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
h1{font-size:1.45rem;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.status{font-size:.86rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:#2e9d5b}
.mapbox{background:var(--ocean);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
.sw{display:inline-block;flex:none;width:14px;height:14px;overflow:visible}
.land{fill:var(--land)}
.pb{fill:none;stroke:var(--plate);stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:1.1}
.q{fill:var(--quake);fill-opacity:.28;stroke:var(--quake);vector-effect:non-scaling-stroke;stroke-width:1;cursor:pointer}
.q.yr{fill-opacity:.16}
.v{fill:var(--volc);stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:.8;cursor:pointer}
.sel{stroke:var(--ink)!important;stroke-width:2.2!important}
.jeju{fill:none;stroke:var(--ink);vector-effect:non-scaling-stroke;stroke-width:1.8}
.lab{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--ocean);stroke-linejoin:round}
.plate{fill:var(--muted);letter-spacing:.3em;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp>span{font-size:.82rem;color:var(--muted);letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.9rem;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
label.tg{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;cursor:pointer}
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.info{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
.card h2{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.big{font-size:1.15rem;font-weight:700}
.nums{display:flex;gap:28px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.nums b{display:block;font-size:1.6rem;line-height:1.2}
.nums small{color:var(--muted);font-size:.82rem}
.src{font-size:.8rem;color:var(--muted);line-height:1.7;margin:0}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 9px;font-size:.84rem;line-height:1.45;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translate(-50%,calc(-100% - 10px))}
.tip b{font-weight:600}
.note{font-size:.84rem;color:var(--muted);margin:6px 0 0}
</style>

const KO = {"Chile":"칠레","Colombia":"콜롬비아","Costa Rica":"코스타리카","DR Congo":"콩고민주공화국","Ecuador":"에콰도르","Ethiopia":"에티오피아","France":"프랑스(레위니옹섬)","Guatemala":"과테말라","Heard I. & McDonald Is.":"허드섬(오스트레일리아령)","Iceland":"아이슬란드","India":"인도(안다만해)","Indonesia":"인도네시아","Italy":"이탈리아","Japan":"일본","Mexico":"멕시코","New Zealand":"뉴질랜드","Nicaragua":"니카라과","Papua New Guinea":"파푸아뉴기니","Peru":"페루","Philippines":"필리핀","Portugal":"포르투갈(아조레스 제도)","Russia":"러시아","Tonga":"통가","United States":"미국"};
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('map');
const VIEWS = { world:[0,0,1080,426], asia:[355,66,300,150] };
let view = 'world', period = 'year', live = false, quakes = [], selected = null, shown = [];
const cache = {};

const px = (lon, lat) => [(((lon + 30) % 360) + 360) % 360 * 3, (80 - lat) * 3];
const k = () => 1080 / VIEWS[view][2];
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }
const fmtDate = ms => { const d = new Date(ms); return d.toLocaleString('ko-KR', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); };

function select(kind, d, node){
  if (selected) selected.classList.remove('sel');
  selected = node; node.classList.add('sel');
  const tip = $('tip');
  if (kind === 'q') tip.innerHTML = `<b>규모 ${d[0].toFixed(1)} 지진</b><br>${d[4]}<br>${fmtDate(d[3])}`;
  else tip.innerHTML = `<b>${d[0]}</b> · ${KO[d[3]] || d[3]}<br>표본 ${DATA.nweeks}주 중 ${d[4]}주 활동 보고`;
  const box = svg.parentNode.getBoundingClientRect(), r = node.getBoundingClientRect();
  let x = r.left + r.width / 2 - box.left, y = r.top - box.top;
  tip.hidden = false;
  const w = tip.offsetWidth;
  x = Math.max(w / 2 + 6, Math.min(box.width - w / 2 - 6, x));
  if (y < tip.offsetHeight + 16){ tip.style.transform = 'translate(-50%, 14px)'; y = r.bottom - box.top; } else tip.style.transform = '';
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function clearSel(){ if (selected) selected.classList.remove('sel'); selected = null; $('tip').hidden = true; }
svg.addEventListener('click', e => { if (!e.target.closest('#quakes circle, #volcs path')) clearSel(); });

function drawPlateNames(){
  const g = $('plateNames'); g.innerHTML = '';
  const s = 1 / k();
  [['유라시아판', 78, 57], ['태평양판', 205, 2], ['필리핀해판', 135, 16]].forEach(([n, lo, la]) => {
    if (n === '필리핀해판' && view === 'world') return;
    const [x, y] = px(lo, la);
    const t = el('text', { x, y, 'text-anchor':'middle', class:'plate', 'font-size': 13 * s, 'stroke-width': 3 * s }, g); t.textContent = n;
  });
}
function drawVolcs(){
  const g = $('volcs'); g.innerHTML = '';
  const s = 1 / k(), r = 5.2 * s * (view === 'asia' ? 1.6 : 1);
  DATA.volc.forEach(d => {
    const [x, y] = px(d[2], d[1]);
    const p = el('path', { d:`M${x},${y - r} L${x + r * .92},${y + r * .6} L${x - r * .92},${y + r * .6} Z`, class:'v' }, g);
    p.addEventListener('click', () => select('v', d, p));
  });
}
function drawQuakes(){
  const g = $('quakes'); g.innerHTML = '';
  const lim = { day:864e5, month:30 * 864e5, year:366 * 864e5 }[period];
  const ref = live ? Date.now() : Math.max(...quakes.map(q => q[3]));
  shown = quakes.filter(q => ref - q[3] <= lim && q[1] > -62).sort((a, b) => b[0] - a[0]);
  const yr = period === 'year' && live;
  const s = 1 / k() * (view === 'asia' ? 1.6 : 1) * (yr ? 0.75 : 1);
  const frag = document.createDocumentFragment();
  shown.forEach((d, i) => {
    const [x, y] = px(d[2], d[1]);
    el('circle', { cx:x, cy:y, r: (1.6 + (d[0] - 4.5) * 2.0) * s, class: yr ? 'q yr' : 'q', 'data-i': i }, frag);
  });
  g.appendChild(frag);
  if (!live) setStatus(false, '받아 둔 지진 자료 (2026년 10월 10일까지 7일, ' + shown.length + '건)');
}
$('quakes').addEventListener('click', e => { const i = e.target.dataset && e.target.dataset.i; if (i !== undefined) select('q', shown[+i], e.target); });
function drawJeju(){
  const g = $('jeju'); g.innerHTML = '';
  const s = 1 / k(), [x, y] = px(126.53, 33.36);
  el('circle', { cx:x, cy:y, r: 6 * s, class:'jeju' }, g);
  const t = el('text', { x: x - 9 * s, y: y + 4.5 * s, 'text-anchor':'end', class:'lab', 'font-size': 13 * s, 'stroke-width': 3.5 * s }, g); t.textContent = '제주';
}
function redraw(){
  svg.setAttribute('viewBox', VIEWS[view].join(' '));
  drawPlateNames(); drawQuakes(); drawVolcs(); drawJeju();
  clearSel();
}
function setPressed(seg, attr, val){ seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] === val)); }

function setStatus(isLive, text){ $('dot').classList.toggle('live', isLive); $('statusText').textContent = text; }
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function fetchPeriod(p){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), p === 'year' ? 30000 : 8000);
  try{
    if (p === 'year'){
      const start = new Date(Date.now() - 365 * 864e5).toISOString().slice(0, 10);
      const r = await fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=csv&minmagnitude=4.5&orderby=time&starttime=${start}`, { signal: ctl.signal });
      if (!r.ok) throw new Error(r.status);
      const rows = parseCSV(await r.text()); const h = rows.shift();
      const it = h.indexOf('time'), ila = h.indexOf('latitude'), ilo = h.indexOf('longitude'), im = h.indexOf('mag'), ip = h.indexOf('place');
      return { list: rows.filter(r => r.length > ip).map(r => [+r[im], +r[ila], +r[ilo], Date.parse(r[it]), r[ip]]), when: Date.now() };
    }
    const feed = { day:'4.5_day', month:'4.5_month' }[p];
    const r = await fetch(`https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${feed}.geojson`, { signal: ctl.signal });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    return { list: j.features.map(f => [f.properties.mag, f.geometry.coordinates[1], f.geometry.coordinates[0], f.properties.time, f.properties.place || '']), when: j.metadata.generated };
  } finally { clearTimeout(tm); }
}
async function loadLive(force){
  const p = period;
  if (!force && cache[p]){ quakes = cache[p].list; clearSel(); drawQuakes(); return; }
  if (live) setStatus(true, (p === 'year' ? '지난 1년 지진 자료를 불러오는 중' : '지진 자료를 불러오는 중'));
  try{
    cache[p] = await fetchPeriod(p);
    if (p !== period) return;
    quakes = cache[p].list; live = true; clearSel();
    setStatus(true, '실시간 지진 자료 · ' + fmtDate(cache[p].when) + ' 기준');
  } catch(err){
    if (!live){ quakes = DATA.quakes; }
    else setStatus(true, '지진 자료를 불러오지 못했습니다. 잠시 뒤 다시 눌러 보세요.');
  }
  drawQuakes();
}
quakes = DATA.quakes;
redraw();
loadLive();
setInterval(() => { if (live && period !== 'year') loadLive(true); }, 5 * 60 * 1000);
