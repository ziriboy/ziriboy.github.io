<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>왜 원곡동일까? — 조별 현장기록</title>
<meta name="theme-color" content="#faf9f6" />
<style>
  :root{--ink:#1b1a18;--ink2:#5f5c56;--ink3:#8b877f;--line:#dedbd3;
        --paper:#faf9f6;--card:#fff;--accent:#8c3b2e;--ok:#2f6b4f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px 64px}

  header{position:sticky;top:0;background:rgba(250,249,246,.97);backdrop-filter:blur(8px);
         padding:13px 0 9px;border-bottom:1px solid var(--line);z-index:10}
  .hrow{display:flex;align-items:center;gap:9px}
  h1{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0}
  .code{font-size:12.5px;color:var(--accent);font-weight:700}
  .dot{width:7px;height:7px;border-radius:50%;background:#c9c6bf;margin-left:auto;flex:0 0 7px}
  .dot.on{background:var(--ok)}
  .bar{height:4px;background:#e8e5dd;border-radius:99px;margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
  .cnt{font-size:11.5px;color:var(--ink3);margin-top:5px}
  .tally{font-size:11.5px;color:var(--ink2);margin-top:3px}
  .tally b{color:var(--ink);font-weight:600}

  input[type=text],textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
  textarea{resize:vertical;min-height:60px;line-height:1.55}
  input:focus,textarea:focus{outline:2px solid #2a6ebb;outline-offset:1px}

  .intro{font-size:13.5px;color:var(--ink2);line-height:1.7;margin:14px 0 2px}
  .intro b{color:var(--ink)}

  .item{background:var(--card);border:1px solid var(--line);border-radius:11px;
        padding:14px;margin:13px 0}
  .item.done{border-color:#c8d8ce}
  .tag{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em;
       display:flex;align-items:center;gap:8px}
  .tag em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--ink3);margin-left:auto}
  .claim{font-size:15px;line-height:1.5;margin:6px 0 5px;font-weight:600}
  .hint{font-size:12.5px;color:var(--ink3);margin:0 0 11px;line-height:1.55}

  .strip{display:flex;gap:9px;overflow-x:auto;padding:2px 0 6px;
         -webkit-overflow-scrolling:touch}
  .strip::-webkit-scrollbar{height:0}
  .ent{flex:0 0 132px;border:1px solid var(--line);border-radius:9px;overflow:hidden;
       background:var(--paper);position:relative}
  .ent img{width:100%;height:100px;object-fit:cover;display:block;background:#efece4}
  .ent .em{padding:7px 8px}
  .ent .ewho{font-size:11px;color:var(--ink3)}
  .ent textarea{min-height:52px;font-size:12.5px;padding:6px 7px;border:0;
                background:transparent;border-top:1px solid var(--line);border-radius:0}
  .ent.mine{border-color:#b9c9c0}
  .ent .del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;
            background:rgba(27,26,24,.62);color:#fff;border:0;font-size:13px;line-height:22px;
            padding:0;text-align:center}
  .add{flex:0 0 132px;height:100px;border:1px dashed var(--line);border-radius:9px;
       background:var(--card);color:var(--ink2);font-size:13px;align-self:flex-start}

  button{font:inherit;cursor:pointer}
  .btn{font-size:13.5px;background:var(--card);border:1px solid var(--line);
       border-radius:8px;padding:9px 12px;color:var(--ink)}
  .btn:active{background:#f1eee6}
  .btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.wide{width:100%;padding:13px}

  h2{font-size:16px;font-weight:700;margin:28px 0 8px;padding-top:20px;
     border-top:1px solid var(--line)}
  .q{margin:14px 0}
  .q p{font-size:14.5px;font-weight:600;margin:0 0 6px}
  .q .by{font-size:11.5px;color:var(--ink3);margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:13.5px;padding:7px 12px;border-radius:999px;
        border:1px solid var(--line);background:var(--card);color:var(--ink2)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .lock{background:#f2efe8;border-radius:10px;padding:16px;font-size:13.5px;
        color:var(--ink2);line-height:1.65;text-align:center}
  .lock b{color:var(--ink)}
  .gcat{margin:18px 0 6px;font-size:12.5px;font-weight:700;color:var(--accent)}
  .gcard{flex:0 0 148px;background:var(--card);border:1px solid var(--line);
         border-radius:9px;overflow:hidden}
  .gcard img{width:100%;height:110px;object-fit:cover;display:block;background:#efece4}
  .gcard .gm{padding:7px 9px}
  .gcard .gwho{font-size:11px;color:var(--ink3)}
  .gcard .gnote{font-size:12.5px;line-height:1.45;margin-top:3px}
  .gcard.mine{border-color:#b9c9c0;background:#f5f9f6}

  .gate{position:fixed;inset:0;background:var(--paper);z-index:100;
        display:flex;align-items:center;justify-content:center;padding:22px}
  .gate .box{max-width:380px;width:100%}
  .gate h2{border:0;padding:0;margin:0 0 6px;font-size:19px}
  .gate p{font-size:13.5px;color:var(--ink2);margin:0 0 16px;line-height:1.65}
  .gate input{margin-bottom:9px}
  .setup{font-size:13px;color:var(--ink2);line-height:1.75}
  .setup code{background:#efece4;padding:1px 5px;border-radius:3px;font-size:12px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;
         background:rgba(27,26,24,.92);color:#fff;font-size:13px;padding:9px 15px;
         border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="box" id="gatebox"></div></div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div class="hrow">
      <h1>왜 원곡동일까?</h1>
      <span class="code" id="codeTag"></span>
      <span class="dot" id="conn"></span>
    </div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="cnt" id="ptxt"></div>
    <div class="tally" id="tally"></div>
  </header>

  <p class="intro">
    주민에게 묻지 않습니다. <b>"일자리를 구하기 쉽다"가 이유라면 인력사무소를 찍으면 됩니다.</b>
    아래 여섯은 사람들이 원곡동에 모여 사는 이유에 대한 가설입니다.
    한 항목에 두 장까지 올릴 수 있습니다. 먼저 여섯 항목을 하나씩 채우고,
    남는 시간에 두 번째 장을 채우세요. <b>같은 항목이라도 서로 다른 것을 찾아 옵니다.</b>
  </p>

  <div id="list"></div>

  <h2>다른 조는 무엇을 찍었을까</h2>
  <div id="gallery"></div>

  <h2>제출</h2>
  <button class="btn solid wide" onclick="exportReport()">조 보고서 파일 내려받기</button>
  <div style="height:9px"></div>
  <button class="btn wide" onclick="leave()">다른 조 코드로 들어가기</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCuOQATa7VYXRJbiF8gzso14ASSIx-BcOI",
  authDomain: "wongok-863fc.firebaseapp.com",
  databaseURL: "https://wongok-863fc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "wongok-863fc",
  storageBucket: "wongok-863fc.firebasestorage.app",
  messagingSenderId: "409772442710",
  appId: "1:409772442710:web:2d2017e90a432da353a7f7"
};

const ITEMS=[
 {t:"일자리", c:"급하게 일을 구하는 사람에게 일자리를 연결해 주는 곳이 있다.",
  h:"인력사무소 · 구인 안내문 · 공단 통근버스 정류장 · 외국어로 적힌 채용 공고"},
 {t:"살 곳", c:"방 하나 단위로 값싸게 빌릴 수 있는 집이 많다.",
  h:"2~3층 다가구주택 · 한 건물의 여러 계량기와 우편함 · 외국어로 적힌 부동산 매물"},
 {t:"돈과 서류", c:"본국 송금과 체류 서류를 동네 안에서 해결할 수 있다.",
  h:"사설 환전소 · 은행의 해외송금 창구 · 행정사·법률사무소 · 여러 언어 응대 통신 매장"},
 {t:"먹을 것", c:"고향의 음식과 식재료를 구할 수 있다.",
  h:"국적별 식당 · 외국어로만 적힌 차림표 · 향신료와 할랄 표시 · 열대 과일 가판"},
 {t:"자녀와 배움", c:"한국어를 배우고 아이를 맡길 곳이 있다.",
  h:"한국어 교실 · 어린이집과 지역아동센터 · 다문화 작은도서관 · 학원"},
 {t:"사람", c:"같은 나라 사람들이 모이고 서로 돕는 자리가 있다.",
  h:"성당·교회·이슬람 사원 · 여러 언어로 적힌 예배 안내 · 이주민 지원센터 · 동향 모임 안내문"},
];
const MAXSHOT=2;

let db=null, uid=null, myName="", roomCode="", FB={};
let D={items:{},members:{}};
let ALL=null, galleryOn=false;

const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1700);}
const entries=i=>{const o=D.items[i]||{};
  return Object.keys(o).map(k=>Object.assign({_k:k},o[k])).sort((a,b)=>(a.at||0)-(b.at||0));};

/* ---------- 시작 화면 ---------- */
function gateSetup(){
  $('#gatebox').innerHTML=`<h2>설정이 필요합니다</h2>
    <p>이 파일 위쪽 <code>FIREBASE_CONFIG</code> 에 Firebase 설정값을 넣어야 합니다.</p>`;
}
function gateJoin(){
  $('#gatebox').innerHTML=`
    <h2>조 코드로 들어가기</h2>
    <p>같은 코드를 넣은 사람끼리 하나의 보고서를 함께 씁니다.</p>
    <input type="text" id="gcode" placeholder="조 코드 (예: jo1)" autocapitalize="off" />
    <input type="text" id="gname" placeholder="내 이름" />
    <button class="btn solid wide" id="gbtn">들어가기</button>`;
  $('#gcode').value=localStorage.getItem('wg-code')||"";
  $('#gname').value=localStorage.getItem('wg-name')||"";
  $('#gbtn').onclick=()=>{
    const code=$('#gcode').value.trim().replace(/[.#$\[\]\/\s]/g,'');
    const name=$('#gname').value.trim();
    if(!code||!name) return toast("조 코드와 이름을 모두 넣으세요");
    localStorage.setItem('wg-code',code); localStorage.setItem('wg-name',name);
    start(code,name);
  };
}
window.leave=()=>{localStorage.removeItem('wg-code');location.reload();};

/* ---------- 사진 ---------- */
function pick(cb){
  const i=document.createElement('input');
  i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment');
  i.onchange=()=>{const f=i.files[0]; if(!f)return;
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const M=900,s=Math.min(1,M/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',0.6));};
      im.src=fr.result;};
    fr.readAsDataURL(f);};
  i.click();
}

/* ---------- 쓰기 ---------- */
async function addShot(i,img){
  try{
    const r=FB.push(FB.ref(db,`rooms/${roomCode}/items/${i}`));
    await FB.set(r,{img,note:"",by:uid,byName:myName,at:Date.now()});
  }catch(e){ toast("전송 실패 — 연결을 확인하세요"); }
}
async function setNote(i,k,note){
  try{ await FB.update(FB.ref(db,`rooms/${roomCode}/items/${i}/${k}`),{note}); }catch(e){}
}
async function delShot(i,k){
  try{ await FB.remove(FB.ref(db,`rooms/${roomCode}/items/${i}/${k}`)); }catch(e){}
}
/* ---------- 모아 보기 ---------- */
function filledCats(){ return ITEMS.filter((_,i)=>entries(i).length>0).length; }
function drawGallery(){
  const host=$('#gallery');
  if(filledCats()<ITEMS.length){
    galleryOn=false;
    host.innerHTML=`<div class="lock">여섯 항목이 한 장씩이라도 채워지면 열립니다.
      지금 <b>${filledCats()} / ${ITEMS.length}</b>개.<br>
      다른 조가 같은 항목에 무엇을 찍었는지 볼 수 있습니다.</div>`;
    return;
  }
  if(!galleryOn){ galleryOn=true; if(db) FB.onValue(FB.ref(db,'rooms'),s=>{ALL=s.val()||{};drawGallery();}); }
  if(!ALL){ host.innerHTML=`<div class="lock">불러오는 중…</div>`; return; }
  const codes=Object.keys(ALL).filter(c=>c!==roomCode);
  let html="";
  ITEMS.forEach((it,i)=>{
    const cards=[];
    entries(i).forEach(e=>cards.push({img:e.img,note:e.note,who:roomCode,mine:true}));
    codes.forEach(c=>{
      const o=(ALL[c]&&ALL[c].items&&ALL[c].items[i])||{};
      Object.keys(o).forEach(k=>{ if(o[k].img) cards.push({img:o[k].img,note:o[k].note,who:c,mine:false}); });
    });
    if(!cards.length) return;
    html+=`<div class="gcat">${it.t} · ${cards.length}장</div><div class="strip">`;
    cards.forEach(k=>{
      html+=`<div class="gcard${k.mine?' mine':''}"><img src="${k.img}">
        <div class="gm"><div class="gwho">${esc(k.who)}${k.mine?' · 우리 조':''}</div>
        <div class="gnote">${esc((k.note||'').slice(0,60))||'—'}</div></div></div>`;
    });
    html+=`</div>`;
  });
  host.innerHTML=html||`<div class="lock">아직 다른 조의 사진이 없습니다.</div>`;
}

/* ---------- 그리기 ---------- */
function draw(){
  const host=$('#list');
  ITEMS.forEach((it,i)=>{
    let d=host.children[i];
    if(!d){
      d=document.createElement('div'); d.className='item';
      d.innerHTML=`<div class="tag"><span>${it.t}</span><em></em></div>
        <p class="claim">${it.c}</p><p class="hint">찾아볼 것 · ${it.h}</p>
        <div class="strip"></div>`;
      host.appendChild(d);
    }
    const list=entries(i);
    d.classList.toggle('done',list.length>0);
    d.querySelector('.tag em').textContent =
      list.length? (list.length+' / '+MAXSHOT+'장') : '아직 비어 있음';
    const strip=d.querySelector('.strip');
    const sig=list.map(e=>e._k+':'+(e.note||'').length).join('|');
    if(strip.dataset.sig!==sig){
      strip.dataset.sig=sig; strip.innerHTML="";
      list.forEach(e=>{
        const c=document.createElement('div');
        c.className='ent'+(e.by===uid?' mine':'');
        c.innerHTML=`<img src="${e.img}">
          ${e.by===uid?'<button class="del">×</button>':''}
          <div class="em"><div class="ewho">${esc(e.byName||'')}</div></div>
          <textarea placeholder="왜 증거인가"></textarea>`;
        const ta=c.querySelector('textarea');
        ta.value=e.note||"";
        if(e.by!==uid) ta.readOnly=true;
        let t; ta.oninput=()=>{clearTimeout(t);t=setTimeout(()=>setNote(i,e._k,ta.value),700);};
        const db_=c.querySelector('.del');
        if(db_) db_.onclick=()=>{ if(confirm("이 사진을 지울까요?")) delShot(i,e._k); };
        strip.appendChild(c);
      });
      if(list.length<MAXSHOT){
        const add=document.createElement('button');
        add.className='add'; add.textContent='+ 사진 추가';
        add.onclick=()=>pick(u=>addShot(i,u));
        strip.appendChild(add);
      }
    }
  });

  const cats=filledCats();
  const total=ITEMS.reduce((a,_,i)=>a+entries(i).length,0);
  $('#pbar').style.width=(cats/ITEMS.length*100)+'%';
  $('#ptxt').textContent=`항목 ${cats} / ${ITEMS.length} 채움 · 모두 ${total} / ${ITEMS.length*MAXSHOT}장`;
  const by={};
  ITEMS.forEach((_,i)=>entries(i).forEach(e=>{by[e.byName||'?']=(by[e.byName||'?']||0)+1;}));
  Object.values(D.members||{}).forEach(m=>{ if(m.name&&!(m.name in by)) by[m.name]=0; });
  const names=Object.keys(by).sort();
  $('#tally').innerHTML = names.length
    ? names.map(n=>`<b>${esc(n)}</b> ${by[n]}장`).join(' · ') : '';

  drawGallery();
}

/* ---------- 보고서 ---------- */
window.exportReport=function(){
  const body=ITEMS.map((it,i)=>{
    const list=entries(i);
    const shots=list.length? list.map(e=>`<div class="sh"><img src="${e.img}">
        <p class="who">${esc(e.byName||'')}</p><p>${nl(e.note)||'—'}</p></div>`).join('')
      : '<p class="no">사진 없음</p>';
    return `<div class="it"><div class="tg">${it.t} · ${list.length}장</div>
      <p class="cl">${esc(it.c)}</p><div class="shots">${shots}</div></div>`;
  }).join('');
  const names=Object.values(D.members||{}).map(m=>m.name).filter(Boolean).join(', ');
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<title>원곡동 — ${esc(roomCode)}</title><style>
body{font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;max-width:820px;margin:0 auto;
padding:26px 18px 60px;background:#faf9f6;color:#1b1a18;line-height:1.65}
h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:26px 0 6px;
border-bottom:1px solid #dedbd3;padding-bottom:5px}
.meta{font-size:13px;color:#5f5c56;margin:0 0 16px}
.it{border:1px solid #dedbd3;background:#fff;border-radius:9px;padding:12px 14px;margin:10px 0}
.tg{font-size:12px;font-weight:700;color:#8c3b2e;margin-bottom:4px}
.cl{font-size:14.5px;font-weight:600;margin:0 0 10px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sh img{width:100%;border-radius:7px;display:block}
.sh p{margin:5px 0 0;font-size:13px}
.sh .who{font-size:11.5px;color:#8b877f;margin-top:5px}
.no{font-size:12.5px;color:#8b877f}
.qa{margin:12px 0}.qa b{display:block;font-size:14px;margin-bottom:3px}
.qa p{margin:0;white-space:pre-wrap}
@media print{body{background:#fff}}
</style></head><body>
<h1>왜 원곡동일까? — 조별 현장기록</h1>
<p class="meta">${esc(roomCode)} · ${esc(names)} · ${new Date().toLocaleString('ko-KR')}</p>
${body}
</body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download='wongok-'+roomCode.replace(/[^\w]/g,'')+'.html';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};

/* ---------- 접속 ---------- */
async function start(code,name){
  roomCode=code; myName=name;
  $('#gate').style.display='none'; $('#app').style.display='';
  $('#codeTag').textContent=code;
  try{const c=localStorage.getItem('wg-cache-'+code); if(c) D=Object.assign(D,JSON.parse(c));}catch(e){}
  draw();

  const [{initializeApp},dbm,authm]=await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
  ]);
  FB=dbm;
  const app=initializeApp(FIREBASE_CONFIG);
  db=dbm.getDatabase(app);
  const auth=authm.getAuth(app);
  uid=(await authm.signInAnonymously(auth)).user.uid;

  const meRef=dbm.ref(db,`rooms/${code}/members/${uid}`);
  await dbm.set(meRef,{name,at:Date.now()});
  dbm.onDisconnect(meRef).remove();

  dbm.onValue(dbm.ref(db,'.info/connected'),s=>$('#conn').classList.toggle('on',!!s.val()));
  dbm.onValue(dbm.ref(db,`rooms/${code}`),s=>{
    const v=s.val()||{};
    D.items=v.items||{}; D.members=v.members||{};
    try{localStorage.setItem('wg-cache-'+code,JSON.stringify(D));}catch(e){}
    draw();
  });

}

if(!FIREBASE_CONFIG.databaseURL){ gateSetup(); }
else{
  gateJoin();
  const c=localStorage.getItem('wg-code'), n=localStorage.getItem('wg-name');
  if(c&&n) start(c,n);
}
</script>
</body>
</html>
