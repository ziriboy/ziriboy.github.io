<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>북극항로 항해</title>
<style>
:root{--ink:#22262d;--mut:#6b707a;--line:#e3e6ea;--bg:#fff;--land:#e4e7ea;--sea:#edf1f5;--c:#1f4f8f;--c2:#8a919a;--warn:#9a3b2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 "Pretendard","Noto Sans KR",system-ui,sans-serif}
.wrap{width:1000px;margin:0 auto;padding:18px 12px 30px}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 12px}
.app{display:flex;gap:14px;align-items:flex-start}
.mapbox{flex:0 0 640px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sea);position:relative}
svg{display:block;width:640px;height:620px;touch-action:none;user-select:none}
.side{flex:1;min-width:0}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.lab{font-size:11.5px;color:var(--mut);margin:0 0 4px}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{min-width:70px}.stat b{display:block;font-size:16px}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12px;color:var(--mut)}
.btn{font:inherit;font-size:12.5px;border:1px solid #cfd4da;background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--ink)}
.btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.main{background:var(--ink);color:#fff;border-color:var(--ink);text-align:center;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0 10px}
.months .btn{text-align:center;padding:4px 0}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 10px}
.routes .btn b{display:block}.routes .btn span{font-size:11.5px;color:var(--mut)}
.card{border:1px solid var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.card .t{font-weight:800;font-size:14px;margin:0 0 4px}
.card .k{font-size:11.5px;color:var(--mut);margin:0 0 6px}
.card p{margin:0 0 8px}
.card .acts{display:flex;flex-direction:column;gap:6px}
.card.warn{border-color:var(--warn)}
.log{max-height:150px;overflow:auto;margin:0;padding-left:16px;color:var(--mut);font-size:12px}
.hint{color:var(--mut);font-size:12px}
.ice{font-size:12px}
textarea{width:100%;min-height:90px;font:inherit;border:1px solid #cfd4da;border-radius:8px;padding:8px}
.ex{margin:8px 0 0;padding:8px 10px;border-left:3px solid #9aa3ad;background:#f6f7f8;font-size:12.5px}
.ex b{display:block;font-size:12px}
.mission p{margin:0 0 6px}
.qq{font-weight:700;margin:4px 0 6px!important}.ans{font-size:12px;color:var(--mut);margin:0 0 4px!important}.fb{border-left:3px solid var(--c);background:#f3f6fa;padding:7px 10px;margin:0 0 8px;font-size:12.5px}
.cmpt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px}.cmpt td,.cmpt th{padding:4px 2px;border-top:1px solid #e3e6ea;text-align:right;white-space:nowrap}.cmpt td:first-child,.cmpt th:first-child{text-align:left}.cmpt th{font-weight:400;color:var(--mut);font-size:11.5px}.cmpt tr.me td{font-weight:700}.save{color:var(--c);font-weight:700}
.rk{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;margin-left:6px;vertical-align:2px;line-height:18px}
.rk.h{background:#9a3b2a;color:#fff}.rk.m{background:#fbf1e3;color:#8a5a12;border:1px solid #e6c48f}.rk.l{background:#f1f3f5;color:#6b707a}
.alert{background:#9a3b2a;color:#fff;border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:12.5px;line-height:1.5}.alert b{display:block;font-size:12px;letter-spacing:.02em}
.card figure{margin:0 0 8px}.card figure img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}.card figcaption{font-size:11.5px;color:var(--mut);margin-top:3px}
.chips.d span{border-color:#e0b4aa;color:#9a3b2a}
@keyframes zp{0%,100%{opacity:.18}50%{opacity:.45}}.zone.on{animation:zp 1.2s ease-in-out infinite}
@media (max-width:1010px){.wrap{width:auto}.app{flex-direction:column}.mapbox{flex:none;width:100%}svg{width:100%;height:auto}}
</style></head><body><div class="wrap">
<h1>선장이 되어 북극항로 건너기</h1>
<p class="sub">부산에서 로테르담까지 짐을 싣고 갔다가 다시 부산으로 돌아오는 한 바퀴 항해</p>
<div class="app">
<div class="mapbox"><svg id="map" viewBox="0 0 660 640"></svg></div>
<div class="side" id="side"></div>
</div>
<p class="hint" style="margin-top:8px">지도와 항해 일수는 실제 항로를 단순하게 나타낸 것이다. 북극항로의 얼음 상태는 해마다 달라지며, 여기서는 일반적인 시기로 나누었다. 바다 경계와 지명은 이해를 돕기 위해 일부만 표시하였다.</p>
</div>

function card(t,k,body,acts,warn,c,rk){rk=rk||(c&&c.rk)||'';const al=c&&c.alert?`<div class="alert"><b>▲ ${c.alert}</b></div>`:'';
 const ph=c&&c.ph?`<figure><img src="${c.ph}" alt="${c.pc}" onerror="this.parentNode.remove()"><figcaption>${c.pc}</figcaption></figure>`:'';
 S.card=`<div class="card${warn||rk==='h'?' warn':''}">${al}<p class="t">${t}${rk?`<span class="rk ${rk}">${rk==='h'?'▲ ':''}${RKN[rk]}</span>`:''}</p><p class="k">${k}</p>${ph}${body}<div class="acts">${acts}</div></div>`;}

 if(c.gate)return gate(c);

 let body='<p>'+c.p+'</p>';
 let rk2=null;if(c.ice){const st=iceState(nowDoy());if(st!=='open'){S.risks.push('바다 얼음');rk2=st==='frozen'?'h':'m';}if(st==='frozen'){body+='<p class="k">그사이 바다가 얼기 시작하였다. 쇄빙선이 두꺼워진 얼음을 겨우 깨며 길을 연다.</p>';S.extra+=2;}else if(st==='part'){body+='<p class="k">쇄빙선이 앞에서 얼음을 깨며 길을 연다. 속도가 느려진다.</p>';S.extra+=1;}else{body+='<p class="k">떠다니는 얼음 조각을 피해 속도를 줄인다.</p>';S.extra+=.5;}}

 card(c.t,c.k,body,ok(),false,c,rk2);}

 let body='<p><b>지금 얼음 상태: '+ICE[st]+'</b></p>';

 else if(st==='part'){body+='<p>바다 곳곳에 얼음이 남아 있거나 새로 얼기 시작하였다. 러시아 쇄빙선의 호위를 받아야 지날 수 있다.</p>';
  card(c.t,c.k,body,`<button class="btn" onclick="escort()"><b>쇄빙선 호위를 받는다</b><br><span class="hint">사흘 정도 더 걸리고 호위 비용을 낸다</span></button><button class="btn" onclick="turnBack()"><b>배를 돌린다</b><br><span class="hint">출발한 항구로 돌아가 수에즈 운하 경유 항로로 간다</span></button>`,true,c,'m');S.risks.push('바다 얼음');}
 else{body+='<p>바다가 두꺼운 얼음으로 덮여 있다. 이 컨테이너선은 얼음을 깰 수 없고, 쇄빙선이 호위해도 지나기 어렵다.</p>';card(c.t,c.k,body,`<button class="btn main" onclick="turnBack()">배를 돌린다</button>`,true,Object.assign({},c,{alert:'얼음에 막힘 · 더 나아갈 수 없다'}),'h');S.risks.push('두꺼운 바다 얼음');}}

 card(c.t,c.k,'<p>앞으로 홍해와 수에즈 운하를 지나는 길과, 아프리카 남쪽 끝의 희망봉을 돌아가는 길 가운데 하나를 골라야 한다. 홍해의 입구인 바브엘만데브 해협에서는 2023년 말부터 상선이 공격을 받아 왔다.</p>',

 S.result.push({key:S.route,route:S.path.name,days:d,km:Math.round(S.path.tot+(S.turnKm||0)),start:dShort(S.legStartDoy),end:dShort(nowDoy())});S.turnKm=0;

 else quizCard(BUSAN_IN,QZ.busanIn,'<p>'+BUSAN_IN.p+'</p>'+cmpLine(S.result[1]),'l',finish,false);}

function summary(){const sz=ROUTES.suez.tot,rows=S.result.map((r,i)=>`<tr class="me"><td>${i?'올 때':'갈 때'} · ${r.route.replace(' 경유 항로','').replace(' 우회 항로','')}</td><td>${r.days}일</td><td>${fmtKm(r.km)}</td><td>${Math.round(r.km/sz*100)}</td></tr>`).join('');
 const myD=S.result.reduce((a,r)=>a+r.days,0),myK=S.result.reduce((a,r)=>a+r.km,0);
 const sd=ROUTES.suez.days*2-myD,sf=Math.round(100-myK/(2*sz)*100);
 return `<table class="cmpt"><tr><th>구간</th><th>걸린 날</th><th>거리</th><th>연료 지수</th></tr>${rows}
 <tr><td>두 번 모두 수에즈였다면</td><td>${ROUTES.suez.days*2}일</td><td>${fmtKm(2*sz)}</td><td>100</td></tr>
 <tr><td>두 번 모두 북극항로였다면</td><td>${ROUTES.nsr.days*2}일</td><td>${fmtKm(2*ROUTES.nsr.tot)}</td><td>${Math.round(ROUTES.nsr.tot/sz*100)}</td></tr></table>
 <p style="margin:0 0 8px">${sd>0?`수에즈로만 다녀왔을 때보다 <span class="save">${sd}일 빨랐고</span>`:`수에즈로만 다녀왔을 때보다 <span class="save">${-sd}일 늦었고</span>`}, 연료와 탄소 배출은 ${sf>=0?`<span class="save">약 ${sf}% 줄었다</span>`:`<span class="save">약 ${-sf}% 늘었다</span>`}.</p>`;}
function finish(){S.stage='end';const tot=S.totalBefore;
 h(`<div class="card"><p class="t">한 바퀴 항해를 마쳤다</p><p class="k">${dateStr(doyOf(S.month))} 부산 출항 → ${dateStr(nowDoy())} 부산 도착 · 모두 ${tot}일 (로테르담 정박 4일 포함)</p>
 ${summary()}
 <p class="lab">치른 대가</p><div class="chips">${[...new Set(S.costs)].map(c=>'<span>'+c+'</span>').join('')}</div>
 <p class="lab" style="margin-top:6px">마주친 위험</p><div class="chips d">${[...new Set(S.risks)].map(c=>'<span>▲ '+c+'</span>').join('')||'<span>없음</span>'}</div>
 <p class="hint">연료와 탄소 배출은 거리에 비례한다고 단순화하였다(얼음 구간의 감속은 고려하지 않음).</p></div>
 <div class="box"><p class="lab">선장 일지</p><p style="margin:0 0 6px">다음에 같은 짐을 싣고 다시 떠난다면, 몇 월에 어느 길로 가고 어느 길로 돌아오겠는가? 걸리는 시간, 계절, 길목을 쥔 나라 가운데 두 가지 이상을 근거로 써 보자.</p>
 <textarea id="ta" placeholder="출항할 달과 갈 때·돌아올 때의 길, 그 까닭"></textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="hint">두세 문장을 쓰면 예시 답안과 비교할 수 있다.</span><button class="btn main" id="cmp" disabled onclick="cmp()">예시 답안과 비교하기</button></div><div id="exs"></div></div>
 <button class="btn" onclick="location.reload()">처음부터 다시 항해하기</button>`);
 const ta=document.getElementById('ta');ta.addEventListener('input',()=>{document.getElementById('cmp').disabled=ta.value.trim().length<20;});}
function cmp(){document.getElementById('exs').innerHTML=`<p class="ex"><b>예시 답안</b>7월 말에 부산을 떠나 갈 때는 북극항로로 가겠다. 8월에 북극항로 구간에 들어가면 얼음이 가장 적어 쇄빙선 없이 지날 수 있고, 수에즈 운하로 가는 것보다 열흘 가까이 빠르다. 그러나 로테르담에서 출항하는 9월 말에는 곧 바다가 다시 얼기 시작하고, 길목을 쥔 러시아의 허가와 비용에 기대야 하므로 돌아올 때는 수에즈 운하 경유 항로를 고르겠다.</p>
 <p class="ex"><b>이런 근거도 있다</b>수에즈 운하 경유 항로도 홍해의 위험 때문에 희망봉을 돌아가면 북극항로보다 20일 넘게 더 걸린다. 위험이 없는 길은 없으므로, 계절과 나라 사이의 관계에 따라 길을 바꿀 수 있게 두 길을 모두 준비해 두는 것이 낫다.</p>
 <p class="hint">내 답에 시간, 계절, 길목을 쥔 나라 가운데 무엇이 들어 있는지 견주어 보자.</p>`;}
/* ---------- setup ---------- */
function setup(){S.totalBefore=0;paintIce();const mo=Array.from({length:12},(_,i)=>`<button class="btn${S.month===i?' on':''}" onclick="S.month=${i};setup()">${i+1}월</button>`).join('');
 h(`<div class="box mission"><p class="lab">미션</p><p>컨테이너선의 선장이 되어 부산에서 로테르담(네덜란드)까지 짐을 싣고 갔다가, 다시 짐을 싣고 부산으로 돌아오자.</p>
 <p class="lab">하는 방법</p><p>출항할 달과 갈 길을 고른 뒤, 지도 위의 배를 끌어 항로를 따라간다. 지점마다 나오는 상황을 읽고 선장으로서 결정한다. 로테르담에서는 돌아올 길을 다시 고른다.</p>
 <p class="lab">마지막에 할 일</p><p style="margin:0">걸린 날, 연료, 치른 대가와 위험을 두 길끼리 견주어 보고, 다음 항해 계획을 선장 일지에 쓴다.</p></div>
 <div class="box"><p class="lab">출항할 달 (1일 출항)</p><div class="months">${mo}</div>
 <p class="lab">그때 북극항로의 얼음 상태: <span style="color:#22262d">${ICE[iceState(doyOf(S.month))]}</span></p>
 <p class="lab" style="margin-top:8px">갈 길</p><div class="routes"><button class="btn" onclick="go('nsr')"><b>북극항로</b><span>약 ${fmtKm(ROUTES.nsr.tot)} · 약 22일(얼음이 없을 때)</span></button><button class="btn" onclick="go('suez')"><b>수에즈 운하 경유 항로</b><span>약 ${fmtKm(ROUTES.suez.tot)} · 약 32일</span></button></div>
 <p class="lab">실을 짐: ${LEGS[0].cargo}</p></div>`);}
function go(r){S.leg=0;S.totalBefore=0;S.costs=[];S.risks=[];S.log=[dateStr(doyOf(S.month))+' 부산 출항'];S.result=[];S.done={};S.gateDone=false;S.legStartDoy=doyOf(S.month);S.extra=0;S.extraCargo=null;startLeg(r);quizCard(BUSAN_OUT,QZ.busanOut,'<p>'+BUSAN_OUT.p+'</p>','l',null,false);}
setup();
</script></body></html>
