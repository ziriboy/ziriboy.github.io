<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지리교과교육론 3강 · 지리 교육과정의 내용조직 원리</title>
<style>
/* ═══ 수업자료 공통 스타일 v1 — 매주 이 블록을 그대로 재사용 ═══ */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --mark:#F6E7B8;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:1120px; --hh:56px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:9px 30px;display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:3px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 10px;font-size:13px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:28px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{max-width:860px;margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.concept{background:var(--wash);border-radius:10px;padding:20px 24px;max-width:1000px;margin:6px 0 26px}
.concept h3{margin:0 0 10px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.concept dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:7px 16px;margin:0;font-size:15px}
.concept dt{font-weight:600}
.concept dd{margin:0;color:var(--mid)}
.concept p{margin:12px 0 0;font-size:14.5px;color:var(--mid)}
.concept p b{color:var(--ink)}

.step{margin-bottom:46px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:74ch}

.opt,.tag{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 12px;font-size:14px;color:var(--mid)}
.opt:hover,.tag:hover{border-color:var(--acc);color:var(--ink)}
.opt[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:disabled:hover{border-color:var(--line);color:var(--mid)}
textarea,.inp{width:100%;min-height:96px;border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;resize:vertical;background:none;line-height:1.7}
.inp{min-height:0;padding:7px 11px}
textarea:focus,.inp:focus{border-color:var(--acc);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;max-width:1000px;margin:14px 0}
.count{font-size:14px;color:var(--mid)}
.count b{color:var(--acc);font-weight:700}

.foot{margin-top:54px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;color:var(--mid);padding:0}
.foot button:hover{color:var(--ink)}
.foot .msg{color:var(--acc)}
/* ═══ 공통 스타일 v1 끝 ═══ */

.bar{position:sticky;top:var(--hh);z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2);
  padding:8px 0;margin:0 0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:5px 13px;font-size:14px;line-height:1.35;text-align:left;color:var(--ink)}
.tab small{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.tab:hover{border-color:var(--acc)}
.tab[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w);color:var(--acc);font-weight:600}
.tab[aria-pressed="true"] small{color:var(--acc)}
.hint{font-size:13px;color:var(--mid)}
.hint b{background:var(--mark);border-radius:4px;padding:1px 7px;font-weight:600;color:var(--ink);margin-right:7px}
.prog{margin-left:auto;font-size:13px;color:var(--soft)}

/* 교육과정 */
.doc{max-width:940px}
.unit{border-top:1px solid var(--line);padding:15px 0 9px}
.uh{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:baseline;margin-bottom:3px}
.uh .un{font-size:12.5px;color:var(--soft);font-weight:600}
.uh .ut{font-size:17.5px;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.std{display:grid;grid-template-columns:38px 132px minmax(0,1fr);padding:4px 0;font-size:15px;line-height:1.72}
.std .c{grid-column:2;font-size:12.5px;color:var(--mid);padding-top:3px;white-space:nowrap}
.std .t{grid-column:3}
.hl{cursor:text}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
.flash{animation:fl 2s ease}
@keyframes fl{0%,55%{background:var(--acc-w);box-shadow:0 0 0 4px var(--acc-w)}100%{background:transparent;box-shadow:none}}

/* 체크리스트 */
.scale{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:end;
  font-size:12px;color:var(--soft);padding-bottom:5px;border-bottom:1px solid var(--line);max-width:1060px}
.scale div{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.it{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:6px 18px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line2);max-width:1060px}
.it .q{font-size:15px;line-height:1.5}
.it .q i{font-style:normal;color:var(--soft);margin-right:8px;font-size:13px}
.it .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.lv{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:5px 4px;font-size:13.5px;color:var(--mid)}
.lv:hover{border-color:var(--acc);color:var(--ink)}
.lv[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.it.done .q{color:var(--mid)}
.it .rf{grid-column:1/-1;font-size:13.5px;line-height:1.65;color:var(--mid);padding-bottom:2px}
.it .rf b{font-weight:600;margin-right:7px}
.it .rf b.ok{color:var(--acc)} .it .rf b.no{color:var(--red)}
.it .go{background:none;border:none;color:var(--soft);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;margin-left:6px}
.it .go:hover{color:var(--acc)}

/* 자동 종합 */
:root{--ours:#D98A4E;--ours-w:#F7E6D6}
.rhead{display:grid;grid-template-columns:18px minmax(0,1fr) 300px;gap:14px;max-width:1040px;
  font-size:12px;color:var(--soft);padding-bottom:4px;border-bottom:1px solid var(--line);
  position:sticky;top:calc(var(--hh) + 46px);background:#fff;z-index:5}
.rhead .zn{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.rgrp{margin-bottom:14px;max-width:1040px}
.rgrp h4{margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.04em}
.rgrp h4 span{font-weight:400;color:var(--soft);letter-spacing:0;margin-left:8px}
.rl{display:grid;grid-template-columns:18px minmax(0,1fr) 300px;gap:14px;align-items:center;
  padding:6px 0 10px;border-bottom:1px solid var(--line2);font-size:15px}
.rl .mk{color:var(--ours);font-size:13px;text-align:center;align-self:start;padding-top:2px}
.rl .nm{line-height:1.4}
.rl.w2 .nm b{font-weight:700}
.rl .nm small{display:block;font-size:12.5px;color:var(--soft);line-height:1.45;margin-top:1px}
.rl .tr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.rl .zn{height:20px;background:var(--wash);border-radius:5px;position:relative}
.rl .zn.ours{background:var(--ours)}
.rl .zn.ref:after{content:'';position:absolute;left:16%;right:16%;bottom:-6px;height:3px;border-radius:2px;background:var(--acc)}
.rgrp.none .nm b{color:var(--soft)}
.rgrp.none .mk{color:var(--soft)}
.rleg{font-size:13px;color:var(--mid);margin:10px 0 0}
.rleg i{display:inline-block;vertical-align:middle;margin:0 6px 0 18px}
.rleg i:first-of-type{margin-left:0}
.rleg .o{width:20px;height:12px;border-radius:3px;background:var(--ours)}
.rleg .g{width:20px;height:3px;background:var(--acc)}
.vsent{font-size:16.5px;line-height:1.75;letter-spacing:-.01em;margin:16px 0 0;max-width:1000px;
  border-left:3px solid var(--acc);padding-left:16px}
.vsent b{font-weight:700}
.refS{font-size:15px;color:var(--mid);margin:14px 0 0;line-height:1.85;max-width:1000px}
.refS .lb{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.04em;margin-right:10px}
.refS b{color:var(--ink)}
.legend{font-size:13px;color:var(--soft);margin:8px 0 0}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:-2px;margin-right:5px}
.cau{margin-top:12px;font-size:14.5px;color:var(--mid);background:var(--wash);border-radius:8px;padding:12px 16px;line-height:1.7;max-width:1000px}
/* 대조표 */
.dt{width:100%;max-width:1000px;border-collapse:collapse;font-size:14.5px;margin:8px 0 0}
.dt th,.dt td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2)}
.dt thead th{border-bottom:1px solid var(--line);font-size:13px;color:var(--mid);font-weight:600}
.dt td.v{width:130px}
.dt .same{color:var(--acc)} .dt .diff{color:var(--red);font-weight:600}
.dt tr.d td{background:var(--wash)}
.hit{font-size:14px;color:var(--mid);margin:16px 0 0}
.hit b{color:var(--acc);font-weight:700}

.final{max-width:1000px;margin-top:8px}
.final label{display:block;font-size:14.5px;font-weight:600;margin-bottom:7px;line-height:1.6}
.final label span{display:block;font-weight:400;color:var(--mid);font-size:13.5px}

/* 비교 */
.ctw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ct{border-collapse:collapse;width:100%;min-width:780px;font-size:14.5px}
.ct th,.ct td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}
.ct thead th{border-bottom:2px solid var(--ink);font-size:15.5px}
.ct thead th button{background:none;border:none;padding:0;font:inherit;cursor:pointer;color:var(--ink)}
.ct thead th button:hover{color:var(--acc)}
.ct tbody th{width:120px;font-weight:600;color:var(--mid);font-size:14px}
.ct td{width:29%;line-height:1.65}
.ct .none{color:var(--soft)}
.ct ul{margin:0;padding:0;list-style:none}
.ct li{padding:1px 0}
.ct li b{font-weight:700}

@media(max-width:820px){
  .hin,main{padding-left:16px;padding-right:16px}
  .brand .c{display:none} h1{font-size:26px}
  .it,.scale{grid-template-columns:1fr}
  .std{grid-template-columns:0 minmax(0,1fr)} .std .c,.std .t{grid-column:2}
  .rhead,.rl{grid-template-columns:16px minmax(0,1fr) 132px;gap:8px}
  .rhead{font-size:11px}
  .prog{margin-left:0}
}
@media print{
  header,.foot,.bar,.lv,.go,#keyb{display:none!important}
  main{padding:0;max-width:none}
  mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
<style>

.brief li{font-size:16.5px;margin:6px 0}
.brief li small{color:var(--soft);font-size:13px;margin-left:8px}
.sd{margin:0 0 14px;color:var(--mid);font-size:14.5px;max-width:62em}

  color:var(--soft);font-size:14px;max-width:860px}
.pens{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.pen{border:1px solid var(--line);border-radius:20px;cursor:pointer;padding:6px 15px;
  font-size:14px;background:none;color:var(--mid)}
.pen[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.pen i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.pen small{color:var(--soft);font-weight:400;margin-left:7px;font-size:12.5px}
.eb{margin-bottom:30px;max-width:900px}
.eg{margin:0 0 10px;font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.ed{border-top:1px solid var(--line)}
.edu{border-bottom:1px solid var(--line2);padding:14px 0 13px}
.edu:last-child{border-bottom:none}
.edt{margin:0 0 7px;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.eds{margin:0 0 5px;font-size:14.5px;line-height:1.75;color:var(--mid);
  padding-left:78px;text-indent:-78px}
.eds:last-child{margin-bottom:0}
.edc{display:inline-block;width:70px;color:var(--soft);font-size:12.5px;text-indent:0}
.nav2{margin-top:24px}
.cmp .pre{background:var(--wash);color:var(--mid)}
textarea[data-txt]{width:100%;max-width:860px;border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;background:none;line-height:1.7;resize:vertical}
textarea[data-txt]:focus{border-color:var(--acc)}
@media (max-width:760px){.elem{grid-template-columns:1fr}}
.pend{margin:14px 0 20px;max-width:860px}
.pend p{margin:0 0 7px;font-size:14px;color:var(--mid);line-height:1.7;
  display:flex;gap:9px;align-items:baseline}
.pend p:last-child{margin-bottom:0}
.pend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto;
  transform:translateY(-1px)}
.pend b{color:var(--ink);font-weight:600;white-space:nowrap}
mark[data-k]{padding:1px 0;border-radius:3px;cursor:pointer;color:inherit}
.evbox{margin-top:18px;border:1px solid var(--line);border-radius:9px;padding:14px 18px;max-width:860px}
.ek{margin:0 0 9px;font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.evl{display:flex;flex-wrap:wrap;gap:6px}
.evc{border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:13.5px;
  background:none;cursor:default;color:var(--ink);text-align:left}
.evc i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.evc small{color:var(--soft);font-size:12px;margin-left:7px}
.evc.pickable{cursor:pointer}
.evc.pickable:hover{border-color:var(--acc)}
.evc[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.picks{display:grid;gap:9px;max-width:860px}
.pk{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;
  border:1px solid var(--line);border-radius:9px;padding:13px 17px;cursor:pointer;color:var(--ink)}
.pk:hover{border-color:var(--acc)}
.pk[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.pk .mk{width:16px;height:16px;border:1px solid var(--line);border-radius:50%;flex:0 0 auto;margin-top:5px}
.pk[aria-pressed="true"] .mk{background:var(--acc);border-color:var(--acc)}
.pk b{font-weight:600}
.pk small{display:block;color:var(--soft);font-size:13px;margin-top:2px;line-height:1.55}
.reveal{margin-top:14px;border-left:3px solid var(--acc);background:var(--acc-w);
  border-radius:0 8px 8px 0;padding:14px 18px;max-width:860px}
.reveal b{color:var(--acc)}
.card{border:1px solid var(--acc);border-radius:10px;padding:20px 24px;max-width:860px}
.card dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 16px;margin:0}
.card dt{color:var(--soft);font-size:13px}
.card dd{margin:0;font-size:15.5px}
.card .sum{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line2);font-size:16.5px;line-height:1.75}
.cmp{overflow:auto;margin-top:8px}
.cmp table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
.cmp th,.cmp td{border-bottom:1px solid var(--line2);padding:11px 12px;text-align:left;vertical-align:top}
.cmp thead th{border-bottom:1px solid var(--line);color:var(--mid);font-weight:600;font-size:13.5px}
.cmp tbody th{color:var(--soft);font-weight:400;font-size:13px;width:88px}
.cmp .none{color:var(--soft)}
.swatch{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:100%;height:9px;border-radius:2px}
.keyb{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;
  padding:7px 16px;font-size:14px;color:var(--mid)}
.keyb:hover{border-color:var(--acc);color:var(--ink)}

"use strict";
var D={"SUBJ":[{"id":"elem","name":"초등 사회","units":[{"n":"3~4학년","t":"우리가 사는 곳","s":[{"c":"4사01-01","t":"주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다."},{"c":"4사01-02","t":"주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐 색한다."}]},{"n":"3~4학년","t":"지도로 만나는 우리 지역","s":[{"c":"4사05-01","t":"우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다."},{"c":"4사05-02","t":"지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다."}]},{"n":"3~4학년","t":"지역문제를 해결하고 지역을 알리는 노력","s":[{"c":"4사09-01","t":"생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다."},{"c":"4사09-02","t":"지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다."}]},{"n":"3~4학년","t":"다양한 환경과 삶의 모습","s":[{"c":"4사10-01","t":"여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다."},{"c":"4사10-02","t":"사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해 한다."}]},{"n":"5~6학년","t":"우리나라 국토 여행","s":[{"c":"6사01-01","t":"우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다."},{"c":"6사01-02","t":"독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해 한다."}]},{"n":"5~6학년","t":"우리나라 지리 탐구","s":[{"c":"6사02-01","t":"우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다."},{"c":"6사02-02","t":"우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색 한다."}]},{"n":"5~6학년","t":"지구, 대륙 그리고 국가들","s":[{"c":"6사09-01","t":"세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다."},{"c":"6사09-02","t":"세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다."}]},{"n":"5~6학년","t":"세계의 자연환경","s":[{"c":"6사10-01","t":"세계의 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다."},{"c":"6사10-02","t":"세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다."}]},{"n":"5~6학년","t":"지구촌 사람들","s":[{"c":"6사12-01","t":"세계의 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다."},{"c":"6사12-02","t":"지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색 한다."}]}]},{"id":"mid","name":"중학교 지리 영역","units":[{"n":1,"t":"세계화 시대, 지리의 힘","s":[{"c":"[9사(지리)01-01]","t":"세계 여러 지역의 특성을 해당 지역의 위치와 자연⋅인문환경을 고려하여 추론한다."},{"c":"[9사(지리)01-02]","t":"다양한 스케일에서 지역이 서로 연계되어 있음을 공간적 상호 작용의 사례를 통해 파악한다."},{"c":"[9사(지리)01-03]","t":"세계의 변화가 지역에 영향을 미치고 지역의 변화가 세계에 영향을 미치는 사례를 조사한다."}]},{"n":2,"t":"아시아","s":[{"c":"[9사(지리)02-01]","t":"다양한 지리 정보와 매체를 활용하여 아시아의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)02-02]","t":"종교와 관련된 아시아의 다양한 문화경관과 생활양식을 파악하고, 세계시민으로서 문화 다양성에 대한 이해와 수용성을 높인다."},{"c":"[9사(지리)02-03]","t":"아시아의 인구 특징을 파악하고 지역별 인구 구조 변화를 비교하여 지역 발전의 가능성 및 변화 모습을 추론한다."},{"c":"[9사(지리)02-04]","t":"글로컬 관점에서 아시아의 산업 특징과 변화를 파악하고, 이것이 우리나라 산업에 미치는 영향을 탐색한다."}]},{"n":3,"t":"유럽","s":[{"c":"[9사(지리)03-01]","t":"다양한 지리 정보와 매체를 활용하여 유럽의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)03-02]","t":"다양한 유형의 유럽 도시를 탐색하고, 기후위기에 대응하여 지속가능한 도시를 만들기 위한 노력을 조사한다."},{"c":"[9사(지리)03-03]","t":"지역 간 역학관계에 따른 유럽의 통합과 분리의 움직임이 유럽연합의 변화와 주민 생활에 미치는 영향을 탐색한다."}]},{"n":4,"t":"아프리카","s":[{"c":"[9사(지리)04-01]","t":"다양한 지리 정보와 매체를 활용하여 아프리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)04-02]","t":"아프리카의 지리적 특성에 기반한 다양한 문화와 지역 잠재력을 탐구하고, 아프리카에 대한 자신의 인식을 성찰한다."},{"c":"[9사(지리)04-03]","t":"지속가능한 발전을 위한 아프리카 각 지역의 노력과 세계 다양한 주체들의 협력 사례를 조사하고, 세계시민으로서 우리가 참여할 수 있는 방안을 모색한다."}]},{"n":5,"t":"아메리카","s":[{"c":"[9사(지리)05-01]","t":"다양한 지리 정보와 매체를 활용하여 아메리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)05-02]","t":"다양한 민족(인종)으로 구성된 아메리카의 인구 특징을 살펴보고, 사례를 들어 아메리카의 문화 혼종성을 설명한다."},{"c":"[9사(지리)05-03]","t":"초국적 기업의 글로벌 생산체제에 대한 이해를 바탕으로, 초국적 기업의 아메리카 지역 내 입지와 해외 이전의 이유, 그에 따른 해당 지역의 변화를 분석한다."}]},{"n":6,"t":"오세아니아와 극지방","s":[{"c":"[9사(지리)06-01]","t":"다양한 지리 정보와 매체를 활용하여 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악하고, 자원 수출을 중심으로 세계 다른 지역과의 상호연계성을 탐색한다."},{"c":"[9사(지리)06-02]","t":"태평양 지역이 겪고 있는 환경 문제를 조사하고 그 해결에 참여할 수 있는 방안을 제안한다."},{"c":"[9사(지리)06-03]","t":"극지방의 지리적 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴보고, 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다."}]},{"n":7,"t":"대한민국, 우리가 살아가는 곳","s":[{"c":"[9사(지리)07-01]","t":"우리 국토의 위치와 영역에 대한 이해를 바탕으로 세계 속에서 우리나라의 위치를 지정학, 지경학적 측면에서 탐색한다."},{"c":"[9사(지리)07-02]","t":"우리나라 행정구역과 주요 도시의 위치를 파악하고, 자신이 살고 있는 곳의 장소성과 장소감을 표현한다."},{"c":"[9사(지리)07-03]","t":"다양한 지리 정보와 매체를 활용하여 우리 지역의 문제를 선정하고 지리적으로 시각화한다."}]},{"n":8,"t":"우리나라의 자연환경과 인간 생활","s":[{"c":"[9사(지리)08-01]","t":"우리나라 주요 산지⋅하천⋅해안 지형의 위치와 특성을 파악하고, 매력적인 지형 경관을 탐색하여 우리 국토의 아름다움을 느낀다."},{"c":"[9사(지리)08-02]","t":"우리나라의 계절별, 지역별 기후 특성 및 변화 양상을 파악하고, 기후변화에 대한 지역별 대응 노력을 조사한다."},{"c":"[9사(지리)08-03]","t":"우리나라 자연재해의 지리적 특성과 피해 최소화를 위한 노력을 파악하고, 일상생활 속 다양한 상황에서 자연재해 발생 시 자신의 대처 방안을 탐색한다."}]},{"n":9,"t":"중부 지역","s":[{"c":"[9사(지리)09-01]","t":"다양한 지리 정보와 매체를 활용하여 중부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다."},{"c":"[9사(지리)09-02]","t":"수도권의 공간 구조를 파악하고, 인구⋅문화⋅경제적 측면을 중심으로 수도권의 변화 양상을 탐색한다."},{"c":"[9사(지리)09-03]","t":"강원⋅충청 지역의 변화를 교통 발달과 수도권과의 관계를 중심으로 파악하고, 강원⋅충청 지역의 산업 변화와 지역경제 활성화를 위한 노력을 조사한다."},{"c":"[9사(지리)09-04]","t":"수도권과 비수도권 간의 지역 불균형 실태를 지도로 표현하고, 지역 불균형을 완화하기 위한 방안들을 제안한다."}]},{"n":10,"t":"남부 지역","s":[{"c":"[9사(지리)10-01]","t":"다양한 지리 정보와 매체를 활용하여 남부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다."},{"c":"[9사(지리)10-02]","t":"글로벌 경제와 우리나라 산업에서 영⋅호남 공업 지역의 위상을 파악하고, 영⋅호남 지역의 산업 변화와 당면 과제를 조사한다."},{"c":"[9사(지리)10-03]","t":"제주도의 지역 변화와 이를 둘러싼 다양한 가치를 살펴보고 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다."}]},{"n":11,"t":"북부 지역","s":[{"c":"[9사(지리)11-01]","t":"다양한 지리 정보와 매체를 활용하여 북한의 자연환경과 인문환경의 특징을 탐색한다."},{"c":"[9사(지리)11-02]","t":"분단이 우리의 일상생활에 미친 영향을 살펴보고, 분리와 연결의 공간으로서 접경지역의 다양한 모습을 세계 여러 지역의 사례를 통해 비교한다."},{"c":"[9사(지리)11-03]","t":"세계시민의 관점에서 한반도 평화의 중요성을 논의하고, 한반도 평화와 통일 환경 속에서 우리의 삶과 국토의 미래를 구상한다."}]},{"n":12,"t":"지속가능한 세계와 글로컬 시민","s":[{"c":"[9사(지리)12-01]","t":"우리나라 주요 식량 자원 및 에너지 자원의 소비 현황과 수입국 현황을 분석하여 이와 관련된 문제를 파악하고, 자원의 지속가능한 확보 방안을 모색한다."},{"c":"[9사(지리)12-02]","t":"지역 개발과 환경 보존을 둘러싼 글로컬 환경 이슈에 관심을 가지고 자신의 웰빙 및 공동체의 지속가능한 발전을 위해 참여하고 실천한다."},{"c":"[9사(지리)12-03]","t":"더 나은 지역을 만들어 가는 사람들의 노력을 국내외 사례를 통해 살펴보고, 자신이 사는 지역의 문제를 해결하기 위한 방안을 모색하고 이를 실천한다."}]}],"key":{"cau":"대단원 이름만 보면 지역적 방법입니다. 그러나 한 지역을 고르게 다루지 않고, 공통의 틀 위에 지역마다 다른 주제를 두세 개씩 골라 얹었습니다. 1번과 2번이 갈리는 지점이 바로 지역적 방법과 지역-주제 방법의 차이입니다. 배열에서는 초등학교와 반대로 세계에서 우리나라로 좁혀 옵니다. 지평확대법의 방향을 뒤집은 것입니다."}},{"id":"wcg","name":"세계시민과 지리","units":[{"n":1,"t":"세계시민, 세계화와 지역 이해","s":[{"c":"[12세지01-01]","t":"세계화의 의미를 지리적 스케일에 따라 이해하고, 세계화와 지역화의 관계 속에서 세계시민의 역할을 탐색한다."},{"c":"[12세지01-02]","t":"지역 통합과 분리 현상의 사례와 주요 원인을 탐구하고, 이를 바탕으로 지역 변화의 역동성을 파악한다."},{"c":"[12세지01-03]","t":"지리정보기술이 세계시민의 삶과 연계되는 다양한 모습을 이해하고, 지리적 문제 해결 및 의사 결정에 활용되는 사례를 조사한다."}],"el":["세계화와 세계시민","지역 변화의 역동성","지리 정보와 지리정보기술의 활용"]},{"n":2,"t":"모자이크 세계, 세계의 다양한 자연환경과 문화","s":[{"c":"[12세지02-01]","t":"세계의 다양한 기후에 대한 이해를 바탕으로 기후를 활용하거나 극복한 사례를 찾아 인간 생활과의 관계를 탐색한다."},{"c":"[12세지02-02]","t":"세계 주요 지형과 인간 생활의 상관성을 파악하고, 지형의 개발과 보존을 둘러싼 갈등 사례를 통해 지속가능한 이용 방안을 토론한다."},{"c":"[12세지02-03]","t":"세계 주요 종교의 특징 및 종교 경관의 의미를 이해하고, 각 종교가 인간 생활에 미치는 영향을 탐구한다."},{"c":"[12세지02-04]","t":"세계의 다양한 음식과 축제를 지리적으로 설명하고, 문화 다양성을 보존하기 위한 방법을 모색한다."}],"el":["다양한 기후와 인간 생활","지형과 인간 생활 및 지형의 지속가능한 이용","세계 주요 종교 경관","다양한 음식과 축제의 지리적 의미"]},{"n":3,"t":"네트워크 세계, 세계의 인구와 경제 공간","s":[{"c":"[12세지03-01]","t":"세계 인구 분포 및 구조를 통해 세계 인구 문제를 이해하고, 국제적 이주가 인구 유출 지역과 유입 지역에 미치는 영향을 탐구한다."},{"c":"[12세지03-02]","t":"주요 식량 자원의 생산과 소비 양상을 통해 세계 식량 문제가 발생하는 구조적 원인을 파악하고, 식량의 안정적인 생산과 공급을 위한 각국의 대응 전략을 비교⋅분석한다."},{"c":"[12세지03-03]","t":"초국적 기업을 중심으로 한 글로벌 경제 체제의 형성 과정을 탐색하고, 글로벌 경제에서의 공간적 불균등을 해소하기 위한 국제적 협력과 개인적 실천 방안에 대해 조사한다."}],"el":["인구 분포 및 구조, 국제적 이주의 영향","식량 자원의 생산과 소비","글로벌 경제와 공간적 불균등"]},{"n":4,"t":"지속가능한 세계, 세계의 환경 문제와 평화","s":[{"c":"[12세지04-01]","t":"세계 주요 에너지 자원의 생산과 소비 현황을 조사하고, 다양한 친환경 에너지원의 특징에 대한 이해를 바탕으로 지속가능한 에너지 생산 방안을 제시한다."},{"c":"[12세지04-02]","t":"세계 주요 환경 문제의 유형과 실태를 설명하고, 생태전환적 삶에 비추어 현재의 생활방식을 비판적으로 점검한다."},{"c":"[12세지04-03]","t":"다양한 지정학적 분쟁을 국제 정세의 변화와 관련지어 조사하고, 세계 평화와 정의에 기여할 수 있는 방안을 찾아 실천한다."}],"el":["세계의 에너지 문제와 대안","세계의 환경 문제와 생태전환적 삶","지정학적 분쟁과 평화를 위한 노력"]}],"key":{"cau":"계통적·주제적 방법과 지역-주제 주제 중심형이 함께 뚜렷하게 나오는 것이 이 과목의 특징입니다. 둘은 배타적이지 않습니다. 주제로 대단원을 세우고(계통), 그 주제를 여러 지역의 사례로 다루기(지역-주제) 때문입니다. 네 대단원이 모두 세계를 다루므로 공간 범위로는 순서가 설명되지 않고, 모자이크 → 네트워크 → 지속가능한 세계라는 개념이 순서를 정합니다."}},{"id":"kgi","name":"한국지리 탐구","units":[{"n":1,"t":"공간정보와 지리 탐구","s":[{"c":"[12한탐01-01]","t":"다양한 현상에 대해 지리적 관점으로 질문을 던지고, 질문에 답을 하기 위한 탐구 계획을 수립한다."},{"c":"[12한탐01-02]","t":"야외조사 및 지리정보기술을 활용한 데이터 수    '<button class="tab" data-tab="cross" aria-pressed="'+(S.sid==="cross")+'">범위와 계열</button>'+
   '</div></div>';}
function foot(){
  return '<div class="foot"><button id="copy">패들렛용 정리 복사</button>'+
   '<button id="print">인쇄 · PDF</button><span class="msg" id="msg"></span>'+
   '<button id="clear">모두 지우기</button></div>';}

function elemView(){
  return '<h1>'+esc(ELEM.name)+'</h1>'+
   ELEM.units.map(function(u){
     return '<div class="unit"><div class="uh"><span class="un">('+esc(u.n)+')</span>'+
       '<span class="ut">'+esc(u.t)+'</span></div>'+
       u.s.map(function(x){return '<div class="std"><span class="c">'+esc(x.c)+'</span>'+
         '<span class="t">'+esc(x.t)+'</span></div>';}).join("")+'</div>';}).join("");
}
function subjView(){
  var s=SID[S.sid],d=S.d[s.id];
  function penbar(){
    return '<div class="toolbar"><div class="pens">'+PENS.map(function(p){
      return '<button class="pen" data-pen="'+p.k+'" aria-pressed="'+(d.pen===p.k)+'">'+
        '<i style="background:'+p.c+'"></i>'+p.n+'</button>';}).join("")+'</div></div>';}

  var h='<h1>'+esc(s.name)+'</h1>';
  if(S.ans[s.id])
    h+='<div class="egbar2"><span>결과를 표시해 두었습니다. 내가 칠한 것과 견주어 보십시오.</span>'+
     '<button class="keyb" id="ansoff">내 표시로 돌아가기</button></div>';

  h+='<div class="step"><h3><b>1</b>대단원과 성취기준</h3>'+
   penbar()+
   '<div class="pend">'+PENS.map(function(p){
     return '<p><i style="background:'+p.c+'"></i><b>'+p.n+'</b> — '+p.d+'</p>';}).join("")+'</div>'+
   '<p class="sd guide">대단원과 성취기준을 지역, 주제·개념, 쟁점·문제로 분류합니다. '+
   '각각에서 그 성격이 가장 뚜렷하게 드러나는 문구를 골라 표시하십시오. '+
   '한 곳에는 한 가지만 분류합니다.</p>'+
   docView(s,false,false)+
   '<div class="ansbar"><button class="keyb" id="anson">'+
     (S.ans[s.id]?"결과 숨기기":"결과 확인하기")+'</button></div>'+
   '</div>';

  var nHi=picked(d,"hi").length,nMid=picked(d,"mid").length;
  function chip(m){
    return '<button class="mchip" draggable="true" data-mv="'+m.k+'">'+
      (m.p?'<i style="background:'+pc(m.p)+'"></i>':'<i class="nod"></i>')+
      '<span><b>'+esc(m.n)+'</b><small>'+esc(m.d)+'</small></span></button>';}
  function box(cl,label,note,list){
    return '<div class="mvbox '+cl+'" data-drop="'+cl+'"><p class="mvh">'+label+
      (note?'<span>'+note+'</span>':'')+'</p><div class="mvc col'+(cl==="pool"?"":" slot")+'">'+
      list.map(chip).join("")+'</div></div>';}
  var pool=METHODS.filter(function(m){return !d.lv[m.k];});
  h+='<div class="step"><h3><b>3</b>조직 방법</h3>'+
   '<div class="mv">'+
    box("hi","뚜렷하게 보이는 것",(nHi?nHi+"개":""),picked(d,"hi"))+
    box("mid","부분적으로 적용된 것",(nMid?nMid+"개":""),picked(d,"mid"))+
    box("pool","후보","",pool)+
   '</div>';
  if(lvDone(d))
    h+='<div class="reveal">'+picked(d,"hi").map(function(m){
      return '<b>'+esc(m.n)+'</b> — '+esc(m.d);}).join('<br>')+'</div>';
  h+='</div>';

  if(stageOf(s)===3)
    h+='<div class="step"><h3><b>·</b>정리</h3>'+cardOf(s)+'</div>';
  return h;}

function cardOf(s){
  var d=S.d[s.id],hi=picked(d,"hi"),mid=picked(d,"mid");
  return '<div class="card"><dl>'+
   '<dt>뚜렷한 방법</dt><dd>'+(hi.length?esc(hi.map(function(m){return m.n;}).join(" · ")):"—")+'</dd>'+
   '<dt>부분적인 방법</dt><dd>'+(mid.length?esc(mid.map(function(m){return m.n;}).join(" · ")):"—")+'</dd>'+
   '</dl></div>';}

function qbox(){
  return '<div class="qbox">'+
   '<p><b>1</b> 같은 내용이 되풀이되는가, 되풀이되면서 깊어지는가.</p>'+
   '<p><b>2</b> 깊어진다면 무엇이 깊어지는가. 다루는 공간인가, 개념인가, 학생에게 요구하는 사고인가.</p>'+
  '</div>';}
function crossView(){
  var h='<h1>범위와 계열</h1>'+
   '<div class="defbox">'+
    '<p><b>범위 scope</b> — 무엇을 넣고 무엇을 뺄 것인가, 얼마나 깊이 다룰 것인가.</p>'+
    '<p><b>계열 sequence</b> — 그것들을 어떤 순서로 놓을 것인가.</p>'+
   '</div>'+
   '<p class="sd" style="margin-top:18px">앞에서 한 색칠과 조직 방법이 <b>범위</b>였습니다. '+
   '여기서는 <b>계열</b>을 봅니다. 같은 주제가 학교급을 따라 어떻게 달라지는지 봅니다.</p>';

  /* 예시 — 인구 */
  h+='<div class="step"><h3><b>예시</b>인구는 학교급에 따라 어떻게 달라지는가</h3>'+
   '<div class="sqlist">'+POP.map(function(b){
     return '<div class="sqrow"><p class="sqh">'+esc(b.g)+'</p>'+
       b.it.map(function(x){
         return '<p class="sqt"><span class="sqc">'+esc(SD[x.c].c)+
           (x.n?' <em>'+esc(x.n)+'</em>':'')+'</span>'+esc(SD[x.c].t)+'</p>';}).join("")+
       '</div>';}).join("")+'</div>'+

   '<div class="cmp" style="margin-top:18px"><table><thead><tr><th></th>'+
     '<th>무엇을 배우는가</th><th>학생에게 요구하는 사고</th></tr></thead><tbody>'+
     POP.map(function(b){
       return '<tr><th>'+esc(b.g)+'</th><td>'+esc(b.w)+'</td><td>'+esc(b.t)+'</td></tr>';}).join("")+
   '</tbody></table></div>'+
   qbox()+'</div>';

  /* 활동 — 자연재해 */
  h+='<div class="step"><h3><b>활동</b>그렇다면 자연재해는 어떻게 계열화되어 있는가</h3>'+
   '<div class="sqlist">'+CLI.map(function(b){
     return '<div class="sqrow"><p class="sqh">'+esc(b[0])+'</p>'+
       b[1].map(function(x){var c=(typeof x==="string")?x:x[0],n=(typeof x==="string")?"":x[1];
         return '<p class="sqt"><span class="sqc">'+esc(SD[c].c)+
           (n?' <em>'+esc(n)+'</em>':'')+'</span>'+esc(SD[c].t)+'</p>';}).join("")+
       '</div>';}).join("")+'</div>'+

   '</div>';

  /* 마무리 */
  if(doneAll())
    h+='<div class="step"><h3><b>·</b>나란히 놓기</h3>'+cmpTable()+
     '<p class="sd" style="margin-top:16px"><button class="keyb" id="keyb">'+(S.key?"해설 닫기":"해설 보기")+'</button></p>'+
     (S.key?'<div class="cau">'+D.READ+'</div>':'')+'</div>';
  return h;}

function cmpTable(){
  function nm(arr,k){var o=arr.filter(function(x){return x.k===k;})[0];return o?o.n:"—";}
  return '<div class="cmp"><table><thead><tr><th></th>'+ALL.map(function(x){
     return '<th><button class="keyb" data-tab="'+x.id+'" style="padding:4px 10px;font-size:13.5px">'+esc(x.name)+'</button></th>';
   }).join("")+'</tr></thead><tbody>'+
   '<tr><th>칠한 색</th><td class="none">읽기 자료</td>'+SUBJ.map(function(x){
     var ev=evList(x.id);
     return '<td><div class="swatch">'+(ev.length?ev.map(function(e){
       return '<span class="sw" style="background:'+pc(e.k)+';flex:1"></span>';}).join("")
       :'<span class="none">없음</span>')+'</div></td>';}).join("")+'</tr>'+
   '<tr><th>뚜렷한 방법<em>범위</em></th><td class="none">—</td>'+SUBJ.map(function(x){
     var g=picked(S.d[x.id],"hi");
     return '<td>'+(g.length?'<b>'+esc(g.map(function(m){return m.n;}).join("<br>"))+'</b>':'<span class="none">—</span>')+'</td>';
   }).join("")+'</tr>'+
   '<tr><th>부분적인 방법<em>범위</em></th><td class="none">—</td>'+SUBJ.map(function(x){
     var g=picked(S.d[x.id],"mid");
     return '<td>'+(g.length?esc(g.map(function(m){return m.n;}).join("<br>")):'<span class="none">—</span>')+'</td>';
   }).join("")+'</tr>'+
   '</tbody></table></div>';}

function summary(){
  var L=["3강 지리 교육과정의 내용조직 원리 — 분석 결과"];
  function nm(arr,k){var o=arr.filter(function(x){return x.k===k;})[0];return o?o.n:"—";}
  SUBJ.forEach(function(x){
    var d=S.d[x.id],ev=evList(x.id);
    if(!ev.length&&!lvDone(d))return;
    L.push("");L.push("■ "+x.name);
    L.push("  뚜렷한 방법: "+(picked(d,"hi").map(function(m){return m.n;}).join(", ")||"—"));
    L.push("  부분적인 방법: "+(picked(d,"mid").map(function(m){return m.n;}).join(", ")||"—"));
    if(ev.length){L.push("  표시한 곳:");
      ev.forEach(function(e){L.push("   · ["+pn(e.k)+"] \u201C"+e.t+"\u201D ("+e.lb+")");});}});
  if(L.length===1)L.push("(아직 기록이 없음)");
  return L.join("\n");}

function paint(){
  $("#main").innerHTML=tabs()+(S.sid==="cross"?crossView():(S.sid==="elem"?elemView():subjView()))+foot();
  bind();window.scrollTo(0,0);}
function bind(){
  qq("[data-tab]").forEach(function(b){b.onclick=function(){S.sid=b.dataset.tab;save();paint();};});
  qq("[data-pen]").forEach(function(b){b.onclick=function(){S.d[S.sid].pen=b.dataset.pen;save();paint();};});
  qq("[data-mv]").forEach(function(b){
    b.addEventListener("touchstart",function(e){
      TS={k:b.dataset.mv,el:b,x:e.touches[0].clientX,y:e.touches[0].clientY,on:false};},{passive:true});
    b.addEventListener("touchmove",function(e){
      if(!TS||TS.k!==b.dataset.mv)return;
      var t=e.touches[0],dx=t.clientX-TS.x,dy=t.clientY-TS.y;
      if(!TS.on&&Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(!TS.on){TS.on=true;b.classList.add("dragging");}
      e.preventDefault();
      b.style.transform="translate("+dx+"px,"+dy+"px)";
      var z=dropUnder(t.clientX,t.clientY);
      qq("[data-drop]").forEach(function(o){o.classList.toggle("over",o===z);});},{passive:false});
    b.addEventListener("touchend",function(e){
      if(!TS||TS.k!==b.dataset.mv)return;
      var moved=TS.on;
      b.classList.remove("dragging");b.style.transform="";
      qq("[data-drop]").forEach(function(o){o.classList.remove("over");});
      if(moved){
        var t=e.changedTouches[0],z=dropUnder(t.clientX,t.clientY);
        if(z){var g=z.dataset.drop;S.d[S.sid].lv[TS.k]=(g==="pool"?"":g);save();paint();}
        TS=null;e.preventDefault();return;}
      TS=null;});
    b.onclick=function(){
      var k=b.dataset.mv,dd=S.d[S.sid],c=dd.lv[k]||"";
      dd.lv[k]=(c===""?"hi":(c==="hi"?"mid":""));
      save();paint();};
    b.ondragstart=function(e){DRAG=b.dataset.mv;
      try{e.dataTransfer.setData("text/plain",DRAG);e.dataTransfer.effectAllowed="move";}catch(x){}};
    b.ondragend=function(){DRAG=null;};});
  qq("[data-drop]").forEach(function(z){
    z.ondragover=function(e){e.preventDefault();z.classList.add("over");};
    z.ondragleave=function(){z.classList.remove("over");};
    z.ondrop=function(e){e.preventDefault();z.classList.remove("over");
      var k=DRAG||(e.dataTransfer&&e.dataTransfer.getData("text/plain"));
      if(!k)return;
      var t=z.dataset.drop;
      S.d[S.sid].lv[k]=(t==="pool"?"":t);
      DRAG=null;save();paint();};});
  qq("[data-pen2]").forEach(function(b){b.onclick=function(){
    S.x.pen=b.dataset.pen2;save();paint();};});
  qq(".hl").forEach(function(el){
    el.onmouseup=function(){setTimeout(hlSel,0);};
    el.ontouchend=function(){setTimeout(hlSel,250);};
    el.onclick=function(e){var sl=window.getSelection();if(sl&&!sl.isCollapsed)return;
      if(e.target.tagName==="MARK")unmark(el,+e.target.dataset.mi);};});
  if($("#anson"))$("#anson").onclick=function(){
    var id=S.sid;
    if(S.ans[id]){S.d[id].marks=S.mine[id]||{};S.ans[id]=false;}
    else{S.mine[id]=S.d[id].marks;S.d[id].marks=egFor(id);S.ans[id]=true;}
    save();paint();};
  if($("#ansoff"))$("#ansoff").onclick=function(){
    var id=S.sid;S.d[id].marks=S.mine[id]||{};S.ans[id]=false;save();paint();};
  if($("#keyb"))$("#keyb").onclick=function(){S.key=!S.key;save();paint();};
  if($("#print"))$("#print").onclick=function(){try{window.print();}catch(e){}};
  if($("#copy"))$("#copy").onclick=function(){copyText(summary());};
  if($("#clear"))$("#clear").onclick=function(){
    if(!window.confirm("이 기기에 저장된 내용을 모두 지웁니다. 계속할까요?"))return;
    try{localStorage.removeItem(KEY);}catch(e){}
    S=blank();save();paint();};
  $("#brand").onclick=function(){S.sid="elem";save();paint();};}
function flash(t){var e=$("#msg");if(e){e.textContent=t;setTimeout(function(){e.textContent="";},2600);}}
function copyText(t){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
    document.body.appendChild(a);a.select();
    try{document.execCommand("copy");flash("복사했습니다");}catch(x){flash("복사하지 못했습니다");}
    document.body.removeChild(a);}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){flash("복사했습니다");},fb);
  else fb();}

load();paint();
})();
</script>
</body>
</html>
