<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지리교과교육론 3강 · 지리 교육과정의 내용조직 원리</title>
<style>
/* ═══ 수업자료 공통 스타일 v1 — 매주 이 블록을 그대로 재사용 ═══ */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --mark:#F6E7B8;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:1120px; --hh:56px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:9px 30px;display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:3px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 10px;font-size:13px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:28px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{max-width:860px;margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.concept{background:var(--wash);border-radius:10px;padding:20px 24px;max-width:1000px;margin:6px 0 26px}
.concept h3{margin:0 0 10px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.concept dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:7px 16px;margin:0;font-size:15px}
.concept dt{font-weight:600}
.concept dd{margin:0;color:var(--mid)}
.concept p{margin:12px 0 0;font-size:14.5px;color:var(--mid)}
.concept p b{color:var(--ink)}

.step{margin-bottom:46px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:74ch}

.opt,.tag{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 12px;font-size:14px;color:var(--mid)}
.opt:hover,.tag:hover{border-color:var(--acc);color:var(--ink)}
.opt[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:disabled:hover{border-color:var(--line);color:var(--mid)}
textarea,.inp{width:100%;min-height:96px;border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;resize:vertical;background:none;line-height:1.7}
.inp{min-height:0;padding:7px 11px}
textarea:focus,.inp:focus{border-color:var(--acc);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;max-width:1000px;margin:14px 0}
.count{font-size:14px;color:var(--mid)}
.count b{color:var(--acc);font-weight:700}

.foot{margin-top:54px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;color:var(--mid);padding:0}
.foot button:hover{color:var(--ink)}
.foot .msg{color:var(--acc)}
/* ═══ 공통 스타일 v1 끝 ═══ */

.bar{position:sticky;top:var(--hh);z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2);
  padding:8px 0;margin:0 0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:5px 13px;font-size:14px;line-height:1.35;text-align:left;color:var(--ink)}
.tab small{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.tab:hover{border-color:var(--acc)}
.tab[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w);color:var(--acc);font-weight:600}
.tab[aria-pressed="true"] small{color:var(--acc)}
.hint{font-size:13px;color:var(--mid)}
.hint b{background:var(--mark);border-radius:4px;padding:1px 7px;font-weight:600;color:var(--ink);margin-right:7px}
.prog{margin-left:auto;font-size:13px;color:var(--soft)}

/* 교육과정 */
.doc{max-width:940px}
.unit{border-top:1px solid var(--line);padding:15px 0 9px}
.uh{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:baseline;margin-bottom:3px}
.uh .un{font-size:12.5px;color:var(--soft);font-weight:600}
.uh .ut{font-size:17.5px;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.std{display:grid;grid-template-columns:38px 132px minmax(0,1fr);padding:4px 0;font-size:15px;line-height:1.72}
.std .c{grid-column:2;font-size:12.5px;color:var(--mid);padding-top:3px;white-space:nowrap}
.std .t{grid-column:3}
.hl{cursor:text}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
.flash{animation:fl 2s ease}
@keyframes fl{0%,55%{background:var(--acc-w);box-shadow:0 0 0 4px var(--acc-w)}100%{background:transparent;box-shadow:none}}

/* 체크리스트 */
.scale{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:end;
  font-size:12px;color:var(--soft);padding-bottom:5px;border-bottom:1px solid var(--line);max-width:1060px}
.scale div{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.it{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:6px 18px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line2);max-width:1060px}
.it .q{font-size:15px;line-height:1.5}
.it .q i{font-style:normal;color:var(--soft);margin-right:8px;font-size:13px}
.it .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.lv{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:5px 4px;font-size:13.5px;color:var(--mid)}
.lv:hover{border-color:var(--acc);color:var(--ink)}
.lv[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.it.done .q{color:var(--mid)}
.it .rf{grid-column:1/-1;font-size:13.5px;line-height:1.65;color:var(--mid);padding-bottom:2px}
.it .rf b{font-weight:600;margin-right:7px}
.it .rf b.ok{color:var(--acc)} .it .rf b.no{color:var(--red)}
.it .go{background:none;border:none;color:var(--soft);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;margin-left:6px}
.it .go:hover{color:var(--acc)}

/* 자동 종합 */
:root{--ours:#D98A4E;--ours-w:#F7E6D6}
.rhead{display:grid;grid-template-columns:18px minmax(0,1fr) 300px;gap:14px;max-width:1040px;
  font-size:12px;color:var(--soft);padding-bottom:4px;border-bottom:1px solid var(--line);
  position:sticky;top:calc(var(--hh) + 46px);background:#fff;z-index:5}
.rhead .zn{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.rgrp{margin-bottom:14px;max-width:1040px}
.rgrp h4{margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.04em}
.rgrp h4 span{font-weight:400;color:var(--soft);letter-spacing:0;margin-left:8px}
.rl{display:grid;grid-template-columns:18px minmax(0,1fr) 300px;gap:14px;align-items:center;
  padding:6px 0 10px;border-bottom:1px solid var(--line2);font-size:15px}
.rl .mk{color:var(--ours);font-size:13px;text-align:center;align-self:start;padding-top:2px}
.rl .nm{line-height:1.4}
.rl.w2 .nm b{font-weight:700}
.rl .nm small{display:block;font-size:12.5px;color:var(--soft);line-height:1.45;margin-top:1px}
.rl .tr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.rl .zn{height:20px;background:var(--wash);border-radius:5px;position:relative}
.rl .zn.ours{background:var(--ours)}
.rl .zn.ref:after{content:'';position:absolute;left:16%;right:16%;bottom:-6px;height:3px;border-radius:2px;background:var(--acc)}
.rgrp.none .nm b{color:var(--soft)}
.rgrp.none .mk{color:var(--soft)}
.rleg{font-size:13px;color:var(--mid);margin:10px 0 0}
.rleg i{display:inline-block;vertical-align:middle;margin:0 6px 0 18px}
.rleg i:first-of-type{margin-left:0}
.rleg .o{width:20px;height:12px;border-radius:3px;background:var(--ours)}
.rleg .g{width:20px;height:3px;background:var(--acc)}
.vsent{font-size:16.5px;line-height:1.75;letter-spacing:-.01em;margin:16px 0 0;max-width:1000px;
  border-left:3px solid var(--acc);padding-left:16px}
.vsent b{font-weight:700}
.refS{font-size:15px;color:var(--mid);margin:14px 0 0;line-height:1.85;max-width:1000px}
.refS .lb{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.04em;margin-right:10px}
.refS b{color:var(--ink)}
.legend{font-size:13px;color:var(--soft);margin:8px 0 0}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:-2px;margin-right:5px}
.cau{margin-top:12px;font-size:14.5px;color:var(--mid);background:var(--wash);border-radius:8px;padding:12px 16px;line-height:1.7;max-width:1000px}
/* 대조표 */
.dt{width:100%;max-width:1000px;border-collapse:collapse;font-size:14.5px;margin:8px 0 0}
.dt th,.dt td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2)}
.dt thead th{border-bottom:1px solid var(--line);font-size:13px;color:var(--mid);font-weight:600}
.dt td.v{width:130px}
.dt .same{color:var(--acc)} .dt .diff{color:var(--red);font-weight:600}
.dt tr.d td{background:var(--wash)}
.hit{font-size:14px;color:var(--mid);margin:16px 0 0}
.hit b{color:var(--acc);font-weight:700}

.final{max-width:1000px;margin-top:8px}
.final label{display:block;font-size:14.5px;font-weight:600;margin-bottom:7px;line-height:1.6}
.final label span{display:block;font-weight:400;color:var(--mid);font-size:13.5px}

/* 비교 */
.ctw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ct{border-collapse:collapse;width:100%;min-width:780px;font-size:14.5px}
.ct th,.ct td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}
.ct thead th{border-bottom:2px solid var(--ink);font-size:15.5px}
.ct thead th button{background:none;border:none;padding:0;font:inherit;cursor:pointer;color:var(--ink)}
.ct thead th button:hover{color:var(--acc)}
.ct tbody th{width:120px;font-weight:600;color:var(--mid);font-size:14px}
.ct td{width:29%;line-height:1.65}
.ct .none{color:var(--soft)}
.ct ul{margin:0;padding:0;list-style:none}
.ct li{padding:1px 0}
.ct li b{font-weight:700}

@media(max-width:820px){
  .hin,main{padding-left:16px;padding-right:16px}
  .brand .c{display:none} h1{font-size:26px}
  .it,.scale{grid-template-columns:1fr}
  .std{grid-template-columns:0 minmax(0,1fr)} .std .c,.std .t{grid-column:2}
  .rhead,.rl{grid-template-columns:16px minmax(0,1fr) 132px;gap:8px}
  .rhead{font-size:11px}
  .prog{margin-left:0}
}
@media print{
  header,.foot,.bar,.lv,.go,#keyb{display:none!important}
  main{padding:0;max-width:none}
  mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
</head>
<body>

<header><div class="hin">
  <button class="brand" id="brand"><span class="c">지리교과교육론</span><span class="n">3강 지리 교육과정의 내용조직 원리</span></button>
</div></header>
<main id="main"></main>

<script>
var D={"ITEMS":[{"g":"reg","t":"대륙·국가·권역·지역 등이 내용 조직의 기본 단위가 된다.","r":{"mid":[2,"12개 대단원 중 9개가 대륙 또는 국내 권역입니다."],"wcg":[0,"네 대단원 모두 지역이 아니라 주제와 개념입니다."],"kgi":[0,"다섯 대단원 중 지역 이름이 들어간 것은 동아시아 하나입니다."]},"ev":"아시아의 국가와 주요 도시의 위치를 파악하고"},{"g":"reg","t":"한 지역의 자연환경과 인문환경을 여러 측면에서 종합적으로 다루며, 지역마다 비슷한 항목을 반복해서 살펴본다.","r":{"mid":[1,"대륙마다 자연환경을 지도로 표현한 뒤 인문 주제를 다루지만, 반복되는 것은 첫 성취기준뿐이고 나머지 주제는 지역마다 다릅니다."],"wcg":[0,"지역을 단위로 삼지 않습니다."],"kgi":[0,"지역을 단위로 삼지 않습니다."]}},{"g":"sys","t":"기후·인구·산업·도시와 같은 주제나 개념이 내용 조직의 기본 단위가 된다.","r":{"mid":[1,"12개 중 ‘우리나라의 자연환경과 인간 생활’ 하나가 주제 단위입니다."],"wcg":[2,"자연환경과 문화, 인구와 경제 공간, 환경 문제와 평화가 대단원입니다."],"kgi":[1,"생활·국토·환경은 주제이지만 지리의 개념 이름은 아닙니다."]}},{"g":"rt1","t":"특정 지역을 먼저 정하고, 그 지역을 이해하기 위해 여러 주제를 선택하여 다룬다.","r":{"mid":[2,"아시아는 종교·인구·산업, 유럽은 도시·통합과 분리, 아메리카는 인구 구성·초국적 기업으로 지역마다 다른 주제를 골랐습니다."],"wcg":[0,"지역별 대단원이 없습니다."],"kgi":[0,"지역별 대단원이 없습니다."]},"ev":"아시아의 인구 특징을 파악하고"},{"g":"rt2","t":"특정 주제를 먼저 정하고, 지역은 그 주제를 이해하기 위한 사례로 다룬다.","r":{"mid":[0,"초국적 기업(05-03)처럼 주제가 앞선 성취기준이 몇 개 있지만, 대단원은 모두 지역으로 묶여 있습니다."],"wcg":[2,"기후·종교·식량 같은 주제를 세우고 사례 지역은 정해 두지 않았습니다."],"kgi":[0,"지역을 사례로 견주기보다 지방소멸·탄소중립·재해 같은 문제 자체를 탐구하고 대안을 제안합니다."]},"ev":"초국적 기업의 아메리카 지역 내 입지와 해외 이전의 이유"},{"g":"iss","t":"현실의 쟁점이나 문제를 중심으로 내용을 구성하고, 원인을 분석하거나 해결 방안을 모색하고 판단하게 한다.","r":{"mid":[1,"쟁점은 극지방(06-03), 제주도(10-03)처럼 개별 성취기준에만 들어 있습니다."],"wcg":[1,"마지막 대단원이 환경 문제와 평화이고, 지형 갈등(02-02) 같은 성취기준이 있습니다."],"kgi":[2,"지방소멸, 에너지 쟁점, 동아시아 갈등이 대단원의 축이고 15개 중 10개가 제안·평가·토론으로 끝납니다."]},"ev":"탄소중립 달성을 위한 에너지 정책을 제안한다"},{"g":"comp","t":"지리적 탐구, 자료·정보 활용, 의사 결정, 의사소통처럼 학생이 실제로 수행할 수 있는 능력을 강조한다.","r":{"mid":[1,"우리 지역의 문제를 지리적으로 시각화하고(07-03) 마지막 대단원에서 실천합니다."],"wcg":[1,"지리정보기술의 활용 사례를 조사하고(01-03) 생활방식을 점검합니다(04-02)."],"kgi":[1,"첫 대단원 전체가 탐구 질문, 야외조사, 데이터 수집·분석·시각화입니다. 다만 나머지 대단원을 묶는 기준은 역량이 아니라 문제입니다. 세 과목 모두 2022 개정의 공통 틀에 따라 역량을 강조하므로, 이 문항으로는 과목이 갈리지 않습니다."]},"ev":"탐구 질문에 맞춰 데이터를 수집, 분석, 시각화한다"},{"g":"ex","t":"가까운 곳이나 좁은 공간에서 출발하여 지역·국가·세계로 공간 범위를 점차 넓혀 간다.","r":{"mid":[0,"반대 방향입니다."],"wcg":[0,"네 대단원의 공간 범위가 모두 세계입니다."],"kgi":[2,"탐구 방법 다음에 생활 → 국토 → 동아시아로 넓어집니다."]},"ev":"핫 플레이스의 특징, 생성과정, 정체성 이슈를 조사하고"},{"g":"na","t":"세계나 대륙 같은 넓은 공간에서 출발하여 국가·지역·생활공간으로 공간 범위를 점차 좁혀 간다.","r":{"mid":[1,"대륙에서 대한민국, 국내 권역으로 내려오지만 첫 대단원이 세계화 도입이고 마지막 대단원에서 다시 글로컬로 넓어집니다."],"wcg":[0,"범위가 바뀌지 않습니다."],"kgi":[0,"반대 방향입니다."]},"ev":"대한민국, 우리가 살아가는 곳"},{"g":"int","t":"여러 교과나 학문에 공통된 개념·주제·사회적 문제를 중심으로 내용을 통합하여 구성한다.","r":{"mid":[0,"사회 과목의 한 영역이지만 지리 영역은 따로 제시되고, 내용도 지리 주제로 짜여 있습니다."],"wcg":[0,"지리 과목 하나로 독립해 있습니다."],"kgi":[0,"지리 과목 하나로 독립해 있습니다."]}},{"g":"loc","t":"학생이 살아가는 지역의 특성이나 문제를 교육 내용이나 탐구 활동에 반영하게 한다.","r":{"mid":[1,"우리 지역의 문제를 선정해 시각화하고(07-03) 마지막 대단원에서 해결을 실천하지만(12-03), 대단원 자체가 학생이 사는 지역으로 짜인 것은 아닙니다."],"wcg":[0,"학생이 사는 지역을 다루는 성취기준이 없습니다."],"kgi":[1,"둘째 대단원 전체가 음식, 핫 플레이스, 공유서비스처럼 학생의 생활공간을 다루고, 우리 지역의 자연재해도 분석합니다(04-03)."]},"ev":"우리 지역의 문제를 선정하고 지리적으로 시각화한다"}],"GROUPS":[{"k":"reg","n":"지역적 방법","d":"지역을 기본 단위로 삼아 그 지역을 종합적으로 이해하게 하는 방식"},{"k":"sys","n":"계통적·주제적 방법","d":"주제와 개념을 기본 단위로 삼는 방식"},{"k":"rt1","n":"지역-주제 방법 · 지역 중심형","d":"지역을 먼저 정하고 그 지역에 맞는 주제를 고르는 방식"},{"k":"rt2","n":"지역-주제 방법 · 주제 중심형","d":"주제를 먼저 정하고 여러 지역을 사례로 삼는 방식"},{"k":"iss","n":"쟁점·문제 중심 방법","d":"현실의 쟁점과 문제를 중심에 놓는 방식"},{"k":"comp","n":"역량 중심 방법","d":"학생이 수행할 수 있는 능력을 앞세우는 방식"},{"k":"ex","n":"공간 범위의 계열화 · 확대형","d":"좁은 공간에서 넓은 공간으로 나아가는 배열"},{"k":"na","n":"공간 범위의 계열화 · 축소형","d":"넓은 공간에서 좁은 공간으로 좁혀 오는 배열"},{"k":"int","n":"통합교육과정","d":"여러 교과의 공통 주제로 내용을 묶는 방식"},{"k":"loc","n":"교육과정의 지역화","d":"학생이 사는 지역을 내용과 활동에 반영하는 방식"}],"READ":"<p>세 과목이 또렷하게 갈립니다. 중학교는 지역을 먼저 정하고 그 지역에 맞는 주제를 고르는 <b>지역 중심<\/b>, 세계시민과 지리는 주제를 먼저 정하고 지역을 사례로 삼는 <b>주제 중심<\/b>, 한국지리 탐구는 <b>문제와 탐구 중심<\/b>입니다. 4번과 5번이 정확히 반대로 나오는 두 과목을 나란히 보면 지역-주제 방법의 두 방향이 드러납니다.<\/p><p>7번 역량은 세 과목이 모두 일부입니다. 2022 개정은 모든 과목이 역량을 공통 틀로 삼기 때문에, 이 항목으로는 과목이 갈리지 않습니다. 10번 통합도 마찬가지입니다. 갈리지 않는 항목이 있다는 것도 분석의 결과입니다.<\/p><p>뚜렷한 원리가 하나로 나오지 않는 것은 자연스럽습니다. 지역-주제 방법 자체가 지역적 방법과 계통적 방법을 결합한 것이고, 공간 범위의 계열화는 묶는 기준이 아니라 배열에 관한 것이어서 다른 원리와 함께 나타납니다. 여덟 방법은 경쟁하는 정답이 아니라 한 교육과정 안에서 함께 쓰입니다.<\/p>","SUBJ":[{"id":"mid","name":"중학교 지리 영역","units":[{"n":1,"t":"세계화 시대, 지리의 힘","s":[{"c":"[9사(지리)01-01]","t":"세계 여러 지역의 특성을 해당 지역의 위치와 자연⋅인문환경을 고려하여 추론한다."},{"c":"[9사(지리)01-02]","t":"다양한 스케일에서 지역이 서로 연계되어 있음을 공간적 상호 작용의 사례를 통해 파악한다."},{"c":"[9사(지리)01-03]","t":"세계의 변화가 지역에 영향을 미치고 지역의 변화가 세계에 영향을 미치는 사례를 조사한다."}]},{"n":2,"t":"아시아","s":[{"c":"[9사(지리)02-01]","t":"다양한 지리 정보와 매체를 활용하여 아시아의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)02-02]","t":"종교와 관련된 아시아의 다양한 문화경관과 생활양식을 파악하고, 세계시민으로서 문화 다양성에 대한 이해와 수용성을 높인다."},{"c":"[9사(지리)02-03]","t":"아시아의 인구 특징을 파악하고 지역별 인구 구조 변화를 비교하여 지역 발전의 가능성 및 변화 모습을 추론한다."},{"c":"[9사(지리)02-04]","t":"글로컬 관점에서 아시아의 산업 특징과 변화를 파악하고, 이것이 우리나라 산업에 미치는 영향을 탐색한다."}]},{"n":3,"t":"유럽","s":[{"c":"[9사(지리)03-01]","t":"다양한 지리 정보와 매체를 활용하여 유럽의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)03-02]","t":"다양한 유형의 유럽 도시를 탐색하고, 기후위기에 대응하여 지속가능한 도시를 만들기 위한 노력을 조사한다."},{"c":"[9사(지리)03-03]","t":"지역 간 역학관계에 따른 유럽의 통합과 분리의 움직임이 유럽연합의 변화와 주민 생활에 미치는 영향을 탐색한다."}]},{"n":4,"t":"아프리카","s":[{"c":"[9사(지리)04-01]","t":"다양한 지리 정보와 매체를 활용하여 아프리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)04-02]","t":"아프리카의 지리적 특성에 기반한 다양한 문화와 지역 잠재력을 탐구하고, 아프리카에 대한 자신의 인식을 성찰한다."},{"c":"[9사(지리)04-03]","t":"지속가능한 발전을 위한 아프리카 각 지역의 노력과 세계 다양한 주체들의 협력 사례를 조사하고, 세계시민으로서 우리가 참여할 수 있는 방안을 모색한다."}]},{"n":5,"t":"아메리카","s":[{"c":"[9사(지리)05-01]","t":"다양한 지리 정보와 매체를 활용하여 아메리카의 국가와 주요 도시의 위치를 파악하고 자연환경의 특성을 지도로 표현한다."},{"c":"[9사(지리)05-02]","t":"다양한 민족(인종)으로 구성된 아메리카의 인구 특징을 살펴보고, 사례를 들어 아메리카의 문화 혼종성을 설명한다."},{"c":"[9사(지리)05-03]","t":"초국적 기업의 글로벌 생산체제에 대한 이해를 바탕으로, 초국적 기업의 아메리카 지역 내 입지와 해외 이전의 이유, 그에 따른 해당 지역의 변화를 분석한다."}]},{"n":6,"t":"오세아니아와 극지방","s":[{"c":"[9사(지리)06-01]","t":"다양한 지리 정보와 매체를 활용하여 오세아니아의 국가와 주요 도시의 위치, 자연환경의 특성을 파악하고, 자원 수출을 중심으로 세계 다른 지역과의 상호연계성을 탐색한다."},{"c":"[9사(지리)06-02]","t":"태평양 지역이 겪고 있는 환경 문제를 조사하고 그 해결에 참여할 수 있는 방안을 제안한다."},{"c":"[9사(지리)06-03]","t":"극지방의 지리적 중요성과 지역 개발을 둘러싼 다양한 이해관계를 살펴보고, 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다."}]},{"n":7,"t":"대한민국, 우리가 살아가는 곳","s":[{"c":"[9사(지리)07-01]","t":"우리 국토의 위치와 영역에 대한 이해를 바탕으로 세계 속에서 우리나라의 위치를 지정학, 지경학적 측면에서 탐색한다."},{"c":"[9사(지리)07-02]","t":"우리나라 행정구역과 주요 도시의 위치를 파악하고, 자신이 살고 있는 곳의 장소성과 장소감을 표현한다."},{"c":"[9사(지리)07-03]","t":"다양한 지리 정보와 매체를 활용하여 우리 지역의 문제를 선정하고 지리적으로 시각화한다."}]},{"n":8,"t":"우리나라의 자연환경과 인간 생활","s":[{"c":"[9사(지리)08-01]","t":"우리나라 주요 산지⋅하천⋅해안 지형의 위치와 특성을 파악하고, 매력적인 지형 경관을 탐색하여 우리 국토의 아름다움을 느낀다."},{"c":"[9사(지리)08-02]","t":"우리나라의 계절별, 지역별 기후 특성 및 변화 양상을 파악하고, 기후변화에 대한 지역별 대응 노력을 조사한다."},{"c":"[9사(지리)08-03]","t":"우리나라 자연재해의 지리적 특성과 피해 최소화를 위한 노력을 파악하고, 일상생활 속 다양한 상황에서 자연재해 발생 시 자신의 대처 방안을 탐색한다."}]},{"n":9,"t":"중부 지역","s":[{"c":"[9사(지리)09-01]","t":"다양한 지리 정보와 매체를 활용하여 중부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다."},{"c":"[9사(지리)09-02]","t":"수도권의 공간 구조를 파악하고, 인구⋅문화⋅경제적 측면을 중심으로 수도권의 변화 양상을 탐색한다."},{"c":"[9사(지리)09-03]","t":"강원⋅충청 지역의 변화를 교통 발달과 수도권과의 관계를 중심으로 파악하고, 강원⋅충청 지역의 산업 변화와 지역경제 활성화를 위한 노력을 조사한다."},{"c":"[9사(지리)09-04]","t":"수도권과 비수도권 간의 지역 불균형 실태를 지도로 표현하고, 지역 불균형을 완화하기 위한 방안들을 제안한다."}]},{"n":10,"t":"남부 지역","s":[{"c":"[9사(지리)10-01]","t":"다양한 지리 정보와 매체를 활용하여 남부 지역의 지리적 특성 및 매력적인 여행 장소들을 탐색한다."},{"c":"[9사(지리)10-02]","t":"글로벌 경제와 우리나라 산업에서 영⋅호남 공업 지역의 위상을 파악하고, 영⋅호남 지역의 산업 변화와 당면 과제를 조사한다."},{"c":"[9사(지리)10-03]","t":"제주도의 지역 변화와 이를 둘러싼 다양한 가치를 살펴보고 이에 대한 자신과 상대방의 의견을 비판적으로 검토한다."}]},{"n":11,"t":"북부 지역","s":[{"c":"[9사(지리)11-01]","t":"다양한 지리 정보와 매체를 활용하여 북한의 자연환경과 인문환경의 특징을 탐색한다."},{"c":"[9사(지리)11-02]","t":"분단이 우리의 일상생활에 미친 영향을 살펴보고, 분리와 연결의 공간으로서 접경지역의 다양한 모습을 세계 여러 지역의 사례를 통해 비교한다."},{"c":"[9사(지리)11-03]","t":"세계시민의 관점에서 한반도 평화의 중요성을 논의하고, 한반도 평화와 통일 환경 속에서 우리의 삶과 국토의 미래를 구상한다."}]},{"n":12,"t":"지속가능한 세계와 글로컬 시민","s":[{"c":"[9사(지리)12-01]","t":"우리나라 주요 식량 자원 및 에너지 자원의 소비 현황과 수입국 현황을 분석하여 이와 관련된 문제를 파악하고, 자원의 지속가능한 확보 방안을 모색한다."},{"c":"[9사(지리)12-02]","t":"지역 개발과 환경 보존을 둘러싼 글로컬 환경 이슈에 관심을 가지고 자신의 웰빙 및 공동체의 지속가능한 발전을 위해 참여하고 실천한다."},{"c":"[9사(지리)12-03]","t":"더 나은 지역을 만들어 가는 사람들의 노력을 국내외 사례를 통해 살펴보고, 자신이 사는 지역의 문제를 해결하기 위한 방안을 모색하고 이를 실천한다."}]}],"key":{"cau":"대단원 이름만 보면 지역적 방법입니다. 그러나 한 지역을 고르게 다루지 않고, 공통의 틀 위에 지역마다 다른 주제를 두세 개씩 골라 얹었습니다. 1번과 2번이 갈리는 지점이 바로 지역적 방법과 지역-주제 방법의 차이입니다. 배열에서는 초등학교와 반대로 세계에서 우리나라로 좁혀 옵니다. 지평확대법의 방향을 뒤집은 것입니다."}},{"id":"wcg","name":"세계시민과 지리","units":[{"n":1,"t":"세계시민, 세계화와 지역 이해","s":[{"c":"[12세지01-01]","t":"세계화의 의미를 지리적 스케일에 따라 이해하고, 세계화와 지역화의 관계 속에서 세계시민의 역할을 탐색한다."},{"c":"[12세지01-02]","t":"지역 통합과 분리 현상의 사례와 주요 원인을 탐구하고, 이를 바탕으로 지역 변화의 역동성을 파악한다."},{"c":"[12세지01-03]","t":"지리정보기술이 세계시민의 삶과 연계되는 다양한 모습을 이해하고, 지리적 문제 해결 및 의사 결정에 활용되는 사례를 조사한다."}],"el":["세계화와 세계시민","지역 변화의 역동성","지리 정보와 지리정보기술의 활용"]},{"n":2,"t":"모자이크 세계, 세계의 다양한 자연환경과 문화","s":[{"c":"[12세지02-01]","t":"세계의 다양한 기후에 대한 이해를 바탕으로 기후를 활용하거나 극복한 사례를 찾아 인간 생활과의 관계를 탐색한다."},{"c":"[12세지02-02]","t":"세계 주요 지형과 인간 생활의 상관성을 파악하고, 지형의 개발과 보존을 둘러싼 갈등 사례를 통해 지속가능한 이용 방안을 토론한다."},{"c":"[12세지02-03]","t":"세계 주요 종교의 특징 및 종교 경관의 의미를 이해하고, 각 종교가 인간 생활에 미치는 영향을 탐구한다."},{"c":"[12세지02-04]","t":"세계의 다양한 음식과 축제를 지리적으로 설명하고, 문화 다양성을 보존하기 위한 방법을 모색한다."}],"el":["다양한 기후와 인간 생활","지형과 인간 생활 및 지형의 지속가능한 이용","세계 주요 종교 경관","다양한 음식과 축제의 지리적 의미"]},{"n":3,"t":"네트워크 세계, 세계의 인구와 경제 공간","s":[{"c":"[12세지03-01]","t":"세계 인구 분포 및 구조를 통해 세계 인구 문제를 이해하고, 국제적 이주가 인구 유출 지역과 유입 지역에 미치는 영향을 탐구한다."},{"c":"[12세지03-02]","t":"주요 식량 자원의 생산과 소비 양상을 통해 세계 식량 문제가 발생하는 구조적 원인을 파악하고, 식량의 안정적인 생산과 공급을 위한 각국의 대응 전략을 비교⋅분석한다."},{"c":"[12세지03-03]","t":"초국적 기업을 중심으로 한 글로벌 경제 체제의 형성 과정을 탐색하고, 글로벌 경제에서의 공간적 불균등을 해소하기 위한 국제적 협력과 개인적 실천 방안에 대해 조사한다."}],"el":["인구 분포 및 구조, 국제적 이주의 영향","식량 자원의 생산과 소비","글로벌 경제와 공간적 불균등"]},{"n":4,"t":"지속가능한 세계, 세계의 환경 문제와 평화","s":[{"c":"[12세지04-01]","t":"세계 주요 에너지 자원의 생산과 소비 현황을 조사하고, 다양한 친환경 에너지원의 특징에 대한 이해를 바탕으로 지속가능한 에너지 생산 방안을 제시한다."},{"c":"[12세지04-02]","t":"세계 주요 환경 문제의 유형과 실태를 설명하고, 생태전환적 삶에 비추어 현재의 생활방식을 비판적으로 점검한다."},{"c":"[12세지04-03]","t":"다양한 지정학적 분쟁을 국제 정세의 변화와 관련지어 조사하고, 세계 평화와 정의에 기여할 수 있는 방안을 찾아 실천한다."}],"el":["세계의 에너지 문제와 대안","세계의 환경 문제와 생태전환적 삶","지정학적 분쟁과 평화를 위한 노력"]}],"key":{"cau":"계통적·주제적 방법과 지역-주제 주제 중심형이 함께 뚜렷하게 나오는 것이 이 과목의 특징입니다. 둘은 배타적이지 않습니다. 주제로 대단원을 세우고(계통), var ITEMS=D.ITEMS,G=D.GROUPS,SUBJ=D.SUBJ,SID={};SUBJ.forEach(function(s){SID[s.id]=s;});
var GN={};G.forEach(function(g){GN[g.k]=g;});
var LV=[['2','뚜렷하게 나타난다'],['1','일부 나타난다'],['0','거의 나타나지 않는다']];
var BANDS=[{k:'hi',h:'뚜렷하게 나타나는 원리',mk:'●'},{k:'mid',h:'보조적으로 나타나는 원리',mk:'○'},{k:'lo',h:'거의 나타나지 않는 원리',mk:'·'}];

function val(sid,k,pick){
  var vs=[];
  ITEMS.forEach(function(it,i){if(it.g!==k)return;
    var a=pick?pick[i]:it.r[sid][0];if(a==null||a==='')return;vs.push(+a);});
  if(!vs.length)return null;
  return vs.reduce(function(a,b){return a+b;},0)/vs.length;}
function bandOf(v){return v>=1.5?'hi':(v>=0.75?'mid':'lo');}
function grouped(sid,pick){
  var o={hi:[],mid:[],lo:[]};
  G.forEach(function(g){var v=val(sid,g.k,pick);if(v==null)return;o[bandOf(v)].push({g:g,v:v});});
  ['hi','mid','lo'].forEach(function(b){o[b].sort(function(x,y){return y.v-x.v;});});
  return o;}

/* ═════ 상태 ═════ */
function bl(){return {marks:{},a:{}};}
function blank(){var d={};SUBJ.forEach(function(s){d[s.id]=bl();});return {sid:'mid',d:d,key:false};}
var S=blank(),dirty=false;
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nAns(id){var a=S.d[id].a,n=0;ITEMS.forEach(function(x,i){if(a[i]!=null&&a[i]!=='')n++;});return n;}
function allAns(id){return nAns(id)===ITEMS.length;}

function jong(w){var c=w.replace(/[^가-힣]+$/,'').slice(-1);return c?(c.charCodeAt(0)-0xAC00)%28:0;}
function ga(w){return jong(w)?'이':'가';}
function andList(ns){return ns.length===2?ns[0]+(jong(ns[0])?'과':'와')+' '+ns[1]:ns.join(', ');}
function sentence(sid,pick){
  var o=grouped(sid,pick),nm=function(x){return x.g.n;};
  if(!o.hi.length&&!o.mid.length)return '';
  var L=[];
  if(o.hi.length){var h=o.hi.map(nm);L.push('<b>'+andList(h)+'</b>'+ga(h[h.length-1])+' 뚜렷하게 나타납니다');}
  else L.push('뚜렷하게 나타나는 원리는 없습니다');
  if(o.mid.length){var m=o.mid.map(nm);L.push('여기에 '+andList(m)+ga(m[m.length-1])+' 보조적으로 더해집니다');}
  return '종합하면, 이 교육과정은 '+L.join('. ')+'.';}

/* ═════ 형광펜 ═════ */
var DOC={},DL={};
SUBJ.forEach(function(s){var L=DL[s.id]=[];
  s.units.forEach(function(u,ui){
    DOC[s.id+'.u'+ui]={t:u.t,lb:'('+u.n+') 대단원',sid:s.id};L.push(s.id+'.u'+ui);
    u.s.forEach(function(x,si){var id=s.id+'.u'+ui+'s'+si;DOC[id]={t:x.t,lb:x.c,sid:s.id};L.push(id);});});});
function marksOf(id){return (S.d[DOC[id].sid].marks[id]||[]).slice().sort(function(a,b){return a.s-b.s;});}
function H(id){var t=DOC[id].t,p=0,out='';
  marksOf(id).forEach(function(m,i){out+=esc(t.slice(p,m.s))+'<mark data-mi="'+i+'">'+esc(t.slice(m.s,m.e))+'</mark>';p=m.e;});
  return '<span class="hl" data-doc="'+id+'">'+out+esc(t.slice(p))+'</span>';}
function hlSel(){
  var sl=window.getSelection();if(!sl||sl.isCollapsed||!sl.rangeCount)return;
  var r=sl.getRangeAt(0);
  function host(n){n=n.nodeType===3?n.parentNode:n;return n&&n.closest?n.closest('.hl'):null;}
  var a=host(r.startContainer);if(!a||a!==host(r.endContainer))return;
  var id=a.dataset.doc,t=DOC[id].t,pre=document.createRange();
  pre.selectNodeContents(a);pre.setEnd(r.startContainer,r.startOffset);
  var s=pre.toString().length,e=s+r.toString().length;
  while(s<e&&/\s/.test(t[s]))s++;while(e>s&&/\s/.test(t[e-1]))e--;
  if(e-s<2)return;
  var keep=marksOf(id).filter(function(m){if(m.e>=s&&m.s<=e){s=Math.min(s,m.s);e=Math.max(e,m.e);return false;}return true;});
  keep.push({s:s,e:e});S.d[DOC[id].sid].marks[id]=keep;
  sl.removeAllRanges();dirty=true;paint();}
function unmark(el,mi){var id=el.dataset.doc,arr=marksOf(id);if(!arr[mi])return;arr.splice(mi,1);S.d[DOC[id].sid].marks[id]=arr;dirty=true;paint();}
function evList(sid){var out=[];DL[sid].forEach(function(id){marksOf(id).forEach(function(m){out.push({t:DOC[id].t.slice(m.s,m.e),lb:DOC[id].lb});});});return out;}

function docView(s){
  return '<div class="doc">'+s.units.map(function(u,ui){
    return '<div class="unit"><div class="uh"><span class="un">('+u.n+')</span><span class="ut">'+H(s.id+'.u'+ui)+'</span></div>'+
      u.s.map(function(x,si){return '<div class="std"><span class="c">'+x.c+'</span><span class="t">'+H(s.id+'.u'+ui+'s'+si)+'</span></div>';}).join('')+
      '</div>';}).join('')+'</div>';}

function checklist(s){
  var d=S.d[s.id],open=S.key&&allAns(s.id);
  return '<div class="scale"><span></span><div>'+LV.map(function(l){return '<span>'+l[1].replace('나타난다','').replace('나타나지 않는다','없다')+'</span>';}).join('')+'</div></div>'+
   ITEMS.map(function(it,i){var v=d.a[i],ref=it.r[s.id];
     return '<div class="it'+(v!=null&&v!==''?' done':'')+'"><div class="q"><i>'+(i+1)+'</i>'+esc(it.t)+'</div>'+
      '<div class="opts">'+LV.map(function(l){
        return '<button class="lv" data-a="'+i+'" data-v="'+l[0]+'" aria-pressed="'+(v===l[0])+'">'+l[1].replace('나타난다','').replace('나타나지 않는다','없다')+'</button>';}).join('')+'</div>'+
      (open?'<div class="rf"><b class="'+(v===ref[0]+''?'ok':'no')+'">참고 '+LV.filter(function(l){return l[0]===ref[0]+'';})[0][1].replace('나타난다','').replace('나타나지 않는다','없다')+'</b>'+
        esc(ref[1])+(it.ev?'<button class="go" data-goev="'+s.id+'|'+i+'">위치 보기</button>':'')+'</div>':'')+
      '</div>';}).join('');}

var ZI={hi:0,mid:1,lo:2};
function dots(v,rv,open){
  var a=ZI[bandOf(v)],b=(open&&rv!=null)?ZI[bandOf(rv)]:-1,h='';
  for(var i=0;i<3;i++)h+='<span class="zn'+(i===a?' ours':'')+(i===b?' ref':'')+'"></span>';
  return h;}
function result(s){
  var d=S.d[s.id],o=grouped(s.id,d.a),open=S.key;
  var h='<div class="rhead"><span></span><span></span><span class="zn"><span>뚜렷</span><span>보조</span><span>거의 없음</span></span></div>'+
   BANDS.map(function(b){var rows=o[b.k];
    return '<div class="rgrp'+(b.k==='lo'?' none':'')+'"><h4>'+b.h+(rows.length?'':' <span>없음</span>')+'</h4>'+
      rows.map(function(x){var rv=open?val(s.id,x.g.k):null;
        return '<div class="rl'+(b.k==='hi'?' w2':'')+'"><span class="mk">'+b.mk+'</span>'+
          '<span class="nm"><b>'+x.g.n+'</b><small>'+x.g.d+'</small></span>'+
          '<span class="tr">'+dots(x.v,rv,open)+'</span></div>';}).join('')+
      '</div>';}).join('')+
   '<p class="rleg"><i class="o"></i>내가 체크한 값'+(open?'<i class="g"></i>참고 값':'')+'</p>';
  h+='<p class="vsent">'+sentence(s.id,d.a)+'</p>';
  if(open)h+='<div class="cau">'+s.key.cau+'</div>';
  return h;}

function view(){
  var s=SID[S.sid],anyDone=SUBJ.some(function(x){return allAns(x.id);});
  var h='<p class="stage">지리교과교육론 3강</p><h1>지리 교육과정의 내용조직 원리</h1>'+
  '<p class="lead">중심 질문 — <b>2022 개정 지리 교육과정은 무엇을 중심으로 내용을 묶고, 어떤 순서로 배열했는가?</b><br>'+
  '대단원과 성취기준을 읽고 '+ITEMS.length+'개 특징이 어느 정도 나타나는지 체크합니다.</p>';

  h+='<div class="bar"><div class="tabs">'+SUBJ.map(function(x){
      return '<button class="tab" data-tab="'+x.id+'" aria-pressed="'+(S.sid===x.id)+'">'+x.name+
        '<small>'+nAns(x.id)+'/'+ITEMS.length+(allAns(x.id)?' · 분석 완료':'')+'</small></button>';}).join('')+'</div>'+
    '<span class="hint"><b>형광펜</b>근거가 될 어구를 긁어 표시 · 표시를 누르면 지워짐</span>'+
    '<span class="prog">'+evList(s.id).length+'곳 표시</span></div>';

  h+='<div class="step"><h3><b>1</b>'+s.name+'의 대단원과 성취기준을 읽는다</h3>'+docView(s)+'</div>';

  h+='<div class="step"><h3><b>2</b>교육과정에서 다음 특징이 어느 정도 나타나는가</h3>'+checklist(s)+'</div>';

  h+='<div class="step"><h3><b>3</b>체크한 결과를 종합한다</h3>';
  if(!allAns(s.id))h+='<p class="d">'+(ITEMS.length-nAns(s.id))+'개 문항이 남았습니다. 모두 체크하면 결과가 열립니다.</p>';
  else h+=result(s)+'<div style="margin-top:16px"><button class="opt" id="keyb" aria-pressed="'+S.key+'">'+
    (S.key?'비교 닫기':'참고 결과와 비교해 보기')+'</button></div>';
  h+='</div>';

  var done=SUBJ.filter(function(x){return allAns(x.id);});
  h+='<div class="step"><h3><b>4</b>세 과목을 맞대어 본다</h3>';
  if(done.length<2)h+='<p class="d">두 과목 이상 체크하면 표가 채워집니다.</p>';
  else{
    h+='<div class="ctw"><table class="ct"><thead><tr><th></th>'+SUBJ.map(function(x){
      return '<th><button data-tab="'+x.id+'">'+x.name+'</button></th>';}).join('')+'</tr></thead><tbody>'+
     BANDS.slice(0,2).map(function(b){
       return '<tr><th>'+b.h+'</th>'+SUBJ.map(function(x){
         if(!allAns(x.id))return '<td class="none">체크하는 중</td>';
         var rows=grouped(x.id,S.d[x.id].a)[b.k];
         return '<td>'+(rows.length?'<ul>'+rows.map(function(r){return '<li>'+b.mk+' '+(b.k==='hi'?'<b>'+r.g.n+'</b>':r.g.n)+'</li>';}).join('')+'</ul>':'<span class="none">없음</span>')+'</td>';}).join('')+'</tr>';}).join('')+
     '</tbody></table></div>'+(S.key?'<div class="cau">'+D.READ+'</div>':'');}
  h+='</div>';

  h+='<div class="foot"><button id="copy">패들렛용 정리 복사</button><button id="print">인쇄 · PDF</button>'+
   '<button id="save">작업 저장</button><button id="load">불러오기</button>'+
   '<span class="msg" id="msg"></span><input type="file" id="file" accept=".json" hidden></div>';
  return h;}

/* ═════ 정리문 ═════ */
function strip(h){return h.replace(/<[^>]+>/g,'');}
function summary(){
  var L=['3강 지리 교육과정의 내용조직 원리 — 분석 결과'];
  SUBJ.forEach(function(x){var d=S.d[x.id],ev=evList(x.id);
    if(!nAns(x.id)&&!ev.length)return;
    L.push('');L.push('■ '+x.name+'  (문항 '+nAns(x.id)+'/'+ITEMS.length+')');
    if(allAns(x.id)){var o=grouped(x.id,d.a);
      BANDS.forEach(function(b){L.push('  '+b.h+': '+(o[b.k].length?o[b.k].map(function(r){return r.g.n;}).join(', '):'없음'));});
      L.push('  '+strip(sentence(x.id,d.a)));}
    if(ev.length){L.push('  근거:');ev.forEach(function(e){L.push('   · “'+e.t+'” ('+e.lb+')');});}});
  if(L.length===1)L.push('(아직 기록이 없음)');
  return L.join('\n');}

/* ═════ 바인딩 ═════ */
function setHH(){document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');}
function paint(){$('#main').innerHTML=view();bind();setHH();}
$('#brand').onclick=function(){window.scrollTo(0,0);};
function goEvidence(sid,i){
  var qq=ITEMS[i].ev;if(!qq)return;
  var id=null;DL[sid].some(function(x){if(DOC[x].t.indexOf(qq)>=0){id=x;return true;}});
  if(S.sid!==sid){S.sid=sid;paint();}
  if(!id)return;
  var el=document.querySelector('[data-doc="'+id+'"]');if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
function bind(){
  var m=$('#main'),q=function(s){return Array.prototype.slice.call(m.querySelectorAll(s));};
  q('[data-tab]').forEach(function(b){b.onclick=function(){S.sid=b.dataset.tab;paint();
    if(b.closest('.ct'))window.scrollTo(0,0);};});
  q('[data-a]').forEach(function(b){b.onclick=function(){var d=S.d[S.sid],i=b.dataset.a;
    d.a[i]=d.a[i]===b.dataset.v?'':b.dataset.v;dirty=true;paint();};});
  if($('#keyb'))$('#keyb').onclick=function(){S.key=!S.key;paint();};
  q('[data-goev]').forEach(function(b){b.onclick=function(){var p=b.dataset.goev.split('|');goEvidence(p[0],+p[1]);};});
  q('.hl').forEach(function(el){
    el.onmouseup=function(){setTimeout(hlSel,0);};
    el.ontouchend=function(){setTimeout(hlSel,250);};
    el.onclick=function(e){var sl=window.getSelection();if(sl&&!sl.isCollapsed)return;
      if(e.target.tagName==='MARK')unmark(el,+e.target.dataset.mi);};});
  $('#copy').onclick=function(){copyText(summary());};
  $('#print').onclick=function(){window.print();};
  $('#save').onclick=save;$('#load').onclick=function(){$('#file').click();};
  $('#file').onchange=load;}
function flash(t){var e=$('#msg');if(e){e.textContent=t;setTimeout(function(){e.textContent='';},2800);}}
function copyText(t){
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();
    try{document.execCommand('copy');flash('복사했습니다');}catch(x){flash('복사하지 못했습니다');}document.body.removeChild(a);}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){flash('복사했습니다');},fb);else fb();}
function stamp(){var d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function save(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='3강_내용조직_'+stamp()+'.json';a.click();
  URL.revokeObjectURL(a.href);dirty=false;flash('저장했습니다');}
function load(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var x=JSON.parse(r.result),b=blank();
    if(!x.d||!x.d.mid)throw 0;
    S=Object.assign(b,x);
    SUBJ.forEach(function(s){S.d[s.id]=Object.assign(bl(),S.d[s.id]||{});
      S.d[s.id].a=S.d[s.id].a||{};S.d[s.id].marks=S.d[s.id].marks||{};});
    if(!SID[S.sid])S.sid='mid';
    dirty=false;paint();flash('불러왔습니다');
  }catch(z){flash('이 화면에서 저장한 파일인지 확인하십시오');}e.target.value='';};
  r.readAsText(f);}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('resize',setHH);
paint();
</script>
</body>
