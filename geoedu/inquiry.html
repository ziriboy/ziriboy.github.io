<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지리교과교육론 · 탐구학습과 PBL</title>
<style>
/* ═══ 수업자료 공통 스타일 v2 — 매주 이 블록을 그대로 재사용 ═══
   폭: --w 하나로 정한다. 980px = 본문 920px + 좌우 여백 30px씩.
       아이패드 가로(1,024px 이상)에 맞춘 최대 폭이며, 더 좁은 화면에서는 화면에 맞춰 줄어든다.
       본문 블록에는 따로 max-width를 주지 않는다 — 머리글과 본문의 양 끝이 같은 선에 온다.
   좁은 화면: 640px 이하(휴대폰)에서만 세로로 쌓는다. 아이패드는 세로로 들어도 같은 배치. */
html{overflow-y:scroll}
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --mark:#F6E7B8;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:980px; --hh:56px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:9px 30px;display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:3px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 10px;font-size:13px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:28px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.concept{background:var(--wash);border-radius:10px;padding:20px 24px;margin:6px 0 26px}
.concept h3{margin:0 0 10px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.concept dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:7px 16px;margin:0;font-size:15px}
.concept dt{font-weight:600}
.concept dd{margin:0;color:var(--mid)}
.concept p{margin:12px 0 0;font-size:14.5px;color:var(--mid)}
.concept p b{color:var(--ink)}

.step{margin-bottom:46px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:74ch}

.opt,.tag{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 12px;font-size:14px;color:var(--mid)}
.opt:hover,.tag:hover{border-color:var(--acc);color:var(--ink)}
.opt[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:disabled:hover{border-color:var(--line);color:var(--mid)}
textarea,.inp{width:100%;min-height:96px;border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;resize:vertical;background:none;line-height:1.7}
.inp{min-height:0;padding:7px 11px}
textarea:focus,.inp:focus{border-color:var(--acc);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;margin:14px 0}
.count{font-size:14px;color:var(--mid)}
.count b{color:var(--acc);font-weight:700}

.foot{margin-top:54px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;color:var(--mid);padding:0}
.foot button:hover{color:var(--ink)}
.foot .msg{color:var(--acc)}
@media(max-width:640px){
  .hin,main{padding-left:16px;padding-right:16px}
  .brand .c{display:none} h1{font-size:26px} .switch .lb{display:none}
  .concept dl{grid-template-columns:1fr}
  .menu{grid-template-columns:1fr}
}
/* ═══ 공통 스타일 v2 끝 ═══ */


/* 판단 버튼 (내 판단 = 채움, 참고 판단 = 테두리) */
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{background:none;border:1px solid var(--line);border-radius:14px;cursor:pointer;
  padding:0 12px;font-size:13.5px;color:var(--mid);line-height:1.9}
.seg button:hover{border-color:var(--acc);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.seg button.ref{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--mid);align-items:center;margin:0 0 12px}
.legend i{display:inline-block;width:22px;height:14px;border-radius:8px;vertical-align:-2px;margin-right:7px;box-sizing:border-box}
.legend .a{background:var(--acc)}
.legend .r{border:1px solid var(--line);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}

.grp{border:1px solid var(--line);border-radius:12px;padding:24px 28px 20px;margin:0 0 24px}
.plain{margin:0 0 28px}
.plain>p{margin:0 0 16px;font-size:15.5px;line-height:1.85}
.plain>p b{font-weight:700}
.grp .gt{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.grp>p{margin:0 0 16px;font-size:15.5px;line-height:1.85}
.grp>p b{font-weight:700}
.grp .flow{margin-bottom:2px}
.grp .items{border-top:1px solid var(--line)}
.gt2{margin-top:30px!important}
.model{margin:34px 0 0;padding-top:22px;border-top:2px solid var(--ink)}
.model>h2{margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.model>p{margin:0 0 16px;font-size:15.5px;line-height:1.85}
.model>p b{font-weight:700}
.ah{margin:44px 0 0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.st{padding:16px 0 4px;border-top:1px solid var(--line2)}
.grp .st:first-of-type{border-top:none;padding-top:0}
.st:last-of-type{padding-bottom:0}
.st>h2{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.st .def{margin-bottom:6px}
.st .proto{margin-bottom:6px}
.st .items{border-top:none}
.band{display:flex;align-items:stretch;gap:0;margin:4px 0 14px;font-size:14px}
.band .bc{flex:1;padding:8px 10px;border-top:3px solid var(--acc)}
.band .bc:nth-of-type(2){border-top-color:#5E8F86}
.band .bc:nth-of-type(3){border-top-color:#A9C3BD}
.band .bc.out{border-top-color:var(--line)}
.band .bc span{display:block;font-size:12px;color:var(--soft)}
.band .bc b{font-weight:600;line-height:1.5}
.band i{width:8px}
.band i.edge{width:2px;background:var(--ink);margin:0 10px}
.sum{font-size:15.5px;line-height:1.85;margin:0 0 8px}
.sum b{font-weight:700}
.wait{font-size:14px;color:var(--soft);margin:0 0 8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 16px}
.pc{border-top:1px solid var(--line);padding:12px 0 0}
.pc>b{display:block;font-size:16px;font-weight:700;margin-bottom:2px}
.pc>p{margin:0 0 10px;font-size:14.5px;line-height:1.7;color:var(--mid)}
.pc .rv{margin-top:10px}
.gs2{margin:24px 0 8px;font-size:16px;font-weight:700}
.std{margin-top:30px}
.pr2{margin:0 0 12px;font-size:15px;line-height:1.75;color:var(--mid)}
.pr2 b{color:var(--ink)}
.cmp2 thead td{font-size:13px;color:var(--acc);font-weight:700}
.cmp2{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:15px}
.cmp2 th,.cmp2 td{text-align:left;vertical-align:top;padding:9px 12px 9px 0;border-bottom:1px solid var(--line2);line-height:1.65}
.cmp2 tbody th{font-weight:600;color:var(--ink)}
.cmp2 th{width:90px}
.cmp2 td{width:42%}
.std>h2{margin:0 0 10px;font-size:19px;font-weight:700}
.sq{border-left:3px solid var(--acc);padding:4px 0 4px 16px;font-size:16px!important}
.it .t u{text-decoration:none;background:var(--mark);padding:0 2px;border-radius:2px}
.ph{display:flex;gap:12px;margin:0 0 14px}
.ph figure{margin:0;min-width:0}
.ph img{display:block;width:100%;height:auto;border-radius:6px}
.ph figcaption{font-size:12.5px;color:var(--soft);margin-top:5px}
.qt th{width:90px}
.cmp3.bt th{width:104px}
.tint{background:var(--wash);border-radius:12px;padding:22px 28px 16px;margin:0 0 24px}
.tint>p{margin:0 0 14px;font-size:15.5px;line-height:1.85}
.tint .pr2{margin:10px 0 0}
.tint .cmp3 th,.tint .cmp3 td{border-bottom-color:var(--line)}
.items.tight .it .t{font-size:15px}
.cp{margin:0;font-size:15px;line-height:1.75}
.ah2{margin:8px 0 10px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.cmp3{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:15px;table-layout:fixed}
.cmp3 th,.cmp3 td{text-align:left;vertical-align:top;padding:9px 12px 9px 0;border-bottom:1px solid var(--line2);line-height:1.65}
.cmp3 thead td{font-size:13px;color:var(--acc);font-weight:700}
.cmp3 th{width:80px;font-weight:600}
.pr{font-size:15px!important;line-height:1.75!important;background:var(--wash);border-radius:8px;padding:10px 14px;margin:0 0 14px!important}
.pr b{margin-right:8px;color:var(--acc)}
.th{margin:0 0 34px}
.th>h2,.ap>h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.th>p{margin:0 0 16px;font-size:15.5px;line-height:1.85}
.th>p b{font-weight:700}
.ex{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0 10px;margin:0 0 18px}
.ex+.ex{border-top:none;margin-top:-18px}
.ex h3{margin:0 0 8px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.ex dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 16px;margin:0;font-size:15px;line-height:1.7}
.ex dt{font-weight:600}
.ex dd{margin:0;color:var(--mid)}
.sh{margin:0 0 6px;font-size:13px;color:var(--soft);font-weight:600;letter-spacing:.04em}
.flow{margin:0 0 18px;display:flex;flex-wrap:wrap;gap:6px 0;font-size:14.5px}
.flow span{display:flex;align-items:center}
.flow span+span::before{content:"→";margin:0 10px;color:var(--soft)}
.flow b{font-weight:700;margin-right:5px;color:var(--acc)}
.stl{font-size:12.5px;color:var(--acc);font-weight:700;letter-spacing:.04em;margin:0 0 4px}
.done .stl{margin-bottom:6px}
.items.tight .it{padding:8px 0;align-items:center}
.items.tight .rv{padding:7px 12px}
.th .flow{color:var(--ink)}
.ap{border-top:2px solid var(--ink);padding-top:20px}
.blk{margin:0 0 30px}
.pq{font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.55;margin:0 0 16px}
.blk>h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.def{border-left:3px solid var(--acc);padding:4px 0 4px 16px;margin:0 0 22px;font-size:16.5px;line-height:1.75}
.def b{font-weight:700}
.items{border-top:1px solid var(--line)}
.it{padding:15px 0;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:start}
.it .t{font-size:16px;line-height:1.65}
.it .t b{font-weight:700;margin-right:8px}
.it .t small{display:block;font-size:14.5px;color:var(--mid);margin-top:2px;line-height:1.7}
.it .seg{justify-content:flex-end;padding-top:1px}
.rv{grid-column:1/-1;padding:10px 14px;background:var(--wash);border-radius:8px;font-size:14.5px;line-height:1.75;color:var(--mid)}
.rv b{color:var(--ink);font-weight:700;margin-right:6px}
.proto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;background:var(--wash);border-radius:10px;padding:18px 22px;margin:0 0 22px}
.proto h3{grid-column:1/-1;margin:0 0 6px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.proto p{margin:0;font-size:15px;line-height:1.8}
.proto ul{margin:0;padding-left:18px;font-size:15px;line-height:1.8}
.done{border-top:2px solid var(--acc);padding-top:14px;margin-top:22px}
.done h4{margin:0 0 6px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.done p{margin:0 0 8px;font-size:15px;line-height:1.8;color:var(--mid)}
.done p b{color:var(--ink)}
.grp .sh{margin:0 0 4px}
.case{display:grid;grid-template-columns:150px minmax(0,1fr);margin:6px 0 0;font-size:15px;line-height:1.75;border-top:1px solid var(--line)}
.case dt,.case dd{padding:10px 0;border-bottom:1px solid var(--line2)}
.case dt{font-weight:600;color:var(--acc)}
.case dd{margin:0;padding-left:16px}
.case dd:last-of-type,.case dt:last-of-type{border-bottom:none}
.grp .sq{margin:0 0 12px;line-height:1.75}
.grp .sum{margin:14px 0 0}

@media(max-width:640px){
  .it{grid-template-columns:1fr}
  .it .seg{justify-content:flex-start}
  .proto{grid-template-columns:1fr;gap:10px}
  .ex dl{grid-template-columns:1fr;gap:2px}
  .pair{grid-template-columns:1fr}
    .case{grid-template-columns:1fr}
  .tint{padding:18px 16px 12px}
  .bt td::before{width:92px}
  .ph{flex-direction:column}
  .cmp3 thead{display:none}
  .cmp3,.cmp3 tbody,.cmp3 tr,.cmp3 th,.cmp3 td{display:block;width:auto}
  .cmp3 tr{border-bottom:1px solid var(--line);padding:8px 0}
  .cmp3 th,.cmp3 td{border:none;padding:3px 0}
  .cmp3 td::before{content:attr(data-l);display:inline-block;width:76px;font-size:13px;color:var(--acc);font-weight:600}
  .case dt{border-bottom:none;padding-bottom:0}
  .case dd{padding:2px 0 10px}
    .band{flex-direction:column}
  .band i{height:4px;width:auto}
  .band i.edge{height:2px;margin:8px 0}
  .grp{padding:18px 16px}
}
@media print{
  header,.foot{display:none!important}
  main{padding:0}
  .seg button{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .it{break-inside:avoid}
}
.cs{background:#F7F4EE;border-radius:12px;padding:24px 28px 18px;margin:0 0 24px}
.cs .gt{margin:0 0 12px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.cs .sq{margin:0 0 12px;line-height:1.75}
.cs .case{border-top-color:rgba(0,0,0,.1)}
.cs .case dt,.cs .case dd{border-bottom-color:rgba(0,0,0,.06)}
.src{margin:12px 0 0;font-size:12.5px;color:var(--soft)}
.more{border-top:1px solid var(--line);margin:8px 0 0;padding:12px 0 0}
.more+.more{margin-top:0}
.more>summary{cursor:pointer;list-style:none;font-size:16px;font-weight:700;letter-spacing:-.02em;padding:2px 0 10px}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:'+';display:inline-block;width:18px;color:var(--acc);font-weight:700}
.more[open]>summary::before{content:'−'}
.more>p{margin:0 0 12px;font-size:15px;line-height:1.75}
.mk{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mk textarea{min-height:84px;font-size:15px}
.bar{display:flex;gap:8px;margin:10px 0 0}
.go{background:none;border:1px solid var(--line);border-radius:14px;padding:0 14px;line-height:2;font-size:13.5px;color:var(--mid);cursor:pointer}
.go:hover{border-color:var(--acc);color:var(--ink)}
.mdl{margin-top:12px;background:var(--wash);border-radius:8px;padding:12px 16px}
.mdl p{margin:0 0 8px;font-size:14.5px;line-height:1.7;color:var(--mid)}
.mdl p:last-child{margin:0}
.mdl b{color:var(--acc);margin-right:8px}
@media(max-width:640px){.cs{padding:18px 16px}}
main{padding-top:22px}
h1{margin-bottom:10px}
.plain>p,.grp>p,.tint>p,.more .mb>p{font-size:15px;line-height:1.65;margin:0 0 12px}
.sq{line-height:1.65!important;font-size:15px!important}
.cp{font-size:14.5px;line-height:1.65}
.ex dl{font-size:14.5px;line-height:1.6;gap:4px 16px}
.case{grid-template-columns:128px minmax(0,1fr);font-size:14.5px;line-height:1.6}
.case dt,.case dd{padding:7px 0}
.case dd{padding-left:12px}
.ph.fill figure{flex:1}
.ph.fill img{height:234px;object-fit:cover}
.more{margin:28px 0 0;border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:0 0 10px 10px;padding:0 20px;background:#fff}
.more+.more{margin-top:14px}
.more>summary{padding:12px 0}
.more>summary i{font-style:normal;font-size:12px;font-weight:600;color:#fff;background:var(--ink);border-radius:4px;padding:1px 7px;margin-right:10px;vertical-align:2px;white-space:nowrap;flex-shrink:0}
.more>summary::before{content:none!important}
.more>summary{display:flex;align-items:center}
.more>summary::after{content:'+';margin-left:auto;color:var(--soft);font-size:18px;font-weight:400}
.more[open]>summary::after{content:'−'}
.more .mb{padding:0 0 16px}
.more table{border:1px solid var(--line)!important;margin:4px 0 10px}
.more th,.more td{border:1px solid var(--line)!important;padding:8px 10px!important;font-size:14px;line-height:1.55}
.more thead td,.more thead th{background:var(--wash);color:var(--ink)!important;font-size:13px;font-weight:700}
.more tbody th{background:#FAFBFA}
.more .pr2{font-size:13.5px;line-height:1.6;margin:6px 0 0}
@media(max-width:640px){.ph.fill img{height:auto}.more{padding:0 14px}.more th,.more td{border:none!important;padding:3px 0!important}.more table{border:none!important}.case{grid-template-columns:1fr}}
.grp{background:#EEF3F6;border:none}
.grp .gt{font-size:18px}

   '<dl class="case">'+
    '<dt>질문하기</dt><dd>카페 거리로 알려진 서울숲2길이 예전에는 어떤 곳이었는지 묻는다. 질문을 셋으로 나눈다. 업종은 어떻게 달라졌는가? 방문객은 언제부터 늘었는가? 원래 살던 주민은 어떻게 되었는가?</dd>'+
    '<dt>근거 모으기</dt><dd>질문마다 필요한 자료를 정하고 직접 찾는다. 카카오맵 로드뷰에서 2009년 시점을 골라 건물마다 업종을 확인하고 지금의 업종과 나란히 적는다. 성수동 유동인구 시계열은 서울 열린데이터광장에서, 성수1가1동 주민등록 인구는 SGIS에서 찾는다.</dd>'+
    '<dt>의미 만들기</dt><dd>건물을 주거, 근린상업, 외지인 대상 업종, 프랜차이즈, 공실로 나누고 변화 유형을 지도에 칠한다. 지도에서 찾은 근거로 서울숲2길이 장소의 생애주기 가운데 어느 단계에 있는지 설명한다.</dd>'+
    '<dt>성찰하기</dt><dd>한 거리의 건물 26곳을 두 시점으로만 비교했다는 한계를 적는다. 변화를 확인하고 나면 “서울숲2길은 어떻게 변화해야 하는가?”라는 질문이 남는다. 자료만으로는 답이 정해지지 않는 가치 질문이다.</dd>'+
   '</dl>'+
   src('한국지리 탐구 2.4 젠트리피케이션')+
  '</section>'+
  more('open','누가 정하는가 — 닫힌, 틀이 있는, 조정 가능한 탐구',
   '<p>탐구에서 질문과 자료, 해석을 누가 정하는지는 하나로 정해져 있지 않다. 로버츠는 반스 등(Barnes et al., 1987)의 틀을 빌려 교사의 지도가 강한 쪽부터 약한 쪽까지 세 유형으로 나누었다.</p>'+
   '<table class="tbl cmp3 bt"><thead><tr><th></th><td>닫힌</td><td>틀이 있는</td><td>조정 가능한</td></tr></thead><tbody>'+
    '<tr><th>탐구의 초점</th><td data-l="닫힌">탐구와 질문의 초점은 교사가 정한다.</td><td data-l="틀이 있는">교사와 학생이 학습 내용의 일부를 고른다. 교사는 학생이 질문을 찾도록 활동을 마련한다.</td><td data-l="조정 가능한">학생이 탐구의 초점을 정하고, 질문을 만들고, 어떻게 조사할지 정한다.</td></tr>'+
    '<tr><th>자료</th><td data-l="닫힌">모든 자료는 교사가 고르고, 권위 있는 근거로 제시된다.</td><td data-l="틀이 있는">교사가 여러 자료를 주고, 학생은 기준을 갖고 고른다. 자료에 질문을 던지게 한다.</td><td data-l="조정 가능한">학생이 학교 안팎에서 자료를 찾도록 돕고, 자료를 비판적으로 보게 한다.</td></tr>'+
    '<tr><th>이해하기</th><td data-l="닫힌">교사가 정해 둔 목표에 이르는 활동을 학생이 따른다.</td><td data-l="틀이 있는">교사가 여러 기법과 개념 틀을 소개하고, 학생이 골라 쓴다.</td><td data-l="조정 가능한">학생이 교사와 의논해 자료를 어떻게 해석하고 분석할지 정한다.</td></tr>'+
    '<tr><th>결론</th><td data-l="닫힌">결과를 미리 예상할 수 있다.</td><td data-l="틀이 있는">학생이 자신이 내린 결론을 놓고 토론한다.</td><td data-l="조정 가능한">학생이 스스로 결론을 내리고 비판적으로 평가한다.</td></tr>'+
    '<tr><th>예</th><td data-l="닫힌">교사가 만든 설문지로 쇼핑센터를 조사하고, 교사가 결과를 모아 그래프를 그리게 한다.</td><td data-l="틀이 있는">교사가 모아 둔 지도, 사진, 기사로 모잠비크 홍수에 관한 신문 기사를 쓴다.</td><td data-l="조정 가능한">학생이 대형 슈퍼마켓 건설 반대 단체를 스스로 조사 주제로 정하고, 설문지를 만들어 결론까지 낸다.</td></tr>'+
   '</tbody></table>'+
   '<p class="pr2">서울숲2길 사례는 교사가 질문과 자료의 출처를 정하고 학생이 자료를 직접 모으는 틀이 있는 탐구에 가깝다. 실제 수업에서 교사의 역할은 단원마다, 같은 수업 안에서도 달라질 수 있다.</p>'+
  '');
}

/* ═════ 2 사실과 가치 ═════ */
function s2(){
  return '<h1>사실 탐구와 가치 탐구</h1>'+
  '<section class="plain">'+
   '<div class="ex"><dl>'+
    '<dt>사실 탐구</dt><dd>세계가 어떠한지, 왜 그러한지를 묻는다. 무엇이 어디에 있고, 어떻게 변했고, 왜 그렇게 되었고, 어떤 영향을 미치는지를 자료와 증거로 답한다. 조사를 더 하면 답이 분명해진다.</dd>'+
    '<dt>가치 탐구</dt><dd>무엇이 바람직한지, 무엇을 해야 하는지를 묻는다. 자료만으로는 답이 정해지지 않는다. 사람들이 어떤 가치를 중시해서 서로 다른 입장을 갖는지 살피고, 근거를 들어 자신의 판단을 세운다.</dd>'+
    '<dt>의사결정</dt><dd>사실 탐구와 가치 탐구를 합쳐 여러 대안 가운데 하나를 고른다. 대안을 늘어놓고 각 대안의 결과를 예측해 장단점을 따진 뒤 선택하고, 그 선택을 정당화한다. 결정을 실행하고 그 결과까지 평가하면 문제해결이 된다.</dd></dl></div>'+
   '</section>'+
  '<section class="grp"><h2 class="gt">새만금 갯벌 — 어떤 탐구로 이어지는 질문인가</h2>'+LEG+
   '<div class="items tight">'+Q1.map(function(q){
     return item(q.id,q.t,QO,q.r,'<b>'+[].concat(q.r).map(function(k){return QN[k];}).join(' · ')+'</b>'+q.x);}).join('')+'</div>'+
  '</section>'+
  more('ib','사실 탐구를 더 나누면 — IB의 개념 기반 탐구',
   '<p>IB(국제 바칼로레아)는 개념 기반 탐구에서 탐구 질문을 <b>사실 질문, 개념 질문, 논쟁 질문</b>으로 나눈다. 탐구의 유형이 아니라 질문의 유형을 나눈 것으로, 사실 탐구 안에서 특정 사례를 묻는 질문과 다른 곳에도 옮겨 쓸 수 있는 관계를 묻는 질문을 구분한 것이 특징이다. 특정 사례에서 출발해 다른 곳에도 옮겨 쓸 수 있는 개념으로 나아가고, 그 위에서 논쟁 질문을 다룬다.</p>'+
   '<table class="tbl cmp3 qt"><thead><tr><th></th><td>뜻</td><td>젠트리피케이션</td><td>도시 열섬</td></tr></thead><tbody>'+
    '<tr><th>사실 질문</th><td data-l="뜻">특정 사례에 대한 지식을 묻는다. 증거로 확인할 수 있다.</td><td data-l="예">서울숲2길의 업종은 2009년 이후 어떻게 달라졌는가?</td><td data-l="예">대구의 폭염일수는 지난 30년 동안 어떻게 변했는가?</td></tr>'+
    '<tr><th>개념 질문</th><td data-l="뜻">사례를 넘어 다른 곳에도 옮겨 쓸 수 있는 개념과 관계를 묻는다.</td><td data-l="예">젠트리피케이션은 왜 일어나고, 장소를 어떻게 바꾸는가?</td><td data-l="예">도시는 왜 주변 지역보다 더 뜨거운가?</td></tr>'+
    '<tr><th>논쟁 질문</th><td data-l="뜻">관점과 가치에 따라 답이 갈린다. 근거를 들어 입장을 정해야 한다.</td><td data-l="예">젠트리피케이션을 막으려면 임대료를 규제해야 하는가?</td><td data-l="예">폭염에 대비해 도심 주차장을 공원으로 바꿔야 하는가?</td></tr>'+
   '</tbody></table>'+
   '<p class="pr2">사실 질문과 개념 질문은 증거로 답하는 사실 탐구에, 논쟁 질문은 대개 판단 기준이 필요한 가치 탐구에 해당한다.</p>'+
  '');
}

   '<dl class="case">'+
    '<dt>문제 만나기</dt><dd>방문객이 많은 오름(예: 백약이오름)의 탐방로 훼손을 직접 본다. 관광과 보전이 부딪히고, 몇 명이 적당한지는 정해져 있지 않다.</dd>'+
    '<dt>알아야 할 것 정하기</dt><dd>‘적정한 방문객 수’를 정하려면 무엇을 알아야 하는지 묻는다. 이 과정에서 수용력 개념을 배운다. 생태계가 스스로 회복할 수 있는 범위(생태적 수용력), 시설이 받아들일 수 있는 인원(물리적 수용력), 방문객이 만족을 잃지 않는 수준(사회·심리적 수용력)이다.</dd>'+
    '<dt>조사·학습</dt><dd>탐방로 침식 상태를 기록하고 토양 경도계로 탐방로가 얼마나 다져졌는지 잰다. 탐방로와 주차장의 수용 인원을 계산한다. 방문객에게 혼잡도, 만족도, 방문객 제한에 대한 생각을 묻는다.</dd>'+
    '<dt>해결안 발표·수정</dt><dd>세 수용력을 종합해 적정 방문객 수와 관리 방안을 동영상이나 포스터로 발표하고, 질문을 받아 고친다.</dd>'+
   '</dl>'+
   src('『새로운 사회 수업의 발견』 · 탐구 기반의 야외 조사')+

  '<section class="cs">'+
   '<h2 class="gt">Heat Busters — 열이 새는 곳을 찾아라!</h2>'+
   '<p class="sq">올겨울 학교 난방비가 작년보다 많이 나왔다. 건물이 오래되어 곳곳에서 난방열이 샌다고 한다. 환경 동아리가 열화상카메라로 열이 새는 곳을 찾아 학교 행정실에 알리기로 했다.</p>'+

var V={s1:s1,s2:s2,s3:s3};
function foot(){
  return '<div class="foot"><button id="print">인쇄 · PDF</button>'+
   '<button id="save">작업 저장</button><button id="load">불러오기</button>'+
   '<span class="msg" id="msg"></span><input type="file" id="file" accept=".json" hidden></div>';
}
function switcher(){
  $('#sw').innerHTML=MENU.map(function(m,i){
    return '<button aria-current="'+(S.scr===m.k)+'" data-go="'+m.k+'"><b>'+(i+1)+'</b><span class="lb">'+m.lb+'</span></button>';}).join('');
}
function go(k){S.scr=k;paint();window.scrollTo(0,0);}
function paint(){
  switcher();
  $('#main').innerHTML=V[S.scr]()+foot();
  if($('#print')){$('#print').onclick=function(){window.print();};
    $('#save').onclick=save;$('#load').onclick=function(){$('#file').click();};
    $('#file').onchange=load;}
}
function keep(fn){var y=window.scrollY;fn();window.scrollTo(0,y);}
document.addEventListener('toggle',function(e){var t=e.target;if(t.dataset&&t.dataset.op){S.op[t.dataset.op]=t.open;}},true);
document.addEventListener('input',function(e){if(e.target.id==='pbl'){S.t.pbl=e.target.value;dirty=true;}});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(d.go){go(d.go);return;}
  if(b.id==='brand'){go('s1');return;}
  if(d.a){S.a[d.a]=d.v;dirty=true;keep(paint);return;}
  if(d.pblk){S.a.pblk='1';dirty=true;keep(paint);return;}
});
function flash(t){var e=$('#msg');if(e){e.textContent=t;setTimeout(function(){e.textContent='';},2400);}}
function stamp(){var d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function save(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='탐구학습_'+stamp()+'.json';a.click();
  URL.revokeObjectURL(a.href);dirty=false;flash('저장했습니다');}
function load(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result),b=blank();
    S=Object.assign(b,d);S.a=S.a||{};S.op=S.op||{};S.t=S.t||{};if(!V[S.scr]||S.scr==='home')S.scr='s1';
    dirty=false;paint();flash('불러왔습니다');
