<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지리교과교육론 2강 · 지리교육의 이데올로기와 패러다임</title>
<style>
/* ═══ 수업자료 공통 스타일 v1 — 매주 이 블록을 그대로 재사용 ═══ */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --mark:#F6E7B8;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:1120px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:9px 30px;display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:4px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 11px;font-size:13.5px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:28px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{max-width:860px;margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.mission{border:1px solid var(--acc);background:var(--acc-w);border-radius:10px;
  padding:18px 22px;margin-bottom:26px}
.mission .l{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin-bottom:4px}
.mission p{margin:0;font-size:16.5px;font-weight:600;line-height:1.6}
.mission .s{margin-top:6px;font-size:14.5px;font-weight:400;color:var(--mid)}

.concept{background:var(--wash);border-radius:10px;padding:20px 24px;margin:22px 0 26px}
.concept h3{margin:0 0 10px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.concept dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 16px;margin:0;font-size:15px}
.concept dt{font-weight:600}
.concept dd{margin:0;color:var(--mid)}
.concept p{margin:12px 0 0;font-size:14.5px;color:var(--mid)}
.concept p b{color:var(--ink)}

.step{margin-bottom:40px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:74ch}

.opt,.tag{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 12px;font-size:14px;color:var(--mid)}
.opt:hover,.tag:hover{border-color:var(--acc);color:var(--ink)}
.opt[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;resize:vertical;background:none;line-height:1.7}
textarea:focus{border-color:var(--acc)}

.out{border-left:3px solid var(--acc);background:var(--acc-w);border-radius:0 8px 8px 0;
  padding:16px 20px;font-size:15.5px;margin-top:10px}
.out h3{margin:0 0 5px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;margin:18px 0}

/* 제안서 카드 */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:stretch}
.plan{display:flex;flex-direction:column}
.plan .egbox{margin-top:auto}
.plan .body:first-of-type{margin-bottom:22px}
.plan{border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.plan .no{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.plan .body{white-space:pre-line;font-size:15.5px;line-height:1.95;margin-top:8px;cursor:text}
.plan .body .ut{font-weight:700;font-size:18px}
.plan .body mark{padding:1px 0;border-radius:3px;cursor:pointer}
.sub{font-size:13px;color:var(--soft);margin:20px 0 7px;padding-top:14px;border-top:1px solid var(--line2)}
.sub b{color:var(--acc);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);border-radius:20px;cursor:pointer;
  padding:4px 11px;font-size:12.5px;color:var(--mid)}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:disabled{opacity:.32;cursor:not-allowed}
.trads{display:flex;flex-wrap:wrap}
.trads button{background:none;border:1px solid var(--line);border-right:none;cursor:pointer;
  padding:6px 10px;font-size:12.5px;color:var(--mid)}
.trads button:first-child{border-radius:6px 0 0 6px}
.trads button:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}
.trads button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ans{margin-top:11px;font-size:14px;color:var(--mid)}
.ans b{color:var(--acc)} .ans .diff{color:var(--red)}
.ans .kw{color:var(--soft);font-size:13px;display:block;margin-top:3px}
.plan.mine{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-w)}
.plan .no em{font-style:normal;background:var(--acc);color:#fff;border-radius:4px;padding:1px 7px;margin-left:6px}
.plan .motto{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:4px 0 12px}
.plan .body{margin-top:0}
.egbox{margin-top:26px;border:1px solid var(--line);border-radius:8px;padding:16px 20px 18px;background:var(--wash)}
.egl{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin-bottom:6px}
.egbox .body{white-space:normal;line-height:1.7}
.egbox .egu{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.egk{font-size:12.5px;color:var(--soft);font-weight:600;margin:14px 0 4px;letter-spacing:.03em}
.egul{margin:0;padding-left:18px}
.egul li{font-size:14.5px;margin:2px 0}
.egul li .body{display:inline}
.egbox .ege{font-size:14.5px;color:var(--mid)}
.mt{border-collapse:collapse;max-width:900px;width:100%;font-size:14.5px}
.mt th,.mt td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:center;vertical-align:middle}
.mt thead th{border-bottom:1px solid var(--line);color:var(--mid);font-weight:600;font-size:13.5px}
.mt tbody th{text-align:left;font-weight:400;color:var(--ink)}
.mt tbody th b{color:var(--acc);margin-right:8px}
.mt td.hit{background:var(--acc-w)}
.tag.hit{border-color:var(--acc);color:var(--acc);font-weight:600}
.lenscard .lp{font-size:12.5px;color:var(--soft);font-weight:600;letter-spacing:.06em;margin-bottom:4px}
.lnav{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}
.mainans{font-size:15px;font-weight:600;margin-bottom:10px}
.mainans .mk{display:inline-block;font-size:11.5px;font-weight:600;color:#fff;background:var(--acc);
  border-radius:4px;padding:2px 7px;margin-right:8px;vertical-align:2px}
.mainans .mk.sub{background:var(--soft);margin-left:16px}
.evlist{display:grid;gap:5px;padding:10px 14px;background:var(--wash);border-radius:8px}
.evi{font-size:13.5px;color:var(--mid)}
.evi .ar{color:var(--soft);margin:0 4px}
.evi .ek{color:var(--acc);font-weight:600}
.cau{margin-top:10px;font-size:13.5px;color:var(--mid);line-height:1.7}
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);
  border-radius:10px;padding:12px 18px;margin-bottom:22px;background:var(--wash)}
.toolbar .tl{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.toolbar .pens{margin:0}
.toolbar .tc{margin-left:auto;font-size:13px;color:var(--soft)}
.toolbar .tt{font-size:14px;color:var(--mid)}
.slist{display:grid;gap:14px}
.slist .item{max-width:none;margin:0}
.slist .txt{cursor:text}
.slist .txt mark{padding:1px 0;border-radius:3px;cursor:pointer}
.ct{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;margin-top:6px;
  table-layout:fixed;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ct col{width:20%}
.ct th,.ct td{border-bottom:1px solid var(--line2);padding:11px 13px;text-align:left;vertical-align:top;
  word-break:keep-all}
.ct tbody tr:last-child th,.ct tbody tr:last-child td{border-bottom:none}
.ct thead th{background:var(--wash);border-bottom:1px solid var(--line);color:var(--mid);
  font-weight:600;font-size:12.5px;letter-spacing:.02em}
.ct thead th:first-child{color:var(--acc)}
.ct tbody td:first-child{font-weight:700;color:var(--ink);border-right:1px solid var(--line2);
  background:#FBFCFA}
.ct tbody tr:hover td{background:#F9FBF9}
.ct tbody tr:hover td:first-child{background:var(--acc-w)}

.jwrap{overflow-x:auto}
.jt{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13.5px;
  table-layout:fixed;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.jt th,.jt td{border-bottom:1px solid var(--line2);padding:7px 6px;text-align:center;vertical-align:middle}
.jt tbody tr:last-child th,.jt tbody tr:last-child td{border-bottom:none}
.jt thead th{font-weight:600;font-size:12px;color:var(--mid);line-height:1.35;padding:8px 5px}
.jt thead th.g1{background:#EAF2EE}
.jt thead th.g2{background:#F5F1E8}
.jt thead tr:first-child th.g1,.jt thead tr:first-child th.g2{font-size:12.5px;color:var(--ink)}
.jt thead tr:first-child th.g1{border-left:1px solid var(--line)}
.jt thead tr:first-child th.g2{border-left:1px solid var(--line)}
.jt th.ph{text-align:left;font-weight:400;width:26%;background:#FBFCFA;color:var(--ink)}
.jt thead th.ph{background:var(--wash);color:var(--acc);font-weight:600}
.jt tbody th.ph b{color:var(--acc);margin-right:8px;font-weight:700}
.jt tbody td:nth-child(6){border-left:1px solid var(--line)}
.jt td.hit{background:var(--acc-w)}
.twol{margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);font-size:14.5px;color:var(--mid);display:grid;gap:3px}
.twol b{color:var(--ink)}
.twol .s{color:var(--soft);margin-top:5px}
.jlist{border-top:1px solid var(--line);margin-top:22px}
.jrow{padding:16px 2px;border-bottom:1px solid var(--line2)}
.jh{font-size:16px;margin-bottom:10px}
.jh b{color:var(--acc);margin-right:10px}
.jg{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.jk{font-size:12.5px;color:var(--soft);min-width:92px}
.jans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14.5px}
.jans b{color:var(--acc)}
.jans .d2{color:var(--red);font-size:13.5px}
.jl{color:var(--mid);font-size:14px;margin-top:4px}
.jl.s{color:var(--soft)}
.cell{width:38px;height:34px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;
  color:var(--acc);font-size:14px}
.cell:hover{border-color:var(--acc)}
.cell[aria-pressed="true"]{border-color:var(--acc);background:#fff}
.mycard{border:1px solid var(--acc);background:var(--acc-w);border-radius:10px;padding:15px 18px;
  max-width:700px;margin-top:16px;font-size:15.5px}
.mycard .l{font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin-bottom:3px}
.mycard .mm{font-size:14px;color:var(--mid);margin-top:4px}
.pens{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pen{border:1px solid var(--line);border-radius:20px;cursor:pointer;padding:6px 15px;font-size:14px;background:none}
.pen[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.pen i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
label.fl{display:block;font-size:14.5px;font-weight:600;margin:18px 0 5px}
label.fl em{font-style:normal;font-weight:400;color:var(--soft);font-size:13.5px;margin-left:8px}
.names{max-width:900px;border-top:1px solid var(--line)}
.nrow{padding:15px 2px;border-bottom:1px solid var(--line2)}
.nh{font-size:16px;margin-bottom:3px}
.nh b{color:var(--acc);margin-right:8px}
.nm{font-size:13.5px;color:var(--mid);margin-bottom:2px}
.nrow .trads{margin-top:9px}

/* 판별 */
.item{border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.item .num{font-size:12px;color:var(--soft);font-weight:600}
.item .num em{font-style:normal;color:var(--acc);margin-left:7px}
.item .txt{margin:4px 0 13px;font-size:15.5px;line-height:1.6}
.item .fb{margin-top:11px;font-size:13.5px;color:var(--mid)}
.item.ok{border-color:var(--acc)}
.item.no{border-color:#D8B6AD}

/* 렌즈 */
.lenses{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-bottom:20px}
.lensbtn{border:1px solid var(--line);border-radius:9px;background:none;text-align:left;
  padding:15px;cursor:pointer}
.lensbtn:hover{border-color:var(--acc)}
.lensbtn[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.lensbtn b{display:block;font-size:16.5px}
.lensbtn span{display:block;font-size:12.5px;color:var(--soft);margin-top:1px}
.lenscard{max-width:900px;border:1px solid var(--line);border-radius:10px;padding:24px}
.lenscard h2{margin:0 0 3px;font-size:22px;letter-spacing:-.02em}
.lenscard .sb{color:var(--mid);margin-bottom:18px;font-size:14.5px}
.mx{display:grid;grid-template-columns:130px minmax(0,1fr);gap:9px 16px;font-size:15px}
.mx .l{color:var(--soft)}
.mx .v{font-weight:600}
.flow{margin-top:18px;padding-top:15px;border-top:1px solid var(--line2);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:14px}
.flow span{background:var(--wash);border-radius:6px;padding:5px 10px}
.flow i{font-style:normal;color:var(--soft)}
.cmp{overflow:auto;margin-top:22px}
.cmp table{border-collapse:collapse;min-width:820px;width:100%;font-size:14px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.cmp th{color:var(--soft);font-weight:600}
.cmp td:first-child{font-weight:700}

.foot{margin-top:54px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;color:var(--mid);padding:0}
.foot button:hover{color:var(--ink)}
.foot .msg{color:var(--acc)}

@media(max-width:860px){
  .hin,main{padding-left:16px;padding-right:16px}
  .brand .c{display:none} h1{font-size:26px} .switch .lb{display:none}
  .plans{grid-template-columns:1fr}
  .plan .egbox{margin-top:20px}
  .mx{grid-template-columns:1fr} .mx .l{margin-top:6px}
  .concept dl{grid-template-columns:1fr}
}
@media print{
  header,.foot,.opt,.tag,.lensbtn,.trads,.chips{display:none!important}
  main{padding:0;max-width:none}
}
</style>
</head>
<body>

<header><div class="hin">
  <button class="brand" id="brand"><span class="c">지리교과교육론</span><span class="n" id="hn">2강 지리교육의 이데올로기와 패러다임</span></button>
  <div class="switch" id="sw"></div>
</div></header>
<main id="main"></main>

<script>
/* ═════ 활동 1 — 네 제안서 ═════ */
var LB=['A','B','C','D'];
var PLANS=[
 {id:'p0',para:'pos',ideo:'lib',motto:'공간의 규칙을 찾아 설명하다',
  belief:'저는 지리교육이 눈앞의 현상을 나열하는 데 그치지 않고, 공간에 나타나는 패턴과 관계를 찾아 그 원인을 설명할 수 있게 해야 한다고 생각합니다. 도시가 어디로 성장하는지, 상업시설은 왜 특정 지역에 집중되는지, 인구와 교통은 어떤 관계를 갖는지를 자료를 통해 확인할 수 있습니다. 지리 수업은 학생이 관찰과 측정을 바탕으로 가설을 세우고, 자료를 분석하여 공간적 질서를 설명하게 해야 합니다.',
  unit:'자료로 발견하는 용인의 공간 구조 — 분포, 입지, 관계',
  content:['용인의 인구와 시가지가 어디에 집중되어 있는지 분포 파악하기',
           '교통망과 상업시설·인구 분포 사이의 관계 분석하기',
           '용인의 도시 성장이 특정 방향으로 나타난 원인 설명하기'],
  act:['인구·교통·토지이용 자료를 지도에 표현하고 공간적 패턴 찾기',
       '“교통 접근성이 높은 지역일수록 상업시설이 많을 것이다”와 같은 가설 세우기',
       '자료를 분석해 가설을 검토하고 용인의 공간 구조를 일반화하기'],

function segs(id,t){
  var mk=(S.m1.marks[id]||[]).slice().sort(function(a,b){return a.s-b.s;});
  var out='',c=0;
  function color(k){for(var i=0;i<PENS.length;i++)if(PENS[i].k===k)return PENS[i].c;return '#eee';}
  mk.forEach(function(m,i){
    if(m.s>c)out+='<span data-s="'+c+'">'+esc(t.slice(c,m.s))+'</span>';
    out+='<mark data-s="'+m.s+'" data-mi="'+i+'" style="background:'+color(m.k)+'">'+esc(t.slice(m.s,m.e))+'</mark>';
    c=m.e;});
  if(c<t.length)out+='<span data-s="'+c+'">'+esc(t.slice(c))+'</span>';
  return out;
}
function planCard(p,i){
  function hb(id,t,cls){return '<div class="body '+(cls||'')+'" data-doc="'+id+'">'+segs(id,t)+'</div>';}
  function li(id,t){return '<li><div class="body" data-doc="'+id+'">'+segs(id,t)+'</div></li>';}
  return '<div class="plan"><div class="no">제안서 '+LB[i]+'</div>'+
   '<div class="motto">'+esc(p.motto)+'</div>'+
   hb(p.id+'a',p.t1)+
   '<div class="egbox"><div class="egl">첫 단원 예시</div>'+
    hb(p.id+'u',p.unit,'egu')+
    '<div class="egk">학습 내용</div><ul class="egul">'+p.content.map(function(t,k){return li(p.id+'c'+k,t);}).join('')+'</ul>'+
    '<div class="egk">주요 활동</div><ul class="egul">'+p.act.map(function(t,k){return li(p.id+'a'+k,t);}).join('')+'</ul>'+
    '<div class="egk">평가</div>'+hb(p.id+'e',p.assess,'ege')+
   '</div></div>';
}

/* ═════ 이벤트 ═════ */
function txt(id,fn){var el=$('#'+id);if(el)el.oninput=function(){fn(el.value);dirty=true;};}
function bind(){
  var m=$('#main'),q=function(s){return Array.prototype.slice.call(m.querySelectorAll(s));};
  q('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go);};});
  q('[data-pen]').forEach(function(b){b.onclick=function(){S.m1.pen=b.dataset.pen;paint();};});
  q('[data-gp]').forEach(function(b){b.onclick=function(){var id=b.dataset.gp;
    S.m2.gp[id]=S.m2.gp[id]===b.dataset.v?'':b.dataset.v;dirty=true;paint();};});
  q('[data-gi]').forEach(function(b){b.onclick=function(){var id=b.dataset.gi;
    S.m2.gi[id]=S.m2.gi[id]===b.dataset.v?'':b.dataset.v;dirty=true;paint();};});
  if($('#ky2'))$('#ky2').onclick=function(){S.m2.key=!S.m2.key;paint();};
  if($('#ky3'))$('#ky3').onclick=function(){S.m3.key=!S.m3.key;paint();};
  q('[data-subj]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.subj,k=b.dataset.pa;
    if(!S.m3.pick[id])S.m3.pick[id]={};
    if(S.m3.pick[id][k])delete S.m3.pick[id][k];
    else{if(Object.keys(S.m3.pick[id]).length>=2)return;S.m3.pick[id][k]=1;}
    dirty=true;paint();};});
  txt('sum',function(v){S.m2.txt=v;});
  txt('pm',function(v){S.m3.txt=v;});
  q('.slist .txt').forEach(function(el){
    el.onmouseup=function(){setTimeout(function(){hlSel3(el);},0);};
    el.onclick=function(e){var sl=window.getSelection();
      if(sl&&!sl.isCollapsed)return;
      if(e.target.tagName==='MARK'){
        var a=S.m3.marks[el.dataset.sdoc]||[];
        a.sort(function(x,y){return x.s-y.s;});a.splice(+e.target.dataset.mi,1);
        S.m3.marks[el.dataset.sdoc]=a;dirty=true;paint();}};});
  q('.plan .body').forEach(function(el){
    el.onmouseup=function(){setTimeout(function(){hlSel(el);},0);};
    el.onclick=function(e){var s=window.getSelection();
      if(s&&!s.isCollapsed)return;
      if(e.target.tagName==='MARK'){
        var a=S.m1.marks[el.dataset.doc]||[];
        a.sort(function(x,y){return x.s-y.s;});a.splice(+e.target.dataset.mi,1);
        S.m1.marks[el.dataset.doc]=a;dirty=true;paint();}};});
  if($('#print')){$('#print').onclick=function(){window.print();};
    $('#save').onclick=save;$('#load').onclick=function(){$('#file').click();};
    $('#file').onchange=load;}
}
function offsetIn(node,off){
  var host=(node.nodeType===3)?node.parentNode:node;
  if(!host||host.dataset.s===undefined)return null;
  return (+host.dataset.s)+off;
}
function hlSel3(el){
  var sl=window.getSelection();
  if(!sl||sl.isCollapsed||!sl.rangeCount)return;
  var r=sl.getRangeAt(0);
  if(!el.contains(r.startContainer)||!el.contains(r.endContainer))return;
