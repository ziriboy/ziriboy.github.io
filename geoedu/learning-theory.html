<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지리교과교육론 4강 · 학습이론</title>
<style>
/* ═══ 수업자료 공통 스타일 v1 — 매주 이 블록을 그대로 재사용 ═══ */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --mark:#F6E7B8;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:1120px; --hh:56px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:9px 30px;display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:3px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 10px;font-size:13px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:28px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{max-width:860px;margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.concept{background:var(--wash);border-radius:10px;padding:20px 24px;max-width:1000px;margin:6px 0 26px}
.concept h3{margin:0 0 10px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.concept dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:7px 16px;margin:0;font-size:15px}
.concept dt{font-weight:600}
.concept dd{margin:0;color:var(--mid)}
.concept p{margin:12px 0 0;font-size:14.5px;color:var(--mid)}
.concept p b{color:var(--ink)}

.step{margin-bottom:46px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:74ch}

.opt,.tag{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 12px;font-size:14px;color:var(--mid)}
.opt:hover,.tag:hover{border-color:var(--acc);color:var(--ink)}
.opt[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:disabled:hover{border-color:var(--line);color:var(--mid)}
textarea,.inp{width:100%;min-height:96px;border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;resize:vertical;background:none;line-height:1.7}
.inp{min-height:0;padding:7px 11px}
textarea:focus,.inp:focus{border-color:var(--acc);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;max-width:1000px;margin:14px 0}
.count{font-size:14px;color:var(--mid)}
.count b{color:var(--acc);font-weight:700}

.foot{margin-top:54px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;color:var(--mid);padding:0}
.foot button:hover{color:var(--ink)}
.foot .msg{color:var(--acc)}
/* ═══ 공통 스타일 v1 끝 ═══ */

.bar{position:sticky;top:var(--hh);z-index:20;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2);
  padding:8px 0;margin:0 0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;padding:5px 13px;font-size:14px;line-height:1.35;text-align:left;color:var(--ink)}
.tab small{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.tab:hover{border-color:var(--acc)}
.tab[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w);color:var(--acc);font-weight:600}
.tab[aria-pressed="true"] small{color:var(--acc)}
.hint{font-size:13px;color:var(--mid)}
.hint b{background:var(--mark);border-radius:4px;padding:1px 7px;font-weight:600;color:var(--ink);margin-right:7px}
.prog{margin-left:auto;font-size:13px;color:var(--soft)}

/* 교육과정 */
.doc{max-width:940px}
.unit{border-top:1px solid var(--line);padding:15px 0 9px}
.uh{display:grid;grid-template-columns:38px minmax(0,1fr);align-items:baseline;margin-bottom:3px}
.uh .un{font-size:12.5px;color:var(--soft);font-weight:600}
.uh .ut{font-size:17.5px;font-weight:700;letter-spacing:-.02em;line-height:1.45}
.std{display:grid;grid-template-columns:38px 132px minmax(0,1fr);padding:4px 0;font-size:15px;line-height:1.72}
.std .c{grid-column:2;font-size:12.5px;color:var(--mid);padding-top:3px;white-space:nowrap}
.std .t{grid-column:3}
.hl{cursor:text}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
.flash{animation:fl 2s ease}
@keyframes fl{0%,55%{background:var(--acc-w);box-shadow:0 0 0 4px var(--acc-w)}100%{background:transparent;box-shadow:none}}

/* 체크리스트 */
.scale{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:end;
  font-size:12px;color:var(--soft);padding-bottom:5px;border-bottom:1px solid var(--line);max-width:1060px}
.scale div{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.it{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:6px 18px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line2);max-width:1060px}
.it .q{font-size:15px;line-height:1.5}
.it .q i{font-style:normal;color:var(--soft);margin-right:8px;font-size:13px}
.it .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.lv{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:5px 4px;font-size:13.5px;color:var(--mid)}
.lv:hover{border-color:var(--acc);color:var(--ink)}
.lv[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.it.done .q{color:var(--mid)}
.it .rf{grid-column:1/-1;font-size:13.5px;line-height:1.65;color:var(--mid);padding-bottom:2px}
.it .rf b{font-weight:600;margin-right:7px}
.it .rf b.ok{color:var(--acc)} .it .rf b.no{color:var(--red)}
.it .go{background:none;border:none;color:var(--soft);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline;margin-left:6px}
.it .go:hover{color:var(--acc)}

/* 자동 종합 */
:root{--ours:#D98A4E;--ours-w:#F7E6D6}
.rhead{display:grid;grid-template-columns:18px minmax(0,1fr) 300px;gap:14px;max-width:1040px;
  font-size:12px;color:var(--soft);padding-bottom:4px;border-bottom:1px solid var(--line);
  position:sticky;top:calc(var(--hh) + 46px);background:#fff;z-index:5}
.rhead .zn{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.rgrp{margin-bottom:14px;max-width:1040px}
.rgrp h4{margin:12px 0 2px;font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.04em}
.rgrp h4 span{font-weight:400;color:var(--soft);letter-spacing:0;margin-left:8px}
.rl{display:grid;grid-template-columns:18px minmax(0,1fr) 300px;gap:14px;align-items:center;
  padding:6px 0 10px;border-bottom:1px solid var(--line2);font-size:15px}
.rl .mk{color:var(--ours);font-size:13px;text-align:center;align-self:start;padding-top:2px}
.rl .nm{line-height:1.4}
.rl.w2 .nm b{font-weight:700}
.rl .nm small{display:block;font-size:12.5px;color:var(--soft);line-height:1.45;margin-top:1px}
.rl .tr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.rl .zn{height:20px;background:var(--wash);border-radius:5px;position:relative}
.rl .zn.ours{background:var(--ours)}
.rl .zn.ref:after{content:'';position:absolute;left:16%;right:16%;bottom:-6px;height:3px;border-radius:2px;background:var(--acc)}
.rgrp.none .nm b{color:var(--soft)}
.rgrp.none .mk{color:var(--soft)}
.rleg{font-size:13px;color:var(--mid);margin:10px 0 0}
.rleg i{display:inline-block;vertical-align:middle;margin:0 6px 0 18px}
.rleg i:first-of-type{margin-left:0}
.rleg .o{width:20px;height:12px;border-radius:3px;background:var(--ours)}
.rleg .g{width:20px;height:3px;background:var(--acc)}
.vsent{font-size:16.5px;line-height:1.75;letter-spacing:-.01em;margin:16px 0 0;max-width:1000px;
  border-left:3px solid var(--acc);padding-left:16px}
.vsent b{font-weight:700}
.refS{font-size:15px;color:var(--mid);margin:14px 0 0;line-height:1.85;max-width:1000px}
.refS .lb{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.04em;margin-right:10px}
.refS b{color:var(--ink)}
.legend{font-size:13px;color:var(--soft);margin:8px 0 0}
.legend i{display:inline-block;width:2px;height:12px;background:var(--ink);vertical-align:-2px;margin-right:5px}
.cau{margin-top:12px;font-size:14.5px;color:var(--mid);background:var(--wash);border-radius:8px;padding:12px 16px;line-height:1.7;max-width:1000px}
/* 대조표 */
.dt{width:100%;max-width:1000px;border-collapse:collapse;font-size:14.5px;margin:8px 0 0}
.dt th,.dt td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2)}
.dt thead th{border-bottom:1px solid var(--line);font-size:13px;color:var(--mid);font-weight:600}
.dt td.v{width:130px}
.dt .same{color:var(--acc)} .dt .diff{color:var(--red);font-weight:600}
.dt tr.d td{background:var(--wash)}
.hit{font-size:14px;color:var(--mid);margin:16px 0 0}
.hit b{color:var(--acc);font-weight:700}

.final{max-width:1000px;margin-top:8px}
.final label{display:block;font-size:14.5px;font-weight:600;margin-bottom:7px;line-height:1.6}
.final label span{display:block;font-weight:400;color:var(--mid);font-size:13.5px}

/* 비교 */
.ctw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.ct{border-collapse:collapse;width:100%;min-width:780px;font-size:14.5px}
.ct th,.ct td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--line)}
.ct thead th{border-bottom:2px solid var(--ink);font-size:15.5px}
.ct thead th button{background:none;border:none;padding:0;font:inherit;cursor:pointer;color:var(--ink)}
.ct thead th button:hover{color:var(--acc)}
.ct tbody th{width:120px;font-weight:600;color:var(--mid);font-size:14px}
.ct td{width:29%;line-height:1.65}
.ct .none{color:var(--soft)}
.ct ul{margin:0;padding:0;list-style:none}
.ct li{padding:1px 0}
.ct li b{font-weight:700}

@media(max-width:820px){
  .hin,main{padding-left:16px;padding-right:16px}
  .brand .c{display:none} h1{font-size:26px}
  .it,.scale{grid-template-columns:1fr}
  .std{grid-template-columns:0 minmax(0,1fr)} .std .c,.std .t{grid-column:2}
  .rhead,.rl{grid-template-columns:16px minmax(0,1fr) 132px;gap:8px}
  .rhead{font-size:11px}
  .prog{margin-left:0}
}
@media print{
  header,.foot,.bar,.lv,.go,#keyb{display:none!important}
  main{padding:0;max-width:none}
  mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
<style>
.brief{margin:0;padding-left:22px;max-width:760px}
.brief li{font-size:16.5px;margin:6px 0}
.brief li small{color:var(--soft);font-size:13px;margin-left:8px}
.sd{margin:0 0 14px;color:var(--mid);font-size:14.5px;max-width:62em}
.lockrow{margin:26px 0;padding:14px 18px;border:1px dashed var(--line2);border-radius:9px;
  color:var(--soft);font-size:14px;max-width:860px}
.pens{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.pen{border:1px solid var(--line);border-radius:20px;cursor:pointer;padding:6px 15px;
  font-size:14px;background:none;color:var(--mid)}
.pen[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.pen i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.pen small{color:var(--soft);font-weight:400;margin-left:7px;font-size:12.5px}
.eb{margin-bottom:30px;max-width:900px}
.eg{margin:0 0 10px;font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.ed{border-top:1px solid var(--line)}
.edu{border-bottom:1px solid var(--line2);padding:14px 0 13px}
.edu:last-child{border-bottom:none}
.edt{margin:0 0 7px;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.eds{margin:0 0 5px;font-size:14.5px;line-height:1.75;color:var(--mid);
  padding-left:78px;text-indent:-78px}
.eds:last-child{margin-bottom:0}
.edc{display:inline-block;width:70px;color:var(--soft);font-size:12.5px;text-indent:0}
.nav2{margin-top:24px}
.cmp .pre{background:var(--wash);color:var(--mid)}
textarea[data-txt]{width:100%;max-width:860px;border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;background:none;line-height:1.7;resize:vertical}
textarea[data-txt]:focus{border-color:var(--acc)}
@media (max-width:760px){.elem{grid-template-columns:1fr}}
.pend{margin:14px 0 20px;max-width:860px}
.pend p{margin:0 0 7px;font-size:14px;color:var(--mid);line-height:1.7;
  display:flex;gap:9px;align-items:baseline}
.pend p:last-child{margin-bottom:0}
.pend i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto;
  transform:translateY(-1px)}
.pend b{color:var(--ink);font-weight:600;white-space:nowrap}
mark[data-k]{padding:1px 0;border-radius:3px;cursor:pointer;color:inherit}
.evbox{margin-top:18px;border:1px solid var(--line);border-radius:9px;padding:14px 18px;max-width:860px}
.ek{margin:0 0 9px;font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.evl{display:flex;flex-wrap:wrap;gap:6px}
.evc{border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:13.5px;
  background:none;cursor:default;color:var(--ink);text-align:left}
.evc i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
.evc small{color:var(--soft);font-size:12px;margin-left:7px}
.evc.pickable{cursor:pointer}
.evc.pickable:hover{border-color:var(--acc)}
.evc[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.picks{display:grid;gap:9px;max-width:860px}
.pk{display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;
  border:1px solid var(--line);border-radius:9px;padding:13px 17px;cursor:pointer;color:var(--ink)}
.pk:hover{border-color:var(--acc)}
.pk[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.pk .mk{width:16px;height:16px;border:1px solid var(--line);border-radius:50%;flex:0 0 auto;margin-top:5px}
.pk[aria-pressed="true"] .mk{background:var(--acc);border-color:var(--acc)}
.pk b{font-weight:600}
.pk small{display:block;color:var(--soft);font-size:13px;margin-top:2px;line-height:1.55}
.reveal{margin-top:14px;border-left:3px solid var(--acc);background:var(--acc-w);
  border-radius:0 8px 8px 0;padding:14px 18px;max-width:860px}
.reveal b{color:var(--acc)}
.card{border:1px solid var(--acc);border-radius:10px;padding:20px 24px;max-width:860px}
.card dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 16px;margin:0}
.card dt{color:var(--soft);font-size:13px}
.card dd{margin:0;font-size:15.5px}
.card .sum{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line2);font-size:16.5px;line-height:1.75}
.cmp{overflow:auto;margin-top:8px}
.cmp table{border-collapse:collapse;width:100%;min-width:760px;font-size:14.5px}
.cmp th,.cmp td{border-bottom:1px solid var(--line2);padding:11px 12px;text-align:left;vertical-align:top}
.cmp thead th{border-bottom:1px solid var(--line);color:var(--mid);font-weight:600;font-size:13.5px}
.cmp tbody th{color:var(--soft);font-weight:400;font-size:13px;width:88px}
.cmp .none{color:var(--soft)}
.swatch{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:100%;height:9px;border-radius:2px}
.keyb{background:none;border:1px solid var(--line);border-radius:7px;cursor:pointer;
  padding:7px 16px;font-size:14px;color:var(--mid)}
.keyb:hover{border-color:var(--acc);color:var(--ink)}
</style>

var D={"S": [{"k": "gagne", "who": "가네", "en": "Gagné", "learn": "학습의 결과는 한 종류가 아니다. 결과의 성격이 다르면 필요한 학습조건도 다르다.", "terms": ["학습결과의 유형", "학습위계", "과제분석", "선행조건", "구체적 개념 · 정의된 개념"], "design": [{"t": "최종 목표에서 거꾸로 분석한다", "d": "과제분석은 수업을 잘게 쪼개는 일이 아니라, 이 문제를 풀기 위해 반드시 먼저 할 수 있어야 하는 것을 찾아내는 일이다.", "e": "“수도권에 왜 인구와 산업이 집중되었는지 설명하라” → 지역 구분 → 분포 읽기 → 개념 이해 → 관계 파악"}, {"t": "개념의 성격에 따라 교수방법을 바꾼다", "d": "학생이 스스로 발견하게 하면 언제나 좋은 것이 아니다. 개념의 성격이 방법을 정한다.", "e": "하천 · 해변 · 도시는 사례 → 비교 → 공통속성 → 개념. 인구밀도 · 배후지 · 입지계수는 정의 → 관계 설명 → 사례 적용"}, {"t": "개념의 층위를 고려해 목표를 세운다", "d": "복잡한 개념은 더 단순하고 구체적인 개념 위에서 만들어진다.", "e": "구체 개념(하천 · 산 · 도로) → 관계적 개념(인구밀도 · 접근성 · 집적) → 복합 개념(도시체계 · 지역갈등)"}], "attack": "선수 능력을 확인하지 않고 복잡한 문제부터 던지면, 학생은 무엇을 근거로 판단해야 할지 모르는 채 겉도는 말만 하게 됩니다.", "warn": "", "cls": ["최종 목표에서 거꾸로 분석해, 먼저 할 수 있어야 하는 능력을 찾는다.", "하위 능력부터 차례로 쌓고, 개념의 종류에 따라 가르치는 방법을 달리한다."], "nc": "순서를 정하는 기준은 ‘쉬운 것에서 어려운 것으로’가 아니다. 최종 수행에 무엇이 먼저 필요한지가 순서를 정한다.", "defs": ["언어정보, 지적 기능, 인지전략, 태도, 운동기능의 다섯 가지. 결과의 종류마다 필요한 학습조건이 다르다.", "지적 기능은 변별 → 개념 → 규칙 → 고차 규칙(문제해결)의 순서로 쌓인다. 위 단계를 배우려면 아래 단계가 먼저 되어 있어야 한다.", "최종 목표에서 거꾸로 내려가며 “이것을 하려면 무엇을 먼저 할 수 있어야 하나?”를 물어 하위 능력을 찾아내는 일.", "새 학습을 시작하기 전에 학습자가 이미 갖추고 있어야 하는 능력.", "하천·산처럼 보고 가리켜 확인할 수 있으면 구체적 개념, 인구밀도·접근성처럼 정의를 통해서만 알 수 있으면 정의된 개념."], "bg": "가네는 제2차 세계대전과 그 뒤 미국 공군에서 조종사와 기술병의 훈련을 연구했다. 짧은 시간 안에 많은 사람을 확실하게 가르쳐야 하는 자리였다. 여기서 그는 두 가지를 보았다. 하나는 계기판의 이름을 외우는 일과 고장의 원인을 찾아내는 일이 둘 다 ‘학습’이라 불리지만 전혀 다른 방식으로 익혀진다는 것이다. 다른 하나는 복잡한 문제를 풀지 못하는 사람에게 대개 그 아래에 있어야 할 더 단순한 능력이 빠져 있다는 것이다.", "props": [{"t": "학습의 결과는 여러 종류이고, 종류마다 필요한 조건이 다르다", "d": "가네는 학습의 결과를 다섯으로 나누었다. 사실과 이름을 아는 언어정보, 개념과 규칙을 써서 무엇을 해내는 지적 기능, 자기 사고를 조절하는 인지전략, 그리고 태도와 운동기능이다. 결과가 다르면 필요한 학습조건도 다르다. 학습조건에는 학습자가 이미 갖춘 능력(내적 조건)과 교사가 마련하는 상황(외적 조건)이 있다.", "b": ["언어정보", "지적 기능", "인지전략", "태도", "운동기능"], "g": ["같은 지형 단원 안에서도 “우리나라 주요 산맥의 이름을 안다”와 “등고선을 읽고 지형을 해석한다”는 다른 종류의 결과다. 앞의 것은 언어정보라서 지도 위에서 반복해 확인하면 된다. 뒤의 것은 지적 기능이라서 여러 능력을 차례로 익혀야 한다. 두 목표를 같은 방식으로 가르치면 어느 한쪽은 놓치게 된다."]}, {"t": "복잡한 능력은 계단처럼 쌓이므로, 목표에서 거꾸로 분석한다", "d": "지적 기능은 변별에서 구체적 개념, 정의된 개념, 규칙을 거쳐 문제해결로 올라간다. 이것이 학습위계다. 위 계단에 오르려면 아래 계단이 먼저 있어야 한다. 그래서 교사는 최종 목표에서 거꾸로 “이것을 하려면 무엇을 먼저 할 수 있어야 하나?”를 물어야 한다. 이 작업이 과제분석이고, 이렇게 찾은 하위 능력이 선행조건이다. 이때 보고 가리켜 확인할 수 있는 개념(구체적 개념)은 사례로, 정의로만 알 수 있는 개념(정의된 개념)은 정의로 가르친다.", "b": ["학습위계", "과제분석", "선행조건", "구체적 개념", "정의된 개념"], "g": ["“등고선 지도로 이 지역의 지형을 해석하라”는 과제를 거꾸로 분석해 보자.", {"ul": ["지형을 해석하려면 경사를 판단할 수 있어야 한다.", "경사를 판단하려면 등고선 간격의 뜻을 알아야 한다.", "그러려면 등고선이 무엇인지부터 알아야 한다."]}, "그래서 수업은 등고선 읽기 → 경사 판단 → 지형 해석의 순서로 짜인다. 지형 해석에서 막힌 학생이 있으면, 교사는 어느 계단에서 막혔는지부터 확인한다."]}], "start": "이 자료들을 읽고 침수를 설명하려면, 학생은 무엇을 먼저 할 수 있어야 할까? 그 순서는 어떻게 될까? (제안 ②)"}, {"k": "piaget", "who": "피아제", "en": "Piaget", "learn": "새로운 지식을 더하는 것이 아니라 기존의 사고구조가 재조직되는 과정이다.", "terms": ["도식", "동화", "조절", "인지갈등(불평형)", "평형화"], "design": [{"t": "학생의 기존 도식을 먼저 드러나게 한다", "d": "오개념은 지워야 할 잘못이 아니라 개념 변화가 시작되는 현재의 사고구조다.", "e": "만어산 너덜겅을 본 학생 — “계곡에서 이런 바위를 봤으니 여기도 물이 흘렀던 곳 아닐까?” 기존 계곡 도식으로 설명한 것이 동화다."}, {"t": "기존 도식으로 설명되지 않는 자료를 만나게 한다", "d": "불평형이 생겨야 사고를 수정한다. 설명이 막히는 지점을 교사가 만들어 준다.", "e": "“사막은 덥고 모래가 많은 곳” → 고비사막의 겨울 기온 자료 → “사막인데 왜 이렇게 추울까?”"}, {"t": "구체적 조작기에는 실제 자료와 대상을 준다", "d": "구체적이라는 말은 논리적 사고를 못 한다는 뜻이 아니다. 자료가 있어야 논리적으로 사고할 수 있다는 뜻이다.", "e": "인구지도를 놓고 두 지역을 비교·분류하는 것은 가능하다. “산업구조가 완전히 바뀐다면 인구분포는?”은 훨씬 어렵다."}, {"t": "학생이 그린 지도에서 공간이해 방식을 읽는다", "d": "물어야 할 것은 정확하게 그렸는가가 아니라 공간을 어떻게 조직하고 있는가다.", "e": "위상적 → 투영적 → 유클리드적. 집을 크게 그렸다면 실수가 아니라 자기 경험을 중심으로 조직된 공간일 수 있다."}], "attack": "학생이 지금 무엇을 어떻게 생각하고 있는지 확인하지 않고 완성된 설명부터 주면, 그 설명은 기존 생각 위에 얹혀 있을 뿐입니다.", "warn": "", "cls": ["학생이 이미 어떻게 생각하고 있는지 먼저 드러낸다.", "기존 생각으로 설명되지 않는 현상을 만나게 하여 사고를 수정하게 한다."], "nc": "반례를 보여 주는 것 자체가 목적이 아니다. 학생의 설명이 실제로 고쳐지는 것이 중요하다.", "defs": ["세상을 이해하고 해석하는 사고의 틀.", "새로운 경험을 기존 도식에 맞추어 해석하는 것. 처음 본 바위 지대를 이미 아는 ‘계곡’으로 이해하는 식이다.", "기존 도식으로 설명되지 않을 때 도식 자체를 고치거나 새로 만드는 것.", "기존 도식과 새 경험이 맞지 않아 생기는 불편한 상태. 사고를 바꾸는 계기가 된다.", "동화와 조절을 거쳐 불평형을 풀고 더 안정된 사고구조에 이르는 과정."], "bg": "젊은 피아제는 파리의 한 연구소에서 아이들의 추론 검사 문항을 표준화하는 일을 했다. 그런데 그의 눈을 끈 것은 정답이 아니라 오답이었다. 같은 나이의 아이들은 같은 방식으로 틀렸다. 아이들은 아무렇게나 틀리는 것이 아니라, 어른과는 다른 나름의 논리로 생각하고 있었다. 그리고 그 논리는 나이에 따라 달라졌다.", "props": [{"t": "학습은 지식이 쌓이는 일이 아니라 사고의 틀이 바뀌는 일이다", "d": "사람은 세상을 이해하는 틀, 곧 도식을 가지고 있고 새 경험을 그 틀에 맞추어 해석한다. 이것이 동화다. 그러다 틀로 설명되지 않는 경험을 만나면 불편한 상태, 곧 인지갈등(불평형)이 생긴다. 이 불편함을 풀기 위해 틀 자체를 고치는 것이 조절이다. 그렇게 더 안정된 이해에 이르는 과정이 평형화다.", "b": ["도식", "동화", "인지갈등(불평형)", "조절", "평형화"], "g": ["많은 학생이 “사막은 덥고 모래가 많은 곳”이라고 생각한다. 피아제식 수업은 이 생각을 지워야 할 오답이 아니라 학생의 현재 도식으로 본다.", {"ul": ["설명하기 전에 학생의 생각을 먼저 꺼내게 한다.", "그다음 고비사막의 한겨울 기온 자료를 보여 준다. “사막인데 왜 이렇게 춥지?” 이 물음에서 조절이 시작된다."]}, "“하천은 하류로 갈수록 물이 많아진다”는 생각도 같은 방식으로 다룰 수 있다. 사막을 지나는 나일강의 하류 유량 자료를 보여 주면 된다."]}, {"t": "사고의 틀은 나이에 따라 질적으로 달라진다", "d": "피아제는 사고의 틀이 나이에 따라 질적으로 달라진다고 보았다. 대략 7~11세의 구체적 조작기에는 실제 대상과 자료가 앞에 있어야 논리적으로 생각할 수 있다. 그 뒤의 형식적 조작기에는 눈앞에 없는 가설과 추상적 관계를 다룰 수 있다.", "b": ["구체적 조작기", "형식적 조작기"], "g": ["초등학생과 중학교 초반 학생에게는 지도와 사진을 앞에 두고 두 지역을 비교하고 분류하게 한다. 고등학생은 “해발고도가 더 높다면?”, “이 하천에 댐이 생긴다면?” 같은 가설적 질문을 다룰 수 있다. 다만 같은 나이라도 낯선 내용 앞에서는 구체적 자료가 먼저 필요하다."]}], "start": "학생들은 도시 침수를 지금 어떻게 설명할까? 어떤 자료가 그 설명을 흔들까? (제안 ①)"}, {"k": "ausubel", "who": "오수벨", "en": "Ausubel", "learn": "새 지식이 학습자가 이미 아는 것과 연결될 때 의미 있는 학습이 된다. 설명을 듣는 수용학습도 유의미할 수 있다.", "terms": ["유의미학습 · 기계적 암기", "수용학습 · 발견학습", "선행조직자", "점진적 분화", "통합적 조정"], "design": [{"t": "설명하기 전에 학생이 이미 아는 것을 확인한다", "d": "수용학습이 곧 암기학습은 아니다. 교사의 설명도 기존 개념에 걸리면 유의미해진다.", "e": "인구밀도의 정의를 교사가 설명해도, 학생이 이미 아는 인구와 면적으로 그 의미를 이해했다면 유의미학습이다."}, {"t": "선행조직자로 개념적 자리를 먼저 만든다", "d": "수업 개요와 다르다. 앞으로 나올 세부 내용이 들어갈 틀을 주는 것이다.", "e": "“오늘은 판, 지진, 화산을 배웁니다”가 아니라 “지구 표면은 여러 판으로 이루어져 있고, 판의 움직임이 지진·화산·산맥을 하나로 연결한다”"}, {"t": "학생의 상태에 따라 조직자를 고른다", "d": "관련 지식이 흩어져 있으면 비교 조직자, 거의 없으면 설명 조직자다.", "e": "도심·상업지역·주거지역을 따로 알고 있을 때 — “도시의 기능지역은 접근성과 지가의 차이에 따라 일정한 패턴을 보인다”"}, {"t": "지식구조를 분화하고 다시 잇는다", "d": "학습이 깊어진다는 것은 정보량이 느는 것이 아니라 구조가 분화되고 연결되는 것이다.", "e": "점진적 분화 — 도시 → 도심 · 부도심 · 교외. 통합적 조정 — 도시화 ↔ 교외화 ↔ 재도시화"}], "attack": "발견만 강조하면 학생은 무엇을 발견해야 하는지도 모른 채 시간을 씁니다. 걸릴 자리가 없는 개념은 공중에 뜹니다.", "warn": "", "cls": ["새 내용을 걸어 둘 넓은 틀(선행조직자)을 먼저 준다.", "학생이 이미 아는 것을 그 틀에 연결하고, 구조를 나누고 다시 잇는다."], "nc": "선행조직자는 수업 개요나 요약이 아니다. 새 내용보다 더 넓고 포괄적인 틀이다.", "defs": ["새 지식이 이미 아는 개념과 연결되면 유의미학습, 연결 없이 외우기만 하면 기계적 암기.", "내용을 완성된 형태로 받아들이면 수용학습, 스스로 찾아내면 발견학습. 이 구분은 유의미·기계적 구분과 서로 다른 축이다.", "새 내용을 배우기 전에 먼저 주는 개념적 틀. 관련 지식이 거의 없으면 설명 조직자, 흩어져 있으면 비교 조직자를 쓴다.", "가장 일반적이고 포괄적인 개념을 먼저 제시하고, 점차 세부 개념으로 나누어 가는 것.", "따로 배운 개념들 사이의 공통점과 차이를 짚어 서로 연결하는 것."], "bg": "1960년대 미국 교육계에서는 발견학습이 큰 인기를 끌었다. 교사가 설명하고 학생이 듣는 수업은 ‘주입식’이라며 낡은 방식으로 취급받았다. 오수벨은 이 흐름에 의문을 던졌다. 학생이 스스로 찾아냈다고 모두 잘 배운 것일까? 교사의 설명을 들었다고 모두 외우기만 한 것일까? 그는 “학습에 가장 큰 영향을 주는 단 하나의 요인은 학습자가 이미 알고 있는 것”이라고 보았다.", "props": [{"t": "중요한 것은 설명이냐 발견이냐가 아니라, 이미 아는 것과 연결되느냐다", "d": "새 지식이 학습자가 이미 아는 것과 연결되면 유의미학습이고, 연결 없이 외우면 기계적 암기다. 내용을 완성된 형태로 받아들이는 수용학습도 유의미할 수 있고, 스스로 찾아낸 발견학습도 기계적일 수 있다. 두 구분은 서로 다른 축이다.", "b": ["유의미학습", "기계적 암기", "수용학습", "발견학습"], "g": ["교사가 계절풍을 설명하는 수업도 유의미학습이 될 수 있다. 학생들이 겪어 본 여름의 후텁지근한 남풍과 겨울의 찬 북서풍에 새 개념을 이어 주면 된다. 반대로 학생이 활동지의 빈칸을 스스로 채웠더라도, 그 답이 아는 것과 이어지지 않았다면 기계적 암기에 그친다."]}, {"t": "새 지식이 걸릴 자리를 먼저 만들어 준다", "d": "새 내용보다 먼저, 그것보다 더 넓고 포괄적인 개념적 틀을 준다. 이것이 선행조직자다. 관련 지식이 거의 없으면 설명 조직자를, 관련 지식은 있지만 흩어져 있으면 비교 조직자를 쓴다.", "b": ["선행조직자", "설명 조직자", "비교 조직자"], "g": ["계절풍, 장마, 벼농사를 따로따로 가르치지 않는다. 먼저 이런 틀을 준다. “육지는 바다보다 빨리 데워지고 빨리 식는다. 이 열적 차이가 바람의 방향을 바꾸고, 그 바람이 비와 농업의 모습까지 결정한다.” 이후 배우는 계절풍, 여름철 강수 집중, 벼농사는 모두 이 한 문장에 걸린다."]}, {"t": "큰 틀에서 나누어 가고, 나눈 것을 다시 잇는다", "d": "일반적인 개념에서 세부 개념으로 나누어 가는 것이 점진적 분화다. 따로 배운 개념들의 공통점과 차이를 짚어 다시 잇는 것이 통합적 조정이다.", "b": ["점진적 분화", "통합적 조정"], "g": ["같은 틀로 두 방향을 모두 볼 수 있다.", {"ul": ["분화: ‘육지와 바다의 열적 차이’를 하루 단위의 해륙풍과 계절 단위의 계절풍으로 나누어 본다.", "조정: 따로 배운 계절풍, 장마, 벼농사가 같은 원리의 서로 다른 결과임을 확인한다."]}]}], "start": "학생들은 도시 침수에 대해 이미 무엇을 알고 있을까? 어떤 틀을 먼저 주면 이 자료들이 하나로 이어질까? (제안 ①·②)"}, {"k": "bruner", "who": "브루너", "en": "Bruner", "learn": "지식의 구조를 학습자에게 맞는 방식으로 표현하면 어떤 연령에서도 배울 수 있다. 학습자는 그 구조를 스스로 발견하며 배운다.", "terms": ["지식의 구조", "행동적 · 영상적 · 상징적 표상", "발견학습", "안내된 발견", "나선형 교육과정"], "design": [{"t": "같은 내용을 세 가지 표상으로 옮긴다", "d": "표상은 자료의 종류가 아니다. 하나의 관계를 행동으로 겪고, 이미지로 구조화하고, 상징으로 일반화하는 것이다.", "e": "연안류 — 답사에서 파도와 모래를 관찰한다 / 화살표로 물질의 이동을 그린다 / 연안표류를 정의하고 공식으로 쓴다"}, {"t": "원리를 주지 않고 자료에서 찾게 한다", "d": "자료 제시 → 비교·탐색 → 패턴 발견 → 가설 형성 → 일반화.", "e": "여러 지역의 기후 자료를 비교해 기후 유형의 특징을 학생이 도출한다."}, {"t": "안내된 발견 — 도움을 점점 줄인다", "d": "처음에는 교사의 질문을 따라가지만, 이후 사고의 책임을 학생에게 넘긴다.", "e": "서울 여름 기온분포 지도 — “기온이 높은 곳부터 표시해 볼까요?” → “그 지역의 토지이용은?” → “공원이나 하천 주변과 비교하면?” → “가설을 만들어 볼까요?”"}, {"t": "나선형으로 다시 만나게 한다", "d": "한 차시의 단계가 아니라 교육과정 차원의 원리다. 반복은 다시 외우는 것이 아니라 더 강력한 방식으로 다시 이해하는 것이다.", "e": "같은 도시 발달 개념을 학년이 올라가며 다른 지역, 더 복잡한 사례로 다시 만난다."}], "attack": "결론을 먼저 알려 주고 사례로 확인만 시키는 수업은, 학생에게서 구조를 발견할 기회를 빼앗습니다.", "warn": "", "cls": ["원리를 먼저 알려 주지 않고, 여러 사례를 견주어 학생이 구조를 발견하게 한다.", "같은 원리를 여러 표상으로 옮기고, 학년이 올라가며 더 깊게 다시 만나게 한다."], "nc": "발견은 학생 혼자 알아서 찾게 두는 것이 아니다. 교사가 사례와 질문을 설계한다.", "defs": ["한 분야의 기본 개념과 원리, 그리고 그것들이 서로 이어지는 방식.", "지식을 나타내는 세 방식. 직접 해 보기(행동적), 그림·지도·도식(영상적), 말·기호·식(상징적). 필요에 따라 오간다.", "교사가 원리를 먼저 알려 주지 않고, 학생이 사례와 자료를 탐색하여 스스로 원리를 찾게 하는 학습.", "교사가 사례와 질문을 설계해 발견을 이끌고, 점차 도움을 줄여 가는 방식.", "같은 핵심 개념을 학년이 올라가며 더 깊고 복잡한 형태로 다시 배우도록 짠 교육과정."], "bg": "1957년 소련이 첫 인공위성을 쏘아 올리자, 미국은 자국 교육이 뒤처졌다는 충격에 빠졌다. 1959년 우즈홀에 과학자와 교육학자들이 모여 무엇을 어떻게 가르칠지 논의했고, 브루너는 그 결과를 『교육의 과정』(1960)으로 정리했다. 그가 본 문제는 두 가지였다. 학생들은 사실을 많이 외우지만 그것을 꿰는 원리는 모른다. 그리고 어려운 내용은 나이가 들어야 배울 수 있다는 통념이 널리 퍼져 있었다.", "props": [{"t": "사실이 아니라 지식의 구조를 가르치고, 나선형으로 다시 만나게 한다", "d": "낱낱의 사실보다 학문의 지식의 구조, 곧 기본 개념과 원리, 그리고 그것들이 이어지는 방식을 가르쳐야 한다. 브루너는 “어떤 교과든 지적으로 정직한 형태로 표현하면, 어떤 발달단계의 아동에게도 가르칠 수 있다”고 보았다. 같은 핵심 개념을 학년이 올라가며 더 깊게 다시 만나게 하는 것이 나선형 교육과정이다.", "b": ["지식의 구조", "나선형 교육과정"], "g": ["도시의 토지이용 뒤에는 ‘접근성이 좋은 곳일수록 땅값이 비싸고, 땅값이 쓰임새를 가른다’는 구조가 있다. 이 구조를 여러 학년에서 다시 만나게 한다.", {"ul": ["초등학교: 우리 동네에서 가게가 모이는 곳을 찾는다.", "중학교: 도심과 주거지역, 교외를 구분한다.", "고등학교: 지대와 도시 내부구조 이론으로 다룬다."]}]}, {"t": "같은 지식을 세 가지 방식으로 표현할 수 있다", "d": "지식은 직접 해 보는 행동적 표상, 그림과 지도로 나타내는 영상적 표상, 말과 기호로 나타내는 상징적 표상으로 옮길 수 있다. 셋은 순서대로 거치는 단계가 아니라 필요에 따라 오가는 방식이다.", "b": ["행동적 표상", "영상적 표상", "상징적 표상"], "g": ["같은 도시 구조를 세 가지로 만난다.", {"ul": ["도심에서 교외까지 직접 걸으며 건물의 높이와 쓰임새가 바뀌는 것을 본다(행동적).", "토지이용도에 색을 칠한다(영상적).", "“도심에서 멀어질수록 지대가 낮아진다”는 관계를 그래프와 문장으로 나타낸다(상징적)."]}]}, {"t": "결론을 주지 않고, 학생이 구조를 발견하게 한다", "d": "결론을 받아 적은 학생은 그것을 다른 상황에 쓰지 못하는 경우가 많다. 브루너는 학생이 자료를 비교하고 탐색하여 패턴을 찾고, 가설을 세워 일반화하는 발견학습을 강조했다. 이때 교사는 사례와 질문을 설계해 이끌고 점점 손을 뗀다. 이것이 안내된 발견이다.", "b": ["발견학습", "안내된 발견"], "g": ["교사가 “도시는 도심-주거지역-교외로 나뉜다”고 먼저 말하지 않는다. 서울, 부산, 대구의 토지이용도를 나란히 놓고 질문을 이어 간다. 뒤로 갈수록 교사의 질문을 줄인다.", {"ol": ["“세 도시에서 공통으로 보이는 배열은?”", "“왜 그런 배열이 생겼을까?”", "“다른 도시에도 맞을까?”"]}]}], "start": "학생이 스스로 찾아내야 할 관계는 무엇일까? 어떤 자료를 어떤 순서로 나란히 놓으면 그 관계가 보일까? (제안 ③)"}, {"k": "vygotsky", "who": "비고츠키", "en": "Vygotsky", "learn": "사고는 먼저 사람들 사이의 상호작용에서 일어나고, 그다음 개인에게 내면화된다.", "terms": ["사회적 상호작용", "내면화", "근접발달영역(ZPD)", "비계", "언어와 사고"], "design": [{"t": "혼자 할 수 있는 수준이 아니라 ZPD에 과제를 놓는다", "d": "같은 과제라도 학생마다 ZPD가 다르다. 좋은 교수는 모두에게 같은 양의 도움을 주는 것이 아니다.", "e": "산업입지 패턴 설명하기 — 혼자 가능한 학생 / “항구와의 거리를 비교해 볼까요?”라는 질문이 있으면 가능한 학생 / 접근성 개념부터 필요한 학생"}, {"t": "비계를 설계하고, 줄여 나간다", "d": "과제 단순화 · 자료 선택 지원 · 사고과정 시범 · 전략적 질문. 학생 대신 답을 만들어 주는 것이 아니다.", "e": "보조바퀴는 처음에 필요하지만 계속 달아 두면 혼자 타는 능력이 자라지 않는다."}, {"t": "말하게 한다", "d": "사회적 언어 → 사적 언어 → 내적 언어. 말하면서 생각 자체가 명료해진다.", "e": "지도를 분석할 때 교사가 무엇부터 보고 어떤 질문을 던지는지 함께 겪은 학생은, 나중에 혼자서도 그 질문을 던진다."}, {"t": "또래의 다른 시각을 부딪히게 한다", "d": "상호작용은 완성된 생각을 교환하는 데서 끝나지 않고 사고 자체를 바꾼다.", "e": "같은 인구이동 지도를 두고 한 학생은 일자리에, 다른 학생은 주택가격에, 또 다른 학생은 대학 위치에 주목한다."}], "attack": "각자 알아서 하라고 맡겨 두면 학생은 이미 할 수 있는 수준에 머뭅니다. 반대로 도움을 끝까지 유지하면 혼자 할 수 있게 되지 않습니다.", "warn": "", "cls": ["혼자서는 어렵지만 도움을 받으면 할 수 있는 수준에 과제를 놓는다.", "또래와 생각을 견주고 말로 설명하게 하며, 교사의 도움은 점차 줄인다."], "nc": "모둠활동을 한다고 모두 비고츠키식 수업은 아니다. 함께 해낸 것이 혼자 할 수 있는 것이 되어야 한다.", "defs": ["교사·또래와 함께 말하고 생각하는 과정. 학습은 여기서 먼저 일어난다.", "다른 사람과 함께 하던 사고가 점차 자기 스스로의 사고가 되는 과정.", "혼자 할 수 있는 수준과, 도움을 받으면 할 수 있는 수준 사이의 영역.", "근접발달영역 안에서 과제를 해낼 수 있도록 주는 일시적 도움. 능숙해지면 줄여 나간다.", "언어는 생각을 전하는 도구일 뿐 아니라 생각을 만드는 도구다. 말하면서 사고가 정리된다."], "bg": "비고츠키는 1920~30년대 소련에서 활동한 심리학자다. 서른일곱에 세상을 떠났고, 그의 저작은 1960~70년대에 와서야 서구에 알려졌다. 같은 시기 피아제는 아이가 혼자 세상을 탐구하며 발달하는 모습에 주목했다. 비고츠키는 아이가 언제나 부모, 교사, 친구 사이에서, 그리고 언어라는 도구를 쓰며 배운다는 점에 주목했다. 그는 지능검사가 아이가 혼자 할 수 있는 것만 잰다는 데에도 문제를 느꼈다. 혼자 푸는 수준이 같은 두 아이라도, 약간의 도움을 받았을 때 풀 수 있는 수준은 크게 다를 수 있었다.", "props": [{"t": "생각은 먼저 사람들 사이에서 일어나고, 그다음 개인의 것이 된다", "d": "사고는 먼저 사람들 사이의 사회적 상호작용 속에서 나타나고, 그다음 개인 안으로 옮겨 온다. 이것이 내면화다. 이때 핵심 도구가 언어다. 남과 나누던 말이 혼잣말이 되고, 다시 속으로 하는 생각이 된다. 말은 생각을 전하는 도구일 뿐 아니라 생각을 만드는 도구다.", "b": ["사회적 상호작용", "내면화"], "g": ["화살표가 복잡하게 얽힌 인구 이동 유선도는 학생 혼자 읽기 어렵다. 교사는 “먼저 범례를 보고, 가장 굵은 화살표를 찾고, 어디서 어디로 가는지 본다”처럼 자기 생각을 소리 내어 보여 준다. 학생들은 짝과 함께 읽으며 서로의 해석을 말로 견준다. 한 학생은 일자리를, 다른 학생은 집값을 볼 때, 그 차이가 서로의 생각을 넓힌다. 이렇게 함께 쓰던 질문 방식은 나중에 학생 혼자 지도를 읽을 때의 생각이 된다."]}, {"t": "혼자 할 수 있는 수준이 아니라, 도움을 받으면 할 수 있는 수준에 과제를 놓는다", "d": "혼자 할 수 있는 수준과 도움을 받으면 할 수 있는 수준 사이를 근접발달영역(ZPD)이라 한다. 좋은 가르침은 이 영역에 과제를 놓는다. 이 영역 안에서 주는 일시적 도움을 오늘날 비계라고 부른다. 과제를 단순화하거나, 자료를 골라 주거나, 생각하는 과정을 시범 보이거나, 전략적인 질문을 던지는 것이다. 학생이 능숙해지면 도움을 줄여 나간다.", "b": ["근접발달영역(ZPD)", "비계"], "g": ["같은 유선도를 두고도 학생마다 서 있는 자리가 다르다.", {"ul": ["혼자 해석하는 학생", "“수도권으로 들어오는 화살표만 따로 볼까요?”라는 힌트 하나면 해내는 학생", "유선도 읽는 법부터 필요한 학생"]}, "비고츠키식 수업은 모두에게 같은 도움을 주지 않는다. 필요한 만큼만 돕고, 스스로 이어 가면 물러난다. 마지막에는 새 지도를 혼자 설명하게 해, 함께 한 생각이 자기 것이 되었는지 확인한다."]}], "start": "학생 혼자서는 어디에서 막힐까? 그때 누구와 무엇을 주고받게 하고, 교사는 어디까지 도울까? (제안 ①·②)"}], "APPLY": {"gagne": {"stairs": true, "flow": [["① 구체적 개념", "저지대 · 포장면 · 빗물받이를 사진과 지도에서 가리킨다"], ["② 정의된 개념", "불투수면 · 지표 유출 · 배수능력을 정의하고 쓴다"], ["③ 규칙", "불투수면이 늘면 유출이 는다. 모이는 물이 빠지는 물보다 많으면 쌓인다"], ["④ 문제해결", "강남역은 왜 심하게 잠겼나? 어떻게 줄일까?"]], "steps": [{"p": "거꾸로 묻는다", "d": "‘강남역 침수를 설명하기’를 하려면 무엇을 먼저 할 수 있어야 하나? 이 물음을 한 계단씩 아래로 내려가며 반복하면 위의 계단이 된다."}, {"p": "개념의 종류에 따라 가르치는 방법이 다르다", "d": "저지대·포장면 같은 구체적 개념은 여러 사진과 지도를 보고 공통점을 찾는다. 불투수면·배수능력 같은 정의된 개념은 정의를 먼저 주고 자료에 적용한다."}, {"p": "아래 계단을 확인한 뒤 올라간다", "d": "수업 첫머리에 “등고선에서 낮은 곳을 찾을 수 있나요?”처럼 선수 능력을 확인한다. 안 되면 그 계단부터 다시 한다."}]}, "piaget": {"flow": [["기존 설명", "“비가 function taskBox(photo){
  return '<div class="taskbox">'+(photo?'<img class="tphoto" src="'+FLOOD+'" alt="폭우로 물에 잠긴 도시의 교차로">':'')+
   '<p class="gk">'+esc(T.title)+'</p>'+
   T.prob.map(function(t){return '<p class="gp">'+esc(t)+'</p>';}).join("")+
   '<p class="gk" style="margin:18px 0 8px">사용 가능한 자료</p>'+
   '<ul class="mats">'+T.mats.map(function(t){return '<li>'+esc(t)+'</li>';}).join("")+'</ul>'+
   '<p class="gq">'+esc(T.q)+'</p></div>';}

/* 학습지 */
function key(i,g,j,k){return i+"-"+g+"-"+j+"-"+k;}
function walk(fn){D.SHEET.forEach(function(b,i){b.groups.forEach(function(G,g){
  G.rows.forEach(function(x,j){x.a.forEach(function(ans,k){fn(key(i,g,j,k),ans);});});});});}
function total(){var n=0;walk(function(){n++;});return n;}
function filled(r){var n=0;walk(function(kk){if(has(S[r][kk]))n++;});return n;}
function scoreOf(r){var ok=0;walk(function(kk,ans){if(norm(S[r][kk])===norm(ans))ok++;});return ok;}
function worksheet(r,show){
  var ro=show; show=show&&r==="r2";
  return D.SHEET.map(function(b,i){
    return '<div class="wsblock"><h4>'+esc(b.who)+'<span class="wsq">'+esc(b.q)+'</span></h4>'+
     b.groups.map(function(G,g){
       return '<p class="wsh">'+esc(G.h)+'</p><ul class="wslist">'+
        G.rows.map(function(x,j){
          var out="",wrong=false;
          x.seg.forEach(function(t,k){
            out+='<span>'+esc(t)+'</span>';
            if(k<x.a.length){
              var val=S[r][key(i,g,j,k)]||"",cls="";
              if(show){cls=(norm(val)===norm(x.a[k]))?" ok":" no";
                if(norm(val)!==norm(x.a[k]))wrong=true;}
              out+='<input type="text" class="'+cls+'" data-f="'+r+'|'+key(i,g,j,k)+'" value="'+
                esc(val)+'"'+(ro?" readonly":"")+'>';}});
          return '<li'+(x.a.length?'':' class="plain"')+'>'+out+
            (show&&wrong?'<span class="ansline">'+x.a.map(esc).join(" · ")+'</span>':'')+'</li>';
        }).join("")+'</ul>';}).join("")+
     '</div>';}).join("");}

function vSheet(){
  var n=filled("r1"),tot=total();
  var h='<h2 class="sect">먼저 풀기</h2>'+
   '<p class="sd" style="margin-bottom:20px">오늘 알아야 할 것입니다. 지금 아는 만큼만 채웁니다. '+n+' / '+tot+'</p>'+
   worksheet("r1",S.r1done);
  if(!S.r1done)
    h+='<div style="margin-top:18px"><button class="keyb" id="r1sub">제출</button></div>';
  else h+='<div class="score"><b>'+scoreOf("r1")+' / '+tot+'</b><span class="sub"> · 1차 · 정답은 ‘다시 풀기’를 제출한 뒤에 공개됩니다</span></div>';
  return h;}

/* 상황 */
function vCase(){
  return '<h2 class="sect">모집단: 역할 나누기</h2>'+
   '<p class="sd" style="margin-bottom:20px">다섯 명이 한 모둠입니다. 다섯 학자가 같은 과제를 받습니다.</p>'+taskBox(true)+
   '<h3 class="sh">맡을 학자</h3>'+
   '<p class="sd">모둠에서 다섯 학자를 한 명씩 나누어 맡습니다. 한 번 정하면 바꾸기 어렵습니다.</p>'+
   pickRow();}
function pickRow(){
  var h='<div class="qrow">'+SC.map(function(x){
    var me=S.mine===x.k,off=S.lock&&!me;
    return '<button class="qc" data-mine="'+x.k+'" aria-pressed="'+me+'"'+(off?' disabled':'')+'>'+
     '<span class="qn">'+esc(x.who)+'<span class="qe">'+x.en+'</span></span></button>';}).join("")+'</div>';
  if(S.lock)h+='<p class="relock">맡은 학자 <b>'+esc(nameOf(S.mine))+'</b>'+
   '<button id="unlock">맡은 학자 바꾸기</button></p>';
  return h;}

/* 전문가 회의 */
var DOC={};
SC.forEach(function(c){
  DOC[c.k+"-learn"]=c.learn;
  c.design.forEach(function(d,i){DOC[c.k+"-d"+i]=d.d;DOC[c.k+"-e"+i]=d.e;});
  DOC[c.k+"-atk"]=c.attack;
  c.cls.forEach(function(t,i){DOC[c.k+"-c"+i]=t;});
  c.defs.forEach(function(t,i){DOC[c.k+"-t"+i]=t;});
  DOC[c.k+"-nc"]=c.nc;
  DOC[c.k+"-bg"]=c.bg;
  c.props.forEach(function(p,i){DOC[c.k+"-q"+i]=p.d;
    p.g.forEach(function(b,j){
      if(typeof b==="string")DOC[c.k+"-q"+i+"g"+j]=b;
      else (b.ul||b.ol).forEach(function(t,l){DOC[c.k+"-q"+i+"g"+j+"l"+l]=t;});});});
  AP[c.k].steps.forEach(function(x,i){DOC[c.k+"-p"+i]=x.p;DOC[c.k+"-s"+i]=x.d;});});
function marksOf(id){return (S.marks[id]||[]).slice().sort(function(a,b){return a.s-b.s;});}
function H(id){var t=DOC[id],p=0,out="";
  marksOf(id).forEach(function(m,i){
    out+=esc(t.slice(p,m.s))+'<mark data-mi="'+i+'">'+esc(t.slice(m.s,m.e))+'</mark>';p=m.e;});
  return '<span class="hl" data-doc="'+id+'">'+out+esc(t.slice(p))+'</span>';}
function hlSel(){
  var sl=window.getSelection();if(!sl||sl.isCollapsed||!sl.rangeCount)return;
  var r=sl.getRangeAt(0);
  function host(n){n=n.nodeType===3?n.parentNode:n;return n&&n.closest?n.closest(".hl"):null;}
  var a=host(r.startContainer);if(!a||a!==host(r.endContainer))return;
  var id=a.dataset.doc,t=DOC[id],pre=document.createRange();
  pre.selectNodeContents(a);pre.setEnd(r.startContainer,r.startOffset);
  var st=pre.toString().length,en=st+r.toString().length;
  while(st<en&&/\s/.test(t[st]))st++;while(en>st&&/\s/.test(t[en-1]))en--;
  if(en-st<2)return;
  var keep=marksOf(id).filter(function(m){return m.e<=st||m.s>=en;});
  keep.push({s:st,e:en});S.marks[id]=keep;
  sl.removeAllRanges();save();paint();}
function unmark(el,mi){var id=el.dataset.doc,arr=marksOf(id);if(!arr[mi])return;
  arr.splice(mi,1);S.marks[id]=arr;save();paint();}
var pm=false,tt=null,sk="";
function snap(){var sl=window.getSelection();
  if(!sl||sl.isCollapsed||!sl.rangeCount)return "";
  var r=sl.getRangeAt(0);return sl.toString()+"@"+r.startOffset+"-"+r.endOffset;}
if(window.PointerEvent)document.addEventListener("pointerdown",function(e){pm=(e.pointerType!=="mouse");},true);
else{document.addEventListener("touchstart",function(){pm=true;},{passive:true,capture:true});
 document.addEventListener("mousedown",function(){pm=false;},true);}
document.addEventListener("selectionchange",function(){
  if(tt){clearTimeout(tt);tt=null;}
  if(!pm)return;var k=snap();if(!k)return;sk=k;
  tt=setTimeout(function(){tt=null;if(snap()===sk)hlSel();},450);});

function card(c,live,rest){
  function tx(id,txt){return live?H(id):esc(txt);}
  return '<div class="card2">'+(rest?'':'<h2>'+esc(c.who)+'<span class="en2">'+c.en+'</span></h2>'+
   '<p class="ck">학습이란</p><p class="cv">'+tx(c.k+"-learn",c.learn)+'</p>'+
   '<p class="ck">핵심 개념</p><div class="terms">'+c.terms.map(function(t){
     return '<span class="tg">'+esc(t)+'</span>';}).join("")+'</div>')+
   '<p class="ck">수업을 이렇게 설계한다</p>'+
   c.design.map(function(d,i){
     return '<div class="dz"><h4>'+esc(d.t)+'</h4><p>'+tx(c.k+"-d"+i,d.d)+'</p>'+
      '<p class="ex">'+tx(c.k+"-e"+i,d.e)+'</p></div>';}).join("")+
   (c.warn?'<div class="warn">'+esc(c.warn)+'</div>':'')+
   '<p class="ck">비판하는 것</p><p class="cv">'+tx(c.k+"-atk",c.attack)+'</p></div>';}
var NUM=["①","②","③","④"];
function story(c,live){
  function tx(id,t){return live?H(id):esc(t);}
  var q="";D.SHEET.forEach(function(b){if(b.k===c.k)q=b.q;});
  function bold(html,terms){terms.slice().sort(function(a,b){return b.length-a.length;}).forEach(function(t){
    var e=esc(t);html=html.split(e).join('<strong>'+e+'</strong>');});return html;}
  return '<div class="story"><h2>'+esc(c.who)+'<span class="en2">'+c.en+'</span><span class="bq">'+esc(q)+'</span></h2>'+
   '<p class="sk">배경</p><p class="sv">'+tx(c.k+"-bg",c.bg)+'</p>'+
   c.props.map(function(p,i){
     return '<div class="prop"><p class="sk">제안 '+NUM[i]+'</p><h4>'+esc(p.t)+'</h4>'+
      '<p class="sv">'+bold(tx(c.k+"-q"+i,p.d),p.b)+'</p>'+
      '<div class="geo"><p class="gl">지리수업에서는</p>'+
      p.g.map(function(b,j){
        if(typeof b==="string")return '<p>'+tx(c.k+"-q"+i+"g"+j,b)+'</p>';
        var tag=b.ul?"ul":"ol";
        return '<'+tag+'>'+(b.ul||b.ol).map(function(t,l){return '<li>'+tx(c.k+"-q"+i+"g"+j+"l"+l,t)+'</li>';}).join("")+'</'+tag+'>';}).join("")+
      '</div></div>';}).join("")+
   '<p class="ncl"><b>혼동하지 말 것</b>'+tx(c.k+"-nc",c.nc)+'</p></div>';}
function brief(c){
  var q="";D.SHEET.forEach(function(b){if(b.k===c.k)q=b.q;});
  return '<div class="brief2"><h2>'+esc(c.who)+'<span class="en2">'+c.en+'</span><span class="bq">'+esc(q)+'</span></h2>'+
   '<dl><dt>학습이란</dt><dd>'+H(c.k+"-learn")+'</dd>'+
   '<dt>핵심 개념</dt><dd class="gl">'+c.terms.map(function(t,i){return '<div class="gr"><b>'+esc(t)+'</b><span>'+H(c.k+"-t"+i)+'</span></div>';}).join("")+'</dd>'+
   '<dt>수업에서는</dt><dd>'+c.cls.map(function(t,i){return '<p>'+H(c.k+"-c"+i)+'</p>';}).join("")+'</dd>'+
   '<dt>혼동하지 말 것</dt><dd class="nc">'+H(c.k+"-nc")+'</dd></dl></div>';}
function applyBox(k,live){
  var a=AP[k];
  function tx(id,txt){return live?H(id):esc(txt);}
  var fl=a.flow.map(function(f,i){
    return (i?'<span class="fa" aria-hidden="true">→</span>':'')+
     '<div class="fi"'+(a.stairs?' style="margin-bottom:'+(i*18)+'px"':'')+'>'+
     '<span class="fl">'+esc(f[0])+'</span><span class="ft">'+esc(f[1])+'</span></div>';}).join("");
  return '<div class="apply"><p class="ah">도시 침수 수업 예시</p><h3>'+esc(nameOf(k))+'의 수업</h3>'+
   '<div class="flow'+(a.stairs?' stairs':'')+'">'+fl+'</div>'+
   a.steps.map(function(x,i){
     return '<div class="pstep"><p class="pp">'+tx(k+"-p"+i,x.p)+'</p>'+
      '<p class="pd">'+tx(k+"-s"+i,x.d)+'</p></div>';}).join("")+'</div>';}
function vExpert(){
  var h='<h2 class="sect">전문가 집단</h2>'+
   '<p class="sd" style="margin-bottom:20px">같은 학자를 맡은 사람끼리 모입니다. 학자의 이야기를 함께 읽고, 그 학자라면 도시침수 자료를 학생에게 어떻게 만나게 할지 정합니다.</p>';
  if(!has(S.mine)){h+='<div class="lockrow">‘모집단: 역할 나누기’에서 맡을 학자를 정하면 자료가 열립니다.</div>';return h;}
  var n=0;Object.keys(S.marks).forEach(function(k){n+=S.marks[k].length;});
  h+='<div class="toolbar2">글자를 긁으면 표시됩니다 · 표시를 누르면 지워집니다'+
   (n?' · 표시한 곳 '+n:'')+'</div>'+
   story(sc(S.mine),true)+
   '<h3 class="sh">전문가 집단 과제</h3>'+taskBox()+
   script(S.mine);
  return h;}
function rm(w){var c=w.charCodeAt(w.length-1)-44032;return (c>=0&&c<11172&&c%28)?"이라면":"라면";}
function script(k){
  var v=S.cmp[k]||{};
  return '<div class="script"><p class="ah">생각의 출발점 · 모집단에서 설명할 내용</p><h3>'+esc(nameOf(k))+rm(nameOf(k))+'</h3>'+
   '<p class="sq">'+esc(sc(k).start)+'</p>'+
   '<textarea data-c="'+k+'|2" rows="4">'+esc(v[2]||"")+'</textarea>'+
   '<p class="sn">여기 쓴 내용은 ‘서로 가르치기’ 표의 '+esc(nameOf(k))+' 줄 셋째 칸에 그대로 들어갑니다.</p></div>';}

/* 돌아가며 설명하기 */
function vTeach(){
  var h='<h2 class="sect">모집단: 서로 가르치기</h2>'+
   '<p class="sd" style="margin-bottom:20px">원래 모둠으로 돌아갑니다. '+
   '자기 학자를 차례로 설명하고, 듣는 동안 표를 채웁니다.</p>'+
   '<div class="scroll"><table class="cmpt"><thead><tr><th></th>'+
    D.CCOLS.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr></thead><tbody>'+
   WHO.map(function(w){
     var me=S.mine===w[0];
     return '<tr'+(me?' class="me"':'')+'><th>'+w[1]+(me?'<small>내 학자</small>':'')+'</th>'+
      D.CCOLS.map(function(_,j){
        return '<td><textarea rows="2" data-c="'+w[0]+'|'+j+'">'+
         esc((S.cmp[w[0]]||{})[j]||"")+'</textarea></td>';}).join("")+'</tr>';}).join("")+
   '</tbody></table></div>';
  return h;}

/* 학습지 (2) */
function vRecap(){
  var n=filled("r2"),tot=total();
  var h='<h2 class="sect">다시 풀기</h2>'+
   '<p class="sd" style="margin-bottom:20px">수업을 시작할 때 푼 것과 같은 학습지입니다. '+n+' / '+tot+'</p>'+
   worksheet("r2",S.r2done);
  if(!S.r2done)
    h+='<div style="margin-top:18px"><button class="keyb" id="r2sub">제출</button></div>';
  else{
    h+='<div class="score"><b>'+scoreOf("r2")+' / '+tot+'</b><span class="sub"> · 2차</span>'+
     (S.r1done?'<div class="cmpbar">1차 '+scoreOf("r1")+' / '+tot+' → 2차 '+scoreOf("r2")+' / '+tot+'</div>':'')+
     '</div>'+
     '<h3 class="sh">교수자 종합</h3>'+
     '<div class="scroll"><table class="cmpt syn"><thead><tr><th></th>'+D.CCOLS.map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr></thead><tbody>'+
     D.SYN.map(function(r){return '<tr><th>'+r[0]+'</th><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>';}).join("")+
     '</tbody></table></div>'+
     '<div class="step" style="margin-top:28px"><h3><b>·</b>다섯 자료 모두 보기</h3>'+
     '<p class="sd"><button class="keyb" id="allc">'+(S.open?"닫기":"펼치기")+'</button></p>'+
     (S.open?SC.map(function(c){return story(c,false)+applyBox(c.k,false);}).join(""):"")+'</div>';}
  return h;}

/* 정리 */
function summary(){
  var L=["4강 학습이론 — 기록"];
  if(has(S.mine))L.push("맡은 학자: "+nameOf(S.mine));
  if(S.r1done)L.push("학습지 1차: "+scoreOf("r1")+"/"+total());
  if(S.r2done)L.push("학습지 2차: "+scoreOf("r2")+"/"+total());
  var mk=Object.keys(S.marks||{});
  if(mk.length){L.push("");L.push("■ 표시한 대목");
    mk.forEach(function(id){marksOf(id).forEach(function(m){
      L.push("  · "+DOC[id].slice(m.s,m.e));});});}
  var ck=Object.keys(S.cmp||{});
  if(ck.length){L.push("");L.push("■ 비교표");
    WHO.forEach(function(w){var v=S.cmp[w[0]]||{};
      var r=D.CCOLS.map(function(_,j){return v[j]||"—";});
      if(r.some(function(x){return x!=="—";}))L.push("  "+w[1]+(S.mine===w[0]?" (내 학자)":"")+": "+r.join(" / "));});}
  if(L.length===1)L.push("(아직 기록이 없음)");
  return L.join("\n");}

var V={sheet:vSheet,case:vCase,expert:vExpert,teach:vTeach,recap:vRecap};
function paint(){
  var fn=V[S.tab]||V[TABS[0][0]];
  $("#main").innerHTML=head()+tabs()+fn()+foot();
  bind();window.scrollTo(0,0);}
function bind(){
  qq("[data-tab]").forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;save();paint();};});
  qq("[data-mine]").forEach(function(b){b.onclick=function(){
    var k=b.dataset.mine;if(S.lock||S.mine===k)return;
    if(!window.confirm(nameOf(k)+" — 이 학자를 맡습니다.\n모둠에서 정한 대로 골랐나요? 정한 뒤에는 바꾸기 어렵습니다."))return;
    S.mine=k;S.lock=true;save();paint();};});
  if($("#unlock"))$("#unlock").onclick=function(){
    if(!window.confirm("모둠에서 다시 정했을 때만 바꿉니다.\n바꾸면 전문가 집단에서 표시한 내용과 설명 대본이 지워집니다. 계속할까요?"))return;
    if(!window.confirm("정말 바꿀까요?"))return;
    if(S.mine)delete S.cmp[S.mine];
    S.mine="";S.lock=false;S.marks={};save();paint();};
  qq("[data-f]").forEach(function(el){el.oninput=function(){
    var p=el.dataset.f.split("|");S[p[0]][p[1]]=el.value;save();};});
  qq("[data-fin]").forEach(function(el){el.oninput=function(){S.fin=el.value;save();};});
  qq("[data-c]").forEach(function(el){el.oninput=function(){
    var p=el.dataset.c.split("|");
    if(!S.cmp[p[0]])S.cmp[p[0]]={};
    S.cmp[p[0]][p[1]]=el.value;save();};});
  qq(".hl").forEach(function(el){
    el.onmouseup=function(){setTimeout(hlSel,0);};
    el.ontouchend=function(){setTimeout(hlSel,250);};
    el.onclick=function(e){var sl=window.getSelection();if(sl&&!sl.isCollapsed)return;
      if(e.target.tagName==="MARK")unmark(el,+e.target.dataset.mi);};});
  if($("#r1sub"))$("#r1sub").onclick=function(){S.r1done=true;save();paint();};
  if($("#r2sub"))$("#r2sub").onclick=function(){S.r2done=true;save();paint();};
  if($("#allc"))$("#allc").onclick=function(){S.open=!S.open;save();paint();};
  if($("#print"))$("#print").onclick=function(){try{window.print();}catch(e){}};
  if($("#copy"))$("#copy").onclick=function(){copyText(summary());};
  if($("#clear"))$("#clear").onclick=function(){
    if(!window.confirm("이 기기에 저장된 내용을 모두 지웁니다. 계속할까요?"))return;
    try{localStorage.removeItem(KEY);}catch(e){}
    S=bl();save();paint();};
  $("#brand").onclick=function(){S.tab="sheet";save();paint();};}
function flash(t){var e=$("#msg");if(e){e.textContent=t;setTimeout(function(){e.textContent="";},2600);}}
function copyText(t){
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";
    document.body.appendChild(a);a.select();
    try{document.execCommand("copy");flash("복사했습니다");}catch(x){flash("복사하지 못했습니다");}
    document.body.removeChild(a);}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(function(){flash("복사했습니다");},fb);
  else fb();}

load();paint();
})();
</script>
