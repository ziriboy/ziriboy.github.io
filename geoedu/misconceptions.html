<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지리교과교육론 · 지리 오개념</title>
<style>
/* ═══ 수업자료 공통 스타일 v2 — 매주 이 블록을 그대로 재사용 ═══
   폭: --w 하나로 정한다. 980px = 본문 920px + 좌우 여백 30px씩.
       아이패드 가로(1,024px 이상)에 맞춘 최대 폭이며, 더 좁은 화면에서는 화면에 맞춰 줄어든다.
       본문 블록에는 따로 max-width를 주지 않는다 — 머리글과 본문의 양 끝이 같은 선에 온다.
   좁은 화면: 640px 이하(휴대폰)에서만 세로로 쌓는다. 아이패드는 세로로 들어도 같은 배치. */
:root{
  --ink:#111517; --mid:#525C60; --soft:#8A9296;
  --line:#E2E5E2; --line2:#EFF1EE; --wash:#F5F7F5;
  --acc:#0E5A50; --acc-w:#E2EFEA; --red:#A03A26;
  --mark:#F6E7B8;
  --warn-l:#E7D8B6; --warn-b:#FCF7EB; --warn-t:#6D5421;
  --f:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --w:980px; --hh:56px;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--f);font-size:16px;
  line-height:1.75;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:var(--w);margin:0 auto;padding:9px 30px;display:flex;align-items:center;gap:18px}
.brand{background:none;border:none;cursor:pointer;padding:0;text-align:left;line-height:1.3}
.brand .c{display:block;font-size:11.5px;color:var(--soft)}
.brand .n{display:block;font-size:14.5px;font-weight:600}
.switch{margin-left:auto;display:flex;gap:3px;overflow:auto}
.switch button{background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;
  padding:5px 10px;font-size:13px;color:var(--mid);white-space:nowrap}
.switch button:hover{border-color:var(--line);color:var(--ink)}
.switch button[aria-current="true"]{background:var(--acc-w);color:var(--acc);font-weight:600}
.switch b{color:var(--soft);font-weight:600;margin-right:5px}
.switch button[aria-current="true"] b{color:var(--acc)}

main{max-width:var(--w);margin:0 auto;padding:44px 30px 110px}
.stage{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.06em;margin:0 0 6px}
h1{font-size:33px;font-weight:700;letter-spacing:-.03em;line-height:1.25;margin:0 0 14px}
.lead{color:var(--mid);font-size:16.5px;margin:0 0 32px;max-width:70ch}
.lead b{color:var(--ink)}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px;margin-top:28px}
.mcard{text-align:left;background:none;border:1px solid var(--line);border-radius:12px;
  padding:24px;cursor:pointer;transition:border-color .12s}
.mcard:hover{border-color:var(--acc)}
.mcard .k{font-size:12.5px;color:var(--acc);font-weight:600;letter-spacing:.06em}
.mcard h3{margin:6px 0 8px;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.mcard p{margin:0;color:var(--mid);font-size:14.5px;line-height:1.65}
.mcard .m{margin-top:14px;font-size:13px;color:var(--soft)}
.arc{margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line2);
  font-size:14.5px;color:var(--mid);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arc span{background:var(--wash);border-radius:6px;padding:4px 10px;color:var(--ink)}
.arc i{font-style:normal;color:var(--soft)}

.concept{background:var(--wash);border-radius:10px;padding:20px 24px;margin:6px 0 26px}
.concept h3{margin:0 0 10px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.concept dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:7px 16px;margin:0;font-size:15px}
.concept dt{font-weight:600}
.concept dd{margin:0;color:var(--mid)}
.concept p{margin:12px 0 0;font-size:14.5px;color:var(--mid)}
.concept p b{color:var(--ink)}

.step{margin-bottom:46px}
.step>h3{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.step>h3 b{color:var(--acc);margin-right:9px}
.step>.d{margin:0 0 16px;color:var(--mid);font-size:14.5px;max-width:74ch}

.opt,.tag{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;
  padding:6px 12px;font-size:14px;color:var(--mid)}
.opt:hover,.tag:hover{border-color:var(--acc);color:var(--ink)}
.opt[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt:disabled:hover{border-color:var(--line);color:var(--mid)}
textarea,.inp{width:100%;min-height:96px;border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;resize:vertical;background:none;line-height:1.7}
.inp{min-height:0;padding:7px 11px}
textarea:focus,.inp:focus{border-color:var(--acc);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.notice{border:1px solid var(--warn-l);background:var(--warn-b);border-radius:9px;
  padding:14px 18px;color:var(--warn-t);font-size:14.5px;margin:14px 0}
.count{font-size:14px;color:var(--mid)}
.count b{color:var(--acc);font-weight:700}

.foot{margin-top:54px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:18px;font-size:14px;color:var(--mid);flex-wrap:wrap}
.foot button{background:none;border:none;cursor:pointer;color:var(--mid);padding:0}
.foot button:hover{color:var(--ink)}
.foot .msg{color:var(--acc)}
@media(max-width:640px){
  .hin,main{padding-left:16px;padding-right:16px}
  .brand .c{display:none} h1{font-size:26px} .switch .lb{display:none}
  .concept dl{grid-template-columns:1fr}
}
/* ═══ 공통 스타일 v2 끝 ═══ */

html{overflow-y:scroll}

/* 판단 버튼 (내 판단 = 채움, 논문 분류 = 테두리) */
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{background:none;border:1px solid var(--line);border-radius:14px;cursor:pointer;
  padding:0 12px;font-size:13.5px;color:var(--mid);line-height:1.9}
.seg button:hover{border-color:var(--acc);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.seg button.ref{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--mid);align-items:center;margin:0 0 14px}
.legend i{display:inline-block;width:22px;height:14px;border-radius:8px;vertical-align:-2px;margin-right:7px;box-sizing:border-box}
.legend .a{background:var(--acc)}
.legend .r{border:1px solid var(--line);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}

/* 읽기 */
.rd h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:40px 0 10px;line-height:1.4}
.rd h2:first-child{margin-top:0}
.rd p{margin:0 0 12px;font-size:15.5px;line-height:1.85}
.rd p b{font-weight:600}
.rd .src,.src{font-size:12.5px;color:var(--soft);white-space:nowrap}
.rd ul{margin:0 0 14px;padding-left:20px;font-size:15px;line-height:1.8}
.rd li{margin:3px 0}
.rd li b{font-weight:600}
.qt{border-left:2px solid var(--acc);padding:2px 0 2px 16px;margin:10px 0 16px;font-size:15.5px;line-height:1.85}
.qt .src{display:block;margin-top:2px}
.ex{border:1px solid var(--line);border-radius:8px;padding:14px 18px 4px;margin:4px 0 18px}
.ex .ex-k{display:block;font-size:12.5px;font-weight:600;color:var(--acc);letter-spacing:.04em;margin-bottom:4px}
.rd .ex p{font-size:15px;line-height:1.8;color:var(--mid)}
@media print{.ex{break-inside:avoid}}
.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:8px 0 18px}
.terms div{border-top:2px solid var(--line);padding-top:10px}
.terms div.em{border-top-color:var(--acc)}
.terms h4{margin:0 0 4px;font-size:16px;font-weight:700}
.terms h4 small{font-weight:400;color:var(--soft);font-size:12.5px;margin-left:6px}
.terms p{margin:0;font-size:14px;line-height:1.7;color:var(--mid)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0 18px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 10px 9px 0;border-bottom:1px solid var(--line2);line-height:1.65}
.tbl th{font-weight:600;white-space:nowrap;width:170px}
.tbl thead th{font-size:12.5px;color:var(--soft);font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{color:var(--mid)}
.tbl td b{color:var(--ink);font-weight:600}

/* 사례 판단 */
.cases{border-top:1px solid var(--line)}
.case{padding:18px 0;border-bottom:1px solid var(--line2)}
.case .h{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 18px;align-items:baseline}
.case .h .seg{margin:0;flex-wrap:nowrap}
.case .no{font-size:13px;font-weight:700;color:var(--acc)}
.case .s{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.55}
.rv{margin:12px 0 0 34px;padding:12px 16px;background:var(--wash);border-radius:8px;font-size:14.5px;line-height:1.75}
.rv .ty{font-weight:700;color:var(--ink)}
.rv .ty .src{margin-left:8px;font-weight:400}
.rv dl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;margin:6px 0 0}
.rv dt{color:var(--soft);font-size:13px;padding-top:1px}
.rv dd{margin:0;color:var(--mid)}
.chip{display:inline-block;font-size:12.5px;line-height:1.6;padding:0 9px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--ink);margin:0 5px 4px 0}
.rv .chips{display:flex;flex-wrap:wrap;gap:0;margin:1px 0 2px}
.rv .nt{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--warn-t);font-size:13.5px}
.dist{margin-top:26px;border-top:2px solid var(--acc);padding-top:16px}
.dist h4{margin:0 0 12px;font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em}
.bars{display:grid;grid-template-columns:200px minmax(0,1fr) 92px;gap:7px 14px;align-items:center;font-size:14px;max-width:760px}
.bars .bt{height:12px;background:var(--line2);border-radius:2px;position:relative}
.bars .bt i{position:absolute;left:0;top:0;bottom:0;background:#9AA3A6;border-radius:2px}
.bars .bt i.top{background:var(--acc)}
.bars .n{color:var(--mid);font-size:13px;text-align:right}
.dist .ml{margin:10px 0 0;padding-left:20px;font-size:14.5px;color:var(--mid);line-height:1.8;max-width:820px}
.dist p{font-size:14.5px;color:var(--mid);line-height:1.8;margin:14px 0 0;max-width:820px}

.subjs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.subj{background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:8px 16px;text-align:left;line-height:1.35}
.subj:hover{border-color:var(--acc)}
.subj b{display:block;font-size:14.5px;font-weight:600}
.subj span{display:block;font-size:12px;color:var(--soft)}
.subj[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-w)}
.grp{border:1px solid var(--line);border-radius:12px;padding:26px 30px 24px;margin:0 0 28px}
.grp .gt{margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.02em}
.grp .rd{max-width:none}
.grp .gs{margin:22px 0 4px;font-size:16px;font-weight:700;color:var(--acc)}
.grp .tbl.steps{max-width:none}
.grp .stp:first-of-type{border-top:none}
.why{list-style:none;padding:0!important}
.why li{padding:8px 0;border-bottom:1px solid var(--line2);margin:0!important}
.why li b{display:block;color:var(--ink)}
.tbl.steps{margin:4px 0 10px}
.tbl.steps th{width:130px}
.tbl.steps th b{color:var(--acc);margin-right:8px}
.tbl.num{max-width:620px;margin:4px 0 10px}
.tbl.num th{width:110px}
.tbl.num thead td{font-size:12.5px;color:var(--soft);font-weight:600}
.tbl.num tbody td{color:var(--ink);font-variant-numeric:tabular-nums}
.stp{display:grid;grid-template-columns:110px minmax(0,1fr);gap:0 26px;padding:22px 0;border-top:1px solid var(--line)}
.stp .lb{font-size:13px;font-weight:700;color:var(--acc);line-height:1.5;padding-top:3px}
.stp .lb span{display:block;font-weight:400;color:var(--soft);font-size:12.5px;margin-top:2px}
.stp .big{font-size:18px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px;line-height:1.55}
.stp p{margin:0 0 10px;font-size:15px;line-height:1.8;color:var(--mid)}
.stp .sub{font-size:14.5px;color:var(--mid)}
.stp ul{margin:0;padding-left:20px;font-size:15px;line-height:1.85;color:var(--mid)}
.stp .mj{margin-left:10px;font-size:13px;color:var(--acc);font-weight:600}
.stp .cases{border-top:none}
.stp .legend{margin-top:2px}
.stp.em .lb{color:var(--ink)}
.map{display:block;width:100%;max-width:820px;height:auto;margin:10px 0 4px}
.map.eq{max-width:470px}
.map .ml{font-size:20px;fill:var(--ink);font-family:var(--f);font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5px}
.map.eq .ml{font-size:26px}
.cmpbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:18px 0 0}
.lk{background:none;border:none;padding:0;cursor:pointer;color:var(--acc);font-size:13.5px}
.lk:hover{text-decoration:underline}
.refs{margin-top:40px;padding-top:16px;border-top:1px solid var(--line2);font-size:13px;color:var(--mid);line-height:1.75}
.refs h4{margin:0 0 6px;font-size:12.5px;color:var(--soft);font-weight:600;letter-spacing:.04em}
.refs p{margin:0 0 3px;padding-left:2em;text-indent:-2em}

@media(max-width:640px){
  .terms{grid-template-columns:1fr}
  .tbl th{width:auto;white-space:normal}
  .case .h{grid-template-columns:30px minmax(0,1fr)}
  .case .h .seg{grid-column:2;margin-top:8px;flex-wrap:wrap}
  .rv{margin-left:0}
  .rv dl{grid-template-columns:1fr}
  .stp{grid-template-columns:1fr;gap:8px}
  .grp{padding:18px 16px}
  .bars{grid-template-columns:1fr 60px}
  .bars .bt{grid-column:1/-1;order:3}
}
@media print{
  header,.foot,.cmpbar,.lk{display:none!important}
  main{padding:0;max-width:none}
  .seg button,.rv,.bars i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .case{break-inside:avoid}
}
</style>
</head>
<body>

<header><div class="hin">
  <button class="brand" id="brand"><span class="c">지리교과교육론</span><span class="n" id="hn">지리 오개념</span></button>
  <div class="switch" id="sw"></div>
</div></header>
<main id="main"></main>

<script>
/* ═════ 출처 ═════ */
var K98='김진국·김일기, 1998', K13='김민성, 2013', K15='김민성, 2015', KT15='김태호, 2015';

/* ═════ 작용했을 배경 (판단 대상이 아니라 설명용 표지) ═════ */
var BG=[
 ['exp','생활 경험','자기가 살고 보고 겪은 것을 모든 경우로 넓힌다.'],
 ['word','낱말','용어의 글자 뜻이나 일상어의 의미로 이해한다.'],
 ['def','정의','비율, 평균, 기준 같은 정의를 덜 이해한다.'],
 ['text','교과서 설명','배운 설명을 예외 없이 모든 경우로 넓힌다.'],
 ['fig','지도·모식도','단순화된 그림이나 유형을 실제 그대로라고 여긴다.'],
 ['cue','한 가지 단서','여러 정보를 함께 보지 않고 한 가지 단서로 판단한다.']
];
var BN={};BG.forEach(function(b){BN[b[0]]=b;});

/* ═════ 문장 — 출처는 김민성(2013) 표 3. ok: 맞는 문장. both: 김진국·김일기(1998)에도 보고 ═════ */
var CASES=[
 {id:'scale',ok:0,both:1,g:['word'],s:'대축척 지도는 땅을 많이 줄인 지도다.',
  f:'대축척 지도는 덜 줄여서 좁은 지역을 자세히 나타낸 지도다. 많이 줄인 지도는 소축척 지도다.',
  w:'‘대(大)’라는 글자 때문에 많이 줄였다고 생각한다. 초·중등학교에서 줄곧 배우는 개념인데도 고등학생에게 남아 있다(김진국·김일기, 1998).'},
 {id:'basalt',ok:0,g:['exp','cue'],s:'제주도에서 물이 잘 빠지는 것은 현무암에 뚫린 구멍 때문이다.',
  f:'현무암의 구멍(기공)은 대부분 서로 이어져 있지 않아 그 자체로는 물이 잘 통하지 않는다. 물이 잘 빠지는 것은 용암이 식으며 생긴 틈(절리)과 용암류 사이의 엉성한 층을 따라 물이 스며들기 때문이다.',
  w:'돌하르방과 돌담에서 본 구멍 뚫린 현무암이 그대로 설명이 된다. 눈에 잘 띄는 한 가지 단서로 배수를 설명한다.'},
 {id:'pole',ok:1,src:K98,g:['exp'],s:'남극은 북극보다 더 춥다.',
  f:'남극은 해발고도가 높은 대륙이 두꺼운 빙상으로 덮여 있다. 북극은 대부분 바다여서 바다의 열이 기온을 누그러뜨린다. 그래서 남극이 훨씬 춥다.',
  w:'반대로 북극이 더 춥다고 생각하는 학생이 많다. 북반구에 살면서 ‘북쪽으로 갈수록 춥다’고 겪은 경험을 극지까지 넓힌다. 이런 선입관은 학교교육을 받아도 쉽게 바뀌지 않는다(김진국·김일기, 1998).'},
 {id:'growth',ok:0,both:1,g:['def','word'],s:'인구 증가율이 낮아지면 인구가 줄어든다.',
  f:'인구 증가율은 인구가 늘어나는 비율이다. 그 값이 작아지더라도 플러스인 한 총인구는 계속 늘어난다.',
  w:'비율과 절대적인 수를 구분하지 못한다. 증가율이 ‘감소’한다는 말을 인구가 ‘감소’한다는 말로 받아들인다.'},
 {id:'gando',ok:0,src:K98,g:['word'],s:'간도는 섬이다.',
  f:'간도는 두만강과 압록강 건너편 만주 일대를 가리키는 지역 이름이다.',
  w:'‘도’라는 글자를 섬으로 받아들인다(김진국·김일기, 1998).'},

  f:'자연제방은 배후습지보다 홍수 피해가 적을 뿐, 홍수가 전혀 없는 곳은 아니다.',
  w:'자연제방은 홍수 피해가 적어 취락이 발달한다는 설명을 예외 없는 사실로 넓힌다. 같은 이유로 배후습지에는 집이 하나도 없을 것이라고 생각하기도 한다.'},
 {id:'greenland',ok:1,src:K98,g:['fig'],s:'그린란드는 오스트레일리아보다 작다.',
  f:'그린란드의 면적(약 217만 km²)은 오스트레일리아(약 769만 km²)의 3분의 1에도 미치지 못한다.',
  w:'반대로 그린란드가 더 크다고 생각하는 학생이 많다. 메르카토르 도법의 세계지도에서는 고위도로 갈수록 면적이 크게 늘어나 그린란드가 오스트레일리아만큼 크게 보인다. 학생들은 지도에 표현된 모습을 실제 그대로 받아들이는 경향이 있다(김진국·김일기, 1998).'},
 {id:'ulleung',ok:0,g:['cue','def'],s:'울릉도는 겨울에 눈이 많이 오므로 우리나라에서 연강수량이 가장 많은 곳이다.',
  f:'울릉도는 대표적인 다설지이지만 최다우지는 아니다. 다설지는 눈의 양을, 다우지는 비와 눈을 합한 강수량을 기준으로 한다.',
  w:'해양성 기후이고 겨울 강수량이 많다는 정보를 모아 연강수량도 가장 많을 것이라고 짐작한다. 눈이 많다는 사실을 강수 전체로 넓힌다.'},
 {id:'sexratio',ok:0,g:['exp'],s:'성비는 남성에 대한 여성의 비율이다.',

  w:'남학생들이 자기 입장에서 남성을 기준으로 놓고 비율을 생각한다.'},
 {id:'wind',ok:1,g:['exp'],s:'평균적으로 농촌의 풍속이 도시보다 크다.',
  f:'평균 풍속은 농촌이 도시보다 크다. 빌딩풍은 건물 사이에서 부는 국지적인 바람이다.',
  w:'반대로 도시의 바람이 더 세다고 생각하는 학생이 많다. 고층 건물 사이에서 부는 강한 빌딩풍을 겪은 경험 때문이다.'},
 {id:'pyramid',ok:0,g:['fig'],s:'우리나라 농촌의 인구 피라미드는 표주박형이다.',
  f:'실제 우리나라 농촌은 유소년층 인구가 부족해 표주박형이 거의 나타나지 않는다.',
  w:'인구 피라미드의 유형을 배운 뒤 실제 농촌 자료에서도 표주박형만 찾으려 한다. 연구에 참여한 교사들은 교과서의 모식도가 이런 오개념의 주요 원인이라고 지적했다.'},
 {id:'terrace',ok:0,g:['word','fig'],s:'하안단구는 계단 모양이 온전하게 남아 있다.',

/* ═════ 1. 오개념이란 ═════ */
function s1(){
  return '<h1>오개념이란 무엇인가</h1><div class="rd">'+
  '<div class="qt">일반적으로 수용되는 지리학 개념 및 원리에 위배되거나 부분적인 영역에서만 작동하는 문제 지식'+src(K13)+'</div>'+
  '<p>개념을 통째로 잘못 아는 경우뿐 아니라, 일부 상황에서만 맞는 지식을 모든 상황에 쓰는 경우도 오개념이다. 오개념이 문제가 되는 것은 학생이 모르기 때문이 아니라 <b>이미 다르게 알고 있기</b> 때문이다.</p>'+
  '<div class="ex"><span class="ex-k">사례 · 계절은 왜 생기는가</span><p>계절이 생기는 이유를 지구가 공전하면서 태양에 가까워지거나 멀어지기 때문이라고 생각하는 학생이 많다. 난로에 가까이 가면 따뜻해지는 경험에서 나온 생각이다. 가까울수록 따뜻하다는 규칙은 난로 앞에서는 맞지만, 지구와 태양 사이에서는 맞지 않는다. 지구가 태양에 가장 가까운 때는 1월 초로, 북반구는 한겨울이다. 일상에서 맞는 규칙을 그것이 통하지 않는 규모에까지 쓴 것이다.</p></div>'+
  '<p>틀린 답이 모두 오개념인 것은 아니다. 한 번 잘못 읽었다가 다시 물으면 바로 고치는 것은 <b>오류</b>에 가깝다. 오개념은 그 뒤에 안정된 생각이 있어서 다른 상황에서도 같은 판단을 되풀이하고, 지적해도 쉽게 바뀌지 않는다.</p>'+
  '<div class="terms">'+
   '<div><h4>선개념<small>preconception</small></h4><p>수업 이전에 이미 가지고 있는 생각. 옳을 수도, 틀릴 수도 있다.</p></div>'+
   '<div><h4>오개념<small>misconception</small></h4><p>학문적 개념과 충돌하는 이해.</p></div>'+
   '<div class="em"><h4>대안적 개념<small>alternative conception</small></h4><p>같은 생각을 학생 나름의 일관된 설명으로 보는 구성주의의 표현.</p></div>'+
  '</div>'+
  '<p>경험으로 지구가 편평하다고 알던 아동은 지구가 둥글다는 것을 배운 뒤 ‘내가 서 있는 곳만 편평하다’는 생각을 만들었다'+src('Vosniadou, 1994; '+K13)+'. 틀렸지만, 경험과 배운 내용을 모두 설명하는 아동 나름의 해결책이다. 그래서 교사는 “틀렸다”고 말하기 전에 그 생각이 어디에서 왔는지를 먼저 물어야 한다.</p>'+
  '</div>';
}

    return '<button'+cls+' aria-pressed="'+(mine===o[0])+'" data-c="'+c.id+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
  var rv='';
  if(mine){
    rv='<div class="rv"><div class="ty">'+(c.ok?'맞는 문장이다':'틀린 문장이다')+src(c.src||(K13+(c.both?' · '+K98+'에도 보고':'')))+'</div><dl>'+
      '<dt>실제로는</dt><dd>'+esc(c.f)+'</dd>'+
      '<dt>작용했을 배경</dt><dd>'+chips(c.g)+esc(c.w)+'</dd></dl></div>';
  }
  return '<div class="case" id="c-'+c.id+'"><div class="h"><span class="no">'+(i+1)+'</span><div class="s">'+esc(c.s)+'</div>'+seg+'</div>'+rv+'</div>';
}
function bgSummary(){
  return '<div class="dist"><h4>이 문장들에 작용한 배경</h4>'+
   '<table class="tbl"><tbody>'+BG.map(function(b){
     var ns=[];CASES.forEach(function(c,i){if(c.g.indexOf(b[0])>=0)ns.push(i+1);});
     return '<tr><th>'+b[1]+'</th><td>'+b[2]+' <span class="src">— '+ns.join(', ')+'</span></td></tr>';}).join('')+
   '</tbody></table>'+
   '<p>여러 문장에 배경이 둘 이상 붙어 있다. 오개념은 한 가지 원인으로만 생기지 않고, 경험과 낱말, 배운 설명과 그림이 함께 작용해 학생 나름의 설명을 만든다. 맞는 문장을 틀렸다고 판단했다면, 그 판단에도 같은 배경이 작용했을 수 있다.</p>'+
   '<p>문장은 고등학교 지리 교사들이 학생들에게서 자주 보았다고 적은 오개념 목록에서 골랐다'+src(K98+'; '+K13)+'. 학생의 답을 직접 조사한 것이 아니라 교사가 인지한 목록이다.</p></div>';
}
function s2(){
  var n=caseDone();
  return '<h1>지리 오개념 테스트</h1>'+
  '<div class="legend"><span><i class="a"></i>내 판단</span><span><i class="r"></i>실제</span><span class="count"><b>'+n+'</b> / '+CASES.length+'</span></div>'+
  '<div class="cases">'+CASES.map(caseHTML).join('')+'</div>'+
  (n===CASES.length?bgSummary():'');
}

/* ═════ 3. 바꾸기 ═════ */
function mercSVG(){
  var m=MAP.merc;
  return '<svg class="map" viewBox="'+m.vb+'" role="img" aria-label="메르카토르 도법 세계지도. 그린란드가 오스트레일리아보다 크게 보인다">'+
   '<path fill="#E3E7E4" d="'+m.others+'"/><path fill="#8A9296" d="'+m.au+'"/><path fill="#0E5A50" d="'+m.gl+'"/>'+
   '<text x="'+(m.glc[0]+70)+'" y="'+(m.glc[1]+30)+'" class="ml">그린란드</text>'+
   '<text x="'+(m.auc[0]-48)+'" y="'+(m.auc[1]+92)+'" class="ml">오스트레일리아</text></svg>';
}
function eqSVG(){
  var e=MAP.eq,w=e.vb.split(' ')[2],h=+e.vb.split(' ')[3];
  return '<svg class="map eq" viewBox="0 -60 '+w+' '+(h+60)+'" role="img" aria-label="같은 축척으로 그린 그린란드와 오스트레일리아. 오스트레일리아가 훨씬 크다">'+
   '<g fill="#0E5A50">'+e.gl+'</g><g fill="#8A9296">'+e.au+'</g>'+
   '<text x="0" y="'+(e.glc[1]-18)+'" class="ml">그린란드 약 217만 km²</text>'+
   '<text x="'+e.auc[0]+'" y="'+(e.auc[1]-18)+'" class="ml" text-anchor="middle">오스트레일리아 약 769만 km²</text></svg>';
}
var STEPS=[
 ['드러내기','가르치기 전에 학생의 생각을 먼저 끌어낸다. 예측하게 하거나, 설명하게 하거나, 개념도를 그리게 한다. 드러나지 않은 생각은 바꿀 수 없다.'],
 ['흔들기','그 생각으로는 설명되지 않는 장면을 직접 보게 한다. 말로 반박하기보다 관찰하게 하고, 어림짐작보다 수치로 보여 줄 때 효과가 크다'+src(K15)+'.'],
 ['새 설명','학생이 이해할 수 있고, 반례와 기존에 알던 현상을 모두 설명하는 설명을 제시한다.'],
 ['넓히기','새 설명을 다른 현상에 적용해, 기존 생각보다 더 많은 것을 설명한다는 것을 경험하게 한다. 반례 하나만 처리하면 학생은 ‘이번만 예외’로 넘기고 원래 생각을 지킨다.'],
 ['돌아보기','처음 생각과 비교하고, 왜 그렇게 생각했는지 돌아보게 한다. 자기 생각이 어디에서 왔는지 알아야 다음에 같은 생각이 들 때 알아차린다.']
];
var LES={
 gl:{nm:'그린란드',from:'지도·모식도',
  q:'메르카토르 도법 세계지도다. 실제 면적은 어느 쪽이 더 클까?',
  pre:function(){return mercSVG();},
  o:[['a','그린란드'],['b','비슷하다'],['c','오스트레일리아']],
  shake:function(){return eqSVG()+'<p>같은 축척으로 그리면 그린란드의 면적은 오스트레일리아의 3분의 1에도 미치지 못한다.</p>';},
  ex:'평면 지도는 둥근 지구를 펼친 것이라, 도법에 따라 크기가 달라진다. 메르카토르 도법은 고위도로 갈수록 땅을 가로세로로 늘려 그리므로, 방향은 바르게 유지되지만 면적은 크게 부풀려진다.',
  wide:['고위도의 러시아와 캐나다도 실제보다 훨씬 크게 보인다.','적도 부근의 아프리카는 실제보다 작아 보인다. 아프리카의 면적은 그린란드의 약 14배다.'],
  back:'지도에 그려진 모습을 실제 그대로 받아들였다. 늘 보던 세계지도가 한 가지 도법이라는 것을 의식하지 못했다.'}
};

function lesson(k){
  var L=LES[k],mine=S.p[k];
  var h='<div class="stp"><div class="lb">드러내기</div><div><p class="big">'+L.q+'</p>'+L.pre()+
    '<div class="seg" style="margin-top:8px">'+L.o.map(function(o){return '<button aria-pressed="'+(mine===o[0])+'" data-p="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div></div></div>';
  if(!mine)return h;
  h+='<div class="stp"><div class="lb">흔들기</div><div>'+L.shake()+'</div></div>'+
    '<div class="stp"><div class="lb">새 설명</div><div><p>'+L.ex+'</p></div></div>'+
    '<div class="stp"><div class="lb">넓히기</div><div><ul>'+L.wide.map(function(w){return '<li>'+w+'</li>';}).join('')+'</ul></div></div>'+
    '<div class="stp"><div class="lb">돌아보기</div><div><p>'+L.back+'</p></div></div>';
  return h;
}
function s3(){
  return '<h1>오개념은 어떻게 바뀌는가</h1>'+
  '<section class="grp"><h2 class="gt">오개념을 바꾸려면</h2><div class="rd">'+
  '<h3 class="gs">왜 잘 바뀌지 않는가</h3>'+
  '<ul class="why"><li><b>그 생각이 지금까지 잘 통했다.</b> 오개념은 학생의 경험과 배운 내용을 나름대로 설명해 준다. 학생에게는 버릴 이유가 없다. 난로 앞에서, 모닥불 곁에서 학생은 가까우면 따뜻하다는 것을 계속 확인한다.</li>'+
   '<li><b>정답은 기존 생각 위에 덧붙여진다.</b> 학생은 수업에서 자전축의 기울기를 배우고 시험에서는 그렇게 답한다. 그러나 수업이 끝나면 기울기를 떠올릴 일은 거의 없고, 거리와 온도의 관계는 생활에서 날마다 쓸모가 있다. 학교에서 배운 설명은 시험을 위한 답으로 남고, 생활에서 통하는 설명은 그대로 남는다. 시험에서는 배운 답을 쓰고, 다른 상황에서는 원래 생각으로 돌아간다. 오개념이 전통적인 수업으로 쉽게 없어지지 않는 이유다'+src(K13)+'.</li>'+
   '<li><b>반례를 만나도 생각을 지킨다.</b> 학생은 맞지 않는 자료를 만나면 자료를 의심하거나, 자기 생각에 맞게 해석하거나, 일부만 고치고 핵심은 그대로 둔다'+src('Chinn and Brewer, 1998; '+K15)+'.</li></ul>'+
  '<h3 class="gs">그래서 어떤 노력이 필요한가</h3>'+
  '<p>정답을 알려 주는 것만으로는 부족하다. 학생이 자기 생각의 한계를 직접 겪고, 새 설명이 더 낫다는 것을 경험해야 한다. 개념변화 수업은 대체로 다음 흐름을 따른다.</p></div>'+
  '<table class="tbl steps"><tbody>'+STEPS.map(function(s,i){return '<tr><th><b>'+(i+1)+'</b>'+s[0]+'</th><td>'+s[1]+'</td></tr>';}).join('')+'</tbody></table>'+
  '<p class="src" style="white-space:normal;margin:0">흔들기·새 설명·넓히기는 강의에서 다룬 Posner의 네 조건(불만족, 이해 가능성, 그럴듯함, 유용성)과 Hashweh의 C1 → R2 → C2에 대응한다.</p>'+
  '</section>'+
  '<section class="grp"><h2 class="gt">수업 예시 — 그린란드</h2>'+lesson('gl')+'</section>';
}

/* ═════ 그리기 ═════ */
var V={home:home,s1:s1,s2:s2,s3:s3};
function foot(){
  if(S.scr==='home')return '';
  return '<div class="foot"><button id="print">인쇄 · PDF</button>'+
   '<button id="save">작업 저장</button><button id="load">불러오기</button>'+
   '<span class="msg" id="msg"></span><input type="file" id="file" accept=".json" hidden></div>';
}
function switcher(){
  $('#sw').innerHTML=MENU.map(function(m,i){
    return '<button aria-current="'+(S.scr===m.k)+'" data-go="'+m.k+'"><b>'+(i+1)+'</b><span class="lb">'+m.lb+'</span></button>';}).join('');
}
function go(k){S.scr=k;paint();window.scrollTo(0,0);}
function paint(){
  switcher();
  $('#main').innerHTML=V[S.scr]()+foot();
  $('#hn').textContent=S.scr==='home'?'지리 오개념':MENU.filter(function(m){return m.k===S.scr;})[0].h;
  if($('#print')){$('#print').onclick=function(){window.print();};
    $('#save').onclick=save;$('#load').onclick=function(){$('#file').click();};
    $('#file').onchange=load;}
}
function keep(fn){var y=window.scrollY;fn();window.scrollTo(0,y);}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(d.go){go(d.go);return;}
  if(b.id==='brand'){go('home');return;}
  if(d.c){S.c[d.c]=(S.c[d.c]===d.v)?undefined:d.v;if(!S.c[d.c])delete S.c[d.c];dirty=true;keep(paint);return;}
  if(d.p){var first=!S.p[d.p];S.p[d.p]=d.v;dirty=true;keep(paint);if(first){var st=document.querySelectorAll('.stp');if(st[1])st[1].scrollIntoView({behavior:'smooth',block:'start'});}return;}
});

function flash(t){var e=$('#msg');if(e){e.textContent=t;setTimeout(function(){e.textContent='';},2400);}}
function stamp(){var d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function save(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='오개념_'+stamp()+'.json';a.click();
  URL.revokeObjectURL(a.href);dirty=false;flash('저장했습니다');}
function load(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result),b=blank();
    S=Object.assign(b,d);S.c=S.c||{};S.p=S.p||{};
    if(!V[S.scr])S.scr='home';
    dirty=false;paint();flash('불러왔습니다');
  }catch(x){flash('이 화면에서 저장한 파일인지 확인하십시오');}e.target.value='';};
  r.readAsText(f);}
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
function setHH(){document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px');}
window.addEventListener('resize',setHH);
paint();setHH();
</script>
</body>
</html>
