<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한반도 경계 아틀라스</title>
<style>
:root{
  --bg:#fbfaf7; --ink:#1f2328; --muted:#6b6f76; --rule:#d9d6cf;
  --sea:#edf2f5; --land:#e6e2d8; --land-kr:#d6cfbf; --coast:#a39d8f;
  --kr:#2f6fb3; --jp:#c2453d; --cn:#c98a16; --ov:#5b2a86; --zone:#1f7a5c;
  --mdl:#1f2328; --dmz:#8a8f6a; --han:#3d8fa6; --hl:#ffd54a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --ink:#e8e6e1; --muted:#9a9ea5; --rule:#33363b;
  --sea:#1b2228; --land:#2b2e32; --land-kr:#3b3e43; --coast:#5d6065;
  --kr:#6aa6e8; --jp:#ef7a70; --cn:#e6b04a; --ov:#b991e0; --zone:#4fc39a;
  --mdl:#e8e6e1; --dmz:#a9ae84; --han:#6cc0d6;}}
:root[data-theme="dark"]{
  --bg:#16181b; --ink:#e8e6e1; --muted:#9a9ea5; --rule:#33363b;
  --sea:#1b2228; --land:#2b2e32; --land-kr:#3b3e43; --coast:#5d6065;
  --kr:#6aa6e8; --jp:#ef7a70; --cn:#e6b04a; --ov:#b991e0; --zone:#4fc39a;
  --mdl:#e8e6e1; --dmz:#a9ae84; --han:#6cc0d6;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 36px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.idx{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin:0 0 12px;scrollbar-width:none}
.idx button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:11px 12px 8px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.idx button b{font-size:11px;font-weight:700;margin-right:5px;letter-spacing:.06em}
.idx button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.body{display:grid;gap:14px}
@media(min-width:900px){.body{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.plateno{font-size:11px;letter-spacing:.14em;color:var(--muted);margin:0}
h2{font-size:17px;margin:2px 0 0;font-weight:800}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--rule);touch-action:none;overflow:hidden}
svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.6px}
.land.kr{fill:var(--land-kr)}
path{vector-effect:non-scaling-stroke}
.eez{fill-opacity:.15;stroke-width:1.2px;fill-rule:evenodd}
.eez.kr{fill:var(--kr);stroke:var(--kr)} .eez.jp{fill:var(--jp);stroke:var(--jp)} .eez.cn{fill:var(--cn);stroke:var(--cn)}
.claim{fill-opacity:.28;stroke-width:1.4px;fill-rule:evenodd}
.claim.kr{fill:var(--kr);stroke:var(--kr)} .claim.jp{fill:var(--jp);stroke:var(--jp)} .claim.cn{fill:var(--cn);stroke:var(--cn)}
.tsc{fill-opacity:.5;stroke:none} .tsc.kr{fill:var(--kr)} .tsc.jp{fill:var(--jp)} .tsc.cn{fill:var(--cn)}
.ovh{fill:url(#ovhatch);stroke:var(--ov);stroke-width:1.2px}
.ov{fill:var(--ov);fill-opacity:.38;stroke:var(--ov);stroke-width:1.3px;stroke-dasharray:4 2}
.ts{fill:var(--kr);fill-opacity:.32;stroke:var(--kr);stroke-width:.8px}
.cz{fill:var(--kr);fill-opacity:.1;stroke:var(--kr);stroke-width:.8px;stroke-dasharray:3 3}
.tsg{fill:var(--kr);fill-opacity:.14;stroke:var(--kr);stroke-width:1px;stroke-dasharray:4 3}
.iw{fill:url(#dots);stroke:none}
.nbl{fill:none;stroke:var(--jp);stroke-width:2.4px;stroke-linejoin:round}
.bl{fill:none;stroke:var(--ink);stroke-width:1.6px}
.zone{fill:url(#hatch);stroke:var(--zone);stroke-width:1.6px}
.med{fill:none;stroke-width:2.2px;stroke-dasharray:6 3}
.med.kr{stroke:var(--kr)} .med.jp{stroke:var(--jp)}
.mdl{fill:none;stroke:var(--mdl);stroke-width:2.4px}
.dmz{fill:var(--dmz);fill-opacity:.45;stroke:none}
.han{fill:var(--han);fill-opacity:.3;stroke:var(--han);stroke-width:1px;stroke-dasharray:3 2}
.dmzb{fill:none;stroke:var(--dmz);stroke-width:1.6px;stroke-dasharray:2 2}
.cnl{fill:none;stroke:var(--cn);stroke-width:2.6px}
.rul{fill:none;stroke:var(--ov);stroke-width:3.2px}
.cns{fill:none;stroke:var(--cn);stroke-width:2.2px;stroke-dasharray:6 4}
.jps{fill:none;stroke:var(--jp);stroke-width:2.2px} .jps.dash{stroke-dasharray:6 4}
.land.hl{fill:var(--land-kr)}
.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.modes button{font:inherit;font-size:13px;padding:9px 6px;border:0;background:none;color:var(--ink);cursor:pointer;line-height:1.3}
.modes button+button{border-left:1px solid var(--ink)}
.modes button.on{background:var(--ink);color:var(--bg);font-weight:700}
.nll{fill:none;stroke:var(--kr);stroke-width:2.4px}
.nk99{fill:none;stroke:var(--jp);stroke-width:2.2px;stroke-dasharray:7 4}
.lbl{fill:var(--muted);text-anchor:middle;font-weight:700;letter-spacing:.12em;pointer-events:none}
.lbl.sea{font-style:italic;font-weight:500;fill:var(--kr);opacity:.7;letter-spacing:.3em}
.lbl.note{font-weight:700;letter-spacing:0;fill:var(--kr);text-anchor:start;font-style:normal;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.lbl.note.end{text-anchor:end}
.river{fill:none;stroke:var(--han);stroke-width:2.6px;stroke-linejoin:round}
.landb{fill:none;stroke:var(--muted);stroke-width:1.6px;stroke-dasharray:3 3}
.lbl.peak{fill:var(--ink);font-weight:600;letter-spacing:0;font-style:normal}
.lbl.rivlbl{fill:var(--han);font-style:italic;font-weight:700;letter-spacing:.15em;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.lbl.rivlbl.s{fill:var(--ov);letter-spacing:0;font-style:normal;text-anchor:start}
.mdl.hanl{stroke-width:1.8px;stroke-dasharray:4 3}
.kj74{fill:none;stroke:var(--ink);stroke-width:2.6px}
.nk99.thin{stroke-width:1.4px;stroke-dasharray:3 3}
.lbl.city{font-weight:500;letter-spacing:0;fill:var(--ink);text-anchor:start}
.pt{cursor:pointer}
.pt .dot{fill:var(--kr);stroke:var(--bg);stroke-width:1.5px}
.pt.jp .dot{fill:var(--jp)} .pt.cn .dot{fill:var(--cn)} .pt.nk .dot{fill:var(--ink)} .pt.ink .dot{fill:var(--ink)}
.pt.bp .dot{fill:var(--bg);stroke:var(--ink);stroke-width:1.8px}
.pt.nb .dot{fill:var(--bg);stroke:var(--kr);stroke-width:1.8px}
.pt text{fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.pt.reef .dot{fill:var(--bg);stroke:var(--ink);stroke-width:1.4px}
.pt.tiny .dot{fill:var(--land-kr);stroke:var(--coast);stroke-width:.8px}
.pt.sel .dot{fill:var(--hl)}
.layer{transition:opacity .25s}
.off{opacity:0;pointer-events:none}
.ctrl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.ctrl button{width:34px;height:34px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font-size:18px;border-radius:6px;cursor:pointer}
.scalebar{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--ink)}
.scalebar i{display:block;height:5px;border:1.5px solid var(--ink);border-top:0;margin-bottom:2px}
.north{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;color:var(--ink);text-align:center;line-height:1}
.north::before{content:"▲";display:block;font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--bg);color:var(--ink);border:1px solid var(--rule);font-size:13px;line-height:1.45;padding:6px 9px;border-radius:6px;max-width:230px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:none}
.tip b{display:block}
.legend{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.legend li{border-bottom:1px solid var(--rule)}
.legend button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 2px;font:inherit;font-size:14px;color:var(--muted);text-align:left;cursor:pointer}
.legend button.on{color:var(--ink)}
.legend svg{width:30px;height:16px;flex:0 0 30px;opacity:.3}
.legend button.on svg{opacity:1}
.legend .chk{margin-left:auto;font-size:12px;color:var(--muted)}
.legend button.on .chk{color:var(--ink)}
.side{display:grid;gap:16px}
.side h3{font-size:11.5px;color:var(--muted);font-weight:700;margin:0 0 6px;letter-spacing:.08em}
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool button{font:inherit;font-size:13px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.tool button.on{background:var(--ink);color:var(--bg)}
.tool output{font-size:14px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.meas line{stroke:var(--ink);stroke-width:1.6px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.meas circle{fill:var(--hl);stroke:var(--ink);stroke-width:1.2px;vector-effect:non-scaling-stroke}

.app{display:grid;gap:12px}
@media(min-width:860px){.app{grid-template-columns:300px minmax(0,1fr);align-items:start}
  .menu{order:0;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:12px} .mapcol{order:1}}
.menu{order:1}
.grp{border-top:1px solid var(--rule)}
.grp:last-child{border-bottom:1px solid var(--rule)}
.gh{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:12px 2px;font:inherit;font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;text-align:left}
.gh .no{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.gh .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.gh .ar{font-size:11px;color:var(--muted);transition:transform .2s}
.grp.open .ar{transform:rotate(90deg)}
.grp .legend{display:none;border-top:0;padding:0 0 8px 0}
.grp.open .legend{display:block}
.legend li{border-bottom:0}
.legend button{padding:8px 2px;font-size:13.5px}
.allbtn{display:flex;gap:6px;padding:0 0 8px}
.allbtn button{font:inherit;font-size:12px;border:1px solid var(--rule);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.mapbox{position:relative}
.pt.hid text{display:none}
.lbl.hid{display:none}
.resetall{font:inherit;font-size:12.5px;margin-top:10px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header><h1>한반도 경계 아틀라스</h1></header>
<div class="app" style="margin-top:12px">
  <nav class="menu" id="menu"></nav>
  <div class="mapcol">
    <div class="mapbox" id="mapbox">
      <svg id="map">
        <defs>

          <pattern id="ovhatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--ov)" stroke-width="1.6"/></pattern>
          <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
            <rect width="5" height="5" fill="var(--kr)" fill-opacity=".12"/><circle cx="2.5" cy="2.5" r=".9" fill="var(--kr)" fill-opacity=".7"/></pattern>
        </defs>
        <g id="vp"></g>
      </svg>
      <div class="north">N</div>
      <div class="ctrl"><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">−</button><button id="zre" aria-label="처음 위치" style="font-size:13px">⟲</button></div>
      <div class="scalebar" id="scalebar"><i></i><span></span></div>
      <div class="tip" id="tip"></div>
    </div>
  </div>
</div>
</div>

    b.innerHTML = `<svg viewBox="0 0 30 16">${SW[l.sw] || ''}</svg><span>${l.name}</span><span class="chk"></span>`;
    b.onclick = () => { state[l.id] = !state[l.id]; applyLayers(); };
    li.appendChild(b); ul.appendChild(li);
  });
  box.appendChild(ul); menu.appendChild(box);
});
const rs = document.createElement('button'); rs.className = 'resetall'; rs.textContent = '모든 레이어 끄기';
rs.onclick = () => { P.layers.forEach(l => state[l.id] = !!l.base); applyLayers(); }; menu.appendChild(rs);
P.layers.forEach(l => state[l.id] = l.on);
function applyLayers() {
  for (const l of P.layers) {
    lg[l.id].classList.toggle('off', !state[l.id]);
    const b = document.querySelector(`.legend button[data-id="${l.id}"]`);
    if (!b) continue;
    b.classList.toggle('on', state[l.id]); b.querySelector('.chk').textContent = state[l.id] ? '켬' : '끔';
  }
  vp.querySelectorAll('.lbl[data-layer]').forEach(t => { const id = t.dataset.layer; if (id) t.classList.toggle('off', !state[id]); });
  document.querySelectorAll('.grp').forEach(box => {
    const ls = P.layers.filter(l => l.g === +box.dataset.g); const n = ls.filter(l => state[l.id]).length;
    box.querySelector('.cnt').textContent = n ? `${n}개 켬` : '';
  });
}

// ---- view ----
let view = { k: 1, x: 0, y: 0 };
function apply() {
  vp.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
  const r = svg.getBoundingClientRect(); const s = P.W / Math.max(1, r.width) / view.k;
  vp.querySelectorAll('.pt').forEach(g => { const x = g.dataset.x, y = g.dataset.y; g.setAttribute('transform', `translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})`); g.classList.toggle('hid', view.k < +g.dataset.mz || view.k < +g.dataset.lz); });
  vp.querySelectorAll('.pt text').forEach(t => t.style.fontSize = t.parentNode.classList.contains('small') ? '11.5px' : '13px');
  vp.querySelectorAll('.lbl').forEach(t => { const x = t.dataset.x, y = t.dataset.y; t.setAttribute('transform', `translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})`); t.style.fontSize = t.classList.contains('city') || t.classList.contains('note') || t.classList.contains('s') ? '12px' : t.classList.contains('rivlbl') ? '13px' : t.classList.contains('peak') ? '11.5px' : '15px'; t.classList.toggle('hid', view.k < +t.dataset.mz); });
  updateScale();
}
function toSvg(cx, cy) { const r = svg.getBoundingClientRect(); return [(cx - r.left) * P.W / r.width, (cy - r.top) * P.H / r.height]; }
function clampView() { view.x = Math.min(0, Math.max(P.W - P.W * view.k, view.x)); view.y = Math.min(0, Math.max(P.H - P.H * view.k, view.y)); }
function zoomAt(f, sx, sy) { const k = Math.min(40, Math.max(1, view.k * f)); f = k / view.k; view.x = sx - (sx - view.x) * f; view.y = sy - (sy - view.y) * f; view.k = k; clampView(); apply(); }
$('zin').onclick = e => { e.stopPropagation(); zoomAt(1.6, P.W / 2, P.H / 2); };
$('zout').onclick = e => { e.stopPropagation(); zoomAt(1 / 1.6, P.W / 2, P.H / 2); };
$('zre').onclick = e => { e.stopPropagation(); view = { k: 1, x: 0, y: 0 }; apply(); };
svg.addEventListener('wheel', e => { e.preventDefault(); const [sx, sy] = toSvg(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, sx, sy); }, { passive: false });
svg.addEventListener('dblclick', e => { const [sx, sy] = toSvg(e.clientX, e.clientY); zoomAt(2, sx, sy); });
const ptrs = new Map(); let last = null, moved = 0;
svg.addEventListener('pointerdown', e => { ptrs.set(e.pointerId, e); moved = 0; last = null; });
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 1) {
    const [x0, y0] = toSvg(prev.clientX, prev.clientY), [x1, y1] = toSvg(e.clientX, e.clientY);
    moved += Math.abs(x1 - x0) + Math.abs(y1 - y0);
    if (moved > 4) { svg.setPointerCapture(e.pointerId); view.x += x1 - x0; view.y += y1 - y0; clampView(); apply(); }
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const [mx, my] = toSvg((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    if (last) zoomAt(d / last, mx, my); last = d; moved = 99;
  }
});
['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, e => { ptrs.delete(e.pointerId); last = null; }));
window.addEventListener('resize', apply);
function inv(x, y) { const [tx, ty] = P.translate, S = P.scale; return [(x - tx) / S * 180 / Math.PI, (2 * Math.atan(Math.exp(-(y - ty) / S)) - Math.PI / 2) * 180 / Math.PI]; }
function hav([l1, p1], [l2, p2]) { const r = Math.PI / 180, a = Math.sin((p2 - p1) * r / 2) ** 2 + Math.cos(p1 * r) * Math.cos(p2 * r) * Math.sin((l2 - l1) * r / 2) ** 2; return 12742 * Math.asin(Math.sqrt(a)); }
function updateScale() {
  const y = (P.H / 2 - view.y) / view.k; const a = inv(0, y), b = inv(1, y);
  const kmPerUnit = hav(a, [b[0], a[1]]) / view.k; const scr = svg.getBoundingClientRect().width / P.W;
  const opts = [1, 2, 5, 10, 20, 22.2, 50, 100, 200, 370.4, 500]; let km = opts[0];
  for (const o of opts) if (o / kmPerUnit * scr < 130) km = o;
  $('scalebar').querySelector('i').style.width = (km / kmPerUnit * scr) + 'px';
  $('scalebar').querySelector('span').textContent = km === 370.4 ? '200해리 (370 km)' : km === 22.2 ? '12해리 (22 km)' : km + ' km';
}
applyLayers(); apply();
</script>
